    titulo: "tipo.conversa_modelo.titulo",
    vazioTitulo: "tipo.conversa_modelo.vazio_titulo",
    vazioLinha: "tipo.conversa_modelo.vazio_linha",
  },
  {
    id: "duelo_modelos",
    nome: "tipo.duelo_modelos.nome",
    titulo: "tipo.duelo_modelos.titulo",
    vazioTitulo: "tipo.duelo_modelos.vazio_titulo",
    vazioLinha: "tipo.duelo_modelos.vazio_linha",
  },
];
const TIPO_POR_ID = Object.fromEntries(TIPOS.map((x) => [x.id, x]));

/** Os dois tipos que falam com o modelo local. Espelha `db.TIPOS_CONVERSA`. */
const TIPOS_CONVERSA = ["conversa_modelo", "duelo_modelos"];
const ehConversa = (tipo) => TIPOS_CONVERSA.indexOf(tipo) >= 0;

/** O nome do estilo de tarefa na língua de agora, com o id como último recurso. */
function nomeTipo(id) {
  const x = TIPO_POR_ID[id];
  return x ? t(x.nome) : String(id || "");
}

/* As TRÊS sub-abas do revisor, na ordem do fluxo: o que chega, o que passou, o
   que os anotadores escreveram. A segunda é o Rate and Review — o nome fica em
   inglês nas duas línguas porque é um nome próprio, não uma etiqueta. */
const SUBABAS_REVISOR = [
  { id: "anotacoes", nome: "subaba.anotacoes.nome", titulo: "subaba.anotacoes.titulo",
    vazio: "subaba.anotacoes.vazio", linha: "subaba.anotacoes.linha" },
  { id: "avaliacao", nome: "subaba.avaliacao.nome", titulo: "subaba.avaliacao.titulo",
    vazio: "subaba.avaliacao.vazio", linha: "subaba.avaliacao.linha" },
  { id: "criacoes", nome: "subaba.criacoes.nome", titulo: "subaba.criacoes.titulo",
    vazio: "subaba.criacoes.vazio", linha: "subaba.criacoes.linha" },
];

/* AS DUAS ESCALAS DA PASSAGEM 2, como TABELA com a chave inteira — pelo mesmo
   motivo de `TIPOS` e `PAPEIS`: `t("rr.antes." + id + ".nome")` seria invisível
   para o teste de chave órfã, e o dicionário passaria a acumular entradas
   mortas sem que ninguém percebesse.

   `classe` pinta o DESFECHO, não a nota: na escala 2, descartar e escalar não
   são a mesma coisa que encerrar, e a cor diz isso antes da leitura. */
const ESCALA_ANTES = [
  { id: "inutilizavel", nome: "rr.antes.inutilizavel.nome", ancora: "rr.antes.inutilizavel.ancora", classe: "grave" },
  { id: "ajustavel", nome: "rr.antes.ajustavel.nome", ancora: "rr.antes.ajustavel.ancora", classe: "" },
  { id: "adequado", nome: "rr.antes.adequado.nome", ancora: "rr.antes.adequado.ancora", classe: "" },
  { id: "excepcional", nome: "rr.antes.excepcional.nome", ancora: "rr.antes.excepcional.ancora", classe: "boa" },
];
const ESCALA_DEPOIS = [
  { id: "incorrigivel", nome: "rr.depois.incorrigivel.nome", ancora: "rr.depois.incorrigivel.ancora", classe: "grave" },
  { id: "borderline_admin", nome: "rr.depois.borderline_admin.nome", ancora: "rr.depois.borderline_admin.ancora", classe: "grave" },
  { id: "adequado", nome: "rr.depois.adequado.nome", ancora: "rr.depois.adequado.ancora", classe: "boa" },
  { id: "excepcional", nome: "rr.depois.excepcional.nome", ancora: "rr.depois.excepcional.ancora", classe: "boa" },
];

/* E os três desfechos que o admin dá a um item escalado. */
const DECISOES = [
  { id: "aprovada", nome: "admin.decisao.aprovada.nome", ancora: "admin.decisao.aprovada.ancora", classe: "boa" },
  { id: "devolvida", nome: "admin.decisao.devolvida.nome", ancora: "admin.decisao.devolvida.ancora", classe: "" },
  { id: "descartada", nome: "admin.decisao.descartada.nome", ancora: "admin.decisao.descartada.ancora", classe: "grave" },
];

/** O que falta, com o marco. Fica no painel do admin, à vista, em vez de
    virar surpresa em cada botão desabilitado. */
const ROTEIRO = [
  ["P4", "roteiro.P4"],
  ["P5", "roteiro.P5"],
  ["P6", "roteiro.P6"],
  ["P7", "roteiro.P7"],
];

/* ==========================================================================
   2. ESTADO
   ========================================================================== */
const CHAVE = "bancada.";

/** As três vistas do anotador. A FILA é o caminho principal e vem primeiro. */
const VISTAS = [
  { id: "fila", nome: "vista.fila" },
  { id: "catalogo", nome: "vista.catalogo" },
  { id: "minhas", nome: "vista.minhas" },
];

const est = {
  // A língua da INTERFACE (nunca a do dado). Resolvida antes do primeiro
  // desenho, em `iniciar()`, porque não existe quadro nenhum em que a tela
  // possa aparecer na língua errada.
  idioma: IDIOMA_PADRAO,
  persona: null,      // {id, nome, papel} — quem está usando agora
  papelEscolhido: null,
  perfis: [],
  saude: null,
  // As diretrizes VERSIONADAS, vindas de /api/diretrizes, nas DUAS línguas:
  // {tipo: {versao, textos: {en: [...], pt: [...]}}}. Vêm juntas de propósito —
  // é o que permite ao botão de idioma trocar o texto sem outra ida ao servidor.
  diretrizes: {},
  // Os projetos e o que está em foco. `projeto: null` = todos.
  projetos: [],
  projeto: null,
  aba: TIPOS[0].id,
  subaba: SUBABAS_REVISOR[0].id,
  // DIVULGAÇÃO PROGRESSIVA: as diretrizes vêm abertas na PRIMEIRA visita de
  // cada aba nesta sessão e fechadas depois. Quem já leu não relê; quem chegou
  // agora não precisa procurar. Por sessão (não persistido) de propósito: uma
  // sessão nova é alguém voltando depois de um tempo.
  diretrizesVistas: new Set(),

  /* ---- P2 ---- */
  vista: "fila",
  envelope: null,     // a tarefa hidratada em mãos (ou null)
  // Por que a fila está vazia. `motivoChave` (+ `motivoDados`) é o que o
  // SERVIDOR disse, guardado como CHAVE para ser traduzido no desenho — trocar
  // de idioma com a fila vazia tem de trocar essa frase também. `motivo` é o
  // erro de rede, que nasce já traduzido porque não vem do servidor.
  motivo: "",
  motivoChave: null,
  motivoDados: null,
  form: null,         // o estado do formulário do tipo em foco
  rascunhoRecuperado: false,
  carregando: false,
  contagens: {},
  foco: 0,            // qual critério o teclado está graduando
  // O tempo É medido e vai para o admin — e NUNCA aparece para quem anota.
  // Cronômetro à vista adiciona pressão sem melhorar decisão, e aqui não há
  // pagamento por hora que o justifique.
  abertoEm: 0,
  catalogo: { q: "", lang: "", fonte: "", faixa: "", page: 1, dados: null },
  minhas: null,

  /* ---- P4d: a conversa com o modelo local ---- */
  // A GERAÇÃO EM VOO: {desde, dois}. Existe só enquanto a chamada está aberta,
  // e é dela que sai o indicador com o tempo decorrido — 17 s sem indicador
  // (medido) parecem travamento. O relógio é do MODELO, nunca da pessoa.
  gerando: null,
  // O último erro do runtime, guardado como CHAVE + dados (nunca a frase pronta
  // do servidor, que vem numa língua só). Ver `blocoRuntime`.
  erroModelo: null,
  // A revelação do duelo, depois do envio: quem era A e quem era B. Mora em
  // `est` e não no DOM porque trocar de idioma redesenha a tela a partir daqui.
  revelacao: null,

  /* ---- P3a: a triagem ---- */
  // {itens, total, minhas_excluidas, sel, detalhe, form, devolvendo, comentario,
  //  carregando}. `comentario` guarda o texto da devolução em ANDAMENTO: ele
  // mora no estado, e não só no <textarea>, para que trocar de idioma no meio
  // de uma devolução não apague o que o revisor já escreveu.
  triagem: null,

  /* ---- P3b: o Rate and Review ---- */
  // {itens, total, sel, detalhe, triagemDoItem, original, form, antes, depois,
  //  justificativa, motivos, foco, abertoEm, carregando, ...}.
  //
  // TUDO que o revisor digita e ainda não enviou mora aqui — as duas notas, o
  // formulário corrigido, o motivo de cada mudança e a justificativa geral —,
  // pela mesma razão do `triagem.comentario`: trocar de idioma redesenha a
  // tela a partir de `est`, e o que só existisse no DOM sumiria.
  //
  // `original` é a cópia INTOCADA do formulário como ele chegou. É contra ela
  // que o diff é calculado, e por isso ela nunca é editada nem regravada no
  // rascunho — desfazer uma correção precisa de um ponto de referência estável.
  rr: null,
  // A fila de escalação do admin: {itens, total, sel, decisao, comentario}.
  escalacao: null,
};

function guardarPersona() {
  try {
    if (est.persona) localStorage.setItem(CHAVE + "persona", JSON.stringify(est.persona));
    else localStorage.removeItem(CHAVE + "persona");
  } catch (_) { /* modo privado: a demo funciona igual, só não lembra */ }
}
function lerPersona() {
  try {
    const bruto = localStorage.getItem(CHAVE + "persona");
    if (!bruto) return null;
    const p = JSON.parse(bruto);
    return p && p.nome && PAPEL_POR_ID[p.papel] ? p : null;
  } catch (_) { return null; }
}

/* ---- tema ---- */
/** O rótulo do botão diz para ONDE o clique leva, não onde se está. */
function rotularTema() {
  const escuro = document.documentElement.getAttribute("data-tema") === "escuro";
  $("#tema").textContent = escuro ? t("tema.claro") : t("tema.escuro");
}
function aplicarTema(tema) {
  document.documentElement.setAttribute("data-tema", tema);
  rotularTema();
  try { localStorage.setItem(CHAVE + "tema", tema); } catch (_) {}
}
function alternarTema() {
  aplicarTema(document.documentElement.getAttribute("data-tema") === "escuro" ? "claro" : "escuro");
}

/* ==========================================================================
   3. SELETOR DE PAPEL  (na barra — não há tela de entrada)
   Uma decisão, sim, mas sem um vestíbulo para tomá-la: a plataforma abre na
   área de trabalho e o papel troca de onde a pessoa está. A frase de cada
   papel não some — vira o `title` do botão e a faixa de contexto logo abaixo
   da barra, que é onde ela ainda se explica sem competir com o trabalho.
   ========================================================================== */
function desenharPapeis() {
  const caixa = $("#papeis");
  limpar(caixa);
  for (const p of PAPEIS) {
    const b = el("button", "papel", t(p.nome));
    b.type = "button";
    b.setAttribute("role", "radio");
    b.setAttribute("aria-checked", String(est.papelEscolhido === p.id));
    b.title = t(p.linha);
    b.dataset.papel = p.id;
    b.addEventListener("click", () => escolherPapel(p.id));
    caixa.appendChild(b);
  }
  const faixa = $("#faixa-papel");
  limpar(faixa);
  const atual = PAPEL_POR_ID[est.papelEscolhido];
  if (atual) juntar(faixa, el("span", "papel-linha", t(atual.linha)));
}

/** `true` quando a plataforma está em modo solo (uma pessoa, os três chapéus).
    Vem do SERVIDOR (`/api/health`), nunca de uma constante do JS: é ele quem lê
    o `settings.toml` e quem de fato aplica ou não a regra. */
function modoSolo() { return !!(est.saude && est.saude.modo_solo); }

/** Trocar de papel troca de tela NA HORA. Sem confirmação e sem passo
    intermediário: o avaliador veio ver os três lados, e cada clique a mais
    entre eles é um lado a menos que ele vê.

    QUEM vai junto depende do modo. Em operação com equipe, o papel escolhe a
    pessoa: trocar para "Revisor" veste a primeira persona de revisor. No MODO
    SOLO, a pessoa é a mesma nos três papéis — porque é literalmente a mesma
    pessoa, e trocar de identidade ao trocar de aba faria o trabalho do autor
    aparecer revisado por uma fixture. Atribuição falsa num portfólio é pior
    que permissão larga numa app de 127.0.0.1. */
async function escolherPapel(papel) {
  if (papel === est.papelEscolhido && est.persona) return;
  est.papelEscolhido = papel;
  $("#entrada-erro").hidden = true;
  if (!modoSolo() || !est.persona) {
    const doPapel = est.perfis.filter((p) => p.papel === papel && p.ativo);
    const guardada = lerPersona();
    const escolhida = doPapel.find((p) => guardada && p.nome === guardada.nome) || doPapel[0];
    est.persona = escolhida
      ? { id: escolhida.id, nome: escolhida.nome, papel: escolhida.papel }
      : null;
    guardarPersona();
  }
  desenharPapeis();
  desenharPersonas();
  est.diretrizesVistas.clear();  // papel novo: as diretrizes voltam a abrir
  await abrirApp();
}

function desenharPersonas() {
  const sel = $("#persona");
  limpar(sel);
  // No modo solo a lista NÃO é filtrada por papel: a mesma pessoa atravessa as
  // três telas, e esconder quem não "é" revisor tornaria impossível voltar.
  const candidatos = modoSolo()
    ? est.perfis.filter((p) => p.ativo)
    : est.perfis.filter((p) => p.papel === est.papelEscolhido && p.ativo);
  if (!candidatos.length) {
    sel.appendChild(el("option", null, t("barra.ninguem_neste_papel")));
    sel.disabled = true;
    return;
  }
  sel.disabled = false;
  for (const p of candidatos) {
    const o = el("option", null, modoSolo() ? p.nome + " · " + nomePapel(p.papel) : p.nome);
    o.value = String(p.id);
    sel.appendChild(o);
  }
  if (est.persona && candidatos.some((p) => p.id === est.persona.id)) {
    sel.value = String(est.persona.id);
  }
}

async function trocarPersona() {
  const id = Number($("#persona").value);
  const p = est.perfis.find((x) => x.id === id);
  if (!p || (est.persona && est.persona.id === id)) return;
  est.persona = { id: p.id, nome: p.nome, papel: p.papel };
  // Fora do modo solo, a pessoa carrega o papel dela: escolher "Diego" na
  // lista leva para a tela de revisor, e não para uma tela que ele não abre.
  if (!modoSolo()) est.papelEscolhido = p.papel;
  guardarPersona();
  desenharPapeis();
  est.diretrizesVistas.clear();
  await abrirApp();
}

/* ---- projeto em foco ----
   Dois projetos nascem com o banco: `Portfólio` (o trabalho real sobre o
   corpus, e o default de toda tarefa nova) e `Demonstração` (o pacote de
   fixtures). Separá-los é o que permite dizer qual trabalho é de quem, em vez
   de somar fixture com autoria na mesma lista. O seletor existe porque, sem
   ele, "trabalhar só num projeto" seria uma promessa do schema que a interface
   não cumpre. */
async function carregarProjetos() {
  try {
    const r = await api("/api/projetos");
    est.projetos = r.items || [];
  } catch (e) {
    est.projetos = [];
    recado(t("recado.erro_projetos", { erro: e.message }), true);
  }
  if (est.projeto !== null && !est.projetos.some((p) => p.id === est.projeto)) {
    est.projeto = null;
  }
  desenharProjetos();
}

function desenharProjetos() {
  const sel = $("#projeto");
  limpar(sel);
  const todos = el("option", null, t("barra.todos_projetos"));
  todos.value = "";
  sel.appendChild(todos);
  for (const p of est.projetos) {
    // O número de tarefas ABERTAS vai no rótulo: um seletor que não diz quanto
    // trabalho tem cada projeto obriga a entrar em todos para descobrir onde
    // está o que se procura.
    const o = el("option", null, p.nome + " (" + n(p.n_abertas) + ")");
    o.value = String(p.id);
    o.title = p.descricao;
    sel.appendChild(o);
  }
  sel.value = est.projeto === null ? "" : String(est.projeto);
}

async function trocarProjeto() {
  const bruto = $("#projeto").value;
  const alvo = bruto === "" ? null : Number(bruto);
  if (alvo === est.projeto) return;
  est.projeto = alvo;
  try {
    if (alvo === null) localStorage.removeItem(CHAVE + "projeto");
    else localStorage.setItem(CHAVE + "projeto", String(alvo));
  } catch (_) {}
  await abrirApp();
}

function lerProjetoGuardado() {
  try {
    const bruto = localStorage.getItem(CHAVE + "projeto");
    return bruto ? Number(bruto) : null;
  } catch (_) { return null; }
}

/** Os parâmetros de projeto que uma chamada carrega — ou nada, quando o foco
    é "todos". Existe para que a chave não apareça como `projeto_id=null` em
    seis lugares diferentes. */
function paramsProjeto(base) {
  return est.projeto === null ? base : { ...base, projeto_id: est.projeto };
}

/** Criar persona continua acessível — só deixou de ser a porta de entrada. */
async function entrar() {
  const erro = $("#entrada-erro");
  erro.hidden = true;
  const novo = $("#novo-nome").value.trim();
  if (!novo) { erro.textContent = t("barra.sem_nome"); erro.hidden = false; return; }
  try {
    const criado = await postar("/api/perfis", { nome: novo, papel: est.papelEscolhido });
    est.perfis.push(criado);
    est.perfis.sort((a, b) => (a.papel + a.nome).localeCompare(b.papel + b.nome, "pt-BR"));
    est.persona = { id: criado.id, nome: criado.nome, papel: criado.papel };
  } catch (e) {
    erro.textContent = e.status === 409
      ? t("barra.nome_repetido", { erro: e.message })
      : t("barra.erro_perfil", { erro: e.message });
    erro.hidden = false;
    return;
  }
  guardarPersona();
  $("#novo-nome").value = "";
  $("#nova-pessoa").open = false;
  desenharPersonas();
  est.diretrizesVistas.clear();
  await abrirApp();
}

/* ==========================================================================
   4. APLICAÇÃO: barra + roteamento por papel
   ========================================================================== */
const TITULO_TELA = {
  anotador: "tela.anotador",
  revisor: "tela.revisor",
  admin: "tela.admin",
};

async function abrirApp() {
  // O papel É o escolhido na barra. Fora do modo solo ele sempre coincide com
  // o da persona (trocar de papel troca de pessoa); no modo solo a mesma
  // pessoa atravessa os três, e é a barra quem manda.
  const papel = est.papelEscolhido || (est.persona && est.persona.papel);
  $("#barra-titulo").textContent = TITULO_TELA[papel] ? t(TITULO_TELA[papel]) : "";

  for (const [id, no] of [["anotador", "#tela-anotador"], ["revisor", "#tela-revisor"], ["admin", "#tela-admin"]]) {
    $(no).hidden = papel !== id;
  }
  // Nenhuma persona com este papel: a tela ainda abre, e diz a saída. Um beco
  // aqui seria o pior possível — é a primeira coisa que se vê.
  if (!est.persona) { semPersona(papel); return; }

  // A saúde vem ANTES do desenho do anotador: é dela que saem os limites que o
  // botão "diz o que falta" usa, e desenhar antes mostraria os números padrão
  // por um quadro.
  await recarregarSaude();
  await carregarProjetos();
  if (papel === "anotador") {
    est.vista = "fila";
    est.envelope = null;
    est.motivo = "";
    est.motivoChave = null;
    await carregarDiretrizes();
    await recarregarContagens();
    desenharAnotador();
  }
  if (papel === "revisor") {
    // As duas filas são recarregadas do zero ao entrar na tela: elas mudam por
    // fora (outra aba triando, o admin devolvendo) e um número velho aqui é
    // uma fila que promete trabalho que já foi feito.
    est.triagem = null;
    est.rr = null;
    await desenharRevisor();
  }
  if (papel === "admin") {
    await carregarEscalacao();
    desenharAdmin();
  }
}

/** Papel sem ninguém cadastrado: bifurcação, não beco. */
function semPersona(papel) {
  const alvo = { anotador: "#area-trabalho", revisor: "#revisor-fila", admin: "#admin-cards" }[papel];
  const no = $(alvo);
  if (!no) return;
  limpar(no);
  const caixa = el("div", "vazio");
  juntar(caixa,
    el("div", "vazio-titulo", t("semPersona.titulo", { papel: nomePapel(papel).toLowerCase() })),
    el("p", "vazio-linha", t("semPersona.linha")));
  no.appendChild(caixa);
}

async function recarregarSaude() {
  try {
    est.saude = await api("/api/health");
  } catch (e) {
    est.saude = null;
    recado(t("recado.erro_saude", { erro: e.message }), true);
  }
  atualizarContagens();
}

/** As diretrizes vêm do BANCO, com versão — e é essa versão que o servidor
    grava em cada anotação. Uma cópia literal no HTML tornaria impossível
    separar "antes" de "depois" quando a regra mudasse. */
async function carregarDiretrizes() {
  if (Object.keys(est.diretrizes).length) return;
  try {
    const r = await api("/api/diretrizes");
    est.diretrizes = r.items || {};
  } catch (e) {
    est.diretrizes = {};
    recado(t("recado.erro_diretrizes", { erro: e.message }), true);
  }
}

/** Os números da barra. O da fila é PESSOAL (o que sobrou para mim neste
    tipo); o da triagem também, porque exclui as do próprio revisor. */
function atualizarContagens() {
  const fila = $("#fila-conta");
  if (fila) {
    const minhas = est.contagens[est.aba];
    fila.textContent = minhas === undefined
      ? "…"
      : minhas === 0 ? t("fila.conta_zero") : t("fila.conta", { n: n(minhas) });
  }
  const rev = $("#revisor-conta");
  if (rev) {
    // O contador é o da SUB-ABA em foco: com duas filas na mesma tela, um único
    // número somando as duas não diria de qual trabalho ele fala.
    const fonte = est.subaba === "avaliacao" ? est.rr : est.triagem;
    rev.textContent = !fonte ? "…"
      : fonte.total === 0 ? t("revisor.conta_zero") : t("revisor.conta", { n: n(fonte.total) });
  }
  const esc = $("#escalacao-conta");
  if (esc) {
    const fila = est.escalacao;
    esc.textContent = !fila ? "…" : t("admin.escalacao_conta", { n: n(fila.total) });
  }
}

/* ==========================================================================
   5. TELA DO ANOTADOR
   Uma área de trabalho, uma tarefa por vez. As quatro abas são os quatro
   estilos de tarefa; o que muda entre elas é o formulário, não a navegação.
   ========================================================================== */
/** Os limites vêm do SERVIDOR (`/api/health.limites`), que os lê do
    settings.toml. Uma cópia aqui divergiria na primeira vez que o arquivo
    mudasse — e a tela passaria a prometer uma validação que o 422 desmente. */
function lim(chave, padrao) {
  const l = (est.saude && est.saude.limites) || {};
  const v = Number(l[chave]);
  return Number.isFinite(v) && v > 0 ? v : padrao;
}

/** `opcoes.manterDiretrizes` preserva o aberto/fechado do painel de diretrizes.

    Existe por causa da troca de idioma: redesenhar a tela reavaliaria a
    "primeira visita" e fecharia um painel que a pessoa tinha acabado de abrir —
    trocar de língua não pode mexer em nada que não seja língua. */
function desenharAnotador(opcoes) {
  const manter = !!(opcoes && opcoes.manterDiretrizes);
  const barra = $("#abas-anotador");
  limpar(barra);
  for (const x of TIPOS) {
    const b = el("button", "aba", t(x.nome));
    b.type = "button";
    b.setAttribute("role", "tab");
    b.setAttribute("aria-selected", String(est.aba === x.id));
    b.dataset.tipo = x.id;
    const conta = est.contagens[x.id];
    b.appendChild(el("span", "conta", conta === undefined ? "" : n(conta)));
    b.addEventListener("click", () => trocarAba(x.id));
    b.addEventListener("keydown", (ev) => andarNasAbas(ev, TIPOS, trocarAba, est.aba));
    barra.appendChild(b);
  }

  const tp = TIPO_POR_ID[est.aba];
  const det = $("#diretrizes");

  // Divulgação progressiva: aberta na primeira visita desta aba na sessão.
  if (!manter) {
    const primeiraVez = !est.diretrizesVistas.has(tp.id);
    est.diretrizesVistas.add(tp.id);
    det.open = primeiraVez;
  }
  // A VERSÃO fica à vista, e não como detalhe de implementação: é ela que
  // o servidor grava em cada anotação, e é o que responde "sob qual regra
  // isto foi anotado?" sem arqueologia de git. Ela é do CONTEÚDO, não da
  // tradução: `v1` em inglês e `v1` em português são a mesma regra.
  const dir = est.diretrizes[tp.id] || { versao: null, textos: {} };
  const linhas = (dir.textos && dir.textos[est.idioma]) || [];
  $("#diretrizes-titulo").textContent = dir.versao
    ? t("diretrizes.titulo_versao", { tipo: t(tp.nome), versao: dir.versao })
    : t("diretrizes.titulo", { tipo: t(tp.nome) });
  const lista = $("#diretrizes-lista");
  limpar(lista);
  for (const linha of linhas) lista.appendChild(el("li", null, linha));
  if (!linhas.length) lista.appendChild(el("li", null, t("diretrizes.sem")));

  desenharVistas();
  atualizarContagens();
  desenharArea();
}

function desenharVistas() {
  const caixa = $("#vistas");
  limpar(caixa);
  for (const v of VISTAS) {
    const b = el("button", "vista", t(v.nome));
    b.type = "button";
    b.setAttribute("aria-current", String(est.vista === v.id));
    b.addEventListener("click", () => irPara(v.id));
    caixa.appendChild(b);
  }
}

function trocarAba(tipo) {
  if (tipo === est.aba) return;
  est.aba = tipo;
  est.envelope = null;
  est.form = null;
  // O MOTIVO DA FILA VAZIA É DA ABA QUE O PRODUZIU. Sem limpá-lo aqui,
  // `desenharArea` vê um `motivoChave` preenchido, decide que já sabe por que a
  // fila está vazia e NÃO chama `carregarFila` — a aba nova abre mostrando o
  // vazio da aba anterior, com trabalho esperando. Aparece só quando a primeira
  // aba está vazia e a segunda não, que é exatamente o banco real de hoje.
  est.motivo = "";
  est.motivoChave = null;
  est.motivoDados = null;
  est.revelacao = null;
  est.erroModelo = null;
  est.minhas = null;
  est.catalogo = { q: "", lang: "", fonte: "", faixa: "", page: 1, dados: null };
  desenharAnotador();
}

function irPara(vista) {
  est.vista = vista;
  desenharVistas();
  desenharArea();
}

/** Roteia a área de trabalho pela vista atual e dispara o carregamento que
    faltar. Toda a tela do anotador passa por aqui. */
function desenharArea() {
  const area = $("#area-trabalho");
  limpar(area);
  // A REVELAÇÃO do duelo segura a tela até a pessoa pedir a próxima: ela é a
  // única chance de ver quem era quem, e um redesenho (uma troca de idioma, por
  // exemplo) não pode engoli-la.
  if (est.revelacao && est.vista === "fila") { revelarDuelo(est.revelacao); return; }
  if (est.vista === "catalogo") {
    desenharCatalogo(area);
    if (!est.catalogo.dados) carregarCatalogo();
    return;
  }
  if (est.vista === "minhas") {
    desenharMinhas(area);
    if (!est.minhas) carregarMinhas();
    return;
  }
  desenharFila(area);
  // A FILA PUXA SOZINHA: não existe botão "buscar tarefa". Fechar o laço antes
  // de pedir a próxima coisa é o que impede a tela de perguntar "e agora?".
  if (!est.envelope && !est.carregando && !est.motivo && !est.motivoChave) carregarFila();
}

/* ==========================================================================
   5.1 FILA
   ========================================================================== */

async function carregarFila() {
  est.carregando = true;
  desenharArea();
  try {
    const r = await postar("/api/tarefas/proxima",
      paramsProjeto({ anotador_id: est.persona.id, tipo: est.aba }));
    // O motivo entra como CHAVE + dados, e não como a frase que a rota devolve
    // em `motivo`: ela está em português, e o estado vazio é a primeira coisa
    // que se vê quando a fila acaba.
    aceitarEnvelope(r.tarefa, r.motivo_chave, r.motivo_dados);
  } catch (e) {
    est.envelope = null;
    est.motivoChave = null;
    est.motivo = t("fila.erro_proxima", { erro: e.message });
  } finally {
    est.carregando = false;
  }
  await recarregarContagens();
  desenharArea();
}

/** Recebe (ou não) uma tarefa e prepara o formulário — restaurando o rascunho
    se houver um guardado para esta atribuição. */
function aceitarEnvelope(envelope, motivoChave, motivoDados) {
  est.envelope = envelope || null;
  // A chave fica GUARDADA (e não a frase já traduzida): trocar de idioma com a
  // fila vazia tem de redesenhar o estado vazio na língua nova, e uma frase
  // congelada em `est` ficaria na língua em que a fila esvaziou.
  est.motivoChave = envelope ? null : (motivoChave || null);
  est.motivoDados = motivoDados || null;
  est.motivo = "";
  est.foco = 0;
  est.rascunhoRecuperado = false;
  est.abertoEm = Date.now();
  est.gerando = null;
  est.erroModelo = null;
  est.revelacao = null;
  pararTique();
  if (!envelope) { est.form = null; return; }
  const guardado = lerRascunho(envelope.atribuicao_id);
  if (guardado) {
    est.form = guardado;
    est.rascunhoRecuperado = true;
  } else {
    est.form = formInicial(envelope);
  }
}

function desenharFila(area) {
  const tp = TIPO_POR_ID[est.aba];
  const painel = el("div", "painel");
  const cabeca = el("div", "painel-cabeca");
  juntar(cabeca, el("h2", null, t(tp.titulo)), el("span", "crescer"));
  if (est.envelope) {
    const origem = est.envelope.tarefa.origem;
    cabeca.appendChild(el("span", "fraco", origem === "livre" ? t("fila.origem_livre")
      : origem === "continuacao" ? t("fila.origem_continuacao") : t("fila.origem_fila")));
  }
  painel.appendChild(cabeca);

  if (est.carregando) {
    painel.appendChild(juntar(el("div", "vazio"), el("p", "vazio-linha", t("fila.puxando"))));
    area.appendChild(painel);
    return;
  }
  if (!est.envelope) {
    painel.appendChild(vazioComSaida(tp));
    area.appendChild(painel);
    return;
  }
  painel.appendChild(desenharWorkspace(est.envelope));
  area.appendChild(painel);
}

/** ESTADO VAZIO COMO BIFURCAÇÃO, nunca um beco: título honesto, o motivo que o
    servidor deu, e as saídas que existem DE VERDADE. */
function vazioComSaida(tp) {
  // O motivo que o servidor deu, traduzido AGORA a partir da chave — nunca a
  // frase pronta que ele mandou junto (ela é a versão em português, e existe
  // para que a API se explique sozinha em /docs).
  const motivo = est.motivo || (est.motivoChave ? t(est.motivoChave, est.motivoDados) : "");
  const caixa = el("div", "vazio");
  juntar(caixa,
    el("div", "vazio-titulo", t(tp.vazioTitulo)),
    el("p", "vazio-linha", motivo || t(tp.vazioLinha)));
  if (motivo) caixa.appendChild(el("p", "vazio-linha fraco", t(tp.vazioLinha)));

  const saidas = el("div", "vazio-saidas");
  const catalogo = el("button", "botao primaria", t("botao.escolher_catalogo"));
  catalogo.type = "button";
  catalogo.addEventListener("click", () => irPara("catalogo"));
  const minhas = el("button", "botao", t("botao.ver_minhas"));
  minhas.type = "button";
  minhas.addEventListener("click", () => irPara("minhas"));
  const virarAdmin = el("button", "botao", t("botao.entrar_admin"));
  virarAdmin.type = "button";
  virarAdmin.addEventListener("click", () => {
    // Com o seletor na barra isto virou UM salto, e não uma volta ao
    // vestíbulo seguida de duas escolhas. O estado vazio deixou de custar
    // três cliques para custar um.
    escolherPapel("admin");
    recado(t("recado.admin_gera"));
  });
  juntar(saidas, catalogo, minhas, virarAdmin);
  caixa.appendChild(saidas);
  return caixa;
}

/* ==========================================================================
   5.2 PEÇAS COMPARTILHADAS DOS WORKSPACES
   ========================================================================== */

/** O prompt, em serifa, com a PROVENIÊNCIA colada embaixo. Texto longo abre
    recortado e expande no clique — o corpus tem prompts de ~1 MB. */
function blocoPrompt(env) {
  const bloco = el("div", "painel-corpo");
  juntar(bloco, el("div", "rotulo-bloco", t("ws.prompt_rotulo")));
  const caixa = el("div", "leitura-caixa");
  caixa.appendChild(el("div", "leitura", env.prompt.text));
  bloco.appendChild(caixa);

  if (env.prompt.n_chars > 1200) {
    const abrir = el("button", "botao discreta", t("botao.mostrar_inteiro"));
    abrir.type = "button";
    abrir.addEventListener("click", () => {
      caixa.classList.toggle("aberta");
      abrir.textContent = caixa.classList.contains("aberta")
        ? t("botao.recolher") : t("botao.mostrar_inteiro");
    });
    bloco.appendChild(abrir);
  }

  const prov = el("div", "proveniencia");
  const selo = el("span", "selo" + (env.prompt.demo ? " demo" : ""),
    env.prompt.demo ? t("ws.prov_demo") : t("ws.prov_fonte", { fonte: env.prompt.fonte }));
  juntar(prov, selo,
    el("span", "selo", t("ws.prov_licenca", { licenca: env.prompt.licenca })),
    el("span", "selo", t("ws.prov_chars", { n: n(env.prompt.n_chars) })),
    el("span", "selo", nomeLingua(env.prompt.lang)));
  // A ATRIBUIÇÃO de um prompt do corpus é DADO: ela vem do `sources.toml`, é
  // exigência da licença (ODC-BY, CC-BY, CC-BY-SA) e sai exatamente como está.
  // A de uma fixture não é atribuição nenhuma — é a tela dizendo que aquilo não
  // é prompt de pessoa nenhuma —, e por isso ela passa pelo dicionário.
  if (env.prompt.demo) prov.appendChild(el("span", null, t("ws.prov_demo_atribuicao")));
  else if (env.prompt.atribuicao) prov.appendChild(el("span", null, env.prompt.atribuicao));
  bloco.appendChild(prov);
  return bloco;
}

/** O nome da língua de um DADO ("português"/"Portuguese"), na língua da tela. */
function nomeLingua(lang) {
  return lang === "pt" ? t("lang.pt") : t("lang.en");
}

/** `modelo-a` → `A`. O rótulo é cego, e o identificador da coluna não é rótulo. */
function rotuloCego(rotulo) { return rotulo === "modelo-a" ? "A" : "B"; }

/* A CONVENÇÃO DE LÍNGUA, POR CAMPO E NA TELA  (P3i)

   O padrão de mercado é assimétrico e não se adivinha: **justificativa,
   comentário de revisão, critério de rubrica e todo metadado saem em inglês**
   (é o que o cliente lê), enquanto **a resposta esperada e a conversa com o
   modelo saem na língua do prompt** (é o dado sendo produzido, e é onde a
   expertise nativa aparece).

   Ela é dita ONDE A DÚVIDA OCORRE — colada ao campo, não numa página de ajuda
   que ninguém abre no meio de uma tarefa —, e é DIRETRIZ, NÃO VALIDAÇÃO: nada
   aqui bloqueia o envio. O anotador pode ter um motivo para desviar (citar um
   trecho do prompt dentro da justificativa, por exemplo) e a plataforma não
   conhece esse motivo. Uma validação aqui produziria um bloqueio que só o
   humano sabe que está errado. */
function dicaLinguaMeta(chave) {
  const caixa = el("div", "lingua-campo");
  juntar(caixa, el("span", "lingua-selo", t("lingua.selo_en")), el("span", null, t(chave)));
  return caixa;
}

/** A dica do campo de DADO: a língua é a do prompt, e o selo mostra qual é. */
function dicaLinguaDado(lang) {
  const caixa = el("div", "lingua-campo dado");
  juntar(caixa,
    el("span", "lingua-selo", lang === "pt" ? t("lingua.selo_pt") : t("lingua.selo_en")),
    el("span", null, lang === "pt" ? t("lingua.dado_pt") : t("lingua.dado_en")));
  return caixa;
}

function blocoResposta(rotulo, texto) {
  const bloco = el("div", "painel-corpo");
  juntar(bloco, el("div", "rotulo-bloco", rotulo));
  const caixa = el("div", "leitura-caixa");
  caixa.appendChild(el("div", "leitura", texto));
  bloco.appendChild(caixa);
  return bloco;
}

function separador(no) {
  no.style.borderTop = "1px solid var(--linha)";
  return no;
}

/** A ÚNICA ação primária da tela. O rótulo do botão diz o que FALTA antes do
    clique — validação que só existe depois do clique é fricção pura. */
function barraAcoes() {
  const barra = el("div", "acoes");
  const falta = oQueFalta();
  const enviarBtn = el("button", "botao primaria", falta ? falta : t("botao.enviar_proxima"));
  enviarBtn.type = "button";
  enviarBtn.id = "enviar";
  enviarBtn.disabled = !!falta || est.carregando;
  enviarBtn.addEventListener("click", enviar);
  juntar(barra, enviarBtn, el("span", "atalho", "Ctrl+Enter"));

  barra.appendChild(el("span", "crescer"));
  const pular = el("button", "botao discreta", t("botao.devolver_pegar_outra"));
  pular.type = "button";
  pular.addEventListener("click", abandonar);
  barra.appendChild(pular);
  return barra;
}

function avisoRascunho() {
  if (!est.rascunhoRecuperado) return null;
  const aviso = el("div", "aviso-rascunho");
  juntar(aviso, el("span", null, t("ws.rascunho_recuperado")));
  const descartar = el("button", "botao discreta", t("botao.descartar_rascunho"));
  descartar.type = "button";
  descartar.addEventListener("click", () => {
    limparRascunho(est.envelope.atribuicao_id);
    est.form = formInicial(est.envelope);
    est.rascunhoRecuperado = false;
    desenharArea();
  });
  aviso.appendChild(descartar);
  return aviso;
}

/** Material faltando: BIFURCAÇÃO, nunca beco. A saída principal é a que resolve
    a falta (escrever a rubrica deste mesmo prompt), não "volte e tente outra". */
function semMaterial(titulo, linha) {
  const caixa = el("div", "vazio");
  juntar(caixa, el("div", "vazio-titulo", titulo), el("p", "vazio-linha", linha));
  const saidas = el("div", "vazio-saidas");
  const rubrica = el("button", "botao primaria", t("botao.escrever_rubrica_deste"));
  rubrica.type = "button";
  rubrica.addEventListener("click", async () => {
    const uid = est.envelope.prompt.uid;
    // `devolver`, e não `abandonar`: puxar a próxima da fila aqui deixaria uma
    // atribuição a mais em aberto antes de abrir a que a pessoa pediu.
    await devolver();
    await pegarLivreEm("escrever_rubrica", uid);
  });
  const devolver = el("button", "botao", t("botao.devolver_pegar_outra"));
  devolver.type = "button";
  devolver.addEventListener("click", abandonar);
  juntar(saidas, rubrica, devolver);
  caixa.appendChild(saidas);
  return caixa;
}

/** O comentário do revisor fica ACIMA do formulário, no caminho do olho: no
    re-trabalho, reconhecer é mais barato que reconstruir de memória. */
function blocoDevolucao(env) {
  const anterior = env.versao_anterior;
  if (!anterior) return null;
  // DOIS CAMINHOS DE VOLTA, e o anotador precisa saber por qual dele veio: a
  // triagem devolve, e o admin também devolve ao decidir uma escalação. O
  // segundo é raro — e some sem ninguém notar se a tela só olhar o primeiro.
  const doAdmin = anterior.decisao_admin === "devolvida";
  if (anterior.veredito !== "devolvida" && !doAdmin) return null;
  const caixa = el("div", "devolucao");
  juntar(caixa,
    el("div", "devolucao-titulo", doAdmin
      ? t("ws.devolvida_admin", { versao: anterior.versao })
      : t("ws.devolvida_versao", { versao: anterior.versao })),
    // `.dado`: o comentário sai na língua em que a pessoa o escreveu.
    el("p", "dado", (doAdmin ? anterior.comentario_admin : anterior.comentario_revisor) || ""));
  return caixa;
}

/* O CONTEXTO DE UM WORKSPACE.
   Os quatro `ws*` servem a TRÊS leitores: quem anota (escreve), quem tria (lê)
   e quem avalia no Rate and Review (escreve por cima do que outra pessoa
   escreveu). Os três veem o MESMO layout — mesma rubrica, mesmas escalas,
   mesma ordem —, e a única forma honesta de garantir isso é ser o mesmo
   código: um segundo desenho "de revisão" seria um segundo lugar onde a
   rubrica pode divergir de si mesma, e a divergência apareceria justamente no
   item que está sendo julgado.

   O contexto tem cinco coisas:
   * `form`    — o estado do formulário que este workspace desenha;
   * `leitura` — desliga os ouvintes e trava os campos;
   * `aoDigitar` — cada tecla num campo de texto (barato: não redesenha);
   * `aoMudar`   — mudança ESTRUTURAL (nota, preferência, critério a mais);
   * `motivos`   — o gancho do P3b: devolve a caixa de motivo daquele pedaço do
     payload, ou `null` para quem não precisa dela (anotador e triagem).

   Antes do P3b os dois primeiros eram chamadas diretas a `salvarRascunho()` e
   `salvarEDesenhar()` — funções do ANOTADOR. Com um terceiro leitor que edita
   outro formulário e salva outro rascunho, deixá-las hardcoded faria o revisor
   escrever no rascunho da tarefa que o anotador tem aberta. */
const NADA = () => {};

function ctxEdicao() {
  return {
    form: est.form,
    leitura: false,
    foco: est.foco,
    aoFocar: (i) => { est.foco = i; },
    aoDigitar: () => { salvarRascunho(); atualizarBotaoEnviar(); },
    aoMudar: salvarEDesenhar,
    motivos: null,
  };
}

function ctxLeitura(form) {
  return {
    form: form, leitura: true, foco: -1,
    aoFocar: NADA, aoDigitar: NADA, aoMudar: NADA, motivos: null,
  };
}

/** O IRMÃO DE `ctxLeitura`: o mesmo workspace, destravado, para o revisor.

    A diferença que importa não é a edição — é o `motivos`: cada campo que o
    revisor altera revela, ali mesmo, o campo do motivo daquela alteração. Ver
    `caixaDeMotivos`. */
function ctxEdicaoRevisor() {
  return {
    form: est.rr.form,
    leitura: false,
    // Marca o terceiro leitor. O que ela desliga são as peças que pertencem a
    // QUEM ANOTA: o aviso de rascunho recuperado, o comentário de devolução (a
    // tela do revisor já o mostra no cabeçalho) e a barra de "Enviar e
    // próxima" — a ação primária daqui é registrar a avaliação, e são coisas
    // diferentes com o mesmo lugar na tela.
    revisor: true,
    foco: est.rr.foco,
    aoFocar: (i) => { est.rr.foco = i; },
    aoDigitar: rrDigitou,
    aoMudar: rrMudou,
    motivos: caixaDeMotivos,
  };
}

function desenharWorkspace(env, ctx) {
  const c = ctx || ctxEdicao();
  const meu = !c.leitura && !c.revisor;   // é o formulário de quem ANOTA?
  const caixa = el("div");
  if (c.leitura) caixa.className = "leitura-modo";
  const aviso = meu ? avisoRascunho() : null;
  const devolucao = meu ? blocoDevolucao(env) : null;
  const corpo = el("div", "painel-corpo");
  if (devolucao) corpo.appendChild(devolucao);
  if (aviso) corpo.appendChild(aviso);
  if (devolucao || aviso) caixa.appendChild(corpo);

  caixa.appendChild(blocoPrompt(env));
  const tipo = env.tarefa.tipo;
  if (tipo === "avaliar_rubrica") caixa.appendChild(wsAvaliar(env, c));
  if (tipo === "escrever_rubrica") caixa.appendChild(wsEscrever(env, c));
  if (tipo === "sft_resposta") caixa.appendChild(wsSft(env, c));
  if (tipo === "comparar_ab") caixa.appendChild(wsComparar(env, c));
  if (tipo === "conversa_modelo") caixa.appendChild(wsConversa(env, c));
  if (tipo === "duelo_modelos") caixa.appendChild(wsDuelo(env, c));
  if (meu) caixa.appendChild(barraAcoes());
  return caixa;
}

/* ==========================================================================
   5.3 AVALIAR COM RUBRICA
   ========================================================================== */

function wsAvaliar(env, ctx) {
  const c0 = ctx || ctxEdicao();
  const form = c0.form;
  const caixa = el("div");
  const resposta = env.respostas[0];
  if (resposta) {
    // "A"/"B", e não `modelo-a`: o rótulo é CEGO, e o identificador da coluna
    // não diz nada a quem avalia — só vaza o formato interno para a tela.
    caixa.appendChild(separador(blocoResposta(
      t("ws.resposta_em_avaliacao", { rotulo: rotuloCego(resposta.rotulo) }), resposta.texto)));
  }

  const bloco = separador(el("div", "painel-corpo"));
  if (!env.rubrica || !resposta) {
    bloco.appendChild(semMaterial(
      !resposta ? t("ws.sem_resposta_titulo") : t("ws.sem_rubrica_titulo"),
      t("ws.sem_material_linha")));
    caixa.appendChild(bloco);
    return caixa;
  }
  // A rubrica de fixture vem com as duas línguas (`titulo_i18n`); a escrita por
  // um anotador vem com uma só, e é isso mesmo — ela é dado, não cromo.
  juntar(bloco, el("div", "rotulo-bloco",
    t("ws.rubrica", { titulo: bi(env.rubrica.titulo_i18n, env.rubrica.titulo) })));
  const lista = el("div", "criterios");
  lista.style.marginTop = "10px";

  env.rubrica.criterios.forEach((c, i) => {
    const escala = c.escala || { min: 1, max: 5, ancoras: [] };
    const nomeC = bi(c.nome_i18n, c.nome);
    const cartao = el("div", "criterio");
    cartao.dataset.foco = String(!c0.leitura && c0.foco === i);
    juntar(cartao,
      el("div", "criterio-nome", nomeC),
      el("div", "criterio-desc", bi(c.descricao_i18n, c.descricao)));

    const botoes = el("div", "notas");
    for (let v = escala.min; v <= escala.max; v++) {
      const b = el("button", "nota", String(v));
      b.type = "button";
      b.setAttribute("aria-pressed", String(form.notas[i] === v));
      b.setAttribute("aria-label", t("a11y.nota", { criterio: nomeC, valor: v }));
      if (c0.leitura) b.tabIndex = -1;
      else b.addEventListener("click", () => { c0.aoFocar(i); graduarEm(c0, i, v); });
      botoes.appendChild(b);
    }
    if (!c0.leitura) {
      const limpa = el("button", "botao discreta", t("botao.limpar"));
      limpa.type = "button";
      limpa.addEventListener("click", () => graduarEm(c0, i, null));
      botoes.appendChild(limpa);
    }
    cartao.appendChild(botoes);

    const ancoras = (escala.ancoras || []).slice().sort((a, b) => a.valor - b.valor);
    if (ancoras.length) {
      const ponta = (a) => a.valor + " — " + bi(a.rotulo_i18n, a.rotulo);
      const linha = el("div", "ancoras");
      juntar(linha,
        el("span", null, ponta(ancoras[0])),
        el("span", null, ponta(ancoras[ancoras.length - 1])));
      cartao.appendChild(linha);
    }

    // A justificativa por critério só EXISTE depois do pedido: ela é a exceção
    // do trabalho, não o trabalho. Na leitura, o que não foi justificado
    // simplesmente não aparece — um campo vazio diria que alguém apagou.
    const linhaJust = el("div", "linha-just");
    if (form.justificativas[i] === null || form.justificativas[i] === undefined) {
      if (!c0.leitura) {
        const pedir = el("button", "botao discreta", t("botao.justificar"));
        pedir.type = "button";
        pedir.addEventListener("click", () => { form.justificativas[i] = ""; c0.aoMudar(); });
        linhaJust.appendChild(pedir);
      }
    } else {
      const campo = el("textarea");
      campo.rows = 2;
      campo.className = "largo";
      campo.placeholder = t("ws.just_ph");
      campo.value = form.justificativas[i];
      if (c0.leitura) campo.readOnly = true;
      else campo.addEventListener("input", () => { form.justificativas[i] = campo.value; c0.aoDigitar(); });
      linhaJust.appendChild(campo);
      if (!c0.leitura) linhaJust.appendChild(dicaLinguaMeta("lingua.meta"));
      linhaJust.style.display = "block";
    }
    cartao.appendChild(linhaJust);
    // O MOTIVO DE CADA MUDANÇA, colado ao critério que mudou (P3b). O prefixo
    // cobre a nota E a justificativa daquele critério — os dois são caminhos
    // distintos no payload e cada um ganha o próprio motivo.
    if (c0.motivos) cartao.appendChild(c0.motivos("notas." + i + "."));
    lista.appendChild(cartao);
  });
  bloco.appendChild(lista);

  if (!c0.leitura || (form.comentario_geral || "").trim()) {
    const geral = el("div", "campo");
    geral.style.marginTop = "14px";
    const areaGeral = el("textarea");
    areaGeral.rows = 3;
    areaGeral.placeholder = t("ws.comentario_geral_ph");
    areaGeral.value = form.comentario_geral;
    if (c0.leitura) areaGeral.readOnly = true;
    else areaGeral.addEventListener("input", () => { form.comentario_geral = areaGeral.value; c0.aoDigitar(); });
    juntar(geral, el("span", null, t("ws.comentario_geral")), areaGeral);
    if (!c0.leitura) geral.appendChild(dicaLinguaMeta("lingua.meta"));
    if (c0.motivos) geral.appendChild(c0.motivos("comentario_geral"));
    bloco.appendChild(geral);
  }

  caixa.appendChild(bloco);
  return caixa;
}

/** Grada um critério DENTRO de um contexto. O anotador e o revisor graduam a
    mesma rubrica, em formulários diferentes — e é o contexto que diz qual. */
function graduarEm(c0, i, valor) {
  c0.form.notas[i] = valor;
  c0.aoMudar();
}

/** O atalho de quem anota (o teclado 1..9 chama por aqui). */
function graduar(i, valor) { graduarEm(ctxEdicao(), i, valor); }

/* ==========================================================================
   5.4 ESCREVER RUBRICA
   Três modelos de partida, COLAPSADOS. Matar a página em branco é a maior
   redução de fricção desta aba — e um modelo aberto por padrão viraria a
   rubrica de todo mundo.
   ========================================================================== */

/* O CONTEÚDO dos modelos é INGLÊS nas duas línguas da interface, e isso não é
   um esquecimento de tradução: um critério de rubrica é METADADO, e a convenção
   de língua deste projeto manda metadado em inglês, porque é o que o cliente lê.
   Oferecer um modelo em português produziria, a cada clique, uma rubrica que
   nasce violando a própria convenção que a tela acabou de declarar ao lado do
   campo. O que É cromo — o rótulo do botão e a explicação — está no dicionário. */
const MODELOS_RUBRICA = [
  {
    nome: "modelo.instrucao",
    titulo: "The answer does what was asked",
    criterios: [
      ["Respects the stated constraints", "Counts, format, tone and limits the request declared out loud.", "ignores at least one stated constraint", "meets them all, including the implied ones"],
      ["Answers the right question", "Goes at the problem the person has, not at a similar-looking one.", "answers something else", "answers exactly what was asked"],
      ["Completeness", "Every part of the request shows up; nothing was quietly dropped.", "leaves part of the request unanswered", "covers everything and flags what it could not cover"],
    ],
  },
  {
    nome: "modelo.verdade",
    titulo: "The answer can be trusted",
    criterios: [
      ["Facts", "Names, numbers, dates and quotes are true and checkable.", "states an invented figure with the look of precision", "states only what can be checked"],
      ["Uncertainty declared", "An estimate reads as an estimate; so does anything that depends on context.", "presents a guess as a certainty", "separates the certain from the likely in the sentence itself"],
      ["Knows where its role ends", "Recognises when the matter needs a professional, and still helps.", "fakes authority it does not have", "genuinely helps and draws the line in one sentence"],
    ],
  },
  {
    nome: "modelo.utilidade",
    titulo: "The answer is something you can act on",
    criterios: [
      ["Actionable", "You can act after one read, with what the person said they have.", "requires a resource the person said they lack", "actionable end to end with what was declared"],
      ["Right register", "The tone fits the recipient and the situation as described.", "clearly wrong register", "sounds like one person writing to another"],
      ["Density", "Every paragraph adds something; nothing is fluent filler.", "fluent and empty prose", "not one line to spare"],
    ],
  },
];

function wsEscrever(env, ctx) {
  const c0 = ctx || ctxEdicao();
  const form = c0.form;
  const caixa = separador(el("div", "painel-corpo"));

  if (!c0.leitura) {
    const modelos = el("details", "modelos");

  entrada.className = "largo";
  entrada.maxLength = 200;
  entrada.placeholder = t("ws.titulo_rubrica_ph");
  entrada.value = form.titulo;
  if (c0.leitura) entrada.readOnly = true;
  else entrada.addEventListener("input", () => { form.titulo = entrada.value; c0.aoDigitar(); });
  juntar(tituloCampo, el("span", null, t("ws.titulo_rubrica")), entrada);
  // UMA dica de língua para a rubrica inteira, no primeiro campo de texto dela:
  // repeti-la em cada um dos até oito critérios viraria ruído, e o texto já diz
  // que ela vale para a rubrica e para os critérios.
  if (!c0.leitura) tituloCampo.appendChild(dicaLinguaMeta("lingua.rubrica"));
  if (c0.motivos) tituloCampo.appendChild(c0.motivos("titulo"));

      min: lim("min_criterios_rubrica", 3), max: lim("max_criterios_rubrica", 8),
    })));

function editorCriterio(c, i, ctx) {
  const c0 = ctx || ctxEdicao();
  const cartao = el("div", "editor-criterio");
  const cabeca = el("div", "forma");
  juntar(cabeca, el("span", "rotulo-bloco", t("ws.criterio_n", { n: i + 1 })), el("span", "crescer"));
  if (!c0.leitura) {
    const tirar = el("button", "botao discreta", t("botao.remover"));
    tirar.type = "button";
    tirar.addEventListener("click", () => { c0.form.criterios.splice(i, 1); c0.aoMudar(); });
    cabeca.appendChild(tirar);
  }
  cartao.appendChild(cabeca);

  const nome = el("input");
  nome.type = "text";
  nome.className = "largo";
  nome.placeholder = t("ws.criterio_nome_ph");
  nome.value = c.nome;
  if (c0.leitura) nome.readOnly = true;
  else nome.addEventListener("input", () => { c.nome = nome.value; c0.aoDigitar(); });
  cartao.appendChild(nome);

  const desc = el("textarea");
  desc.rows = 2;
  desc.placeholder = t("ws.criterio_desc_ph");
  desc.value = c.descricao;
  if (c0.leitura) desc.readOnly = true;
  else desc.addEventListener("input", () => { c.descricao = desc.value; c0.aoDigitar(); });
  cartao.appendChild(desc);

  const campos = el("div", "campos");
  const pontas = [
    ["rotulo_min", "ws.rotulo_min"],
    ["rotulo_max", "ws.rotulo_max"],
  ];
  for (const [chave, rotulo] of pontas) {
    const campo = el("div", "campo");
    const entrada = el("input");
    entrada.type = "text";
    entrada.className = "largo";
    entrada.value = c[chave];
    if (c0.leitura) entrada.readOnly = true;
    else entrada.addEventListener("input", () => { c[chave] = entrada.value; c0.aoDigitar(); });
    juntar(campo, el("span", null, t(rotulo)), entrada);
    campos.appendChild(campo);
  }
  const escala = el("div", "campo");
  const sel = el("select");
  for (const max of [3, 4, 5, 7]) {
    const o = el("option", null, t("ws.escala_opcao", { max: max }));
    o.value = String(max);
    sel.appendChild(o);
  }
  sel.value = String(c.escala_max);
  if (c0.leitura) sel.disabled = true;
  else sel.addEventListener("change", () => { c.escala_max = Number(sel.value); c0.aoDigitar(); });
  juntar(escala, el("span", null, t("ws.escala")), sel);
  campos.appendChild(escala);
  cartao.appendChild(campos);
  // Um bloco de motivos por CRITÉRIO: o prefixo cobre nome, descrição, as duas
  // pontas da escala e o tamanho dela — cinco caminhos, cada um com o seu.
  if (c0.motivos) cartao.appendChild(c0.motivos("criterios." + i + "."));
  return cartao;
}

/* ==========================================================================
   5.5 RESPOSTA DE REFERÊNCIA (SFT)

function wsSft(env, ctx) {
  const c0 = ctx || ctxEdicao();
  const form = c0.form;

  else campo.addEventListener("input", () => {
    form.resposta = campo.value;
    contadorSft.textContent = t("ws.contador_chars", { n: n(campo.value.trim().length) });
    c0.aoDigitar();
  });

    t("ws.contador_chars", { n: n(form.resposta.trim().length) }));

  if (!c0.leitura) coluna.appendChild(dicaLinguaDado(env.prompt.lang));

  if (guia) {

    juntar(lado, el("div", "rotulo-bloco",

    if (guia.nota_chave) lado.appendChild(el("p", "fraco", t(guia.nota_chave)));

      if (c0.leitura) caixinha.disabled = true;
      else caixinha.addEventListener("change", () => { form.checklist[i] = caixinha.checked; c0.aoDigitar(); });
      const texto = el("span");
      juntar(texto,
        el("div", "criterio-nome", bi(c.nome_i18n, c.nome)),
        el("div", "criterio-desc", bi(c.descricao_i18n, c.descricao)));
      juntar(rotulo, caixinha, texto);
      marcaveis.appendChild(rotulo);

    lado.appendChild(el("p", "fraco", c0.leitura ? t("ws.guia_leitura") : t("ws.guia_edicao")));

/* ==========================================================================
   5.6 COMPARAR A/B
   Duas colunas com ROLAGEM SINCRONIZADA: a comparação é trecho a trecho, e
   duas barras independentes obrigam a pessoa a reencontrar o lugar a cada vez.
   ========================================================================== */

function wsComparar(env, ctx) {
  const c0 = ctx || ctxEdicao();
  const form = c0.form;
  const caixa = separador(el("div", "painel-corpo"));
  // Sem par não há comparação. Estado honesto com saídas reais, nunca duas
  // colunas vazias esperando um material que não existe.
  if (env.respostas.length < 2) {
    caixa.appendChild(semMaterial(t("ws.sem_par_titulo"), t("ws.sem_par_linha")));
    return caixa;
  }
  const grade = el("div", "ab");
  const areas = [];

  env.respostas.forEach((r, i) => {
    const coluna = el("button", "ab-coluna");
    coluna.type = "button";
    coluna.setAttribute("aria-pressed", String(form.preferencia === r.rotulo));
    const cabeca = el("div", "ab-cabeca");
    juntar(cabeca,
      el("strong", null, rotuloCego(r.rotulo)),
      el("span", "fraco", t("ws.rotulo_cego")),
      el("span", "crescer"),
      el("span", "atalho", c0.leitura
        ? (form.preferencia === r.rotulo ? t("ws.escolhida") : "")
        : (i === 0 ? "←" : "→")));
    const texto = el("div", "ab-texto");
    texto.appendChild(el("div", "leitura", r.texto));
    juntar(coluna, cabeca, texto);
    if (c0.leitura) coluna.tabIndex = -1;
    else coluna.addEventListener("click", () => escolherABEm(c0, r.rotulo));
    areas.push(texto);
    grade.appendChild(coluna);
  });
  caixa.appendChild(grade);
  sincronizarRolagem(areas);

  const empate = el("div", "ab-empate");
  const bEmpate = el("button", "botao", t("botao.empate"));
  bEmpate.type = "button";
  bEmpate.setAttribute("aria-pressed", String(form.preferencia === "empate"));
  if (form.preferencia === "empate") bEmpate.classList.add("primaria");
  if (c0.leitura) bEmpate.tabIndex = -1;
  else bEmpate.addEventListener("click", () => escolherABEm(c0, "empate"));
  juntar(empate, bEmpate, c0.leitura ? null : el("span", "atalho", "E"));
  if (c0.motivos) empate.appendChild(c0.motivos("preferencia"));
  caixa.appendChild(empate);

  const minimo = lim("min_chars_justificativa", 30);
  const campo = el("div", "campo");
  campo.style.marginTop = "16px";
  const area = el("textarea");
  area.rows = 4;
  area.placeholder = t("ws.just_ab_ph", { min: minimo });
  area.value = form.justificativa;
  if (c0.leitura) area.readOnly = true;
  else area.addEventListener("input", () => {
    form.justificativa = area.value;
    contador.textContent = t("ws.contador_de", { n: n(area.value.trim().length), min: minimo });
    c0.aoDigitar();
  });
  juntar(campo,
    el("span", null, c0.leitura ? t("ws.just_ab_rotulo_leitura") : t("ws.just_ab_rotulo")),
    area);
  const contador = el("div", "contador", c0.leitura
    ? t("ws.contador_chars", { n: n(form.justificativa.trim().length) })
    : t("ws.contador_de", { n: n(form.justificativa.trim().length), min: minimo }));
  campo.appendChild(contador);
  if (!c0.leitura) campo.appendChild(dicaLinguaMeta("lingua.meta"));
  if (c0.motivos) campo.appendChild(c0.motivos("justificativa"));
  caixa.appendChild(campo);
  return caixa;
}

/* ==========================================================================
   5.6b CONVERSA COM MODELO LOCAL  (P4d)

   Duas abas, um mecanismo. A diferença entre elas cabe numa frase: na CONVERSA
   um modelo responde e o nome dele está à vista; no DUELO dois respondem sob
   rótulos cegos e o anotador escolhe com qual a conversa continua.

   O NOME DO MODELO NÃO ENTRA NO DUELO, E ISSO É ESTRUTURAL
   ========================================================
   O servidor não manda `modelo` nem `digest` nos turnos de um duelo (ver
   `conversa._dict`), e as funções que desenham o duelo nunca leem esses campos.
   São as duas metades da mesma garantia: se a tela lesse, bastaria o dia em que
   alguém "só acrescentasse o campo no envelope" para a preferência passar a ser
   sobre a marca. Quem revela é `blocoRevelacao`, e só depois do envio.

   A CONVERSA VIVE NO SERVIDOR
   ===========================
   Os turnos vêm no envelope (`env.conversa`), não do localStorage: recarregar a
   página, fechar a aba ou derrubar o servidor não custa trinta turnos. O
   rascunho guarda uma CÓPIA deles mesmo assim (`form.turnos`), porque perder
   trabalho é a maior fricção que existe e uma segunda rede não custa nada.
   ========================================================================== */

/** As chaves que o SERVIDOR escolhe para o estado do runtime.

    Numa tabela com a chave INTEIRA pelo mesmo motivo de `TIPOS`: uma chave
    montada (ou vinda crua do servidor) é invisível para o teste de chave órfã, e
    o dicionário passaria a acumular entradas mortas. Ela também é a guarda: uma
    chave que o front não conhece cai na de servidor fora do ar, em vez de
    escrever `modelos.qualquer_coisa` na tela. */
const CHAVES_RUNTIME = [
  "modelos.falhou",
  "modelos.fora_do_ar",
  "modelos.faltam",
  "modelos.pronto",
  "modelos.nenhum",
  "modelos.sem_resposta",
];
/** Uma chave desconhecida cai na genérica — que não tem marcador nenhum.

    Cair na de "servidor fora do ar" seria pior que cair em nada: ela promete
    `{url}` e, com dados de outra falha, escreve `{url}` literal na tela. Foi
    exatamente o que apareceu no navegador quando uma resposta vazia herdou a
    chave errada. */
function chaveRuntime(bruta) {
  return CHAVES_RUNTIME.indexOf(bruta) >= 0 ? bruta : CHAVES_RUNTIME[0];
}

/** O estado do runtime como a tela o mostra: o que falta e o comando que arruma.

    NÃO É UM ERRO, é uma instrução. A máquina que abre esta plataforma pode não
    ter baixado 7,5 GB ainda, e isso é normal — tratar como falha faria "falta
    baixar um arquivo" parecer "a plataforma quebrou". */
function blocoRuntime() {
  const m = (est.saude && est.saude.modelos) || null;
  if (!m) return null;
  const erro = est.erroModelo;
  const pronto = m.ok && !erro;
  const caixa = el("div", "runtime" + (pronto ? " pronto" : ""));
  const cabeca = el("div", "forma");
  juntar(cabeca,
    el("strong", null, t("runtime.titulo")),
    el("span", "crescer"),
    el("span", "fraco", t("runtime.timeout", { n: m.timeout_s })));
  caixa.appendChild(cabeca);

  const chave = erro ? chaveRuntime(erro.chave) : chaveRuntime(m.erro_chave);
  const dados = erro ? erro.dados : m.erro_dados;
  caixa.appendChild(el("p", null, t(chave, dados || {})));
  // A frase CRUA do servidor, quando houver, como `.dado`: ela vem numa língua
  // só (é a mesma que a API põe em /docs) e traz o detalhe que a chave
  // generaliza. Sem ela, uma falha imprevista viraria "não deu para gerar" e
  // nada mais — e o diagnóstico ficaria no terminal, longe de quem está vendo.
  if (erro && erro.mensagem) caixa.appendChild(el("p", "fraco dado", erro.mensagem));

  const nomes = (m.instalados || []).map((x) => x.nome);
  // `.dado`: nome de modelo e URL vêm do servidor, não do dicionário.
  caixa.appendChild(el("p", "fraco dado", t("runtime.instalados", {
    lista: nomes.length ? nomes.join(", ") : t("runtime.nenhum_instalado"),
  }) + " · " + m.url));

  const comandos = (erro && erro.comandos) || m.comandos || [];
  if (!pronto && comandos.length) {
    caixa.appendChild(el("span", "fraco", t("runtime.conserto")));
    // O comando é COMANDO: sai igual nas duas línguas e é selecionável inteiro.
    for (const c of comandos) caixa.appendChild(el("code", "comando dado", c));
  }
  const rever = el("button", "botao discreta", t("runtime.rever"));
  rever.type = "button";
  rever.addEventListener("click", reconferirModelos);
  caixa.appendChild(juntar(el("div", "forma"), rever));
  return caixa;
}

/** Reconfere o runtime sem recarregar a tela — o caminho de quem acabou de
    rodar `ollama pull` no terminal ao lado. */
async function reconferirModelos() {
  try {
    const m = await api("/api/modelos");
    if (est.saude) est.saude.modelos = m;
    est.erroModelo = null;
  } catch (e) {
    recado(t("recado.erro_modelos", { erro: e.message }), true);
  }
  desenharArea();
}

/* ---- o tempo decorrido da GERAÇÃO ----
   O único relógio à vista nesta plataforma, e ele mede a MÁQUINA. Medido: 17,6 s
   para um turno do modelo mais verboso — sem indicador, isso é indistinguível de
   um travamento. `setTimeout` recursivo, e não um intervalo: quando o nó do
   indicador sai da tela o laço se encerra sozinho, sem ninguém para limpá-lo. */
let tiqueGeracao = null;
function pararTique() { clearTimeout(tiqueGeracao); tiqueGeracao = null; }
function tiquetaque() {
  const no = $("#decorrido");
  if (!no || !est.gerando) { pararTique(); return; }
  no.textContent = t("conversa.decorrido",
    { s: Math.max(0, Math.round((Date.now() - est.gerando.desde) / 1000)) });
  tiqueGeracao = setTimeout(tiquetaque, 1000);
}

function blocoGerando() {
  const g = est.gerando;
  if (!g) return null;
  const caixa = el("div", "gerando");
  const quem = g.dois
    ? t("conversa.gerando_dois")
    : t("conversa.gerando", { modelo: g.modelo || "" });
  const decorrido = el("span", "decorrido", t("conversa.decorrido", { s: 0 }));
  decorrido.id = "decorrido";
  decorrido.title = t("conversa.decorrido_titulo");
  juntar(caixa, el("span", "ponto-gerando"), el("span", null, quem), decorrido);
  pararTique();
  tiqueGeracao = setTimeout(tiquetaque, 250);
  return caixa;
}

/** Qual modelo responde na conversa de um só: o PRIMEIRO da configuração. É a
    mesma regra do servidor (`modelos.modelos_configurados()[0]`), e aqui ela só
    serve para nomear quem está gerando. */
function modeloDaVez() {
  const m = (est.saude && est.saude.modelos) || {};
  return (m.configurados || [])[0] || "";
}

/* ---- as peças de um turno ---- */

/** A casca de um turno: cabeça (quem, quando, quanto demorou) e corpo.

    `extras` entra na cabeça — é por onde o nome do modelo aparece na CONVERSA e
    por onde ele NÃO aparece no duelo. */
function bolha(papel, texto, extras, opcoes) {
  const o = opcoes || {};
  const caixa = el("div", "turno" + (papel === "usuario" ? " eu" : "") +
    (o.marcado ? " marcado" : ""));
  const cabeca = el("div", "turno-cabeca");
  juntar(cabeca,
    el("span", "turno-quem", papel === "usuario" ? t("conversa.eu") : t("conversa.modelo")));
  for (const extra of extras || []) if (extra) cabeca.appendChild(extra);
  caixa.appendChild(cabeca);
  const corpo = el("div", "turno-corpo");
  // `.dado`: o texto do prompt e o do modelo são DADOS, na língua deles.
  corpo.appendChild(el("div", "leitura dado", texto));
  caixa.appendChild(corpo);
  return caixa;
}

/** O raciocínio do modelo, RECOLHIDO e à parte da resposta.

    Não é filtrado em silêncio: ele é conteúdo que o anotador pode querer
    avaliar, e descartá-lo seria decidir por ele que não conta. Também não é a
    resposta — por isso vem fechado, embaixo, com marcador. */
function blocoRaciocinio(turno) {
  const bruto = turno.raciocinio || "";
  if (!bruto.trim()) return null;
  const det = el("details", "raciocinio");
  det.appendChild(el("summary", null, t("conversa.raciocinio", { n: n(bruto.length) })));
  det.appendChild(el("div", "raciocinio-corpo dado", bruto));
  return det;
}

/** MARCAR UM TURNO: nota + motivo, ALI, sem modal.

    O mesmo padrão do motivo por edição do P3b, e pela mesma razão: um modal
    esconderia justamente o texto sobre o qual a nota está sendo dada. */
function marcacaoDeTurno(ordem, c0) {
  const form = c0.form;
  const atual = form.problemas[String(ordem)];
  if (c0.leitura && !atual) return null;
  if (!atual && form.marcando !== ordem) return null;

  const escala = escalaDoTurno();
  const caixa = el("div", "marca-turno");
  const linha = el("div", "forma");
  juntar(linha, el("span", "fraco", t("conversa.marca_nota")));
  for (let v = escala.min; v <= escala.max; v++) {
    const b = el("button", "nota", String(v));
    b.type = "button";
    b.setAttribute("aria-pressed", String(!!atual && atual.nota === v));
    b.setAttribute("aria-label", t("a11y.turno_nota", { n: ordem, valor: v }));
    if (c0.leitura) b.tabIndex = -1;
    else b.addEventListener("click", () => { marcarTurno(c0, ordem, v, null); });
    linha.appendChild(b);
  }
  caixa.appendChild(linha);

  const campo = el("div", "campo");
  const area = el("textarea");
  area.rows = 2;
  area.placeholder = t("conversa.marca_motivo_ph");
  area.value = (atual && atual.motivo) || "";
  if (c0.leitura) area.readOnly = true;
  else area.addEventListener("input", () => {
    marcarTurno(c0, ordem, undefined, area.value, true);
  });
  juntar(campo, el("span", null, t("conversa.marca_motivo")), area);
  if (!c0.leitura) campo.appendChild(dicaLinguaMeta("lingua.meta"));
  caixa.appendChild(campo);

  if (!c0.leitura) {
    const tirar = el("button", "botao discreta", t("conversa.marca_remover"));
    tirar.type = "button";
    tirar.addEventListener("click", () => {
      delete form.problemas[String(ordem)];
      form.marcando = null;
      c0.aoMudar();
    });
    caixa.appendChild(juntar(el("div", "forma"), tirar));
  }
  return caixa;
}

/** A escala da marcação, LIDA DO SERVIDOR — nunca uma cópia no JS, pela mesma
    razão dos `limites`: uma cópia divergiria do 422 na primeira vez que ela
    mudasse, e o botão prometeria o que o servidor desmente. */
function escalaDoTurno() {
  const m = (est.saude && est.saude.modelos) || {};
  const e = m.escala_turno || {};
  return { min: Number(e.min) || 1, max: Number(e.max) || 5 };
}

function marcarTurno(c0, ordem, nota, motivo, soDigitou) {
  const chave = String(ordem);
  const atual = c0.form.problemas[chave] || { nota: escalaDoTurno().min, motivo: "" };
  if (nota !== undefined && nota !== null) atual.nota = nota;
  if (motivo !== undefined && motivo !== null) atual.motivo = motivo;
  c0.form.problemas[chave] = atual;
  c0.form.marcando = ordem;
  // Digitar não redesenha (tiraria o foco do campo no meio da frase); mudar a
  // nota sim, porque o botão pressionado precisa mudar de cor.
  if (soDigitou) c0.aoDigitar(); else c0.aoMudar();
}

/** O botão que abre a marcação de um turno. Fora da bolha para não competir com
    o texto — a leitura vem primeiro, a marcação é a exceção. */
function botaoMarcar(ordem, c0) {
  if (c0.leitura) return null;
  const marcado = !!c0.form.problemas[String(ordem)];
  const b = el("button", "turno-acao", marcado ? t("conversa.marcado") : t("conversa.marcar"));
  b.type = "button";
  b.addEventListener("click", () => {
    c0.form.marcando = c0.form.marcando === ordem ? null : ordem;
    if (c0.form.marcando === ordem && !marcado) marcarTurno(c0, ordem, null, "");
    else c0.aoMudar();
  });
  return b;
}

/** Os turnos que a tela desenha: os do SERVIDOR quando existem, o espelho do
    rascunho quando não (leitura de uma anotação já enviada, ou uma rede que
    caiu no meio). */
function turnosDe(env, c0) {
  const doServidor = (env.conversa && env.conversa.turnos) || null;
  if (doServidor && doServidor.length) {
    // O rascunho guarda a conversa INTEIRA, e não só o formulário: é a segunda
    // rede sob os trinta turnos.
    c0.form.turnos = doServidor;
    return doServidor;
  }
  return c0.form.turnos || [];
}

function selo(texto) { return el("span", "selo", texto); }

/* ---- CONVERSA: um modelo, nome à vista ---- */

function fluxoConversa(env, c0) {
  const caixa = el("div", "conversa");
  caixa.setAttribute("aria-label", t("a11y.conversa"));
  for (const turno of turnosDe(env, c0)) {
    const extras = [selo(t("conversa.turno_n", { n: turno.ordem }))];
    if (turno.papel === "modelo") {
      // Na conversa de um modelo só NÃO há preferência a enviesar, e saber com
      // quem se fala é o que permite dizer "esta família faz isto".
      if (turno.modelo) extras.push(el("span", "selo dado", turno.modelo));
      extras.push(selo(t("conversa.duracao", { s: Math.round(turno.duracao_ms / 1000) })));
      if (turno.truncado) extras.push(selo(t("conversa.truncado")));
    }
    extras.push(el("span", "crescer"), botaoMarcar(turno.ordem, c0));
    const bola = bolha(turno.papel, turno.texto, extras,
      { marcado: !!c0.form.problemas[String(turno.ordem)] });
    const raciocinio = blocoRaciocinio(turno);
    if (raciocinio) bola.appendChild(raciocinio);
    const marca = marcacaoDeTurno(turno.ordem, c0);
    if (marca) bola.appendChild(marca);
    caixa.appendChild(bola);
  }
  return caixa;
}

/* ---- DUELO: dois modelos, rótulo cego ----
   NENHUMA das duas funções abaixo lê `modelo` ou `digest` de um turno. Ver o
   cabeçalho desta seção: é metade da garantia de que o rótulo é cego de verdade,
   e a outra metade é o servidor não mandar os campos. */

function fluxoDuelo(env, c0) {
  const caixa = el("div", "conversa");
  caixa.setAttribute("aria-label", t("a11y.conversa"));
  const turnos = turnosDe(env, c0);
  const porOrdem = {};
  for (const turno of turnos) {
    (porOrdem[turno.ordem] = porOrdem[turno.ordem] || []).push(turno);
  }
  const ordens = Object.keys(porOrdem).map(Number).sort((a, b) => a - b);
  const pendente = env.conversa ? env.conversa.rodada_pendente : null;

  for (const ordem of ordens) {
    const grupo = porOrdem[ordem];
    if (grupo[0].papel === "usuario") {
      const extras = [selo(t("conversa.turno_n", { n: ordem })), el("span", "crescer"),
        botaoMarcar(ordem, c0)];
      const bola = bolha("usuario", grupo[0].texto, extras,
        { marcado: !!c0.form.problemas[String(ordem)] });
      const marca = marcacaoDeTurno(ordem, c0);
      if (marca) bola.appendChild(marca);
      caixa.appendChild(bola);
      continue;
    }
    caixa.appendChild(rodadaDuelo(ordem, grupo, c0, ordem === pendente));
  }
  return caixa;
}

/** Uma rodada: duas colunas cegas, rolagem sincronizada, e a escolha embaixo. */
function rodadaDuelo(ordem, respostas, c0, pendente) {
  const caixa = el("div", "rodada");
  const cabeca = el("div", "forma");
  juntar(cabeca,
    el("span", "rotulo-bloco", t("duelo.rodada", { n: ordem })),
    el("span", "crescer"),
    botaoMarcar(ordem, c0));
  caixa.appendChild(cabeca);

  const grade = el("div", "ab");
  const areas = [];
  const vencedora = respostas.find((r) => r.escolhida);
  respostas.slice().sort((a, b) => (a.rotulo < b.rotulo ? -1 : 1)).forEach((r, i) => {
    const escolhivel = pendente && !c0.leitura;
    const coluna = el("button", "ab-coluna");
    coluna.type = "button";
    coluna.setAttribute("aria-pressed", String(!!r.escolhida));
    const cab = el("div", "ab-cabeca");
    juntar(cab,
      el("strong", null, r.rotulo),
      el("span", "fraco", t("duelo.lado")),
      el("span", "crescer"),
      r.truncado ? selo(t("conversa.truncado")) : null,
      selo(t("conversa.duracao", { s: Math.round(r.duracao_ms / 1000) })),
      el("span", "atalho", escolhivel ? (i === 0 ? "←" : "→")
        : (r.escolhida ? t("duelo.vencedora", { lado: r.rotulo }) : "")));
    const texto = el("div", "ab-texto");
    texto.appendChild(el("div", "leitura dado", r.texto));
    juntar(coluna, cab, texto);
    if (!escolhivel) coluna.tabIndex = -1;
    else coluna.addEventListener("click", () => escolherLado(r.rotulo));
    const raciocinio = blocoRaciocinio(r);
    if (raciocinio) coluna.appendChild(raciocinio);
    areas.push(texto);
    grade.appendChild(coluna);
  });
  caixa.appendChild(grade);
  sincronizarRolagem(areas);

  const marca = marcacaoDeTurno(ordem, c0);
  if (marca) caixa.appendChild(marca);

  if (pendente && !c0.leitura) caixa.appendChild(caixaDeEscolha(ordem, c0));
  else if (vencedora && vencedora.justificativa) {
    caixa.appendChild(el("p", "rodada-nota dado", vencedora.justificativa));
  }
  return caixa;
}

/** A escolha da rodada: um motivo POR RODADA, e ele é obrigatório.

    Por rodada e não uma no fim porque é isso que torna o dado multi-turno mais
    valioso que o de turno único: "escolhi B na rodada 1 pela concisão e A na 3
    porque B esqueceu a restrição" são dois sinais, e uma justificativa única os
    fundiria num só. */
function caixaDeEscolha(ordem, c0) {
  const minimo = lim("min_chars_justificativa", 30);
  const caixa = el("div", "duelo-escolha");
  juntar(caixa, el("span", "rotulo-bloco", t("duelo.escolher")));
  caixa.appendChild(el("p", "fraco", t("duelo.oculto")));

  const campo = el("div", "campo");
  const area = el("textarea");
  area.rows = 3;
  area.placeholder = t("duelo.por_que_ph");
  area.value = c0.form.escolha || "";
  area.addEventListener("input", () => {
    c0.form.escolha = area.value;
    c0.aoDigitar();
    atualizarBotoesDaConversa();
  });
  juntar(campo, el("span", null, t("duelo.por_que")), area);
  campo.appendChild(dicaLinguaMeta("lingua.meta"));
  caixa.appendChild(campo);

  const botoes = el("div", "forma");
  for (const lado of ["A", "B"]) {
    const b = el("button", "botao primaria escolher-lado",
      t("duelo.continuar", { lado: lado }));
    b.type = "button";
    b.disabled = (c0.form.escolha || "").trim().length < minimo || est.carregando;
    b.addEventListener("click", () => escolherLado(lado));
    botoes.appendChild(b);
  }
  juntar(botoes, el("span", "atalho", "←"), el("span", "atalho", "→"),
    el("span", "fraco", t("ws.contador_de", {
      n: n((c0.form.escolha || "").trim().length), min: minimo,
    })));
  caixa.appendChild(botoes);
  return caixa;
}

/* ---- o compositor e o encerramento ---- */

function compositor(env) {
  const conversa = env.conversa || {};
  const caixa = el("div", "compositor");

  if (conversa.rodada_pendente !== null && conversa.rodada_pendente !== undefined) {
    // Sem vencedora não se sabe com qual resposta a conversa continua — e
    // inventar a continuação seria fabricar uma escolha que ninguém fez.
    caixa.appendChild(el("p", "fraco", t("duelo.escolher")));
    return caixa;
  }

  if (conversa.aguardando !== null && conversa.aguardando !== undefined) {
    const aviso = el("div", "aviso-rascunho");
    juntar(aviso,
      el("span", null, t("conversa.falhou") + " " + t("conversa.falhou_linha")));
    const tentar = el("button", "botao primaria", t("conversa.tentar"));
    tentar.type = "button";
    tentar.disabled = !!est.gerando;
    tentar.addEventListener("click", () => mandarTurno(null));
    aviso.appendChild(tentar);
    caixa.appendChild(aviso);
    return caixa;
  }

  const cheio = conversa.n_turnos >= conversa.max_turnos;
  if (cheio) {
    caixa.appendChild(el("p", "fraco", t("conversa.teto_cheio", { max: conversa.max_turnos })));
    return caixa;
  }

  const area = el("textarea");
  area.rows = 4;
  area.id = "compositor";
  const primeiro = !(conversa.turnos || []).length;
  area.placeholder = primeiro ? t("conversa.primeiro_ph") : t("conversa.enviar_ph");
  area.value = est.form.rascunho || "";
  area.disabled = !!est.gerando;
  area.addEventListener("input", () => {
    est.form.rascunho = area.value;
    salvarRascunho();
    // SÓ o botão, sem redesenhar: um redesenho a cada tecla tiraria o foco do
    // campo no meio da frase — o mesmo motivo de `atualizarBotaoEnviar`.
    atualizarBotoesDaConversa();
  });
  caixa.appendChild(area);
  // A CONVERSA É DADO: ela sai na língua do prompt, não na da interface. É a
  // mesma convenção da resposta de referência, e ela é dita aqui porque é aqui
  // que a dúvida ocorre.
  caixa.appendChild(dicaLinguaDado(env.prompt.lang));

  const linha = el("div", "forma");
  const mandar = el("button", "botao primaria", t("conversa.enviar"));
  mandar.type = "button";
  mandar.id = "mandar-turno";
  mandar.disabled = !!est.gerando || !(est.form.rascunho || "").trim();
  mandar.addEventListener("click", () => mandarTurno((est.form.rascunho || "").trim()));
  juntar(linha, mandar, el("span", "atalho", "Ctrl+Enter"),
    el("span", "crescer"),
    el("span", "fraco", t("conversa.teto", {
      n: conversa.n_turnos, max: conversa.max_turnos,
    })));
  caixa.appendChild(linha);
  return caixa;
}

/** Reabilita os botões que dependem do que está sendo DIGITADO, sem redesenhar.

    Existe pelo mesmo motivo de `atualizarBotaoEnviar`, e o defeito que ele
    conserta apareceu no navegador: o botão de mandar o turno nasce desabilitado
    (o compositor está vazio), e sem isto ele continuava desabilitado **enquanto
    a pessoa digitava** — a aba inteira parecia travada depois do primeiro turno.
    Redesenhar a cada tecla não serve: tiraria o foco do campo no meio da frase. */
function atualizarBotoesDaConversa() {
  if (!est.form) return;
  const mandar = $("#mandar-turno");
  if (mandar) mandar.disabled = !!est.gerando || !(est.form.rascunho || "").trim();
  const minimo = lim("min_chars_justificativa", 30);
  const podeEscolher = (est.form.escolha || "").trim().length >= minimo && !est.carregando;
  for (const b of document.querySelectorAll(".escolher-lado")) b.disabled = !podeEscolher;
}

/** O botão que ENCERRA e revela a rubrica. Divulgação progressiva levada a
    sério: enquanto se conversa, a rubrica não existe na tela — ela é a decisão
    do fim, e mostrá-la antes competiria com a conversa que está acontecendo. */
function barraEncerrar(env) {
  const conversa = env.conversa || {};
  const linha = el("div", "forma");
  linha.style.marginTop = "14px";
  const b = el("button", "botao", t("conversa.encerrar"));
  b.type = "button";
  b.disabled = !conversa.avaliavel;
  b.addEventListener("click", encerrarConversa);
  juntar(linha, b, el("span", "atalho", t("conversa.encerrar_atalho")));
  if (!conversa.avaliavel) linha.appendChild(el("span", "fraco", t("falta.sem_turno")));
  return linha;
}

function encerrarConversa() {
  if (!est.form || est.form.encerrada) return;
  est.form.encerrada = true;
  salvarEDesenhar();
  recado(t("recado.conversa_encerrada"));
}

/** A avaliação: a rubrica multi-turno + os turnos marcados + a geral.

    A rubrica é a MESMA de `wsAvaliar` no desenho, e de propósito — quem já
    graduou uma rubrica nesta plataforma reconhece o controle em vez de aprender
    outro. O que muda é o objeto: aqui ela fala da conversa inteira. */
function avaliacaoDaConversa(env, c0) {
  const form = c0.form;
