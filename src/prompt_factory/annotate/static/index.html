  const caixa = separador(el("div", "painel-corpo"));
  const cabeca = el("div", "forma");
  juntar(cabeca,
    el("h3", null, t("conversa.rubrica_titulo")),
    el("span", "crescer"),
    el("span", "fraco", t("conversa.problemas_n", {
      n: Object.keys(form.problemas || {}).length,
    })));
  caixa.appendChild(cabeca);
  if (!c0.leitura) {
    const voltar = el("button", "botao discreta", t("conversa.reabrir"));
    voltar.type = "button";
    voltar.addEventListener("click", () => { form.encerrada = false; salvarEDesenhar(); });
    cabeca.appendChild(voltar);
  }
  caixa.appendChild(el("p", "fraco", t("ws.rubrica_multiturno")));

  const rubrica = env.rubrica || { criterios: [] };
  const lista = el("div", "criterios");
  lista.style.marginTop = "10px";
  rubrica.criterios.forEach((c, i) => {
    const escala = c.escala || { min: 1, max: 5, ancoras: [] };
    const nomeC = bi(c.nome_i18n, c.nome);
    const cartao = el("div", "criterio");
    cartao.dataset.foco = String(!c0.leitura && c0.foco === i);
    juntar(cartao,
      el("div", "criterio-nome", nomeC),
      el("div", "criterio-desc", bi(c.descricao_i18n, c.descricao)));
    const botoes = el("div", "notas");
    for (let v = escala.min; v <= escala.max; v++) {
      const b = el("button", "nota", String(v));
      b.type = "button";
      b.setAttribute("aria-pressed", String(form.notas[i] === v));
      b.setAttribute("aria-label", t("a11y.nota", { criterio: nomeC, valor: v }));
      if (c0.leitura) b.tabIndex = -1;
      else b.addEventListener("click", () => { c0.aoFocar(i); graduarEm(c0, i, v); });
      botoes.appendChild(b);
    }
    cartao.appendChild(botoes);
    const ancoras = (escala.ancoras || []).slice().sort((a, b) => a.valor - b.valor);
    if (ancoras.length) {
      const ponta = (a) => a.valor + " — " + bi(a.rotulo_i18n, a.rotulo);
      const linha = el("div", "ancoras");
      juntar(linha,
        el("span", null, ponta(ancoras[0])),
        el("span", null, ponta(ancoras[ancoras.length - 1])));
      cartao.appendChild(linha);
    }
    if (c0.motivos) cartao.appendChild(c0.motivos("notas." + i + "."));
    lista.appendChild(cartao);
  });
  caixa.appendChild(lista);

  const minimo = lim("min_chars_justificativa", 30);
  const campo = el("div", "campo");
  campo.style.marginTop = "16px";
  const area = el("textarea");
  area.rows = 4;
  area.placeholder = t("conversa.geral_ph");
  area.value = form.justificativa;
  if (c0.leitura) area.readOnly = true;
  else area.addEventListener("input", () => {
    form.justificativa = area.value;
    contador.textContent = t("ws.contador_de", {
      n: n(area.value.trim().length), min: minimo,
    });
    c0.aoDigitar();
  });
  juntar(campo, el("span", null, t("conversa.geral")), area);
  const contador = el("div", "contador", t("ws.contador_de", {
    n: n((form.justificativa || "").trim().length), min: minimo,
  }));
  campo.appendChild(contador);
  if (!c0.leitura) campo.appendChild(dicaLinguaMeta("lingua.meta"));
  if (c0.motivos) campo.appendChild(c0.motivos("justificativa"));
  caixa.appendChild(campo);
  return caixa;
}

function wsConversa(env, ctx) {
  const c0 = ctx || ctxEdicao();
  const caixa = el("div");
  const bloco = separador(el("div", "painel-corpo"));
  const runtime = c0.leitura ? null : blocoRuntime();
  if (runtime) bloco.appendChild(runtime);

  const turnos = turnosDe(env, c0);
  if (!turnos.length) {
    juntar(bloco,
      el("div", "vazio-titulo", t("conversa.vazia")),
      el("p", "vazio-linha", t("conversa.vazia_linha")));
  } else {
    bloco.appendChild(el("p", "fraco", t("conversa.marcar_dica")));
    bloco.appendChild(fluxoConversa(env, c0));
  }
  const gerando = c0.leitura ? null : blocoGerando();
  if (gerando) bloco.appendChild(gerando);
  if (!c0.leitura && !c0.form.encerrada) {
    bloco.appendChild(compositor(env));
    bloco.appendChild(barraEncerrar(env));
  }
  caixa.appendChild(bloco);
  if (c0.leitura || c0.form.encerrada) caixa.appendChild(avaliacaoDaConversa(env, c0));
  return caixa;
}

function wsDuelo(env, ctx) {
  const c0 = ctx || ctxEdicao();
  const caixa = el("div");
  const bloco = separador(el("div", "painel-corpo"));
  const runtime = c0.leitura ? null : blocoRuntime();
  if (runtime) bloco.appendChild(runtime);

  const turnos = turnosDe(env, c0);
  if (!turnos.length) {
    juntar(bloco,
      el("div", "vazio-titulo", t("conversa.vazia")),
      el("p", "vazio-linha", t("conversa.vazia_linha")),
      el("p", "fraco", t("duelo.oculto")));
  } else {
    bloco.appendChild(el("p", "fraco", t("conversa.marcar_dica")));
    bloco.appendChild(fluxoDuelo(env, c0));
  }
  const gerando = c0.leitura ? null : blocoGerando();
  if (gerando) bloco.appendChild(gerando);
  if (!c0.leitura && !c0.form.encerrada) {
    bloco.appendChild(compositor(env));
    bloco.appendChild(barraEncerrar(env));
  }
  caixa.appendChild(bloco);
  if (c0.leitura || c0.form.encerrada) {
    caixa.appendChild(avaliacaoDaConversa(env, c0));
    // QUEM ERA QUEM, e só aqui: em modo leitura a avaliação já foi enviada, e
    // esconder a partir daí seria esconder por esconder.
    const revelacao = blocoRevelacao(c0.form.rodadas || []);
    if (revelacao) caixa.appendChild(revelacao);
  }
  return caixa;
}

/** A REVELAÇÃO. Função à parte de `wsDuelo` de propósito: é a ÚNICA do caminho
    do duelo que lê o nome do modelo, e mantê-la separada é o que permite provar
    — lendo o arquivo — que o desenho do duelo não o lê nunca. */
function blocoRevelacao(rodadas) {
  if (!rodadas.length) return null;
  const caixa = separador(el("div", "painel-corpo"));
  juntar(caixa,
    el("div", "rotulo-bloco", t("duelo.revelacao_titulo")),
    el("p", "fraco", t("duelo.revelado")));
  const lista = el("div", "revelacao");
  for (const rodada of rodadas) {
    for (const r of rodada.respostas || []) {
      const linha = el("div", "revelacao-linha");
      // O nome do modelo é DADO: vem do servidor e sai como está.
      juntar(linha,
        el("span", "dado", t("duelo.revelacao_linha", {
          n: rodada.ordem, lado: r.rotulo, modelo: r.modelo,
        })),
        el("span", "crescer"),
        r.rotulo === rodada.vencedora
          ? el("span", "etiqueta aprovado", t("duelo.vencedora", { lado: r.rotulo }))
          : null);
      lista.appendChild(linha);
    }
  }
  caixa.appendChild(lista);
  return caixa;
}

/* ---- as chamadas ---- */

/** Manda um turno (ou repete o que ficou sem resposta) e redesenha.

    O turno do humano é gravado pelo SERVIDOR antes de ele chamar o modelo, então
    um erro aqui nunca custa o que a pessoa escreveu — o 503 volta com a conversa
    como ela ficou, e a tela oferece "tentar de novo". */
async function mandarTurno(texto) {
  if (!est.envelope || est.gerando) return;
  const env = est.envelope;
  const duelo = env.tarefa.tipo === "duelo_modelos";
  est.gerando = { desde: Date.now(), dois: duelo, modelo: modeloDaVez() };
  est.erroModelo = null;
  desenharArea();
  try {
    const r = await postar("/api/conversa/" + env.atribuicao_id + "/turno", {
      anotador_id: est.persona.id,
      texto: texto,
    });
    env.conversa = r.conversa;
    if (texto) est.form.rascunho = "";
  } catch (e) {
    // O 503 da inferência traz a conversa junto: nada se perde, e a tela sabe
    // dizer o que falta (modelo não baixado, servidor fora do ar).
    const d = e.corpo && e.corpo.detail;
    if (d && typeof d === "object" && d.chave) {
      est.erroModelo = {
        chave: d.chave,
        dados: d.dados || {},
        mensagem: d.mensagem || "",
        comandos: (d.dados || {}).comandos,
      };
      if (d.conversa) env.conversa = d.conversa;
    } else {
      recado(e.message, true);
    }
  } finally {
    est.gerando = null;
    pararTique();
  }
  salvarRascunho();
  desenharArea();
}

/** Escolhe a vencedora da rodada aberta — e a conversa continua com ela. */
async function escolherLado(lado) {
  if (!est.envelope || est.carregando || est.gerando) return;
  const env = est.envelope;
  const pendente = env.conversa && env.conversa.rodada_pendente;
  if (pendente === null || pendente === undefined) return;
  const motivo = (est.form.escolha || "").trim();
  if (motivo.length < lim("min_chars_justificativa", 30)) return;
  est.carregando = true;
  desenharArea();
  try {
    const r = await postar("/api/conversa/" + env.atribuicao_id + "/escolher", {
      anotador_id: est.persona.id,
      ordem: pendente,
      rotulo: lado,
      justificativa: motivo,
    });
    env.conversa = r.conversa;
    est.form.escolha = "";
    recado(t("recado.escolha_registrada"));
  } catch (e) {
    recado(e.message, true);
  } finally {
    est.carregando = false;
  }
  salvarRascunho();
  desenharArea();
}

/** Escolhe (ou desmarca) um lado do A/B DENTRO de um contexto. */
function escolherABEm(c0, rotulo) {
  c0.form.preferencia = c0.form.preferencia === rotulo ? null : rotulo;
  c0.aoMudar();
}

/** O atalho de quem anota (as setas do teclado chamam por aqui). */
function escolherAB(rotulo) { escolherABEm(ctxEdicao(), rotulo); }

/** Rolagem sincronizada por PROPORÇÃO, não por pixel: as duas respostas quase
    nunca têm a mesma altura, e casar o scrollTop cru descasa os textos na
    primeira rolagem. */
function sincronizarRolagem(areas) {
  if (areas.length !== 2) return;
  let ecoando = false;
  areas.forEach((area, i) => {
    area.addEventListener("scroll", () => {
      if (ecoando) return;
      ecoando = true;
      const outro = areas[1 - i];
      const meu = Math.max(1, area.scrollHeight - area.clientHeight);
      const dele = Math.max(0, outro.scrollHeight - outro.clientHeight);
      outro.scrollTop = (area.scrollTop / meu) * dele;
      // rAF, e não um timeout: o navegador dispara o scroll do outro lado no
      // mesmo quadro, e liberar antes disso reabre o laço.
      requestAnimationFrame(() => { ecoando = false; });
    });
  });
}

/* ==========================================================================
   5.7 FORMULÁRIO: estado inicial, o que falta, rascunho e envio
   ========================================================================== */

function formInicial(env) {
  return formDoPayload(env, env.versao_anterior && env.versao_anterior.payload);
}

/** O estado do formulário a partir de um payload — o mesmo mapa para os dois
    leitores: o anotador repopulando uma devolvida e o revisor lendo a
    submissão na triagem. Um segundo mapa de leitura divergiria do primeiro
    exatamente onde importa (a ordem dos critérios). */
function formDoPayload(env, anterior) {
  const tipo = env.tarefa.tipo;
  if (tipo === "avaliar_rubrica") {
    const criterios = (env.rubrica && env.rubrica.criterios) || [];
    const form = {
      notas: criterios.map(() => null),
      justificativas: criterios.map(() => null),
      comentario_geral: "",
    };
    // RECONHECIMENTO EM VEZ DE MEMÓRIA: no re-trabalho o formulário volta
    // preenchido com o que a pessoa escreveu.
    if (anterior && anterior.notas) {
      criterios.forEach((c, i) => {
        const achado = anterior.notas.find((x) => x.criterio === c.nome);
        if (achado) {
          form.notas[i] = achado.nota;
          if (achado.justificativa) form.justificativas[i] = achado.justificativa;
        }
      });
      form.comentario_geral = anterior.comentario_geral || "";
    }
    return form;
  }
  if (tipo === "escrever_rubrica") {
    if (anterior && anterior.criterios) {
      return { titulo: anterior.titulo || "", criterios: anterior.criterios.map((c) => ({ ...c })) };
    }
    return { titulo: "", criterios: [] };
  }
  if (tipo === "sft_resposta") {
    const criterios = (env.rubrica && env.rubrica.criterios) || [];
    // O CHECKLIST volta do payload, casado por NOME de critério — como as notas
    // do avaliar_rubrica. Até o P3b ele voltava sempre todo desmarcado: a
    // triagem mostrava "nada marcado" para quem tinha marcado tudo, e o Rate
    // and Review acusaria como mudança do revisor uma caixa que o anotador já
    // havia marcado. É a mesma casada por nome, e pelo mesmo motivo: a rubrica
    // pode ter ganhado um critério entre a submissão e a leitura.
    const marcados = (anterior && anterior.checklist) || [];
    return {
      resposta: (anterior && anterior.resposta) || "",
      checklist: criterios.map((c) => {
        const achado = marcados.find((x) => x.criterio === c.nome);
        return achado ? !!achado.atendido : false;
      }),
    };
  }
  if (ehConversa(tipo)) {
    // A rubrica das duas abas de conversa é a da PLATAFORMA, e ela vem sempre no
    // envelope — as notas são posicionais nela, como no `avaliar_rubrica`.
    const criterios = (env.rubrica && env.rubrica.criterios) || [];
    const problemas = {};
    for (const p of (anterior && anterior.turnos_problematicos) || []) {
      problemas[String(p.ordem)] = { nota: p.nota, motivo: p.motivo || "" };
    }
    const form = {
      // Fechada quando se está LENDO uma anotação já enviada: a conversa acabou,
      // e a rubrica é o que o revisor veio ver.
      encerrada: !!anterior,
      // A conversa em si. Do payload na leitura; do envelope (e do rascunho)
      // enquanto ela está acontecendo — ver `turnosDe`.
      turnos: (anterior && anterior.turnos) || [],
      rodadas: (anterior && anterior.rodadas) || [],
      notas: criterios.map(() => null),
      justificativas: criterios.map(() => null),
      problemas: problemas,
      marcando: null,
      justificativa: (anterior && anterior.justificativa) || "",
      // O PRIMEIRO TURNO JÁ VEM ESCRITO: é o prompt da tarefa, e ele é
      // EDITÁVEL. Uma caixa em branco sobre um prompt que está logo acima
      // obrigaria a pessoa a copiá-lo à mão para começar — e um prompt de
      // sistema escondido faria a avaliação medir o nosso prompt, não o modelo.
      // O tamanho é o do pool (`pool_fallback_max_chars`), então não há parede.
      rascunho: !anterior && !((env.conversa && env.conversa.turnos) || []).length
        ? env.prompt.text : "",
      // O motivo da rodada aberta. Mora no FORM (e não no DOM) porque o rascunho
      // é por atribuição e porque trocar de idioma redesenha a tela a partir de
      // `est` — o que só existisse no DOM sumiria.
      escolha: "",
    };
    if (anterior && anterior.notas) {
      criterios.forEach((c, i) => {
        const achado = anterior.notas.find((x) => x.criterio === c.nome);
        if (achado) {
          form.notas[i] = achado.nota;
          if (achado.justificativa) form.justificativas[i] = achado.justificativa;
        }
      });
    }
    return form;
  }
  return {
    preferencia: (anterior && anterior.preferencia) || null,
    justificativa: (anterior && anterior.justificativa) || "",
  };
}

/** O QUE FALTA, em uma frase — ou `null` quando dá para enviar.

    É esta função que vira o rótulo do botão. Ela usa os MESMOS limites do
    servidor (lidos do /api/health), então o botão e o 422 nunca discordam. */
function oQueFalta() {
  const env = est.envelope;
  if (!env || !est.form) return t("falta.nada");
  const tipo = env.tarefa.tipo;

  if (tipo === "avaliar_rubrica") {
    if (!env.rubrica) return t("falta.sem_rubrica");
    const total = est.form.notas.length;
    const semNota = est.form.notas.filter((v) => v === null || v === undefined).length;
    if (semNota) return t("falta.notas", { n: semNota, total: total });
    return null;
  }
  if (tipo === "escrever_rubrica") {
    const piso = lim("min_criterios_rubrica", 3);
    if (est.form.titulo.trim().length < 5) return t("falta.titulo_rubrica");
    if (est.form.criterios.length < piso) {
      const faltam = piso - est.form.criterios.length;
      // Duas chaves em vez de um plural montado no código: o inglês e o
      // português não flexionam igual, e "1 critério(s)" numa tela de portfólio
      // é o tipo de detalhe que se lê como descuido.
      return faltam === 1 ? t("falta.criterio_um") : t("falta.criterios_n", { n: faltam });
    }
    for (let i = 0; i < est.form.criterios.length; i++) {
      const c = est.form.criterios[i];
      if (c.nome.trim().length < 3) return t("falta.criterio_nome", { n: i + 1 });
      if (c.descricao.trim().length < 10) return t("falta.criterio_desc", { n: i + 1 });
      if (c.rotulo_min.trim().length < 3 || c.rotulo_max.trim().length < 3) {
        return t("falta.criterio_pontas", { n: i + 1 });
      }
    }
    return null;
  }
  if (tipo === "sft_resposta") {
    const piso = lim("min_chars_sft", 40);
    const tem = est.form.resposta.trim().length;
    if (tem < piso) return t("falta.sft", { n: piso - tem });
    return null;
  }
  if (ehConversa(tipo)) {
    const conversa = env.conversa || {};
    // ENCERRAR É A PRIMEIRA COISA QUE FALTA, e o botão diz isso em vez de
    // aparecer habilitado e devolver um 409: enquanto a conversa está aberta, o
    // que se está fazendo é conversar, não avaliar.
    if (!conversa.avaliavel && !(est.form.turnos || []).length) return t("falta.sem_turno");
    if (!est.form.encerrada) return t("falta.encerrar");
    const total = est.form.notas.length;
    const semNota = est.form.notas.filter((v) => v === null || v === undefined).length;
    if (semNota) return t("falta.notas", { n: semNota, total: total });
    const pisoConversa = lim("min_chars_justificativa", 30);
    const temConversa = (est.form.justificativa || "").trim().length;
    if (temConversa < pisoConversa) {
      return t("falta.justificativa", { n: pisoConversa - temConversa });
    }
    return null;
  }
  if (!est.form.preferencia) return t("falta.preferencia");
  const piso = lim("min_chars_justificativa", 30);
  const tem = est.form.justificativa.trim().length;
  if (tem < piso) return t("falta.justificativa", { n: piso - tem });
  return null;
}

/** Atualiza SÓ o botão. Redesenhar a área inteira a cada tecla digitada tiraria
    o foco do campo no meio da frase. */
function atualizarBotaoEnviar() {
  const b = $("#enviar");
  if (!b) return;
  const falta = oQueFalta();
  b.textContent = falta ? falta : t("botao.enviar_proxima");
  b.disabled = !!falta || est.carregando;
}

function salvarEDesenhar() {
  salvarRascunho();
  desenharArea();
}

/* ---- rascunho automático, por atribuição ----
   Perder trabalho é a maior fricção que existe. O rascunho é por
   `atribuicao_id` (e não por tipo) porque é a atribuição que identifica ESTE
   trabalho: duas tarefas do mesmo tipo têm rascunhos independentes. */
function rascunhoChave(id) { return CHAVE + "rascunho." + id; }

function salvarRascunho() {
  if (!est.envelope || !est.form) return;
  try {
    localStorage.setItem(rascunhoChave(est.envelope.atribuicao_id), JSON.stringify(est.form));
  } catch (_) { /* modo privado ou cota cheia: a demo funciona, só não lembra */ }
}
function lerRascunho(id) {
  try {
    const bruto = localStorage.getItem(rascunhoChave(id));
    return bruto ? JSON.parse(bruto) : null;
  } catch (_) { return null; }
}
function limparRascunho(id) {
  try { localStorage.removeItem(rascunhoChave(id)); } catch (_) {}
}

/** Monta o payload no formato do contrato `<tipo>@1`. O servidor revalida tudo
    contra o tipo que ELE leu do banco — isto aqui é conveniência, não garantia.

    `form` é parâmetro desde o P3b: o Rate and Review monta DOIS payloads (o
    original e o corrigido) para calcular o diff, e os dois têm de sair da mesma
    função. Duas montagens diferentes produziriam diferenças que não existem — e
    o revisor teria de justificar mudanças que ele não fez. */
function montarPayload(env, form) {
  const f = form || est.form;
  const tipo = env.tarefa.tipo;
  if (tipo === "avaliar_rubrica") {
    const criterios = env.rubrica.criterios;
    return {
      notas: criterios.map((c, i) => {
        const nota = { criterio: c.nome, nota: f.notas[i] };
        const just = f.justificativas[i];
        if (just && just.trim()) nota.justificativa = just.trim();
        return nota;
      }),
      comentario_geral: f.comentario_geral.trim() || null,
    };
  }
  if (tipo === "escrever_rubrica") {
    return {
      titulo: f.titulo.trim(),
      criterios: f.criterios.map((c) => ({
        nome: c.nome.trim(),
        descricao: c.descricao.trim(),
        escala_min: 1,
        escala_max: Number(c.escala_max) || 5,
        rotulo_min: c.rotulo_min.trim(),
        rotulo_max: c.rotulo_max.trim(),
      })),
    };
  }
  if (tipo === "sft_resposta") {
    const corpo = { resposta: f.resposta.trim() };
    const criterios = (env.rubrica && env.rubrica.criterios) || [];
    if (criterios.length) {
      corpo.checklist = criterios.map((c, i) => ({ criterio: c.nome, atendido: !!f.checklist[i] }));
    }
    return corpo;
  }
  if (ehConversa(tipo)) {
    const criterios = (env.rubrica && env.rubrica.criterios) || [];
    // `turnos` (e `rodadas`) NÃO SAEM DAQUI. Quem os monta é o servidor, a
    // partir do que ele mesmo gravou em `turnos_conversa` — no duelo o cliente
    // sequer sabe qual modelo respondeu, e um "quem" vindo de quem não sabia
    // seria fabricação. Mandá-los aqui seria, no melhor caso, redundante.
    return {
      rubrica: (env.rubrica && env.rubrica.rubrica_id) || "",
      notas: criterios.map((c, i) => {
        const nota = { criterio: c.nome, nota: f.notas[i] };
        const just = f.justificativas[i];
        if (just && just.trim()) nota.justificativa = just.trim();
        return nota;
      }),
      turnos_problematicos: Object.keys(f.problemas || {})
        .map(Number)
        .sort((a, b) => a - b)
        .filter((ordem) => (f.problemas[String(ordem)].motivo || "").trim())
        .map((ordem) => ({
          ordem: ordem,
          nota: f.problemas[String(ordem)].nota,
          motivo: f.problemas[String(ordem)].motivo.trim(),
        })),
      justificativa: (f.justificativa || "").trim(),
    };
  }
  return { preferencia: f.preferencia, justificativa: f.justificativa.trim() };
}

async function enviar() {
  if (!est.envelope || oQueFalta() || est.carregando) return;
  const env = est.envelope;
  est.carregando = true;
  atualizarBotaoEnviar();
  try {
    const r = await postar("/api/atribuicoes/" + env.atribuicao_id + "/submeter", {
      anotador_id: est.persona.id,
      payload: montarPayload(env),
      // Medido e enviado — e invisível para quem anota. Só o admin vê tempos.
      tempo_ativo_ms: Math.max(0, Date.now() - est.abertoEm),
    });
    limparRascunho(env.atribuicao_id);
    est.envelope = null;
    est.form = null;
    recado(r.expirou
      ? t("recado.enviado_expirado")
      : t("recado.enviado", { versao: r.versao }));
    est.carregando = false;
    // A REVELAÇÃO do duelo, e só agora: com a avaliação já gravada, a
    // preferência não pode mais ser contaminada pela marca.
    if (r.revelacao && r.revelacao.length) { revelarDuelo(r.revelacao); return; }
    if (r.continuacao) { oferecerContinuacao(r.continuacao); return; }
    // FECHAR O LOOP ANTES DE PEDIR A PRÓXIMA COISA: enviar leva direto à
    // próxima tarefa, sem uma tela intermediária perguntando "e agora?".
    est.motivo = "";
    est.motivoChave = null;
    est.vista = "fila";
    desenharVistas();
    await carregarFila();
  } catch (e) {
    est.carregando = false;
    recado(e.message, true);
    desenharArea();
  }
}

/** QUEM ERA QUEM, depois do envio do duelo. Uma tela, uma saída.

    O estado mora em `est.revelacao` e não só no DOM: trocar de idioma aqui
    redesenha a partir da memória, e uma revelação que sumisse ao trocar de
    língua faria a pessoa perder a única chance de ver o resultado. */
function revelarDuelo(revelacao) {
  est.revelacao = revelacao;
  const area = $("#area-trabalho");
  limpar(area);
  const painel = el("div", "painel");
  painel.appendChild(juntar(el("div", "painel-cabeca"),
    el("h2", null, t("duelo.revelacao_titulo"))));
  const corpo = el("div", "painel-corpo");
  corpo.appendChild(el("p", "fraco", t("duelo.revelado")));
  const lista = el("div", "revelacao");
  for (const rodada of revelacao) {
    for (const lado of rodada.lados || []) {
      const linha = el("div", "revelacao-linha");
      // Nome de modelo é DADO: vem do servidor e sai como está.
      juntar(linha,
        el("span", "dado", t("duelo.revelacao_linha", {
          n: rodada.ordem, lado: lado.rotulo, modelo: lado.modelo,
        })),
        el("span", "crescer"),
        lado.rotulo === rodada.vencedora
          ? el("span", "etiqueta aprovado", t("duelo.vencedora", { lado: lado.rotulo }))
          : null);
      lista.appendChild(linha);
    }
  }
  corpo.appendChild(lista);
  const seguir = el("button", "botao primaria", t("botao.proxima_tarefa"));
  seguir.type = "button";
  seguir.addEventListener("click", () => {
    est.revelacao = null;
    est.motivo = "";
    est.motivoChave = null;
    carregarFila();
  });
  corpo.appendChild(juntar(el("div", "vazio-saidas"), seguir));
  painel.appendChild(corpo);
  area.appendChild(painel);
}

/** A oferta rubrica → SFT. Uma pergunta, duas saídas, nenhuma delas um beco. */
function oferecerContinuacao(cont) {
  const area = $("#area-trabalho");
  limpar(area);
  const painel = el("div", "painel");
  painel.appendChild(juntar(el("div", "painel-cabeca"), el("h2", null, t("cont.titulo"))));
  const caixa = el("div", "vazio");
  juntar(caixa,
    el("div", "vazio-titulo", t("cont.convite")),
    el("p", "vazio-linha", t("cont.porque")));
  const saidas = el("div", "vazio-saidas");
  const sim = el("button", "botao primaria", t("botao.escrever_resposta_agora"));
  sim.type = "button";
  sim.addEventListener("click", () => aceitarContinuacao(cont));
  const nao = el("button", "botao", t("botao.nao_proxima"));
  nao.type = "button";
  nao.addEventListener("click", () => { est.motivo = ""; est.motivoChave = null; carregarFila(); });
  juntar(saidas, sim, nao);
  caixa.appendChild(saidas);
  painel.appendChild(caixa);
  area.appendChild(painel);
}

async function aceitarContinuacao(cont) {
  est.aba = cont.tipo;
  est.vista = "fila";
  est.carregando = true;
  desenharAnotador();
  try {
    const r = await postar("/api/tarefas/livre", paramsProjeto({
      anotador_id: est.persona.id,
      tipo: cont.tipo,
      prompt_uid: cont.prompt_uid,
      origem: cont.origem,
    }));
    aceitarEnvelope(r.tarefa, null);
  } catch (e) {
    est.motivoChave = null;
    est.motivo = t("recado.erro_continuacao", { erro: e.message });
  } finally {
    est.carregando = false;
  }
  await recarregarContagens();
  desenharArea();
}

/** Devolve a atribuição em mãos e NÃO puxa a próxima — quem decide o que vem
    depois é quem chamou. */
async function devolver() {
  if (!est.envelope) return;
  const id = est.envelope.atribuicao_id;
  try {
    await postar("/api/atribuicoes/" + id + "/abandonar", { anotador_id: est.persona.id });
    limparRascunho(id);
    recado(t("recado.devolvida_fila"));
  } catch (e) {
    recado(e.message, true);
  }
  est.envelope = null;
  est.form = null;
  est.motivo = "";
  est.motivoChave = null;
}

async function abandonar() {
  await devolver();
  await carregarFila();
}

async function recarregarContagens() {
  try {
    const r = await api(comParams("/api/tarefas/contagens",
      paramsProjeto({ anotador_id: est.persona.id })));
    est.contagens = r.contagens || {};
  } catch (_) { est.contagens = {}; }
  pintarContagens();
}

/** Só os números das abas — sem redesenhar a área de trabalho embaixo. */
function pintarContagens() {
  for (const b of document.querySelectorAll("#abas-anotador .aba")) {
    const conta = est.contagens[b.dataset.tipo];
    const selo = b.querySelector(".conta");
    if (selo) selo.textContent = conta === undefined ? "" : n(conta);
  }
  atualizarContagens();
}

/* ==========================================================================
   5.8 CATÁLOGO (modo livre)
   Busca + TRÊS filtros. Recorte fino é o trabalho da outra ferramenta; aqui a
   pessoa quer escolher uma tarefa em dez segundos.
   ========================================================================== */

const FAIXAS = [
  ["", "catalogo.faixa_qualquer"],
  ["curto", "catalogo.faixa_curto"],
  ["medio", "catalogo.faixa_medio"],
  ["longo", "catalogo.faixa_longo"],
];

function desenharCatalogo(area) {
  const painel = el("div", "painel");
  const cabeca = el("div", "painel-cabeca");
  juntar(cabeca,
    el("h2", null, t("catalogo.titulo", { tipo: nomeTipo(est.aba).toLowerCase() })),
    el("span", "crescer"));
  const dados = est.catalogo.dados;
  if (dados) {
    cabeca.appendChild(el("span", "fraco num",
      t("catalogo.contagem", { n: n(dados.total), total: n(dados.n_pool) })));
  }
  painel.appendChild(cabeca);

  const corpo = el("div", "painel-corpo");
  const filtros = el("div", "filtros");
  const busca = el("input");
  busca.type = "text";
  busca.placeholder = t("catalogo.busca_ph");
  busca.value = est.catalogo.q;
  // O texto digitado vai para o ESTADO a cada tecla (a busca só dispara no
  // Enter ou no botão). Sem isto, trocar de idioma com uma busca escrita e
  // ainda não disparada apagaria o que a pessoa acabou de digitar.
  busca.addEventListener("input", () => { est.catalogo.q = busca.value; });
  busca.addEventListener("keydown", (ev) => {
    if (ev.key === "Enter") { est.catalogo.page = 1; carregarCatalogo(); }
  });
  filtros.appendChild(busca);

  const selIdioma = seletor([["", "catalogo.todos_idiomas"], ["pt", "lang.pt"], ["en", "lang.en"]],
    est.catalogo.lang, (v) => { est.catalogo.lang = v; est.catalogo.page = 1; carregarCatalogo(); });
  const selFaixa = seletor(FAIXAS, est.catalogo.faixa,
    (v) => { est.catalogo.faixa = v; est.catalogo.page = 1; carregarCatalogo(); });
  // As FONTES são dado (nomes de dataset), não cromo: entram como estão.
  const selFonte = seletorLivre(
    [["", t("catalogo.todas_fontes")]].concat(((dados && dados.fontes) || []).map((f) => [f, f])),
    est.catalogo.fonte,
    (v) => { est.catalogo.fonte = v; est.catalogo.page = 1; carregarCatalogo(); });
  juntar(filtros, selIdioma, selFaixa, selFonte);

  const buscar = el("button", "botao", t("botao.buscar"));
  buscar.type = "button";
  buscar.addEventListener("click", () => { est.catalogo.page = 1; carregarCatalogo(); });
  filtros.appendChild(buscar);
  corpo.appendChild(filtros);
  if (est.catalogo.q && dados && !dados.busca_aplicada) {
    corpo.appendChild(el("p", "falta", t("catalogo.busca_vazia")));
  }
  painel.appendChild(corpo);

  if (!dados) {
    painel.appendChild(juntar(el("div", "vazio"), el("p", "vazio-linha", t("catalogo.carregando"))));
    area.appendChild(painel);
    return;
  }
  if (!dados.items.length) {
    const vazio = el("div", "vazio");
    juntar(vazio,
      el("div", "vazio-titulo", t("catalogo.vazio_titulo")),
      el("p", "vazio-linha", t("catalogo.vazio_linha", { n: n(dados.n_pool) })));
    const saidas = el("div", "vazio-saidas");
    const limpaB = el("button", "botao primaria", t("botao.limpar_filtros"));
    limpaB.type = "button";
    limpaB.addEventListener("click", () => {
      est.catalogo = { q: "", lang: "", fonte: "", faixa: "", page: 1, dados: null };
      carregarCatalogo();
    });
    const volta = el("button", "botao", t("botao.voltar_fila"));
    volta.type = "button";
    volta.addEventListener("click", () => irPara("fila"));
    juntar(saidas, limpaB, volta);
    vazio.appendChild(saidas);
    painel.appendChild(vazio);
    area.appendChild(painel);
    return;
  }

  const lista = el("div", "lista-catalogo");
  for (const item of dados.items) {
    const linha = el("div", "item-catalogo" + (item.ja_anotei ? " feito" : ""));
    const texto = el("div", "item-texto");
    juntar(texto, el("div", "item-trecho", item.trecho + (item.truncado ? "…" : "")));
    const meta = el("div", "item-meta");
    juntar(meta,
      el("span", "selo", item.fonte),
      el("span", "selo", item.licenca),
      el("span", "selo", t("ws.prov_chars", { n: n(item.n_chars) })),
      el("span", "selo", nomeLingua(item.lang)));
    if (item.ja_anotei) meta.appendChild(el("span", "selo", t("catalogo.ja_anotei")));
    // O ERRO SE ANUNCIA ANTES DE ACONTECER: um prompt cru do corpus não tem
    // resposta de modelo nenhuma, e comparar A/B sobre ele seria um beco.
    const podeEste = (item.pode || []).indexOf(est.aba) >= 0;
    if (!podeEste) meta.appendChild(el("span", "selo", t("catalogo.sem_material_selo")));
    texto.appendChild(meta);
    linha.appendChild(texto);

    const impedido = !!item.ja_anotei || !podeEste;
    const b = el("button", "botao" + (impedido ? "" : " primaria"),
      item.ja_anotei ? t("botao.ja_anotado")
        : !podeEste ? t("botao.sem_material") : t("botao.anotar_este"));
    b.type = "button";
    b.disabled = impedido;
    if (!podeEste && !item.ja_anotei) {
      b.title = est.aba === "comparar_ab"
        ? t("catalogo.title_ab", { n: n(item.n_respostas) })
        : t("catalogo.title_avaliar");
    }
    b.addEventListener("click", () => pegarLivre(item.uid));
    linha.appendChild(b);
    lista.appendChild(linha);
  }
  painel.appendChild(lista);

  if (dados.pages > 1) {
    const nav = el("div", "paginacao");
    const anterior = el("button", "botao", t("botao.anterior"));
    anterior.type = "button";
    anterior.disabled = dados.page <= 1;
    anterior.addEventListener("click", () => { est.catalogo.page = dados.page - 1; carregarCatalogo(); });
    const proximo = el("button", "botao", t("botao.proxima"));
    proximo.type = "button";
    proximo.disabled = dados.page >= dados.pages;
    proximo.addEventListener("click", () => { est.catalogo.page = dados.page + 1; carregarCatalogo(); });
    juntar(nav, anterior,
      el("span", "num", t("catalogo.pagina", { page: n(dados.page), pages: n(dados.pages) })),
      proximo);
    painel.appendChild(nav);
  }
  area.appendChild(painel);
}

/** Seletor cujos rótulos são CHAVES do dicionário (cromo). */
function seletor(opcoes, valor, aoMudar) {
  return seletorLivre(opcoes.map(([v, chave]) => [v, t(chave)]), valor, aoMudar);
}

/** Seletor cujos rótulos já são texto pronto — usado para DADO (nome de fonte). */
function seletorLivre(opcoes, valor, aoMudar) {
  const sel = el("select");
  for (const [v, rotulo] of opcoes) {
    const o = el("option", null, rotulo);
    o.value = v;
    sel.appendChild(o);
  }
  sel.value = valor;
  sel.addEventListener("change", () => aoMudar(sel.value));
  return sel;
}

/** Junta caminho e query. Existe para que o caminho continue sendo um literal
    inteiro no código — é o que o teste de contrato do front consegue ler. */
/** `caminho?a=1&b=2`. Aceita `URLSearchParams` **ou** um objeto simples.

    Aceitar os dois não é conveniência: com só `URLSearchParams`, passar um
    objeto produzia `?[object Object]` — uma URL válida, um 422 do servidor por
    campo faltando, e uma tela vazia sem erro visível. Foi exatamente isso que
    aconteceu na primeira montagem da fila de triagem. Um contorno silencioso
    é pior que um erro, então a função passou a converter. */
function comParams(caminho, params) {
  const p = params instanceof URLSearchParams
    ? params
    : new URLSearchParams(Object.entries(params).map(([k, v]) => [k, String(v)]));
  return caminho + "?" + p.toString();
}

/** Ordem das buscas do catálogo. Trocar dois filtros em sequência dispara duas
    consultas, e a PRIMEIRA pode responder por último — a tela mostraria o
    resultado do filtro anterior como se fosse o atual. Só a busca mais recente
    tem direito de escrever em `est.catalogo.dados`. */
let buscaAtual = 0;

async function carregarCatalogo() {
  const c = est.catalogo;
  const minha = ++buscaAtual;
  const p = new URLSearchParams({
    anotador_id: String(est.persona.id),
    tipo: est.aba,
    page: String(c.page),
  });
  if (c.q.trim()) p.set("q", c.q.trim());
  if (c.lang) p.set("lang", c.lang);
  if (c.fonte) p.set("fonte", c.fonte);
  if (c.faixa) p.set("faixa", c.faixa);
  let resultado;
  try {
    resultado = await api(comParams("/api/catalogo", p));
  } catch (e) {
    resultado = { items: [], total: 0, pages: 0, page: 1, n_pool: 0, fontes: [] };
    if (minha === buscaAtual) recado(t("catalogo.erro", { erro: e.message }), true);
  }
  if (minha !== buscaAtual) return;  // chegou atrasada: descarta
  c.dados = resultado;
  if (est.vista === "catalogo") desenharArea();
}

const pegarLivre = (uid) => pegarLivreEm(est.aba, uid);

/** Abre este prompt neste tipo, pelo modo livre, e leva para a área de trabalho. */
async function pegarLivreEm(tipo, uid) {
  try {
    // A tarefa nasce NO PROJETO EM FOCO: sem isso, escolher um prompt no
    // catálogo enquanto se trabalha no Portfólio criaria a tarefa no projeto
    // padrão de qualquer jeito, e o recorte da barra não valeria para o que se
    // cria dentro dele.
    const r = await postar("/api/tarefas/livre", paramsProjeto({
      anotador_id: est.persona.id, tipo, prompt_uid: uid,
    }));
    est.aba = tipo;
    aceitarEnvelope(r.tarefa, null);
    est.vista = "fila";
    desenharAnotador();
    await recarregarContagens();
  } catch (e) {
    recado(e.message, true);
  }
}

/* ==========================================================================
   5.9 MINHAS TAREFAS
   ========================================================================== */

const ROTULO_STATUS = {
  em_andamento: ["pendente", "status.em_andamento"],
  submetida: ["pendente", "status.submetida"],
  aprovada: ["aprovado", "status.aprovada"],
  abandonada: ["pendente", "status.abandonada"],
  expirada: ["pendente", "status.expirada"],
};

function desenharMinhas(area) {
  const painel = el("div", "painel");
  const cabeca = el("div", "painel-cabeca");
  juntar(cabeca, el("h2", null, t("minhas.titulo")), el("span", "crescer"));
  if (est.minhas) {
    cabeca.appendChild(el("span", "fraco num", t("minhas.total", { n: n(est.minhas.length) })));
  }
  painel.appendChild(cabeca);

  if (!est.minhas) {
    painel.appendChild(juntar(el("div", "vazio"), el("p", "vazio-linha", t("minhas.carregando"))));
    area.appendChild(painel);
    return;
  }
  if (!est.minhas.length) {
    const vazio = el("div", "vazio");
    juntar(vazio,
      el("div", "vazio-titulo", t("minhas.vazio_titulo")),
      el("p", "vazio-linha", t("minhas.vazio_linha")));
    const saidas = el("div", "vazio-saidas");
    const fila = el("button", "botao primaria", t("botao.ir_fila"));
    fila.type = "button";
    fila.addEventListener("click", () => irPara("fila"));
    const cat = el("button", "botao", t("botao.escolher_catalogo"));
    cat.type = "button";
    cat.addEventListener("click", () => irPara("catalogo"));
    juntar(saidas, fila, cat);
    vazio.appendChild(saidas);
    painel.appendChild(vazio);
    area.appendChild(painel);
    return;
  }

  for (const item of est.minhas) {
    const linha = el("div", "minha");
    const texto = el("div", "item-texto");
    const topo = el("div", "forma");
    const [classe, chave] = ROTULO_STATUS[item.status] || ["pendente", null];
    const eti = el("span", "etiqueta " + classe);
    juntar(eti, el("span", "ponto"), el("span", null, chave ? t(chave) : item.status));
    juntar(topo, eti,
      el("span", "fraco", nomeTipo(item.tipo)),
      el("span", "fraco", item.origem === "livre" ? t("fila.origem_livre") : t("minhas.da_fila")));
    if (item.versao) topo.appendChild(el("span", "fraco", t("minhas.versao", { n: item.versao })));
    texto.appendChild(topo);

    texto.appendChild(el("div", "item-trecho",
      item.disponivel ? item.prompt : t("minhas.indisponivel")));
    // A DEVOLUÇÃO é o único item desta lista que exige ação, e por isso ela vem
    // com o comentário embutido: obrigar a abrir a tarefa para descobrir o que
    // o revisor escreveu é a fricção que faz uma devolução ser ignorada.
    // OS DOIS caminhos de volta: a triagem e o admin decidindo uma escalação.
    // O segundo é raro, e por isso é o que some sem ninguém notar — o admin
    // escreveria um comentário obrigatório que o anotador nunca leria.
    const doAdmin = item.decisao_admin === "devolvida" && item.comentario_admin;
    const devolvida = (item.veredito === "devolvida" && item.comentario_revisor) || doAdmin;
    if (devolvida) {
      const dev = el("div", "devolucao");
      juntar(dev,
        el("div", "devolucao-titulo",
          doAdmin ? t("minhas.devolvida_admin") : t("minhas.devolvida")),
        // `.dado`: o comentário sai na língua em que a pessoa o escreveu.
        el("p", "dado", doAdmin ? item.comentario_admin : item.comentario_revisor));
      texto.appendChild(dev);
    }
    linha.appendChild(texto);

    if (item.status === "em_andamento" && item.disponivel) {
      const abrir = el("button", "botao primaria",
        devolvida ? t("botao.corrigir_reenviar") : t("botao.continuar"));
      abrir.type = "button";
      abrir.addEventListener("click", () => reabrir(item));
      linha.appendChild(abrir);
    }
    painel.appendChild(linha);
  }
  area.appendChild(painel);
}

async function carregarMinhas() {
  try {
    const r = await api(comParams("/api/atribuicoes", new URLSearchParams({
      anotador_id: String(est.persona.id),
    })));
    est.minhas = r.items || [];
  } catch (e) {
    est.minhas = [];
    recado(t("minhas.erro", { erro: e.message }), true);
  }
  if (est.vista === "minhas") desenharArea();
}

async function reabrir(item) {
  try {
    const r = await api(comParams("/api/atribuicoes/" + item.atribuicao_id, new URLSearchParams({
      anotador_id: String(est.persona.id),
    })));
    est.aba = item.tipo;
    aceitarEnvelope(r.tarefa, null);
    est.vista = "fila";
    desenharAnotador();
  } catch (e) {
    recado(e.message, true);
  }
}

/* ==========================================================================
   5.10 TECLADO
   O teclado é o caminho principal; o mouse é o alternativo. Uma tarefa inteira
   precisa ser completável sem tocar no mouse.
   ========================================================================== */

function ehCampo(alvo) {
  const tag = (alvo && alvo.tagName) || "";
  return tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || (alvo && alvo.isContentEditable);
}

/** ↑/↓ andam entre critérios, 1..9 gradua o que está em foco.

    Uma função e não duas cópias: o `avaliar_rubrica` e as duas abas de conversa
    graduam a MESMA forma de rubrica, e duas cópias divergiriam justamente no
    detalhe que faz o gesto funcionar — andar sozinho para o próximo critério, que
    é o que transforma a rubrica inteira numa sequência de teclas. */
function graduarPeloTeclado(ev, criterios) {
  const total = est.form.notas.length;
  if (!total) return;
  if (ev.key === "ArrowDown" || ev.key === "ArrowUp") {
    const passo = ev.key === "ArrowDown" ? 1 : -1;
    est.foco = (est.foco + passo + total) % total;
    ev.preventDefault();
    desenharArea();
    return;
  }
  if (!/^[1-9]$/.test(ev.key)) return;
  const criterio = criterios[est.foco];
  const escala = (criterio && criterio.escala) || { min: 1, max: 9 };
  const valor = Number(ev.key);
  if (valor < escala.min || valor > escala.max) {
    recado(t("recado.escala", { min: escala.min, max: escala.max }), true);
    return;
  }
  ev.preventDefault();
  graduar(est.foco, valor);
  if (est.foco < total - 1) { est.foco += 1; desenharArea(); }
}

function teclado(ev) {
  if (!est.persona) return;
  if (est.persona.papel === "revisor" || est.persona.papel === "admin") {
    tecladoRevisor(ev);
    return;
  }
  if (est.persona.papel !== "anotador") return;

  // Ctrl+Enter vale DENTRO dos campos também: é o atalho de "terminei de
  // escrever", e obrigar a sair do campo antes de enviar é fricção.
  if ((ev.ctrlKey || ev.metaKey) && ev.key === "Enter") {
    ev.preventDefault();
    // NUMA CONVERSA ABERTA, "terminei de escrever" é MANDAR O TURNO, não enviar
    // a anotação: são a mesma frase mental em dois momentos, e a tecla segue o
    // momento. Depois de encerrada, ela volta a ser o envio.
    const emConversa = est.envelope && ehConversa(est.envelope.tarefa.tipo)
      && est.form && !est.form.encerrada && est.vista === "fila";
    if (emConversa) {
      const escrito = (est.form.rascunho || "").trim();
      const conversa = est.envelope.conversa || {};
      if (conversa.aguardando !== null && conversa.aguardando !== undefined) mandarTurno(null);
      else if (escrito) mandarTurno(escrito);
      return;
    }
    enviar();
    return;
  }
  if (ehCampo(ev.target) || !est.envelope || est.vista !== "fila") return;

  const tipo = est.envelope.tarefa.tipo;
  if (ehConversa(tipo)) {
    // `E` ENCERRA. Não é "empate": num duelo o empate não tem vencedora para
    // continuar a conversa, e inventar uma continuação seria fabricar a escolha
    // que ninguém fez. `E` de encerrar/end é a mesma letra nas duas línguas.
    if ((ev.key === "e" || ev.key === "E") && est.form && !est.form.encerrada) {
      ev.preventDefault();
      encerrarConversa();
      return;
    }
    const pendente = est.envelope.conversa && est.envelope.conversa.rodada_pendente;
    if (tipo === "duelo_modelos" && pendente !== null && pendente !== undefined) {
      if (ev.key === "ArrowLeft") { ev.preventDefault(); escolherLado("A"); return; }
      if (ev.key === "ArrowRight") { ev.preventDefault(); escolherLado("B"); return; }
    }
    // Depois de encerrada, os números graduam a rubrica multi-turno — o mesmo
    // gesto do `avaliar_rubrica`, sobre a mesma forma de rubrica.
    if (est.form && est.form.encerrada && est.envelope.rubrica) {
      graduarPeloTeclado(ev, est.envelope.rubrica.criterios || []);
    }
    return;
  }
  if (tipo === "avaliar_rubrica" && est.envelope.rubrica) {
    graduarPeloTeclado(ev, est.envelope.rubrica.criterios || []);
    return;
  }
  if (tipo === "comparar_ab") {
    if (ev.key === "ArrowLeft") { ev.preventDefault(); escolherAB("modelo-a"); }
    if (ev.key === "ArrowRight") { ev.preventDefault(); escolherAB("modelo-b"); }
    if (ev.key === "e" || ev.key === "E") { ev.preventDefault(); escolherAB("empate"); }
  }
}

/** Os atalhos da TRIAGEM. `J`/`K` andam na fila, `A` aprova, `R` devolve.

    Ctrl+Enter dentro do campo de devolução envia o comentário — é o mesmo
    "terminei de escrever" do anotador, e obrigar a sair do campo para clicar
    seria a mesma fricção do outro lado da mesa. */
function tecladoRevisor(ev) {
  if (est.subaba === "avaliacao") { tecladoRR(ev); return; }
  const tri = est.triagem;
  if (!tri || est.subaba !== "anotacoes") return;
  if (tri.devolvendo) {
    if ((ev.ctrlKey || ev.metaKey) && ev.key === "Enter") {
      const piso = lim("min_chars_devolucao", 20);
      const escrito = (tri.comentario || "").trim();
      if (escrito.length >= piso) {
        ev.preventDefault();
        triar("devolvida", escrito);
      }
    }
    if (ev.key === "Escape") {
      ev.preventDefault();
      tri.devolvendo = false;
      desenharDetalheTriagem();
    }
    return;
  }
  if (ehCampo(ev.target) || !tri.itens.length) return;

  if (ev.key === "j" || ev.key === "J" || ev.key === "k" || ev.key === "K") {
    const passo = (ev.key === "j" || ev.key === "J") ? 1 : -1;
    const i = tri.itens.findIndex((x) => x.anotacao_id === tri.sel);
    const alvo = tri.itens[Math.min(tri.itens.length - 1, Math.max(0, (i < 0 ? 0 : i) + passo))];
    if (alvo) { ev.preventDefault(); abrirNaTriagem(alvo.anotacao_id); }
    return;
  }
  if (!tri.sel || !tri.detalhe) return;
  if (ev.key === "a" || ev.key === "A") { ev.preventDefault(); triar("aprovada", null); }
  if (ev.key === "r" || ev.key === "R") { ev.preventDefault(); abrirDevolucao(); }
}

/** Os atalhos do RATE AND REVIEW. `J`/`K` andam na fila, `Ctrl+Enter` registra.

    Nada de `A`/`R` aqui, e não é esquecimento: a passagem 2 não tem duas
    respostas rápidas — ela tem duas escalas de quatro posições e um diff a
    justificar. Uma tecla que "aprova" seria a triagem outra vez, com outro
    nome. As escalas andam pelas setas, dentro do radiogroup (ver `escalaRR`).

    O `1..4` também ficou de fora de propósito: o workspace do revisor é
    editável, e o mesmo `3` que graduaria uma escala está graduando um critério
    da rubrica logo abaixo. Duas coisas na mesma tecla, na mesma tela. */
function tecladoRR(ev) {
  const rr = est.rr;
  if (!rr) return;
  // Ctrl+Enter vale DENTRO dos campos: é o "terminei de escrever", e obrigar a
  // sair do campo antes de registrar seria a mesma fricção do outro lado.
  if ((ev.ctrlKey || ev.metaKey) && ev.key === "Enter") {
    ev.preventDefault();
    registrarAvaliacao();
    return;
  }
  if (ehCampo(ev.target) || !rr.itens.length) return;
  if (ev.key === "j" || ev.key === "J" || ev.key === "k" || ev.key === "K") {
    const passo = (ev.key === "j" || ev.key === "J") ? 1 : -1;
    const i = rr.itens.findIndex((x) => x.anotacao_id === rr.sel);
    const alvo = rr.itens[Math.min(rr.itens.length - 1, Math.max(0, (i < 0 ? 0 : i) + passo))];
    if (alvo) { ev.preventDefault(); abrirNoRR(alvo.anotacao_id); }
  }
}

/* Navegação por setas dentro de um conjunto de abas (padrão de tablist). */
function andarNasAbas(ev, itens, escolher, atual) {
  const i = itens.findIndex((x) => x.id === atual);
  if (ev.key === "ArrowRight") { escolher(itens[(i + 1) % itens.length].id); ev.preventDefault(); }
  if (ev.key === "ArrowLeft") { escolher(itens[(i - 1 + itens.length) % itens.length].id); ev.preventDefault(); }
}

/* ==========================================================================
   6. TELA DO REVISOR — PASSAGEM 1: A TRIAGEM
   Fila cronológica à esquerda, detalhe à direita — e o detalhe abre NO MESMO
   LAYOUT que o anotador viu (os mesmos `ws*`, em modo leitura), porque
   reconhecer é mais barato que reconstruir.

   `A` aprova, `R` devolve (com comentário obrigatório), `J`/`K` andam na fila.
   Aprovar manda para a passagem 2; devolver reabre a tarefa do anotador, que
   corrige e reenvia como versão 2.
   ========================================================================== */
async function desenharRevisor() {
  const barra = $("#abas-revisor");
  limpar(barra);
  for (const s of SUBABAS_REVISOR) {
    const b = el("button", "aba", t(s.nome));
    b.type = "button";
    b.setAttribute("role", "tab");
    b.setAttribute("aria-selected", String(est.subaba === s.id));
    // "…" e não "0" quando a fila ainda não foi lida: são estados diferentes, e
    // um zero inventado é a única leitura que faz alguém deixar de clicar.
    const fonte = s.id === "anotacoes" ? est.triagem : s.id === "avaliacao" ? est.rr : null;
    b.appendChild(el("span", "conta", fonte ? n(fonte.total) : (s.id === "criacoes" ? "0" : "…")));
    b.addEventListener("click", () => { est.subaba = s.id; desenharRevisor(); });
    b.addEventListener("keydown", (ev) => andarNasAbas(ev, SUBABAS_REVISOR, (id) => { est.subaba = id; desenharRevisor(); }, est.subaba));
    barra.appendChild(b);
  }

  const s = SUBABAS_REVISOR.find((x) => x.id === est.subaba);
  $("#revisor-fila-titulo").textContent = t(s.titulo);
  $("#revisor-atalhos").textContent = est.subaba === "anotacoes" ? t("revisor.atalhos")
    : est.subaba === "avaliacao" ? t("rr.atalhos") : "";

  if (est.subaba === "criacoes") { desenharCriacoesPendentes(s); return; }
  if (est.subaba === "avaliacao") {
    if (!est.rr) { await carregarRR(); return; }
    desenharFilaRR(s);
    desenharDetalheRR();
    atualizarContagens();
    return;
  }
  if (!est.triagem) { await carregarTriagem(); return; }
  desenharFilaTriagem(s);
  desenharDetalheTriagem();
  atualizarContagens();
}

/** A sub-aba Criações continua sendo casca (P4) — e diz isso, em vez de
    fingir. */
function desenharCriacoesPendentes(s) {
  const fila = $("#revisor-fila");
  limpar(fila);
  const vazia = el("div", "fila-vazia");
  juntar(vazia, el("div", "vazio-titulo", t(s.vazio)), el("p", "vazio-linha", t(s.linha)));
  fila.appendChild(vazia);
  const det = $("#revisor-detalhe");
  limpar(det);
  const caixa = el("div", "vazio");
  juntar(caixa,
    el("div", "vazio-titulo", t("triagem.criacoes_titulo")),
    el("p", "vazio-linha", t("triagem.criacoes_linha")));
  // O que ainda não funciona fica desabilitado e MARCADO com o marco em que
  // chega. Um botão morto sem etiqueta parece defeito; com a etiqueta, é
  // roteiro à vista.
  const acoes = el("div", "vazio-saidas");
  for (const [chave, marco] of [["botao.aprovar_criacao", "P4"], ["botao.recusar_criacao", "P4"]]) {
    const b = el("button", "botao", t(chave));
    b.type = "button";
    b.disabled = true;
    b.appendChild(el("span", "marco", marco));
    acoes.appendChild(b);
  }
  caixa.appendChild(acoes);
  det.appendChild(caixa);
  atualizarContagens();
}

async function carregarTriagem(manterSel) {
  const anterior = manterSel === undefined ? (est.triagem && est.triagem.sel) : manterSel;
  const vazia = {
    itens: [], total: 0, minhas_excluidas: 0, minhas_na_fila: 0, modo_solo: false,
    sel: null, detalhe: null, form: null, devolvendo: false, comentario: "",
    carregando: false,
  };
  try {
    const r = await api(comParams("/api/revisao/fila",
      paramsProjeto({ revisor_id: est.persona.id })));
    est.triagem = {
      ...vazia,
      itens: r.items || [],
      total: r.total || 0,
      minhas_excluidas: r.minhas_excluidas || 0,
      minhas_na_fila: r.minhas_na_fila || 0,
      modo_solo: !!r.modo_solo,
    };
  } catch (e) {
    est.triagem = { ...vazia, erro: e.message };
  }
  await desenharRevisor();
  // Seleciona sozinho: uma fila com itens e nada aberto obriga um clique que
  // não decide nada. Se o item que estava aberto sumiu (acabou de ser triado),
  // o próximo assume o lugar dele — a fila anda sem que ninguém a empurre.
  const itens = est.triagem.itens;
  if (!itens.length) return;
  const alvo = itens.find((x) => x.anotacao_id === anterior) || itens[0];
  await abrirNaTriagem(alvo.anotacao_id);
}

/** A FAIXA DO MODO SOLO — permanente, não dispensável.

    Ela declara que a regra de QC está afrouxada: o revisor está vendo (e vai
    julgar) trabalho que ele mesmo escreveu. Um aviso que se fecha vira um
    aviso que ninguém viu na hora que importava, e esconder isso seria mentir
    sobre o QC — que é exatamente o que este projeto existe para não fazer. */
function faixaSoloDe(estado) {
  if (!estado || !estado.modo_solo) return null;
  const caixa = el("div", "faixa-solo");
  juntar(caixa,
    el("b", null, t("solo.titulo")),
    el("span", null, t("solo.linha")),
    el("span", "fraco",
      (estado.minhas_na_fila
        ? t("solo.contagem", { n: n(estado.minhas_na_fila), total: n(estado.itens.length) })
        : t("solo.sem_meus"))
      + t("solo.nota")));
  return caixa;
}

/** A faixa da TRIAGEM. As duas passagens usam a mesma, e por isso ela é uma
    função só com o estado por parâmetro: duas faixas seriam dois lugares onde a
    declaração do modo solo pode divergir de si mesma. */
function faixaSolo() {
  return faixaSoloDe(est.triagem);
}

function desenharFilaTriagem(s) {
  const fila = $("#revisor-fila");
  limpar(fila);
  const tri = est.triagem;
  const solo = faixaSolo();
  if (solo) fila.appendChild(solo);
  if (!tri.itens.length) {
    const vazia = el("div", "fila-vazia");
    juntar(vazia, el("div", "vazio-titulo", t(s.vazio)), el("p", "vazio-linha", t(s.linha)));
    if (tri.minhas_excluidas) {
      // Sem esta linha, um revisor que anotou e vê a fila vazia acha que a
      // plataforma perdeu o trabalho dele.
      vazia.appendChild(el("p", "vazio-linha",
        t("triagem.minhas_excluidas", { n: n(tri.minhas_excluidas) })));
    }
    fila.appendChild(vazia);
    return;
  }
  for (const item of tri.itens) {
    const b = el("button", "fila-item");
    b.type = "button";
    b.setAttribute("aria-current", String(tri.sel === item.anotacao_id));
    const topo = el("div", "fila-item-topo");
    juntar(topo,
      el("strong", null, nomeTipo(item.tipo)),
      // No modo solo a fila é mista: marcar QUAIS são minhas é o que torna o
      // aviso acionável em vez de decorativo.
      el("span", item.minha ? "eu" : null,
        item.minha ? t("triagem.eu_sufixo", { nome: item.anotador }) : item.anotador),
      el("span", "crescer"));
    // `dado`: nome de projeto é conteúdo do banco, não cromo — ele sai na
    // língua em que foi cadastrado, como o nome de uma pessoa.
    if (item.projeto) topo.appendChild(el("span", "fraco dado", item.projeto));
    if (item.versao > 1) topo.appendChild(el("span", "etiqueta devolvido", "v" + item.versao));
    b.appendChild(topo);
    b.appendChild(el("div", "fila-item-trecho",
      item.disponivel ? item.prompt : t("triagem.prompt_sumiu")));
    b.addEventListener("click", () => abrirNaTriagem(item.anotacao_id));
    fila.appendChild(b);
  }
}

async function abrirNaTriagem(anotacaoId) {
  const tri = est.triagem;
  if (!tri) return;
  tri.sel = anotacaoId;
  tri.devolvendo = false;
  tri.comentario = "";
  tri.carregando = true;
  desenharFilaTriagem(SUBABAS_REVISOR[0]);
  desenharDetalheTriagem();
  try {
    const r = await api(comParams("/api/revisao/" + anotacaoId, { revisor_id: est.persona.id }));
    tri.detalhe = r.tarefa;
    tri.minha = !!r.minha;
    tri.form = formDoPayload(r.tarefa, r.tarefa.anotacao.payload);
  } catch (e) {
    tri.detalhe = null;
    tri.form = null;
    recado(e.message, true);
  }
  tri.carregando = false;
  desenharDetalheTriagem();
}

function desenharDetalheTriagem() {
  const det = $("#revisor-detalhe");
  limpar(det);
  const tri = est.triagem;
  if (!tri || !tri.sel) {
    const caixa = el("div", "vazio");
    juntar(caixa,
      el("div", "vazio-titulo", t("triagem.nada_selecionado")),
      el("p", "vazio-linha", t("triagem.nada_selecionado_linha")));
    det.appendChild(caixa);
    return;
  }
  if (tri.carregando || !tri.detalhe) {
    det.appendChild(el("div", "vazio-linha",
      tri.carregando ? t("triagem.abrindo") : t("triagem.erro_abrir")));
    return;
  }
  const env = tri.detalhe;
  const a = env.anotacao;

  const cabeca = el("div", "triagem-cabeca");
  juntar(cabeca,
    el("span", "etiqueta pendente", t("triagem.versao", { n: a.versao })),
    el("span", tri.minha ? "eu" : "fraco",
      tri.minha ? t("triagem.por_voce") : t("triagem.por", { nome: a.anotador })),
    el("span", "fraco", (a.submetida_em || "").slice(0, 19).replace("T", " ")),
    el("span", "crescer"),
    // O nome do projeto sai num nó próprio, marcado como DADO: junto com o
    // resto ele viraria uma string única meio cromo, meio conteúdo — e a
    // varredura de língua deixaria de conseguir separar as duas coisas.
    env.tarefa.projeto ? el("span", "fraco dado", env.tarefa.projeto + " · ") : null,
    el("span", "fraco", a.payload_schema
      + (a.versao_diretriz ? " · " + t("triagem.diretriz", { n: a.versao_diretriz }) : "")));
  det.appendChild(cabeca);
  // O aviso acompanha o ITEM, e não só a fila: julgar o próprio trabalho é uma
  // decisão que se toma no detalhe, com o botão à mão.
  if (tri.minha) {
    const aviso = faixaSolo();
    if (aviso) det.appendChild(aviso);
  }

  // O MESMO LAYOUT do anotador, em leitura. Ver `desenharWorkspace`.
  det.appendChild(desenharWorkspace(env, ctxLeitura(tri.form)));

  if (tri.devolvendo) { det.appendChild(caixaDevolucao()); return; }

  const acoes = el("div", "triagem-acoes");
  const aprovar = el("button", "botao primaria", t("botao.aprovar"));
  aprovar.type = "button";
  aprovar.addEventListener("click", () => triar("aprovada", null));
  const devolver = el("button", "botao", t("botao.devolver_ajuste"));
  devolver.type = "button";
  devolver.addEventListener("click", abrirDevolucao);
  juntar(acoes,
    aprovar, el("span", "atalho", "A"),
    devolver, el("span", "atalho", "R"),
    el("span", "crescer"),
    el("span", "fraco", t("triagem.nota_acoes")));
  det.appendChild(acoes);
}

/** A microcopy DIZ para quem o comentário vai — e é isso que muda o que o
    revisor escreve. */
function caixaDevolucao() {
  const piso = lim("min_chars_devolucao", 20);
  const tri = est.triagem;
  const caixa = el("div", "devolver-caixa");
  caixa.appendChild(el("div", "devolucao-titulo", t("triagem.devolver_titulo")));
  caixa.appendChild(el("p", "vazio-linha", t("triagem.devolver_microcopy")));
  const area = el("textarea");
  area.rows = 3;
  area.id = "comentario-devolucao";
  area.placeholder = t("triagem.devolver_ph", { min: piso });
  // Repovoado do ESTADO: trocar de idioma no meio de uma devolução redesenha
  // este bloco, e o que o revisor já escreveu tem de continuar aqui.
  area.value = tri.comentario || "";
  caixa.appendChild(area);
  const escrito = () => (tri.comentario || "").trim().length;
  const contador = el("div", "contador", t("ws.contador_de", { n: n(escrito()), min: piso }));
  caixa.appendChild(contador);
  // O comentário de devolução é METADADO: ele entra no relatório de qualidade e
  // na auditoria do item, e é o cliente quem lê os dois.
  caixa.appendChild(dicaLinguaMeta("lingua.meta"));

  const acoes = el("div", "triagem-acoes");
  const rotularEnviar = (b) => {
    const tem = escrito();
    b.disabled = tem < piso;
    b.textContent = tem < piso
      ? t("falta.devolucao", { n: piso - tem })
      : t("botao.devolver_com_comentario");
  };
  const enviar = el("button", "botao primaria", "");
  enviar.type = "button";
  rotularEnviar(enviar);
  enviar.addEventListener("click", () => triar("devolvida", (tri.comentario || "").trim()));
  const cancelar = el("button", "botao discreta", t("botao.cancelar"));
  cancelar.type = "button";
  cancelar.addEventListener("click", () => {
    tri.devolvendo = false;
    tri.comentario = "";
    desenharDetalheTriagem();
  });
  area.addEventListener("input", () => {
    tri.comentario = area.value;
    contador.textContent = t("ws.contador_de", { n: n(escrito()), min: piso });
    rotularEnviar(enviar);
  });
  juntar(acoes, enviar, cancelar);
  caixa.appendChild(acoes);
  // FOCO no campo: quem apertou R já decidiu devolver, e o próximo gesto é
  // escrever — não procurar onde escrever. O cursor vai para o FIM do que já
  // existe, para que um redesenho no meio da frase não jogue o texto atrás dele.
  requestAnimationFrame(() => {
    area.focus();
    const fim = area.value.length;
    area.setSelectionRange(fim, fim);
  });
  return caixa;
}

function abrirDevolucao() {
  if (!est.triagem || !est.triagem.detalhe) return;
  est.triagem.devolvendo = true;
  desenharDetalheTriagem();
}

async function triar(veredito, comentario) {
  const tri = est.triagem;
  if (!tri || !tri.sel || tri.carregando) return;
  const alvo = tri.sel;
  // Qual é o PRÓXIMO nesta fila: depois de triar, este item some, e a seleção
  // precisa cair no seguinte sozinha — fechar o loop antes de pedir a próxima
  // coisa vale para quem revisa igual.
  const i = tri.itens.findIndex((x) => x.anotacao_id === alvo);
  const proximo = tri.itens[i + 1] || tri.itens[i - 1] || null;
  tri.carregando = true;
  try {
    await postar("/api/revisao/" + alvo, {
      revisor_id: est.persona.id,
      veredito: veredito,
      comentario: comentario || null,
    });
    recado(veredito === "aprovada" ? t("recado.aprovada") : t("recado.devolvida"));
    // APROVAR ENCHE A OUTRA FILA. Sem invalidar aqui, a sub-aba do Rate and
    // Review continuaria mostrando o que ela leu na última visita — e o item
    // que acabou de ser aprovado só apareceria depois de sair da tela e voltar.
    // `null` (e não uma recarga) porque recarregar agora desenharia a fila da
    // passagem 2 por cima do detalhe da triagem que está aberto.
    if (veredito === "aprovada") est.rr = null;
  } catch (e) {
    tri.carregando = false;
    recado(e.message, true);
    return;
  }
  tri.carregando = false;
  await carregarTriagem(proximo ? proximo.anotacao_id : null);
  await recarregarSaude();
}

/* ==========================================================================
   6b. TELA DO REVISOR — PASSAGEM 2: O RATE AND REVIEW

   A mesma fila à esquerda, o mesmo detalhe à direita, o MESMO workspace — só
   que destravado. A tela conduz em quatro passos numerados, e a ordem é a
   ordem da decisão:

     1. avaliar o trabalho COMO CHEGOU (antes de tocar em qualquer coisa);
     2. corrigir ali mesmo, com um motivo curto por mudança;
     3. avaliar o RESULTADO;
     4. escrever por que — obrigatório sempre.

   UMA AÇÃO PRIMÁRIA, e ela diz o que falta antes do clique. A ordem em que
   `rrOQueFalta` procura é a ordem visual: o botão aponta para a primeira coisa
   pendente de cima para baixo, e não para a "mais importante" — quem lê o
   botão está procurando onde continuar, não uma opinião.

   O CRONÔMETRO É INVISÍVEL, como no anotador: `abertoEm` é um carimbo, não um
   relógio na tela. Ele vai para `avaliacoes.tempo_ativo_ms` e de lá para o
   painel do admin.
   ========================================================================== */

/** Achata um payload em `{caminho: folha}`. Espelho de `avaliacoes.achatar` no
    servidor, e é a igualdade entre os dois que faz o botão desta tela concordar
    com o 422 — o servidor recalcula o diff e exige os mesmos caminhos. */
function achatar(valor, prefixo, saida) {
  const plano = saida || {};
  const folha = valor === null || typeof valor !== "object";
  const vazio = !folha && (Array.isArray(valor) ? !valor.length : !Object.keys(valor).length);
  if (folha || vazio) {
    if (prefixo) plano[prefixo] = valor;
    return plano;
  }
  const chaves = Array.isArray(valor) ? valor.map((_, i) => i) : Object.keys(valor);
  for (const k of chaves) achatar(valor[k], prefixo ? prefixo + "." + k : String(k), plano);
  return plano;
}

/** Os caminhos que mudaram entre dois payloads, na ordem do payload ORIGINAL.
    Ordem alfabética misturaria o critério 10 com o 1; esta acompanha o
    formulário, que é onde a pessoa está olhando. */
function diffPayload(antes, depois) {
  const a = achatar(antes, "");
  const b = achatar(depois, "");
  const tem = (o, k) => Object.prototype.hasOwnProperty.call(o, k);
  const ordem = Object.keys(a).concat(Object.keys(b).filter((k) => !tem(a, k)));
  const saida = [];
  for (const campo of ordem) {
    const va = tem(a, campo) ? a[campo] : null;
    const vb = tem(b, campo) ? b[campo] : null;
    if (JSON.stringify(va) === JSON.stringify(vb)) continue;
    saida.push({ campo: campo, antes: va, depois: vb });
  }
  return saida;
}

/** Uma folha como texto, para o resumo e para o corpo do POST. */
function comoTexto(v) {
  if (v === null || v === undefined) return null;
  return (typeof v === "string" ? v : JSON.stringify(v)).slice(0, 2000);
}

/* ---- rascunho da avaliação, por ANOTAÇÃO ----
   Separado do rascunho do anotador (`bancada.rascunho.<atribuicao>`) porque são
   dois trabalhos diferentes sobre coisas diferentes: a mesma pessoa, no modo
   solo, pode ter uma tarefa aberta e uma avaliação pela metade ao mesmo tempo. */
function rrChave(id) { return CHAVE + "avaliacao." + id; }

function salvarRascunhoRR() {
  const rr = est.rr;
  if (!rr || !rr.sel || !rr.form) return;
  try {
    localStorage.setItem(rrChave(rr.sel), JSON.stringify({
      antes: rr.antes, depois: rr.depois, justificativa: rr.justificativa,
      motivos: rr.motivos, form: rr.form,
    }));
  } catch (_) { /* modo privado ou cota cheia: funciona igual, só não lembra */ }
}
function lerRascunhoRR(id) {
  try {
    const bruto = localStorage.getItem(rrChave(id));
    return bruto ? JSON.parse(bruto) : null;
  } catch (_) { return null; }
}
function limparRascunhoRR(id) {
  try { localStorage.removeItem(rrChave(id)); } catch (_) {}
}

async function carregarRR(manterSel) {
  const anterior = manterSel === undefined ? (est.rr && est.rr.sel) : manterSel;
  const vazia = {
    itens: [], total: 0, minhas_excluidas: 0, minhas_na_fila: 0, modo_solo: false,
    sel: null, detalhe: null, triagemDoItem: null, original: null, form: null,
    antes: null, depois: null, justificativa: "", motivos: {}, diff: [], caixas: [],
    foco: 0, abertoEm: 0, carregando: false, rascunhoRecuperado: false, minha: false,
  };
  try {
    const r = await api(comParams("/api/avaliacao/fila",
      paramsProjeto({ revisor_id: est.persona.id })));
    est.rr = {
      ...vazia,
      itens: r.items || [],
      total: r.total || 0,
      minhas_excluidas: r.minhas_excluidas || 0,
      minhas_na_fila: r.minhas_na_fila || 0,
      modo_solo: !!r.modo_solo,
    };
  } catch (e) {
    est.rr = { ...vazia, erro: e.message };
    recado(t("rr.erro_fila", { erro: e.message }), true);
  }
  await desenharRevisor();
  // Seleciona sozinho, como a triagem: uma fila com itens e nada aberto obriga
  // um clique que não decide nada.
  const itens = est.rr.itens;
  if (!itens.length) return;
  const alvo = itens.find((x) => x.anotacao_id === anterior) || itens[0];
  await abrirNoRR(alvo.anotacao_id);
}

async function abrirNoRR(anotacaoId) {
  const rr = est.rr;
  if (!rr) return;
  rr.sel = anotacaoId;
  rr.carregando = true;
  rr.detalhe = null;
  rr.caixas = [];
  desenharFilaRR(SUBABAS_REVISOR[1]);
  desenharDetalheRR();
  try {
    const r = await api(comParams("/api/avaliacao/" + anotacaoId, { revisor_id: est.persona.id }));
    rr.detalhe = r.tarefa;
    rr.minha = !!r.minha;
    rr.triagemDoItem = r.triagem || null;
    // O ORIGINAL é a cópia intocada: o diff é contra ela, e desfazer uma
    // correção precisa de um ponto de referência que não se mexe.
    rr.original = formDoPayload(r.tarefa, r.tarefa.anotacao.payload);
    rr.form = JSON.parse(JSON.stringify(rr.original));
    rr.antes = null;
    rr.depois = null;
    rr.justificativa = "";
    rr.motivos = {};
    rr.foco = 0;
    rr.rascunhoRecuperado = false;
    const guardado = lerRascunhoRR(anotacaoId);
    if (guardado) {
      rr.antes = guardado.antes || null;
      rr.depois = guardado.depois || null;
      rr.justificativa = guardado.justificativa || "";
      rr.motivos = guardado.motivos || {};
      if (guardado.form) rr.form = guardado.form;
      rr.rascunhoRecuperado = true;
    }
    // O relógio começa quando o item ABRE, não quando a fila carrega.
    rr.abertoEm = Date.now();
  } catch (e) {
    rr.detalhe = null;
    rr.form = null;
    recado(e.message, true);
  }
  rr.carregando = false;
  desenharDetalheRR();
}

function desenharFilaRR(s) {
  const fila = $("#revisor-fila");
  limpar(fila);
  const rr = est.rr;
  const solo = faixaSoloDe(rr);
  if (solo) fila.appendChild(solo);
  if (!rr.itens.length) {
    const vazia = el("div", "fila-vazia");
    juntar(vazia, el("div", "vazio-titulo", t(s.vazio)), el("p", "vazio-linha", t(s.linha)));
    if (rr.minhas_excluidas) {
      vazia.appendChild(el("p", "vazio-linha",
        t("rr.minhas_excluidas", { n: n(rr.minhas_excluidas) })));
    }
    // ESTADO VAZIO COM SAÍDA: a fila da passagem 2 só enche quando a triagem
    // aprova, e a saída real é ir triar.
    const saidas = el("div", "vazio-saidas");
    const irTriar = el("button", "botao primaria", t("subaba.anotacoes.nome"));
    irTriar.type = "button";
    irTriar.addEventListener("click", () => { est.subaba = "anotacoes"; desenharRevisor(); });
    juntar(saidas, irTriar);
    vazia.appendChild(saidas);
    fila.appendChild(vazia);
    return;
  }
  for (const item of rr.itens) {
    const b = el("button", "fila-item");
    b.type = "button";
    b.setAttribute("aria-current", String(rr.sel === item.anotacao_id));
    const topo = el("div", "fila-item-topo");
    juntar(topo,
      el("strong", null, nomeTipo(item.tipo)),
      el("span", item.minha ? "eu" : null,
        item.minha ? t("triagem.eu_sufixo", { nome: item.anotador }) : item.anotador),
      el("span", "crescer"));
    if (item.projeto) topo.appendChild(el("span", "fraco dado", item.projeto));
    if (item.versao > 1) topo.appendChild(el("span", "etiqueta devolvido", "v" + item.versao));
    b.appendChild(topo);
    // QUEM TRIOU, na própria linha da fila. A métrica de QC mais interessante
    // deste marco — "a triagem deixou passar" — precisa dos dois nomes juntos,
    // e o revisor decide melhor sabendo quem já olhou aquilo.
    if (item.triador) {
      b.appendChild(el("div", "fila-item-topo",
        t("rr.triagem", { nome: item.triador })));
    }
    b.appendChild(el("div", "fila-item-trecho",
      item.disponivel ? item.prompt : t("triagem.prompt_sumiu")));
    b.addEventListener("click", () => abrirNoRR(item.anotacao_id));
    fila.appendChild(b);
  }
}

/** UMA ESCALA: as quatro opções sempre visíveis, com a âncora ao lado.

    Um `<select>` economizaria espaço e custaria a única coisa que uma escala
    ancorada tem — a possibilidade de comparar as quatro descrições antes de
    escolher uma. Teclado: as setas andam e selecionam, como num radiogroup de
    verdade, e Tab entra e sai do grupo. */
function escalaRR(opcoes, valor, ariaChave, aoEscolher) {
  const caixa = el("div", "escala");
  caixa.setAttribute("role", "radiogroup");
  caixa.setAttribute("aria-label", t(ariaChave));
  opcoes.forEach((o, i) => {
    const b = el("button", "escala-opcao" + (o.classe ? " " + o.classe : ""));
    b.type = "button";
    b.setAttribute("role", "radio");
    b.setAttribute("aria-checked", String(valor === o.id));
    // Só o selecionado (ou o primeiro, quando nada está) fica na ordem do Tab:
    // é o padrão de um radiogroup, e é o que evita quatro paradas de Tab por
    // escala numa tela que já tem muitas.
    b.tabIndex = (valor === o.id || (!valor && i === 0)) ? 0 : -1;
    juntar(b, el("b", null, t(o.nome)), el("span", null, t(o.ancora)));
    b.addEventListener("click", () => aoEscolher(o.id));
    b.addEventListener("keydown", (ev) => {
      if (ev.key !== "ArrowDown" && ev.key !== "ArrowUp" &&
          ev.key !== "ArrowRight" && ev.key !== "ArrowLeft") return;
      ev.preventDefault();
      const passo = (ev.key === "ArrowDown" || ev.key === "ArrowRight") ? 1 : -1;
      aoEscolher(opcoes[(i + passo + opcoes.length) % opcoes.length].id);
    });
    caixa.appendChild(b);
  });
  return caixa;
}

/** A caixa de motivos de um pedaço do payload. Ela nasce VAZIA e é preenchida
    por `rrSincronizar` conforme os campos daquele prefixo mudam — é isso que
    faz o motivo aparecer colado ao campo editado e sumir quando a edição é
    desfeita, sem modal e sem redesenhar a tela a cada tecla. */
function caixaDeMotivos(prefixo) {
  const caixa = el("div", "motivos");
  est.rr.caixas.push({ prefixo: prefixo, no: caixa, linhas: {} });
  return caixa;
}

function linhaDeMotivo(campo) {
  const piso = lim("min_chars_motivo_edicao", 10);
  const linha = el("div", "motivo-linha");
  const entrada = el("input");
  entrada.type = "text";
  entrada.maxLength = 600;
  entrada.placeholder = t("rr.motivo_ph", { min: piso });
  entrada.value = est.rr.motivos[campo] || "";
  entrada.setAttribute("aria-label", t("rr.motivo_rotulo", { campo: campo }));
  entrada.addEventListener("input", () => {
    est.rr.motivos[campo] = entrada.value;
    salvarRascunhoRR();
    rrAtualizarResumo();
    rrAtualizarBotao();
  });
  // O caminho do campo é o ENDEREÇO no payload, e é literalmente o que vai para
  // `edicoes_avaliacao.campo`. Ele sai em mono e sem tradução: é vocabulário de
  // máquina, e traduzi-lo faria a trilha de auditoria e a tela discordarem.
  juntar(linha, el("label", null, t("rr.motivo_rotulo", { campo: campo })), entrada);
  return linha;
}

/** Recalcula o diff e reconcilia as caixas de motivo — SEM redesenhar.

    Reconstruir as caixas a cada tecla tiraria o foco do campo no meio da
    palavra. Aqui só entra a linha que passou a existir e só sai a que deixou de
    existir; quem estava sendo digitado permanece o mesmo nó. */
function rrSincronizar() {
  const rr = est.rr;
  if (!rr || !rr.detalhe || !rr.form) return;
  rr.diff = diffPayload(
    montarPayload(rr.detalhe, rr.original), montarPayload(rr.detalhe, rr.form));
  const ativos = {};
  for (const d of rr.diff) ativos[d.campo] = true;

  const colocados = {};
  for (const caixa of rr.caixas) {
    for (const campo of Object.keys(caixa.linhas)) {
      if (ativos[campo]) colocados[campo] = true;
    }
  }
  for (const caixa of rr.caixas) {
    for (const d of rr.diff) {
      if (colocados[d.campo]) continue;
      if (d.campo.indexOf(caixa.prefixo) !== 0) continue;
      const linha = linhaDeMotivo(d.campo);
      caixa.linhas[d.campo] = linha;
      caixa.no.appendChild(linha);
      colocados[d.campo] = true;
    }
    for (const campo of Object.keys(caixa.linhas)) {
      if (ativos[campo]) continue;
      caixa.no.removeChild(caixa.linhas[campo]);
      delete caixa.linhas[campo];
    }
  }
  rrAtualizarResumo();
  rrAtualizarBotao();
}

/** Uma tecla num campo do workspace do revisor. */
function rrDigitou() {
  salvarRascunhoRR();
  rrSincronizar();
}

/** Uma mudança ESTRUTURAL (nota, preferência, critério a mais ou a menos).
    Redesenha o detalhe inteiro, como o anotador faz — são cliques, e o foco não
    está no meio de uma palavra. */
function rrMudou() {
  salvarRascunhoRR();
  desenharDetalheRR();
}

/** O RESUMO DO DIFF: conferir o que mudou sem rolar a tela inteira de volta.

    Só texto aqui dentro — nenhum campo editável —, e é por isso que ele pode
    ser reconstruído a cada tecla sem custar foco. */
function rrAtualizarResumo() {
  const no = $("#rr-diff");
  if (!no) return;
  const rr = est.rr;
  limpar(no);
  const piso = lim("min_chars_motivo_edicao", 10);
  const cabeca = el("div", "painel-cabeca");
  cabeca.style.padding = "0 0 4px";
  cabeca.style.border = "none";
  juntar(cabeca,
    el("h2", "rr-secao-titulo", t("rr.diff_titulo")),
    el("span", "crescer"),
    el("span", "etiqueta " + (rr.diff.length ? "devolvido" : "pendente"),
      t("rr.diff_conta", { n: n(rr.diff.length) })));
  no.appendChild(cabeca);
  if (!rr.diff.length) {
    no.appendChild(el("p", "rr-secao-nota", t("rr.diff_vazio")));
    return;
  }
  const lista = el("div", "diff-lista");
  for (const d of rr.diff) {
    const item = el("div", "diff-item");
    juntar(item, el("div", "diff-campo", d.campo));
    const valores = el("div", "diff-valores");
    juntar(valores,
      el("span", "de", t("rr.diff_de") + ": "
        + (comoTexto(d.antes) === null ? t("rr.diff_nada") : comoTexto(d.antes))),
      el("span", "para", t("rr.diff_para") + ": "
        + (comoTexto(d.depois) === null ? t("rr.diff_nada") : comoTexto(d.depois))));
    item.appendChild(valores);
    const motivo = (rr.motivos[d.campo] || "").trim();
    item.appendChild(el("div", "diff-motivo" + (motivo.length < piso ? " pendente" : ""),
      motivo.length < piso ? t("rr.diff_sem_motivo") : motivo));
    lista.appendChild(item);
  }
  no.appendChild(lista);
}

/** O QUE FALTA, na ordem em que a tela pede — de cima para baixo. */
function rrOQueFalta() {
  const rr = est.rr;
  if (!rr || !rr.detalhe || !rr.form) return t("falta.nada");
  if (!rr.antes) return t("falta.rr_antes");
  const piso = lim("min_chars_motivo_edicao", 10);
  const sem = (rr.diff || [])
    .filter((d) => (rr.motivos[d.campo] || "").trim().length < piso).length;
  if (sem) return sem === 1 ? t("falta.rr_motivo_um") : t("falta.rr_motivos", { n: sem });
  if (!rr.depois) return t("falta.rr_depois");
  const minimo = lim("min_chars_avaliacao", 30);
  const tem = (rr.justificativa || "").trim().length;
  if (tem < minimo) return t("falta.justificativa", { n: minimo - tem });
  return null;
}

function rrAtualizarBotao() {
  const b = $("#rr-registrar");
  if (!b) return;
  const falta = rrOQueFalta();
  b.textContent = falta ? falta : t("botao.registrar_avaliacao");
  b.disabled = !!falta || est.rr.carregando;
}

function desenharDetalheRR() {
  const det = $("#revisor-detalhe");
  limpar(det);
  const rr = est.rr;
  if (!rr || !rr.sel) {
    const caixa = el("div", "vazio");
    juntar(caixa,
      el("div", "vazio-titulo", t("rr.nada_selecionado")),
      el("p", "vazio-linha", t("rr.nada_selecionado_linha")));
    det.appendChild(caixa);
    return;
  }
  if (rr.carregando || !rr.detalhe) {
