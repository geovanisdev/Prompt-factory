      pedir.addEventListener("click", () => { form.justificativas[i] = ""; c0.aoMudar(); });
      caixa.appendChild(pedir);
    }
    return caixa;
  }
  const campo = el("textarea");
  campo.rows = 2;
  campo.className = "largo";
  campo.placeholder = t(obrigatoria ? "ws.porque_ph" : "ws.just_ph");
  // Numa matriz de 20 linhas há 20 campos com o MESMO placeholder: sem o nome do
  // critério, quem navega por leitor de tela ouve "por que esta nota" vinte vezes
  // e não sabe qual delas está preenchendo.
  campo.setAttribute("aria-label", t("a11y.justificativa", { criterio: nomeC }));
  campo.value = escrito || "";
  if (c0.leitura) campo.readOnly = true;
  else campo.addEventListener("input", () => {
    form.justificativas[i] = campo.value; c0.aoDigitar();
  });
  caixa.appendChild(campo);
  if (obrigatoria) caixa.appendChild(trechoDoCriterio(c, i, c0));
  // O SELO DE LÍNGUA saiu daqui e subiu para a matriz, uma vez só. Ele é uma
  // convenção do INSTRUMENTO ("metadado em inglês"), não uma propriedade de cada
  // linha: repetido em vinte critérios ele custava altura em cada um e, pior,
  // deixava de ser lido — um aviso que aparece vinte vezes é um aviso que
  // ninguém vê na primeira.
  // Com o campo dentro, a linha deixa de ser uma fileira de chips e vira um
  // bloco: a caixa de texto ocupa a largura toda.
  caixa.classList.add("bloco");
  return caixa;
}

/** O trecho verbatim — PROEMINENTE e OPCIONAL.

    Exigi-lo em toda severidade alta faria quem enfrenta um defeito difuso ("a
    resposta inteira erra o registro") colar um trecho arbitrário só para
    destravar o botão: evidência fabricada dentro do artefato entregue. O botão
    "é difuso" registra a escolha em vez de deixá-la implícita. */
function trechoDoCriterio(c, i, c0) {
  const form = c0.form;
  const nomeC = bi(c.nome_i18n, c.nome);
  const caixa = el("div", "trecho");
  if (form.difusos[i]) {
    caixa.appendChild(el("span", "fraco", t("ws.trecho_difuso_dito")));
    if (!c0.leitura) {
      const desfazer = el("button", "botao discreta", t("botao.desfazer"));
      desfazer.type = "button";
      desfazer.addEventListener("click", () => { form.difusos[i] = false; c0.aoMudar(); });
      caixa.appendChild(desfazer);
    }
    return caixa;
  }
  const campo = el("input");
  campo.type = "text";
  campo.className = "largo";
  campo.placeholder = t("ws.trecho_ph");
  campo.setAttribute("aria-label", t("a11y.trecho", { criterio: nomeC }));
  campo.value = form.trechos[i] || "";
  if (c0.leitura) campo.readOnly = true;
  else campo.addEventListener("input", () => { form.trechos[i] = campo.value; c0.aoDigitar(); });
  caixa.appendChild(campo);
  if (!c0.leitura && !(form.trechos[i] || "").trim()) {
    const difuso = el("button", "botao discreta", t("botao.difuso"));
    difuso.type = "button";
    difuso.addEventListener("click", () => {
      form.trechos[i] = ""; form.difusos[i] = true; c0.aoMudar();
    });
    caixa.appendChild(difuso);
  }
  return caixa;
}

/** N/A é uma DECISÃO, não uma ausência: marcar limpa a nota, os tipos e o
    trecho, porque um critério que não se aplica não afirma nada. */
function alternarNa(c0, i) {
  const form = c0.form;
  const ligado = !form.na[i];
  form.na[i] = ligado;
  if (ligado) {
    form.notas[i] = null;
    form.issues[i] = {};
    form.trechos[i] = "";
    form.difusos[i] = false;
  } else {
    form.motivosNa[i] = "";
  }
  c0.aoMudar();
}

/** O cabeçalho de escala — escrito UMA vez por grupo, não por critério.

    É esta linha que paga a compressão: as âncoras deixam de repetir em cada
    ficha e viram rótulo de coluna. */
function cabecalhoDaEscala(criterios, indices) {
  const escala = escalaDe(criterios[indices[0]]);
  const cabeca = el("div", "matriz-linha matriz-cabeca");
  cabeca.style.setProperty("--cols", String(escala.max - escala.min + 1));
  cabeca.appendChild(el("div", "matriz-nome"));
  for (let v = escala.min; v <= escala.max; v++) {
    const a = ancoraDe(escala, v);
    cabeca.appendChild(el("div", "matriz-col", a ? bi(a.rotulo_i18n, a.rotulo) : String(v)));
  }
  cabeca.appendChild(el("div", "matriz-col", t("ws.na")));
  return cabeca;
}

/** Todos os critérios do grupo têm a mesma escala? Só então o cabeçalho único
    diz a verdade; se não, cada linha volta a carregar os próprios rótulos. */
function escalaUniforme(criterios, indices) {
  const chave = (i) => {
    const e = escalaDe(criterios[i]);
    return e.min + ":" + e.max + ":" + (e.ancoras || []).map((a) => a.valor + a.rotulo).join("|");
  };
  const primeira = chave(indices[0]);
  return indices.every((i) => chave(i) === primeira);
}

/** A faixa-guia: descrição e âncoras do critério EM FOCO, no pé da matriz.

    É o painel lateral deitado — ocupa altura fixa em vez de largura, segue ↑/↓,
    e não depende de hover nem de posicionamento. Some na leitura, onde não há
    foco: quem tria vê os critérios todos abertos. */
function faixaGuia(criterios, c0) {
  const c = criterios[c0.foco];
  if (c0.leitura || !c) return null;
  const faixa = el("div", "guia");
  const escala = escalaDe(c);
  const ancoras = (escala.ancoras || []).slice().sort((a, b) => a.valor - b.valor);
  juntar(faixa,
    el("div", "guia-nome", bi(c.nome_i18n, c.nome)),
    el("div", "guia-desc", bi(c.descricao_i18n, c.descricao) || ""));
  // TODAS as âncoras, não só as duas pontas. O `.ancoras` de antes mostrava
  // `ancoras[0]` e `ancoras[n-1]` e jogava fora o meio — que é exatamente o
  // ponto sobre o qual dois anotadores discordam, e o único que o pacote de
  // demonstração já descrevia sem que a tela mostrasse. Aqui elas cabem porque
  // são de UM critério só, o que está em foco.
  if (ancoras.length) {
    const lista = el("div", "guia-ancoras");
    for (const a of ancoras) {
      const item = el("span", "guia-ancora");
      juntar(item,
        el("b", null, String(a.valor)),
        el("span", null, bi(a.rotulo_i18n, a.rotulo)));
      lista.appendChild(item);
    }
    faixa.appendChild(lista);
  }
  return faixa;
}

/** O RAIL: o que você marcou, os overalls e a síntese — tudo na mesma dobra.

    É a resposta à dor "rating em cima, rationale lá embaixo". A frase de CADA
    critério já mora na linha dele (adjacência máxima); o que o rail resolve é o
    outro rationale, o do conjunto — e ele o resolve **ecoando aqui em cima o
    que a pessoa já escreveu**, para que escrever a síntese deixe de ser um
    exercício de memória e vire um de síntese, com as peças à vista.

    O QUE ELE NÃO FAZ: pré-preencher a caixa. Um texto gerado a partir das
    issues marcadas repetiria os ratings sem os explicar, ninguém apaga um campo
    que já veio preenchido, e o resultado é a mesma falha de sempre — só que com
    boa gramática e mais difícil de auditar. O rail lista a obrigação; quem
    escreve é quem anota. */
/** O eco do rail, atualizado SEM redesenhar.

    Digitar não redesenha nesta tela — um redesenho por tecla tiraria o foco do
    campo no meio da palavra. Mas o rail existe para mostrar o que você acabou de
    escrever, e um eco que só aparece na próxima mudança estrutural é um eco que
    diz "ainda sem frase" sobre uma frase que está na tela. É a mesma cirurgia de
    `atualizarBotaoEnviar` e `rrSincronizar`, pelo mesmo motivo.

    Sem argumento, varre o rail inteiro; com um nó, atualiza só ele (é como o
    desenho inicial o preenche, sem duplicar a regra do que mostrar). */
function atualizarEcoDoRail(form, no) {
  const alvos = no ? [no] : document.querySelectorAll(".rail-achado[data-i]");
  for (const item of alvos) {
    const i = Number(item.dataset.i);
    const eco = item.querySelector(".rail-eco");
    if (!eco) continue;
    const escrito = ((form.na[i] ? form.motivosNa[i] : form.justificativas[i]) || "").trim();
    eco.textContent = escrito || t("rail.sem_frase");
    eco.className = escrito ? "rail-eco dado" : "rail-eco rail-falta";
  }
}

function railDeAvaliacao(criterios, c0) {
  const form = c0.form;
  const rail = el("aside", "rail");
  const grupos = gruposDe(criterios);

  if (!c0.leitura && (grupos.length > 1 || grupos[0].chave)) {
    const prog = el("div", "rail-bloco");
    prog.appendChild(el("div", "rail-titulo", t("rail.progresso")));
    for (const g of grupos) {
      const principais = g.indices.filter((i) => !criterios[i].resumo);
      if (!principais.length) continue;
      const faltando = principais.filter((i) => faltaNoCriterio(criterios[i], form, i)).length;
      const linha = el("button", "rail-grupo");
      linha.type = "button";
      juntar(linha,
        el("span", "crescer", g.rotulo || t("rail.sem_grupo")),
        el("span", "num", n(principais.length - faltando) + "/" + n(principais.length)));
      if (faltando) linha.dataset.pendente = "true";
      // Clicável: o número diz que falta, e o clique leva até lá. Um contador
      // que não é um caminho é uma cobrança sem saída.
      linha.addEventListener("click", () => {
        c0.aoFocar(principais.find((i) => faltaNoCriterio(criterios[i], form, i)) ?? principais[0]);
        c0.aoMudar();
      });
      prog.appendChild(linha);
    }
    rail.appendChild(prog);
  }

  const marcados = criterios
    .map((c, i) => ({ c: c, i: i }))
    .filter((x) => !x.c.resumo && (form.na[x.i] || sinalizado(x.c, form, x.i)));
  if (marcados.length) {
    const bloco = el("div", "rail-bloco");
    bloco.appendChild(el("div", "rail-titulo", t("rail.deve_justificar")));
    for (const x of marcados) {
      const item = el("div", "rail-achado");
      item.dataset.i = String(x.i);
      const cabeca = el("div", "rail-achado-nome");
      cabeca.appendChild(el("span", "crescer", bi(x.c.nome_i18n, x.c.nome)));
      const tipos = Object.keys(form.issues[x.i] || {}).filter((k) => form.issues[x.i][k]);
      if (form.na[x.i]) cabeca.appendChild(el("span", "selo", t("ws.na")));
      else if (tipos.length) cabeca.appendChild(el("span", "selo", n(tipos.length)));
      item.appendChild(cabeca);
      item.appendChild(el("div", "rail-eco dado"));
      atualizarEcoDoRail(form, item);
      // Clicar leva ao critério: o rail aponta, a linha conserta.
      if (!c0.leitura) {
        item.addEventListener("click", () => { c0.aoFocar(x.i); c0.aoMudar(); });
        item.classList.add("clicavel");
      }
      bloco.appendChild(item);
    }
    rail.appendChild(bloco);
  }

  const temOverall = criterios.some((c) => c.resumo);
  if (temOverall) {
    const bloco = el("div", "rail-bloco");
    const travado = !c0.leitura && overallTravado(criterios, form);
    bloco.appendChild(el("div", "rail-titulo", t("rail.overall")));
    if (travado) {
      // Travado, ele mostra o QUE FALTA — nunca um controle morto e mudo.
      bloco.appendChild(el("p", "rail-falta", faltaNaMatriz(criterios, form) || ""));
    } else {
      bloco.appendChild(matrizDeCriterios(criterios, c0, {
        resumo: true, agrupar: false, guia: false,
      }));
    }
    rail.appendChild(bloco);
  }
  return rail;
}

/** A matriz inteira: abas por grupo (só para quem anota), cabeçalho de escala e
    as linhas, mais a faixa-guia no pé.

    O GRUPO ATIVO É DERIVADO DO FOCO, e não guardado num segundo estado. Com
    isso, `↓` no último critério de um grupo troca de aba sozinho, o rascunho não
    precisa lembrar de mais nada, e não existe o estado inconsistente "aba A
    aberta, foco em B". */
function matrizDeCriterios(criterios, c0, opts) {
  const o = opts || {};
  const caixa = el("div", "matriz");
  // Os OVERALLS são critérios com `resumo: true` — não um conceito novo, não um
  // widget próprio, não um campo fora de `notas[]`. Consequência: mesmo payload,
  // mesma validação contra a rubrica, mesmo teclado, mesma caixa de motivo do
  // Rate and Review, mesma linha no export. Qualquer coisa modelada fora de
  // `notas[]` precisaria de uma segunda cópia de cada um desses cinco.
  const grupos = gruposDe(criterios).map((g) => ({
    ...g,
    indices: g.indices.filter((i) => !!criterios[i].resumo === !!o.resumo),
  })).filter((g) => g.indices.length);
  if (!grupos.length) return caixa;
  // Quem ANOTA vê um grupo por vez (é foco); quem TRIA e quem avalia veem tudo
  // empilhado (é conferência). Um `if`, não um segundo renderizador.
  const agrupar = o.agrupar !== false && !c0.leitura && !c0.revisor
    && grupos.length > 1 && grupos[0].chave !== "";
  const ativo = agrupar
    ? (grupos.find((g) => g.indices.includes(c0.foco)) || grupos[0])
    : null;

  // OS ATALHOS INVISÍVEIS DA MATRIZ, no cabeçalho dela. Eram os únicos gestos da
  // plataforma sem nenhuma marca na tela: `1–9`, `N`, `0` e as setas operam a
  // matriz inteira, e quem não os conhece grada vinte critérios com o mouse. Os
  // chips não são clicáveis — eles dizem o que já funciona; o `title` de cada um
  // repete a mesma frase da folha (`?`), num lugar só.
  if (!c0.leitura && !o.resumo) {
    const chips = el("div", "chips");
    for (const [tecla, chave] of [["1–9", "atalhos.matriz_nota"], ["N", "atalhos.matriz_na"],
                                  ["0", "atalhos.matriz_pendente"], ["↑ ↓", "atalhos.matriz_setas"]]) {
      const chip = el("span", "atalho", tecla);
      chip.title = t(chave);
      chips.appendChild(chip);
    }
    caixa.appendChild(chips);
  }

  if (agrupar) {
    const abas = el("div", "abas abas-grupo");
    abas.setAttribute("role", "tablist");
    grupos.forEach((g) => {
      const b = el("button", "aba", g.rotulo);
      b.type = "button";
      b.setAttribute("role", "tab");
      b.setAttribute("aria-selected", String(g === ativo));
      const faltando = g.indices.filter((i) => faltaNoCriterio(criterios[i], c0.form, i)).length;
      // A contagem NUNCA é omitida: uma aba não preenchida tem de ser visível
      // sem clique, senão o agrupamento vira o doom scrolling com outro nome.
      b.appendChild(el("span", "conta",
        n(g.indices.length - faltando) + "/" + n(g.indices.length)));
      if (faltando) b.dataset.pendente = "true";
      b.addEventListener("click", () => { c0.aoFocar(g.indices[0]); c0.aoMudar(); });
      abas.appendChild(b);
    });
    caixa.appendChild(abas);
  }

  for (const g of grupos) {
    if (agrupar && g !== ativo) continue;
    if (!agrupar && g.chave) caixa.appendChild(el("div", "rotulo-bloco", g.rotulo));
    if (escalaUniforme(criterios, g.indices)) {
      caixa.appendChild(cabecalhoDaEscala(criterios, g.indices));
    }
    for (const i of g.indices) caixa.appendChild(linhaDeCriterio(criterios[i], i, c0));
  }

  // UMA VEZ POR MATRIZ, e não uma vez por critério (ver `fraseDoCriterio`). Fora
  // do rail: lá dentro os overalls são desenhados em modo compacto, e o selo
  // apareceria uma segunda vez a três centímetros da primeira.
  if (!c0.leitura && !o.resumo) caixa.appendChild(dicaLinguaMeta("lingua.meta"));

  if (o.guia !== false) {
    const guia = faixaGuia(criterios, c0);
    if (guia) caixa.appendChild(guia);
  }
  return caixa;
}

/** As perguntas abertas do instrumento (P9). Vêm normalizadas do servidor
    (`rubrica_ativa`), então o JS só lê. Vazio para toda rubrica pré-P9. */
function perguntasDe(env) {
  return (env.rubrica && env.rubrica.perguntas) || [];
}

/** As caixas de pergunta — ANTES da matriz, na ordem do brief: "state the user
    goal before rating". Uma textarea por pergunta, com o rótulo vindo do DADO
    (`bi()`, sidecar `*_i18n`) e o aviso de falta vindo do cromo.

    Os três leitores de sempre: quem anota escreve; quem tria lê o texto como
    parágrafo; quem faz o Rate and Review edita, e a caixa de motivo do diff
    cobra o porquê pela MESMA mecânica dos outros campos (`c0.motivos`). */
function caixasDePergunta(env, c0) {
  const perguntas = perguntasDe(env);
  if (!perguntas.length) return null;
  const form = c0.form;
  const caixa = el("div", "perguntas-instrumento");
  for (const pergunta of perguntas) {
    const id = pergunta.id;
    const bloco = el("div", "campo pergunta-aberta");
    const rotulo = el("span", null, bi(pergunta.rotulo_i18n, pergunta.rotulo));
    const desc = bi(pergunta.descricao_i18n, pergunta.descricao);
    const valor = (form.respostas || {})[id] || "";
    // CATEGORIA: a resposta é o ID de uma classe, escolhido num seletor cujas
    // opções o servidor já expandiu da taxonomia (`perguntas_da_rubrica`). Sem
    // opções em mãos — taxonomia ilegível — o ramo degrada para a caixa livre:
    // a resposta continua capturável, e a validação do servidor degrada junto.
    const opcoes = pergunta.tipo === "categoria" ? pergunta.opcoes || [] : [];
    if (c0.leitura) {
      if (opcoes.length && valor) {
        const achada = opcoes.find((o) => o.id === valor);
        const lida = el("p", "pergunta-lida");
        // Nome legível + id, SEMPRE os dois — o mesmo contrato do chip de
        // categoria do brief: o id é o que atravessa a plataforma e o corpus.
        if (achada) lida.appendChild(el("span", null, bi(achada.rotulo_i18n, achada.rotulo) + " "));
        lida.appendChild(el("span", "cat-id", valor));
        juntar(bloco, rotulo, lida);
      } else {
        juntar(bloco, rotulo, el("p", "pergunta-lida", valor || "—"));
      }
      caixa.appendChild(bloco);
      continue;
    }
    if (opcoes.length) {
      const sel = el("select");
      sel.setAttribute("aria-label", bi(pergunta.rotulo_i18n, pergunta.rotulo));
      const vazia = el("option", null, t("pergunta.escolher"));
      vazia.value = "";
      sel.appendChild(vazia);
      for (const o of opcoes) {
        // O nome na língua da interface E o id na mesma linha: é o id que o
        // payload grava, e escondê-lo no seletor esconderia justamente a parte
        // que casa com o banco de prompts.
        const op = el("option", null, bi(o.rotulo_i18n, o.rotulo) + " · " + o.id);
        op.value = o.id;
        sel.appendChild(op);
      }
      sel.value = valor;
      sel.addEventListener("change", () => {
        form.respostas = { ...(form.respostas || {}) };
        form.respostas[id] = sel.value;
        c0.aoMudar();
      });
      juntar(bloco, rotulo, sel);
      // A descrição não cabe num placeholder (select não tem): vira a linha de
      // apoio embaixo, que é onde mora o "se nada servir, use 'outro'".
      if (desc) bloco.appendChild(el("div", "pergunta-desc", desc));
      if (c0.motivos) bloco.appendChild(c0.motivos("respostas." + id));
      caixa.appendChild(bloco);
      continue;
    }
    const area = el("textarea");
    area.rows = 2;
    area.value = valor;
    if (desc) area.placeholder = desc;
    area.setAttribute("aria-label", bi(pergunta.rotulo_i18n, pergunta.rotulo));
    area.addEventListener("input", () => {
      form.respostas = { ...(form.respostas || {}) };
      form.respostas[id] = area.value;
      c0.aoDigitar();
    });
    juntar(bloco, rotulo, area, dicaLinguaMeta("lingua.meta"));
    if (c0.motivos) bloco.appendChild(c0.motivos("respostas." + id));
    caixa.appendChild(bloco);
  }
  return caixa;
}

function wsAvaliar(env, ctx) {
  const c0 = ctx || ctxEdicao();
  const form = c0.form;
  const caixa = el("div");
  const resposta = env.respostas[0];
  if (resposta) {
    // "A"/"B", e não `modelo-a`: o rótulo é CEGO, e o identificador da coluna
    // não diz nada a quem avalia — só vaza o formato interno para a tela.
    caixa.appendChild(separador(blocoResposta(
      t("ws.resposta_em_avaliacao", { rotulo: rotuloCego(resposta.rotulo) }), resposta.texto)));
  }

  const bloco = separador(el("div", "painel-corpo"));
  if (!env.rubrica || !resposta) {
    bloco.appendChild(semMaterial(
      !resposta ? t("ws.sem_resposta_titulo") : t("ws.sem_rubrica_titulo"),
      t("ws.sem_material_linha")));
    caixa.appendChild(bloco);
    return caixa;
  }
  // A rubrica de fixture vem com as duas línguas (`titulo_i18n`); a escrita por
  // um anotador vem com uma só, e é isso mesmo — ela é dado, não cromo.
  juntar(bloco, el("div", "rotulo-bloco",
    t("ws.rubrica", { titulo: bi(env.rubrica.titulo_i18n, env.rubrica.titulo) })));
  // AS PERGUNTAS DO INSTRUMENTO vêm antes da matriz, porque é a ordem do
  // trabalho que o brief declara: primeiro dizer o que a pessoa queria obter,
  // depois julgar o quanto a resposta serve a isso.
  const perguntas = caixasDePergunta(env, c0);
  if (perguntas) bloco.appendChild(perguntas);
  // Matriz à esquerda, rail à direita — `.com-guia` já é este grid e já colapsa
  // em 900px. Abaixo disso o rail desce, e a adjacência que justifica o desenho
  // é a primeira coisa que se perde: é o preço de uma ferramenta de trabalho de
  // desktop, e ele é declarado em vez de fingido.
  const colunas = el("div", "com-guia");
  const railBloco = railDeAvaliacao(env.rubrica.criterios, c0);
  juntar(colunas, matrizDeCriterios(env.rubrica.criterios, c0, {}), railBloco);
  bloco.appendChild(colunas);

  if (!c0.leitura || (form.comentario_geral || "").trim()) {
    const geral = el("div", "campo espaco-acima-2");
    const areaGeral = el("textarea");
    areaGeral.rows = 3;
    areaGeral.placeholder = t("ws.comentario_geral_ph");
    areaGeral.setAttribute("aria-label", t("ws.comentario_geral"));
    areaGeral.value = form.comentario_geral;
    if (c0.leitura) areaGeral.readOnly = true;
    else areaGeral.addEventListener("input", () => { form.comentario_geral = areaGeral.value; c0.aoDigitar(); });
    juntar(geral, el("span", null, t("ws.comentario_geral")), areaGeral);
    if (!c0.leitura) geral.appendChild(dicaLinguaMeta("lingua.meta"));
    if (c0.motivos) geral.appendChild(c0.motivos("comentario_geral"));
    // A SÍNTESE MORA NO RAIL, encostada no que ela tem de sintetizar. Era o
    // último campo da página — a distância física entre os ratings e o texto
    // que os explica era a dor nº 2 inteira.
    railBloco.appendChild(geral);
  }

  caixa.appendChild(bloco);
  return caixa;
}

/** Grada um critério DENTRO de um contexto. O anotador e o revisor graduam a
    mesma rubrica, em formulários diferentes — e é o contexto que diz qual. */
function graduarEm(c0, i, valor) {
  c0.form.notas[i] = valor;
  c0.aoMudar();
}

/** O atalho de quem anota (o teclado 1..9 chama por aqui). */
function graduar(i, valor) { graduarEm(ctxEdicao(), i, valor); }

/* ==========================================================================
   5.4 ESCREVER RUBRICA
   Três modelos de partida, COLAPSADOS. Matar a página em branco é a maior
   redução de fricção desta aba — e um modelo aberto por padrão viraria a
   rubrica de todo mundo.
   ========================================================================== */

/* OS MODELOS SAÍRAM DAQUI (P8). Eles eram um array de literais de JavaScript, e
   isso escondia o problema: um quarto modelo exigia editar a tela. Agora vêm de
   `GET /api/modelos-rubrica`, servidos de uma fixture do pacote — e o construtor
   do admin (P5a) vai trocar a fixture por uma tabela sem que este arquivo saiba.
   Ver `annotate/rubricas_modelo.py`, inclusive para a convenção de língua: o
   CONTEÚDO é inglês nas duas línguas (metadado é o que o cliente lê), e só o
   rótulo do botão — que é cromo — vem do dicionário, por `nome_chave`. */

/** Um critério na forma canônica (`rubrica@3`) → a forma do formulário.

    São dois contratos de verdade e não uma inconsistência: `escrever_rubrica@1`
    é o que a pessoa PREENCHE (escala e pontas em campos separados), `rubrica@3`
    é o instrumento MONTADO. A conversão fica num lugar só, na direção em que ela
    é usada — a outra direção mora no servidor (`tarefas.normalizar_criterio`). */
function doModeloParaOForm(c) {
  const escala = c.escala || { min: 1, max: 5, ancoras: [] };
  const ancoras = (escala.ancoras || []).slice().sort((a, b) => a.valor - b.valor);
  const rotulo = (valor) => {
    const a = ancoras.find((x) => Number(x.valor) === valor);
    return a ? bi(a.rotulo_i18n, a.rotulo) : "";
  };
  return {
    nome: c.nome,
    descricao: c.descricao || "",
    escala_min: escala.min,
    escala_max: escala.max,
    rotulo_min: rotulo(escala.min),
    rotulo_max: rotulo(escala.max),
  };
}

function wsEscrever(env, ctx) {
  const c0 = ctx || ctxEdicao();
  const form = c0.form;
  const caixa = separador(el("div", "painel-corpo"));

  if (!c0.leitura) {
    const modelos = el("details", "modelos");
    modelos.appendChild(el("summary", null, t("ws.modelos_summary")));
    const corpoModelos = el("div", "modelos-corpo");

/* ==========================================================================
   5.6b CONVERSA COM MODELO LOCAL  (P4d)

   Duas abas, um mecanismo. A diferença entre elas cabe numa frase: na CONVERSA
   um modelo responde e o nome dele está à vista; no DUELO dois respondem sob
   rótulos cegos e o anotador escolhe com qual a conversa continua.

   O NOME DO MODELO NÃO ENTRA NO DUELO, E ISSO É ESTRUTURAL
   ========================================================
   O servidor não manda `modelo` nem `digest` nos turnos de um duelo (ver
   `conversa._dict`), e as funções que desenham o duelo nunca leem esses campos.
   São as duas metades da mesma garantia: se a tela lesse, bastaria o dia em que
   alguém "só acrescentasse o campo no envelope" para a preferência passar a ser
   sobre a marca. Quem revela é `blocoRevelacao`, e só depois do envio.

   A CONVERSA VIVE NO SERVIDOR
   ===========================
   Os turnos vêm no envelope (`env.conversa`), não do localStorage: recarregar a
   página, fechar a aba ou derrubar o servidor não custa trinta turnos. O
   rascunho guarda uma CÓPIA deles mesmo assim (`form.turnos`), porque perder
   trabalho é a maior fricção que existe e uma segunda rede não custa nada.
   ========================================================================== */

/** As chaves que o SERVIDOR escolhe para o estado do runtime.

    Numa tabela com a chave INTEIRA pelo mesmo motivo de `TIPOS`: uma chave
    montada (ou vinda crua do servidor) é invisível para o teste de chave órfã, e
    o dicionário passaria a acumular entradas mortas. Ela também é a guarda: uma
    chave que o front não conhece cai na de servidor fora do ar, em vez de
    escrever `modelos.qualquer_coisa` na tela. */
const CHAVES_RUNTIME = [
  "modelos.falhou",
  "modelos.fora_do_ar",
  "modelos.faltam",
  "modelos.pronto",
  "modelos.nenhum",
  "modelos.sem_resposta",
];
/** Uma chave desconhecida cai na genérica — que não tem marcador nenhum.

    Cair na de "servidor fora do ar" seria pior que cair em nada: ela promete
    `{url}` e, com dados de outra falha, escreve `{url}` literal na tela. Foi
    exatamente o que apareceu no navegador quando uma resposta vazia herdou a
    chave errada. */
function chaveRuntime(bruta) {
  return CHAVES_RUNTIME.indexOf(bruta) >= 0 ? bruta : CHAVES_RUNTIME[0];
}

/** O estado do runtime como a tela o mostra: o que falta e o comando que arruma.

    NÃO É UM ERRO, é uma instrução. A máquina que abre esta plataforma pode não
    ter baixado 7,5 GB ainda, e isso é normal — tratar como falha faria "falta
    baixar um arquivo" parecer "a plataforma quebrou". */
function blocoRuntime() {
  const m = (est.saude && est.saude.modelos) || null;
  if (!m) return null;
  const erro = est.erroModelo;
  const pronto = m.ok && !erro;
  const caixa = el("div", "runtime" + (pronto ? " pronto" : ""));
  const cabeca = el("div", "forma");
  juntar(cabeca,
    el("strong", null, t("runtime.titulo")),
    el("span", "crescer"),
    el("span", "fraco", t("runtime.timeout", { n: m.timeout_s })));
  caixa.appendChild(cabeca);

  const chave = erro ? chaveRuntime(erro.chave) : chaveRuntime(m.erro_chave);
  const dados = erro ? erro.dados : m.erro_dados;
  caixa.appendChild(el("p", null, t(chave, dados || {})));
  // A frase CRUA do servidor, quando houver, como `.dado`: ela vem numa língua
  // só (é a mesma que a API põe em /docs) e traz o detalhe que a chave
  // generaliza. Sem ela, uma falha imprevista viraria "não deu para gerar" e
  // nada mais — e o diagnóstico ficaria no terminal, longe de quem está vendo.
  if (erro && erro.mensagem) caixa.appendChild(el("p", "fraco dado", erro.mensagem));

  const nomes = (m.instalados || []).map((x) => x.nome);
  // `.dado`: nome de modelo e URL vêm do servidor, não do dicionário.
  caixa.appendChild(el("p", "fraco dado", t("runtime.instalados", {
    lista: nomes.length ? nomes.join(", ") : t("runtime.nenhum_instalado"),
  }) + " · " + m.url));

  const comandos = (erro && erro.comandos) || m.comandos || [];
  if (!pronto && comandos.length) {
    caixa.appendChild(el("span", "fraco", t("runtime.conserto")));
    // O comando é COMANDO: sai igual nas duas línguas e é selecionável inteiro.
    for (const c of comandos) caixa.appendChild(el("code", "comando dado", c));
  }
  const rever = el("button", "botao discreta", t("runtime.rever"));
  rever.type = "button";
  rever.addEventListener("click", reconferirModelos);
  caixa.appendChild(juntar(el("div", "forma"), rever));
  return caixa;
}

/** Reconfere o runtime sem recarregar a tela — o caminho de quem acabou de
    rodar `ollama pull` no terminal ao lado. */
async function reconferirModelos() {
  try {
    const m = await api("/api/modelos");
    if (est.saude) est.saude.modelos = m;
    est.erroModelo = null;
  } catch (e) {
    recado(t("recado.erro_modelos", { erro: e.message }), true);
  }
  desenharArea();
}

/* ---- o tempo decorrido da GERAÇÃO ----
   O único relógio à vista nesta plataforma, e ele mede a MÁQUINA. Medido: 17,6 s
   para um turno do modelo mais verboso — sem indicador, isso é indistinguível de
   um travamento. `setTimeout` recursivo, e não um intervalo: quando o nó do
   indicador sai da tela o laço se encerra sozinho, sem ninguém para limpá-lo. */
let tiqueGeracao = null;
function pararTique() { clearTimeout(tiqueGeracao); tiqueGeracao = null; }
function tiquetaque() {
  const no = $("#decorrido");
  if (!no || !est.gerando) { pararTique(); return; }
  no.textContent = t("conversa.decorrido",
    { s: Math.max(0, Math.round((Date.now() - est.gerando.desde) / 1000)) });
  tiqueGeracao = setTimeout(tiquetaque, 1000);
}

function blocoGerando() {
  const g = est.gerando;
  if (!g) return null;
  const caixa = el("div", "gerando");
  const quem = g.dois
    ? t("conversa.gerando_dois")
    : t("conversa.gerando", { modelo: g.modelo || "" });
  const decorrido = el("span", "decorrido", t("conversa.decorrido", { s: 0 }));
  decorrido.id = "decorrido";
  decorrido.title = t("conversa.decorrido_titulo");
  juntar(caixa, el("span", "ponto-gerando"), el("span", null, quem), decorrido);
  pararTique();
  tiqueGeracao = setTimeout(tiquetaque, 250);
  return caixa;
}

/** Qual modelo responde na conversa de um só: o PRIMEIRO da configuração. É a
    mesma regra do servidor (`modelos.modelos_configurados()[0]`), e aqui ela só
    serve para nomear quem está gerando. */
function modeloDaVez() {
  const m = (est.saude && est.saude.modelos) || {};
  return (m.configurados || [])[0] || "";
}

/* ---- as peças de um turno ---- */

/** A casca de um turno: cabeça (quem, quando, quanto demorou) e corpo.

    `extras` entra na cabeça — é por onde o nome do modelo aparece na CONVERSA e
    por onde ele NÃO aparece no duelo. */
function bolha(papel, texto, extras, opcoes) {
  const o = opcoes || {};
  const caixa = el("div", "turno" + (papel === "usuario" ? " eu" : "") +
    (o.marcado ? " marcado" : ""));
  const cabeca = el("div", "turno-cabeca");
  juntar(cabeca,
    el("span", "turno-quem", papel === "usuario" ? t("conversa.eu") : t("conversa.modelo")));
  for (const extra of extras || []) if (extra) cabeca.appendChild(extra);
  caixa.appendChild(cabeca);
  const corpo = el("div", "turno-corpo");
  // `.dado`: o texto do prompt e o do modelo são DADOS, na língua deles.
  corpo.appendChild(el("div", "leitura dado", texto));
  caixa.appendChild(corpo);
  return caixa;
}

/** O raciocínio do modelo, RECOLHIDO e à parte da resposta.

    Não é filtrado em silêncio: ele é conteúdo que o anotador pode querer
    avaliar, e descartá-lo seria decidir por ele que não conta. Também não é a
    resposta — por isso vem fechado, embaixo, com marcador. */
function blocoRaciocinio(turno) {
  const bruto = turno.raciocinio || "";
  if (!bruto.trim()) return null;
  const det = el("details", "raciocinio");
  det.appendChild(el("summary", null, t("conversa.raciocinio", { n: n(bruto.length) })));
  det.appendChild(el("div", "raciocinio-corpo dado", bruto));
  return det;
}

/** MARCAR UM TURNO: nota + motivo, ALI, sem modal.

    O mesmo padrão do motivo por edição do P3b, e pela mesma razão: um modal
    esconderia justamente o texto sobre o qual a nota está sendo dada. */
function marcacaoDeTurno(ordem, c0) {
  const form = c0.form;
  const atual = form.problemas[String(ordem)];
  if (c0.leitura && !atual) return null;
  if (!atual && form.marcando !== ordem) return null;

  const escala = escalaDoTurno();
  const caixa = el("div", "marca-turno");
  const linha = el("div", "forma");
  juntar(linha, el("span", "fraco", t("conversa.marca_nota")));
  for (let v = escala.min; v <= escala.max; v++) {
    const b = el("button", "nota", String(v));
    b.type = "button";
    b.setAttribute("aria-pressed", String(!!atual && atual.nota === v));
    b.setAttribute("aria-label", t("a11y.turno_nota", { n: ordem, valor: v }));
    if (c0.leitura) b.tabIndex = -1;
    else b.addEventListener("click", () => { marcarTurno(c0, ordem, v, null); });
    linha.appendChild(b);
  }
  caixa.appendChild(linha);

  const campo = el("div", "campo");
  const area = el("textarea");
  area.rows = 2;
  area.placeholder = t("conversa.marca_motivo_ph");
  area.setAttribute("aria-label", t("conversa.marca_motivo"));
  area.value = (atual && atual.motivo) || "";
  if (c0.leitura) area.readOnly = true;
  else area.addEventListener("input", () => {
    marcarTurno(c0, ordem, undefined, area.value, true);
  });
  juntar(campo, el("span", null, t("conversa.marca_motivo")), area);
  if (!c0.leitura) campo.appendChild(dicaLinguaMeta("lingua.meta"));
  caixa.appendChild(campo);

  if (!c0.leitura) {
    const tirar = el("button", "botao discreta", t("conversa.marca_remover"));
    tirar.type = "button";
    tirar.addEventListener("click", () => {
      delete form.problemas[String(ordem)];
      form.marcando = null;
      c0.aoMudar();
    });
    caixa.appendChild(juntar(el("div", "forma"), tirar));
  }
  return caixa;
}

/** A escala da marcação, LIDA DO SERVIDOR — nunca uma cópia no JS, pela mesma
    razão dos `limites`: uma cópia divergiria do 422 na primeira vez que ela
    mudasse, e o botão prometeria o que o servidor desmente. */
function escalaDoTurno() {
  const m = (est.saude && est.saude.modelos) || {};
  const e = m.escala_turno || {};
  return { min: Number(e.min) || 1, max: Number(e.max) || 5 };
}

function marcarTurno(c0, ordem, nota, motivo, soDigitou) {
  const chave = String(ordem);
  const atual = c0.form.problemas[chave] || { nota: escalaDoTurno().min, motivo: "" };
  if (nota !== undefined && nota !== null) atual.nota = nota;
  if (motivo !== undefined && motivo !== null) atual.motivo = motivo;
  c0.form.problemas[chave] = atual;
  c0.form.marcando = ordem;
  // Digitar não redesenha (tiraria o foco do campo no meio da frase); mudar a
  // nota sim, porque o botão pressionado precisa mudar de cor.
  if (soDigitou) c0.aoDigitar(); else c0.aoMudar();
}

/** O botão que abre a marcação de um turno. Fora da bolha para não competir com
    o texto — a leitura vem primeiro, a marcação é a exceção. */
function botaoMarcar(ordem, c0) {
  if (c0.leitura) return null;
  const marcado = !!c0.form.problemas[String(ordem)];
  const b = el("button", "turno-acao", marcado ? t("conversa.marcado") : t("conversa.marcar"));
  b.type = "button";
  b.addEventListener("click", () => {
    c0.form.marcando = c0.form.marcando === ordem ? null : ordem;
    if (c0.form.marcando === ordem && !marcado) marcarTurno(c0, ordem, null, "");
    else c0.aoMudar();
  });
  return b;
}

/** Os turnos que a tela desenha: os do SERVIDOR quando existem, o espelho do
    rascunho quando não (leitura de uma anotação já enviada, ou uma rede que
    caiu no meio). */
function turnosDe(env, c0) {
  const doServidor = (env.conversa && env.conversa.turnos) || null;
  if (doServidor && doServidor.length) {
    // O rascunho guarda a conversa INTEIRA, e não só o formulário: é a segunda
    // rede sob os trinta turnos.
    c0.form.turnos = doServidor;
    return doServidor;
  }
  return c0.form.turnos || [];
}

function selo(texto) { return el("span", "selo", texto); }

/* ---- CONVERSA: um modelo, nome à vista ---- */

function fluxoConversa(env, c0) {
  const caixa = el("div", "conversa");
  caixa.setAttribute("aria-label", t("a11y.conversa"));
  for (const turno of turnosDe(env, c0)) {
    const extras = [selo(t("conversa.turno_n", { n: turno.ordem }))];
    if (turno.papel === "modelo") {
      // Na conversa de um modelo só NÃO há preferência a enviesar, e saber com
      // quem se fala é o que permite dizer "esta família faz isto".
      if (turno.modelo) extras.push(el("span", "selo dado", turno.modelo));
      extras.push(selo(t("conversa.duracao", { s: Math.round(turno.duracao_ms / 1000) })));
      if (turno.truncado) extras.push(selo(t("conversa.truncado")));
    }
    extras.push(el("span", "crescer"), botaoMarcar(turno.ordem, c0));
    const bola = bolha(turno.papel, turno.texto, extras,
      { marcado: !!c0.form.problemas[String(turno.ordem)] });
    const raciocinio = blocoRaciocinio(turno);
    if (raciocinio) bola.appendChild(raciocinio);
    const marca = marcacaoDeTurno(turno.ordem, c0);
    if (marca) bola.appendChild(marca);
    caixa.appendChild(bola);
  }
  return caixa;
}

/* ---- DUELO: dois modelos, rótulo cego ----
   NENHUMA das duas funções abaixo lê `modelo` ou `digest` de um turno. Ver o
   cabeçalho desta seção: é metade da garantia de que o rótulo é cego de verdade,
   e a outra metade é o servidor não mandar os campos. */

function fluxoDuelo(env, c0) {
  const caixa = el("div", "conversa");
  caixa.setAttribute("aria-label", t("a11y.conversa"));
  const turnos = turnosDe(env, c0);
  const porOrdem = {};
  for (const turno of turnos) {
    (porOrdem[turno.ordem] = porOrdem[turno.ordem] || []).push(turno);
  }
  const ordens = Object.keys(porOrdem).map(Number).sort((a, b) => a - b);
  const pendente = env.conversa ? env.conversa.rodada_pendente : null;

  for (const ordem of ordens) {
    const grupo = porOrdem[ordem];
    if (grupo[0].papel === "usuario") {
      const extras = [selo(t("conversa.turno_n", { n: ordem })), el("span", "crescer"),
        botaoMarcar(ordem, c0)];
      const bola = bolha("usuario", grupo[0].texto, extras,
        { marcado: !!c0.form.problemas[String(ordem)] });
      const marca = marcacaoDeTurno(ordem, c0);
      if (marca) bola.appendChild(marca);
      caixa.appendChild(bola);
      continue;
    }
    caixa.appendChild(rodadaDuelo(ordem, grupo, c0, ordem === pendente));
  }
  return caixa;
}

/** Uma rodada: duas colunas cegas, rolagem sincronizada, e a escolha embaixo. */
function rodadaDuelo(ordem, respostas, c0, pendente) {
  const caixa = el("div", "rodada");
  const cabeca = el("div", "forma");
  juntar(cabeca,
    el("span", "rotulo-bloco", t("duelo.rodada", { n: ordem })),
    el("span", "crescer"),
    botaoMarcar(ordem, c0));
  caixa.appendChild(cabeca);

  const grade = el("div", "ab");
  const areas = [];
  const vencedora = respostas.find((r) => r.escolhida);
  respostas.slice().sort((a, b) => (a.rotulo < b.rotulo ? -1 : 1)).forEach((r, i) => {
    const escolhivel = pendente && !c0.leitura;
    const coluna = el("button", "ab-coluna");
    coluna.type = "button";
    coluna.setAttribute("aria-pressed", String(!!r.escolhida));
    const cab = el("div", "ab-cabeca");
    juntar(cab,
      el("strong", null, r.rotulo),
      el("span", "fraco", t("duelo.lado")),
      el("span", "crescer"),
      r.truncado ? selo(t("conversa.truncado")) : null,
      selo(t("conversa.duracao", { s: Math.round(r.duracao_ms / 1000) })),
      el("span", "atalho", escolhivel ? (i === 0 ? "←" : "→")
        : (r.escolhida ? t("duelo.vencedora", { lado: r.rotulo }) : "")));
    const texto = el("div", "ab-texto");
    texto.appendChild(el("div", "leitura dado", r.texto));
    juntar(coluna, cab, texto);
    if (!escolhivel) coluna.tabIndex = -1;
    else coluna.addEventListener("click", () => escolherLado(r.rotulo));
    const raciocinio = blocoRaciocinio(r);
    if (raciocinio) coluna.appendChild(raciocinio);
    areas.push(texto);
    grade.appendChild(coluna);
  });
  caixa.appendChild(grade);
  sincronizarRolagem(areas);

  const marca = marcacaoDeTurno(ordem, c0);
  if (marca) caixa.appendChild(marca);

  if (pendente && !c0.leitura) caixa.appendChild(caixaDeEscolha(ordem, c0));
  else if (vencedora && vencedora.justificativa) {
    caixa.appendChild(el("p", "rodada-nota dado", vencedora.justificativa));
  }
  return caixa;
}

/** A escolha da rodada: um motivo POR RODADA, e ele é obrigatório.

    Por rodada e não uma no fim porque é isso que torna o dado multi-turno mais
    valioso que o de turno único: "escolhi B na rodada 1 pela concisão e A na 3
    porque B esqueceu a restrição" são dois sinais, e uma justificativa única os
    fundiria num só. */
function caixaDeEscolha(ordem, c0) {
  const minimo = lim("min_chars_justificativa", 30);
  const caixa = el("div", "duelo-escolha");
  juntar(caixa, el("span", "rotulo-bloco", t("duelo.escolher")));
  caixa.appendChild(el("p", "fraco", t("duelo.oculto")));

  const campo = el("div", "campo");
  const area = el("textarea");
  area.rows = 3;
  area.placeholder = t("duelo.por_que_ph");
  area.setAttribute("aria-label", t("duelo.por_que"));
  area.value = c0.form.escolha || "";
  area.addEventListener("input", () => {
    c0.form.escolha = area.value;
    c0.aoDigitar();
    atualizarBotoesDaConversa();
  });
  juntar(campo, el("span", null, t("duelo.por_que")), area);
  campo.appendChild(dicaLinguaMeta("lingua.meta"));
  caixa.appendChild(campo);

  const botoes = el("div", "forma");
  for (const lado of ["A", "B"]) {
    const b = el("button", "botao primaria escolher-lado",
      t("duelo.continuar", { lado: lado }));
    b.type = "button";
    b.disabled = (c0.form.escolha || "").trim().length < minimo || est.carregando;
    b.addEventListener("click", () => escolherLado(lado));
    botoes.appendChild(b);
  }
  juntar(botoes, el("span", "atalho", "←"), el("span", "atalho", "→"),
    el("span", "fraco", t("ws.contador_de", {
      n: n((c0.form.escolha || "").trim().length), min: minimo,
    })));
  caixa.appendChild(botoes);
  return caixa;
}

/* ---- o compositor e o encerramento ---- */

function compositor(env) {
  const conversa = env.conversa || {};
  const caixa = el("div", "compositor");

  if (conversa.rodada_pendente !== null && conversa.rodada_pendente !== undefined) {
    // Sem vencedora não se sabe com qual resposta a conversa continua — e
    // inventar a continuação seria fabricar uma escolha que ninguém fez.
    caixa.appendChild(el("p", "fraco", t("duelo.escolher")));
    return caixa;
  }

  if (conversa.aguardando !== null && conversa.aguardando !== undefined) {
    const aviso = el("div", "aviso-rascunho");
    juntar(aviso,
      el("span", null, t("conversa.falhou") + " " + t("conversa.falhou_linha")));
    const tentar = el("button", "botao primaria", t("conversa.tentar"));
    tentar.type = "button";
    tentar.disabled = !!est.gerando;
    tentar.addEventListener("click", () => mandarTurno(null));
    aviso.appendChild(tentar);
    caixa.appendChild(aviso);
    return caixa;
  }

  const cheio = conversa.n_turnos >= conversa.max_turnos;
  if (cheio) {
    caixa.appendChild(el("p", "fraco", t("conversa.teto_cheio", { max: conversa.max_turnos })));
    return caixa;
  }

  const area = el("textarea");
  area.rows = 4;
  area.id = "compositor";
  const primeiro = !(conversa.turnos || []).length;
  area.placeholder = primeiro ? t("conversa.primeiro_ph") : t("conversa.enviar_ph");
  // O compositor não tem rótulo visível — a instrução É o placeholder, e um
  // placeholder some ao primeiro caractere. O nome acessível repete o mesmo
  // texto, que é o que faz ele sobreviver ao primeiro caractere.
  area.setAttribute("aria-label", area.placeholder);
  area.value = est.form.rascunho || "";
  area.disabled = !!est.gerando;
  area.addEventListener("input", () => {
    est.form.rascunho = area.value;
    salvarRascunho();
    // SÓ o botão, sem redesenhar: um redesenho a cada tecla tiraria o foco do
    // campo no meio da frase — o mesmo motivo de `atualizarBotaoEnviar`.
    atualizarBotoesDaConversa();
  });
  caixa.appendChild(area);
  // A CONVERSA É DADO: ela sai na língua do prompt, não na da interface. É a
  // mesma convenção da resposta de referência, e ela é dita aqui porque é aqui
  // que a dúvida ocorre.
  caixa.appendChild(dicaLinguaDado(env.prompt.lang));

  const linha = el("div", "forma");
  const mandar = el("button", "botao primaria", t("conversa.enviar"));
  mandar.type = "button";
  mandar.id = "mandar-turno";
  mandar.disabled = !!est.gerando || !(est.form.rascunho || "").trim();
  mandar.addEventListener("click", () => mandarTurno((est.form.rascunho || "").trim()));
  juntar(linha, mandar, el("span", "atalho", "Ctrl+Enter"),
    el("span", "crescer"),
    el("span", "fraco", t("conversa.teto", {
      n: conversa.n_turnos, max: conversa.max_turnos,
    })));
  caixa.appendChild(linha);
  return caixa;
}

/** Reabilita os botões que dependem do que está sendo DIGITADO, sem redesenhar.

    Existe pelo mesmo motivo de `atualizarBotaoEnviar`, e o defeito que ele
    conserta apareceu no navegador: o botão de mandar o turno nasce desabilitado
    (o compositor está vazio), e sem isto ele continuava desabilitado **enquanto
    a pessoa digitava** — a aba inteira parecia travada depois do primeiro turno.
    Redesenhar a cada tecla não serve: tiraria o foco do campo no meio da frase. */
function atualizarBotoesDaConversa() {
  if (!est.form) return;
  const mandar = $("#mandar-turno");
  if (mandar) mandar.disabled = !!est.gerando || !(est.form.rascunho || "").trim();
  const minimo = lim("min_chars_justificativa", 30);
  const podeEscolher = (est.form.escolha || "").trim().length >= minimo && !est.carregando;
  for (const b of document.querySelectorAll(".escolher-lado")) b.disabled = !podeEscolher;
}

/** O botão que ENCERRA e revela a rubrica. Divulgação progressiva levada a
    sério: enquanto se conversa, a rubrica não existe na tela — ela é a decisão
    do fim, e mostrá-la antes competiria com a conversa que está acontecendo. */
function barraEncerrar(env) {
  const conversa = env.conversa || {};
  const linha = el("div", "forma espaco-acima-2");
  const b = el("button", "botao", t("conversa.encerrar"));
  b.type = "button";
  b.disabled = !conversa.avaliavel;
  b.addEventListener("click", encerrarConversa);
  juntar(linha, b, el("span", "atalho", t("conversa.encerrar_atalho")));
  if (!conversa.avaliavel) linha.appendChild(el("span", "fraco", t("falta.sem_turno")));
  return linha;
}

function encerrarConversa() {
  if (!est.form || est.form.encerrada) return;
  est.form.encerrada = true;
  salvarEDesenhar();
  recado(t("recado.conversa_encerrada"));
}

/** A avaliação: a rubrica multi-turno + os turnos marcados + a geral.

    A rubrica é a MESMA de `wsAvaliar` no desenho, e de propósito — quem já
    graduou uma rubrica nesta plataforma reconhece o controle em vez de aprender
    outro. O que muda é o objeto: aqui ela fala da conversa inteira. */
function avaliacaoDaConversa(env, c0) {
  const form = c0.form;
  const caixa = separador(el("div", "painel-corpo"));
  const cabeca = el("div", "forma");
  juntar(cabeca,
    el("h3", null, t("conversa.rubrica_titulo")),
    el("span", "crescer"),
    el("span", "fraco", t("conversa.problemas_n", {
      n: Object.keys(form.problemas || {}).length,
    })));
  caixa.appendChild(cabeca);
  if (!c0.leitura) {
    const voltar = el("button", "botao discreta", t("conversa.reabrir"));
    voltar.type = "button";
    voltar.addEventListener("click", () => { form.encerrada = false; salvarEDesenhar(); });
    cabeca.appendChild(voltar);
  }
  caixa.appendChild(el("p", "fraco", t("ws.rubrica_multiturno")));

  // A MESMA matriz do `avaliar_rubrica`. Era um laço quase verbatim até o P8, e
  // mudar a rubrica exigia mexer nos dois lugares.
  const rubrica = env.rubrica || { criterios: [] };
  caixa.appendChild(matrizDeCriterios(rubrica.criterios, c0, {}));

  const minimo = lim("min_chars_justificativa", 30);
  const campo = el("div", "campo espaco-acima-3");
  const area = el("textarea");
  area.rows = 4;
  area.placeholder = t("conversa.geral_ph");
  area.setAttribute("aria-label", t("conversa.geral"));
  area.value = form.justificativa;
  if (c0.leitura) area.readOnly = true;
  else area.addEventListener("input", () => {
    form.justificativa = area.value;
    contador.textContent = t("ws.contador_de", {
      n: n(area.value.trim().length), min: minimo,
    });
    c0.aoDigitar();
  });
  juntar(campo, el("span", null, t("conversa.geral")), area);
  const contador = el("div", "contador", t("ws.contador_de", {
    n: n((form.justificativa || "").trim().length), min: minimo,
  }));
  campo.appendChild(contador);
  if (!c0.leitura) campo.appendChild(dicaLinguaMeta("lingua.meta"));
  if (c0.motivos) campo.appendChild(c0.motivos("justificativa"));
  caixa.appendChild(campo);
  return caixa;
}

function wsConversa(env, ctx) {
  const c0 = ctx || ctxEdicao();
  const caixa = el("div");
  const bloco = separador(el("div", "painel-corpo"));
  const runtime = c0.leitura ? null : blocoRuntime();
  if (runtime) bloco.appendChild(runtime);

  const turnos = turnosDe(env, c0);
  if (!turnos.length) {
    juntar(bloco,
      el("div", "vazio-titulo", t("conversa.vazia")),
      el("p", "vazio-linha", t("conversa.vazia_linha")));
  } else {
    bloco.appendChild(el("p", "fraco", t("conversa.marcar_dica")));
    bloco.appendChild(fluxoConversa(env, c0));
  }
  const gerando = c0.leitura ? null : blocoGerando();
  if (gerando) bloco.appendChild(gerando);
  if (!c0.leitura && !c0.form.encerrada) {
    bloco.appendChild(compositor(env));
    bloco.appendChild(barraEncerrar(env));
  }
  caixa.appendChild(bloco);
  if (c0.leitura || c0.form.encerrada) caixa.appendChild(avaliacaoDaConversa(env, c0));
  return caixa;
}

function wsDuelo(env, ctx) {
  const c0 = ctx || ctxEdicao();
  const caixa = el("div");
  const bloco = separador(el("div", "painel-corpo"));
  const runtime = c0.leitura ? null : blocoRuntime();
  if (runtime) bloco.appendChild(runtime);

  const turnos = turnosDe(env, c0);
  if (!turnos.length) {
    juntar(bloco,
      el("div", "vazio-titulo", t("conversa.vazia")),
      el("p", "vazio-linha", t("conversa.vazia_linha")),
      el("p", "fraco", t("duelo.oculto")));
  } else {
    bloco.appendChild(el("p", "fraco", t("conversa.marcar_dica")));
    bloco.appendChild(fluxoDuelo(env, c0));
  }
  const gerando = c0.leitura ? null : blocoGerando();
  if (gerando) bloco.appendChild(gerando);
  if (!c0.leitura && !c0.form.encerrada) {
    bloco.appendChild(compositor(env));
    bloco.appendChild(barraEncerrar(env));
  }
  caixa.appendChild(bloco);
  if (c0.leitura || c0.form.encerrada) {
    caixa.appendChild(avaliacaoDaConversa(env, c0));
    // QUEM ERA QUEM, e só aqui: em modo leitura a avaliação já foi enviada, e
    // esconder a partir daí seria esconder por esconder.
    const revelacao = blocoRevelacao(c0.form.rodadas || []);
    if (revelacao) caixa.appendChild(revelacao);
  }
  return caixa;
}

/** A REVELAÇÃO. Função à parte de `wsDuelo` de propósito: é a ÚNICA do caminho
    do duelo que lê o nome do modelo, e mantê-la separada é o que permite provar
    — lendo o arquivo — que o desenho do duelo não o lê nunca. */
function blocoRevelacao(rodadas) {
  if (!rodadas.length) return null;
  const caixa = separador(el("div", "painel-corpo"));
  juntar(caixa,
    el("div", "rotulo-bloco", t("duelo.revelacao_titulo")),
    el("p", "fraco", t("duelo.revelado")));
  const lista = el("div", "revelacao");
  for (const rodada of rodadas) {
    for (const r of rodada.respostas || []) {
      const linha = el("div", "revelacao-linha");
      // O nome do modelo é DADO: vem do servidor e sai como está.
      juntar(linha,
        el("span", "dado", t("duelo.revelacao_linha", {
          n: rodada.ordem, lado: r.rotulo, modelo: r.modelo,
        })),
        el("span", "crescer"),
        r.rotulo === rodada.vencedora
          ? el("span", "etiqueta aprovado", t("duelo.vencedora", { lado: r.rotulo }))
          : null);
      lista.appendChild(linha);
    }
  }
  caixa.appendChild(lista);
  return caixa;
}

/* ---- as chamadas ---- */

/** Manda um turno (ou repete o que ficou sem resposta) e redesenha.

    O turno do humano é gravado pelo SERVIDOR antes de ele chamar o modelo, então
    um erro aqui nunca custa o que a pessoa escreveu — o 503 volta com a conversa
    como ela ficou, e a tela oferece "tentar de novo". */
async function mandarTurno(texto) {
  if (!est.envelope || est.gerando) return;
  const env = est.envelope;
  const duelo = env.tarefa.tipo === "duelo_modelos";
  est.gerando = { desde: Date.now(), dois: duelo, modelo: modeloDaVez() };
  est.erroModelo = null;
  desenharArea();
  try {
    const r = await postar("/api/conversa/" + env.atribuicao_id + "/turno", {
      anotador_id: est.persona.id,
      texto: texto,
    });
    env.conversa = r.conversa;
    if (texto) est.form.rascunho = "";
  } catch (e) {
    // O 503 da inferência traz a conversa junto: nada se perde, e a tela sabe
    // dizer o que falta (modelo não baixado, servidor fora do ar).
    const d = e.corpo && e.corpo.detail;
    if (d && typeof d === "object" && d.chave) {
      est.erroModelo = {
        chave: d.chave,
        dados: d.dados || {},
        mensagem: d.mensagem || "",
        comandos: (d.dados || {}).comandos,
      };
      if (d.conversa) env.conversa = d.conversa;
    } else {
      recado(e.message, true);
    }
  } finally {
    est.gerando = null;
    pararTique();
  }
  salvarRascunho();
  desenharArea();
}

/** Escolhe a vencedora da rodada aberta — e a conversa continua com ela. */
async function escolherLado(lado) {
  if (!est.envelope || est.carregando || est.gerando) return;
  const env = est.envelope;
  const pendente = env.conversa && env.conversa.rodada_pendente;
  if (pendente === null || pendente === undefined) return;
  const motivo = (est.form.escolha || "").trim();
  if (motivo.length < lim("min_chars_justificativa", 30)) return;
  est.carregando = true;
  desenharArea();
  try {
    const r = await postar("/api/conversa/" + env.atribuicao_id + "/escolher", {
      anotador_id: est.persona.id,
      ordem: pendente,
      rotulo: lado,
      justificativa: motivo,
    });
    env.conversa = r.conversa;
    est.form.escolha = "";
    recado(t("recado.escolha_registrada"));
  } catch (e) {
    recado(e.message, true);
  } finally {
    est.carregando = false;
  }
  salvarRascunho();
  desenharArea();
}

/** Escolhe (ou desmarca) um lado do A/B DENTRO de um contexto. */
function escolherABEm(c0, rotulo) {
  c0.form.preferencia = c0.form.preferencia === rotulo ? null : rotulo;
  c0.aoMudar();
}

/** O atalho de quem anota (as setas do teclado chamam por aqui). */
function escolherAB(rotulo) { escolherABEm(ctxEdicao(), rotulo); }

/** Rolagem sincronizada por PROPORÇÃO, não por pixel: as duas respostas quase
    nunca têm a mesma altura, e casar o scrollTop cru descasa os textos na
    primeira rolagem. */
function sincronizarRolagem(areas) {
  if (areas.length !== 2) return;
  let ecoando = false;
  areas.forEach((area, i) => {
    area.addEventListener("scroll", () => {
      if (ecoando) return;
      ecoando = true;
      const outro = areas[1 - i];
      const meu = Math.max(1, area.scrollHeight - area.clientHeight);
      const dele = Math.max(0, outro.scrollHeight - outro.clientHeight);
      outro.scrollTop = (area.scrollTop / meu) * dele;
      // rAF, e não um timeout: o navegador dispara o scroll do outro lado no
      // mesmo quadro, e liberar antes disso reabre o laço.
      requestAnimationFrame(() => { ecoando = false; });
    });
  });
}

/* ==========================================================================
   5.7 FORMULÁRIO: estado inicial, o que falta, rascunho e envio
   ========================================================================== */

function formInicial(env) {
  return formDoPayload(env, env.versao_anterior && env.versao_anterior.payload);
}

/** Os campos que a matriz escreve, um array por dimensão, POSICIONAIS na rubrica.

    Arrays irmãos e planos, e não uma lista de objetos, pela mesma razão de
    sempre neste arquivo: `form.notas` já era assim, e o teclado, o rascunho, o
    `montarPayload` e o diff do Rate and Review todos o leem por índice. Um
    formato novo aqui obrigaria a mexer nos quatro. */
function camposDaMatriz(criterios) {
  return {
    notas: criterios.map(() => null),
    justificativas: criterios.map(() => null),
    na: criterios.map(() => false),
    motivosNa: criterios.map(() => ""),
    issues: criterios.map(() => ({})),
    trechos: criterios.map(() => ""),
    difusos: criterios.map(() => false),
  };
}

/** Repõe o que foi submetido, casado por NOME de critério — nunca por posição.

    A rubrica pode ter ganhado um critério entre a submissão e a leitura, e casar
    por índice faria a nota do critério 3 reaparecer no critério 4 sem que nada
    avisasse. É a mesma disciplina que o checklist do SFT já usa. */
function restaurarMatriz(form, criterios, notas) {
  criterios.forEach((c, i) => {
    const achado = notas.find((x) => x.criterio === c.nome);
    if (!achado) return;
    form.notas[i] = achado.nota === undefined ? null : achado.nota;
    if (achado.justificativa) form.justificativas[i] = achado.justificativa;
    form.na[i] = !!achado.nao_aplicavel;
    form.motivosNa[i] = achado.motivo_na || "";
    form.issues[i] = { ...(achado.tipos_issue || {}) };
    form.trechos[i] = achado.trecho || "";
    form.difusos[i] = !!achado.trecho_difuso;
  });
}

/** O estado do formulário a partir de um payload — o mesmo mapa para os dois
    leitores: o anotador repopulando uma devolvida e o revisor lendo a
    submissão na triagem. Um segundo mapa de leitura divergiria do primeiro
    exatamente onde importa (a ordem dos critérios). */
function formDoPayload(env, anterior) {
  const tipo = env.tarefa.tipo;
  if (tipo === "avaliar_rubrica") {
    const criterios = (env.rubrica && env.rubrica.criterios) || [];
    const form = camposDaMatriz(criterios);
    form.comentario_geral = "";
    // As respostas às perguntas do instrumento: um mapa {id: texto}, casado por
    // ID como as notas casam por nome — a rubrica pode ter ganhado uma pergunta
    // entre a submissão e a leitura.
    form.respostas = {};
    for (const pergunta of perguntasDe(env)) {
      form.respostas[pergunta.id] =
        (anterior && anterior.respostas && anterior.respostas[pergunta.id]) || "";
    }
    // RECONHECIMENTO EM VEZ DE MEMÓRIA: no re-trabalho o formulário volta
    // preenchido com o que a pessoa escreveu.
    if (anterior && anterior.notas) {
      restaurarMatriz(form, criterios, anterior.notas);
      form.comentario_geral = anterior.comentario_geral || "";
    }
    return form;
  }
  if (tipo === "escrever_rubrica") {
    if (anterior && anterior.criterios) {
      return { titulo: anterior.titulo || "", criterios: anterior.criterios.map((c) => ({ ...c })) };
    }
    return { titulo: "", criterios: [] };
  }
  if (tipo === "sft_resposta") {
    const criterios = (env.rubrica && env.rubrica.criterios) || [];
    // O CHECKLIST volta do payload, casado por NOME de critério — como as notas
    // do avaliar_rubrica. Até o P3b ele voltava sempre todo desmarcado: a
    // triagem mostrava "nada marcado" para quem tinha marcado tudo, e o Rate
    // and Review acusaria como mudança do revisor uma caixa que o anotador já
    // havia marcado. É a mesma casada por nome, e pelo mesmo motivo: a rubrica
    // pode ter ganhado um critério entre a submissão e a leitura.
    const marcados = (anterior && anterior.checklist) || [];
    return {
      resposta: (anterior && anterior.resposta) || "",
      checklist: criterios.map((c) => {
        const achado = marcados.find((x) => x.criterio === c.nome);
        return achado ? !!achado.atendido : false;
      }),
    };
  }
  if (ehConversa(tipo)) {
    // A rubrica das duas abas de conversa é a da PLATAFORMA, e ela vem sempre no
    // envelope — as notas são posicionais nela, como no `avaliar_rubrica`.
    const criterios = (env.rubrica && env.rubrica.criterios) || [];
    const problemas = {};
    for (const p of (anterior && anterior.turnos_problematicos) || []) {
      problemas[String(p.ordem)] = { nota: p.nota, motivo: p.motivo || "" };
    }
    const form = {
      // Os mesmos campos da matriz do `avaliar_rubrica`, e pela mesma razão de
      // o desenhador ser um só: a rubrica multi-turno é uma rubrica.
      ...camposDaMatriz(criterios),
      // Fechada quando se está LENDO uma anotação já enviada: a conversa acabou,
      // e a rubrica é o que o revisor veio ver.
      encerrada: !!anterior,
      // A conversa em si. Do payload na leitura; do envelope (e do rascunho)
      // enquanto ela está acontecendo — ver `turnosDe`.
      turnos: (anterior && anterior.turnos) || [],
      rodadas: (anterior && anterior.rodadas) || [],
      problemas: problemas,
      marcando: null,
      justificativa: (anterior && anterior.justificativa) || "",
      // O PRIMEIRO TURNO JÁ VEM ESCRITO: é o prompt da tarefa, e ele é
      // EDITÁVEL. Uma caixa em branco sobre um prompt que está logo acima
      // obrigaria a pessoa a copiá-lo à mão para começar — e um prompt de
      // sistema escondido faria a avaliação medir o nosso prompt, não o modelo.
      // O tamanho é o do pool (`pool_fallback_max_chars`), então não há parede.
      rascunho: !anterior && !((env.conversa && env.conversa.turnos) || []).length
        ? env.prompt.text : "",
      // O motivo da rodada aberta. Mora no FORM (e não no DOM) porque o rascunho
      // é por atribuição e porque trocar de idioma redesenha a tela a partir de
      // `est` — o que só existisse no DOM sumiria.
      escolha: "",
    };
    if (anterior && anterior.notas) restaurarMatriz(form, criterios, anterior.notas);
    return form;
  }
  return {
    preferencia: (anterior && anterior.preferencia) || null,
    justificativa: (anterior && anterior.justificativa) || "",
  };
}

/** O QUE FALTA, em uma frase — ou `null` quando dá para enviar.

    É esta função que vira o rótulo do botão. Ela usa os MESMOS limites do
    servidor (lidos do /api/health), então o botão e o 422 nunca discordam. */
function oQueFalta() {
  const env = est.envelope;
  if (!env || !est.form) return t("falta.nada");
  const tipo = env.tarefa.tipo;

  if (tipo === "avaliar_rubrica") {
    if (!env.rubrica) return t("falta.sem_rubrica");
    // As perguntas vêm primeiro, na mesma ordem em que a tela as desenha e o
    // servidor as valida — o botão e o 422 têm de contar a mesma história.
    for (const pergunta of perguntasDe(env)) {
      const texto = ((est.form.respostas || {})[pergunta.id] || "").trim();
      if (pergunta.obrigatoria && !texto) {
        // Duas chaves porque o botão pede a AÇÃO que falta: numa caixa livre é
        // escrever, num seletor de categoria é escolher.
        const chave = pergunta.tipo === "categoria" && (pergunta.opcoes || []).length
          ? "falta.pergunta_categoria" : "falta.pergunta";
        return t(chave, { rotulo: bi(pergunta.rotulo_i18n, pergunta.rotulo) });
      }
      if (texto && texto.length < (pergunta.minimo || 0)) {
        return t("falta.pergunta_minimo", {
          rotulo: bi(pergunta.rotulo_i18n, pergunta.rotulo),
          n: (pergunta.minimo || 0) - texto.length,
        });
      }
    }
    return faltaNaMatriz(env.rubrica.criterios, est.form);
  }
  if (tipo === "escrever_rubrica") {
    const piso = lim("min_criterios_rubrica", 3);
    if (est.form.titulo.trim().length < 5) return t("falta.titulo_rubrica");
    if (est.form.criterios.length < piso) {
      const faltam = piso - est.form.criterios.length;
      // Duas chaves em vez de um plural montado no código: o inglês e o
      // português não flexionam igual, e "1 critério(s)" numa tela de portfólio
      // é o tipo de detalhe que se lê como descuido.
      return faltam === 1 ? t("falta.criterio_um") : t("falta.criterios_n", { n: faltam });
    }
    for (let i = 0; i < est.form.criterios.length; i++) {
      const c = est.form.criterios[i];
      if (c.nome.trim().length < 3) return t("falta.criterio_nome", { n: i + 1 });
      if (c.descricao.trim().length < 10) return t("falta.criterio_desc", { n: i + 1 });
      if (c.rotulo_min.trim().length < 3 || c.rotulo_max.trim().length < 3) {
        return t("falta.criterio_pontas", { n: i + 1 });
      }
    }
    return null;
  }
  if (tipo === "sft_resposta") {
    const piso = lim("min_chars_sft", 40);
    const tem = est.form.resposta.trim().length;
    if (tem < piso) return t("falta.sft", { n: piso - tem });
    return null;
  }
  if (ehConversa(tipo)) {
    const conversa = env.conversa || {};
    // ENCERRAR É A PRIMEIRA COISA QUE FALTA, e o botão diz isso em vez de
    // aparecer habilitado e devolver um 409: enquanto a conversa está aberta, o
    // que se está fazendo é conversar, não avaliar.
    if (!conversa.avaliavel && !(est.form.turnos || []).length) return t("falta.sem_turno");
    if (!est.form.encerrada) return t("falta.encerrar");
    // A MESMA conta da matriz do `avaliar_rubrica` — mesma rubrica, mesma regra.
    const naMatriz = faltaNaMatriz((env.rubrica && env.rubrica.criterios) || [], est.form);
    if (naMatriz) return naMatriz;
    const pisoConversa = lim("min_chars_justificativa", 30);
    const temConversa = (est.form.justificativa || "").trim().length;
    if (temConversa < pisoConversa) {
      return t("falta.justificativa", { n: pisoConversa - temConversa });
    }
    return null;
  }
  if (!est.form.preferencia) return t("falta.preferencia");
  const piso = lim("min_chars_justificativa", 30);
  const tem = est.form.justificativa.trim().length;
  if (tem < piso) return t("falta.justificativa", { n: piso - tem });
  return null;
}

/** Atualiza SÓ o aviso e o estado do botão. Redesenhar a área inteira a cada
    tecla digitada tiraria o foco do campo no meio da frase — e reescrever o
    RÓTULO do botão trocaria o alvo de lugar a cada caractere. */
function atualizarBotaoEnviar() {
  const b = $("#enviar");
  if (!b) return;
  const falta = oQueFalta();
  const aviso = $("#falta-envio");
  if (aviso) {
    aviso.textContent = falta || "";
    aviso.hidden = !falta;
  }
  b.disabled = !!falta || est.carregando;
}

function salvarEDesenhar() {
  salvarRascunho();
  desenharArea();
}

/* ---- rascunho automático, por atribuição ----
   Perder trabalho é a maior fricção que existe. O rascunho é por
   `atribuicao_id` (e não por tipo) porque é a atribuição que identifica ESTE
   trabalho: duas tarefas do mesmo tipo têm rascunhos independentes. */
function rascunhoChave(id) { return CHAVE + "rascunho." + id; }

function salvarRascunho() {
  if (!est.envelope || !est.form) return;
  try {
    localStorage.setItem(rascunhoChave(est.envelope.atribuicao_id), JSON.stringify(est.form));
  } catch (_) { /* modo privado ou cota cheia: a demo funciona, só não lembra */ }
}
function lerRascunho(id) {
  try {
    const bruto = localStorage.getItem(rascunhoChave(id));
    return bruto ? JSON.parse(bruto) : null;
  } catch (_) { return null; }
}
function limparRascunho(id) {
  try { localStorage.removeItem(rascunhoChave(id)); } catch (_) {}
}

/* ---- rascunho dos DOIS comentários curtos do revisor ----
   O comentário da devolução e o da escalação eram os únicos campos livres da
   plataforma que sobreviviam a um redesenho (moram em `est`) e NÃO sobreviviam a
   um F5. E são justamente os dois que uma pessoa reescreve com mais cuidado: o
   da devolução é a única instrução que o anotador recebe para consertar o
   trabalho, e o da decisão do admin é a única que ele recebe pelo outro caminho.

   A chave carrega o id do item para que dois deles em aberto não se sobrescrevam
   — e nenhuma delas é uma chave do dicionário (o teste de chave órfã varre
   literais no formato `a.b`, e estas terminam em ponto de propósito). */
const chaveTriagem = (id) => CHAVE + "rascunho.triagem." + id;
const chaveEscalacao = (id) => CHAVE + "rascunho.escalacao." + id;
function lerRascunhoTexto(chave) {
  try { return localStorage.getItem(chave) || ""; } catch (_) { return ""; }
}
function salvarRascunhoTexto(chave, texto) {
  try {
    if (texto) localStorage.setItem(chave, texto);
    else localStorage.removeItem(chave);
  } catch (_) { /* modo privado ou cota cheia: só não lembra */ }
}

/** Monta o payload no formato do contrato `<tipo>@1`. O servidor revalida tudo
    contra o tipo que ELE leu do banco — isto aqui é conveniência, não garantia.

    `form` é parâmetro desde o P3b: o Rate and Review monta DOIS payloads (o
    original e o corrigido) para calcular o diff, e os dois têm de sair da mesma
    função. Duas montagens diferentes produziriam diferenças que não existem — e
    o revisor teria de justificar mudanças que ele não fez. */
/** Uma linha de `notas[]` no formato do contrato. Compartilhada pelo
    `avaliar_rubrica` e pelas duas abas de conversa — o mesmo motivo de
    `matrizDeCriterios` existir.

    `tipos_issue` sai com **TODOS os ids do catálogo, na ordem do catálogo**,
    inclusive os `false`. Duas consequências, e as duas são o ponto: o diff do
    Rate and Review vê um caminho por toggle (e não dois, como veria numa lista
    — `achatar` trata lista vazia como folha), e a ordem nunca depende da ordem
    dos cliques, então não há diferença fantasma por reordenação. */
function notaDoPayload(c, f, i) {
  const nota = { criterio: c.nome };
  if (f.na && f.na[i]) {
    // N/A não afirma nada: nem nota, nem tipo, nem trecho. A chave `nota` fica
    // AUSENTE, não nula — quem lê não deve ter de desambiguar "apagada" de
    // "nunca existiu".
    nota.nao_aplicavel = true;
    nota.motivo_na = (f.motivosNa[i] || "").trim();
    return nota;
  }
  nota.nota = f.notas[i];
  const just = f.justificativas[i];
  if (just && just.trim()) nota.justificativa = just.trim();
  const catalogo = catalogoDe(c);
  if (catalogo.length) {
    const marcados = (f.issues && f.issues[i]) || {};
    nota.tipos_issue = {};
    for (const tipo of catalogo) nota.tipos_issue[tipo.id] = !!marcados[tipo.id];
  }
  if (f.trechos && (f.trechos[i] || "").trim()) nota.trecho = f.trechos[i].trim();
  if (f.difusos && f.difusos[i]) nota.trecho_difuso = true;
  return nota;
}

function montarPayload(env, form) {
  const f = form || est.form;
  const tipo = env.tarefa.tipo;
  if (tipo === "avaliar_rubrica") {
    const criterios = env.rubrica.criterios;
    const corpo = {
      notas: criterios.map((c, i) => notaDoPayload(c, f, i)),
      comentario_geral: f.comentario_geral.trim() || null,
    };
    // TODAS as perguntas declaradas, na ordem do INSTRUMENTO, sempre presentes
    // — a lição do `tipos_issue`: com o mapa completo, cada resposta editada no
    // Rate and Review é exatamente um caminho de diff, e a ordem estável não
    // fabrica diferença fantasma.
    const perguntas = perguntasDe(env);
    if (perguntas.length) {
      corpo.respostas = {};
      for (const pergunta of perguntas) {
        corpo.respostas[pergunta.id] = ((f.respostas || {})[pergunta.id] || "").trim();
      }
    }
    return corpo;
  }
  if (tipo === "escrever_rubrica") {
    return {
      titulo: f.titulo.trim(),
      criterios: f.criterios.map((c) => ({
        nome: c.nome.trim(),
        descricao: c.descricao.trim(),
        escala_min: 1,
        escala_max: Number(c.escala_max) || 5,
        rotulo_min: c.rotulo_min.trim(),
        rotulo_max: c.rotulo_max.trim(),
      })),
    };
  }
  if (tipo === "sft_resposta") {
    const corpo = { resposta: f.resposta.trim() };
    const criterios = (env.rubrica && env.rubrica.criterios) || [];
    if (criterios.length) {
      corpo.checklist = criterios.map((c, i) => ({ criterio: c.nome, atendido: !!f.checklist[i] }));
    }
    return corpo;
  }
  if (ehConversa(tipo)) {
    const criterios = (env.rubrica && env.rubrica.criterios) || [];
    // `turnos` (e `rodadas`) NÃO SAEM DAQUI. Quem os monta é o servidor, a
    // partir do que ele mesmo gravou em `turnos_conversa` — no duelo o cliente
    // sequer sabe qual modelo respondeu, e um "quem" vindo de quem não sabia
    // seria fabricação. Mandá-los aqui seria, no melhor caso, redundante.
    return {
      rubrica: (env.rubrica && env.rubrica.rubrica_id) || "",
      notas: criterios.map((c, i) => notaDoPayload(c, f, i)),
      turnos_problematicos: Object.keys(f.problemas || {})
        .map(Number)
        .sort((a, b) => a - b)
        .filter((ordem) => (f.problemas[String(ordem)].motivo || "").trim())
        .map((ordem) => ({
          ordem: ordem,
          nota: f.problemas[String(ordem)].nota,
          motivo: f.problemas[String(ordem)].motivo.trim(),
        })),
      justificativa: (f.justificativa || "").trim(),
    };
  }
  return { preferencia: f.preferencia, justificativa: f.justificativa.trim() };
}

async function enviar() {
  if (!est.envelope || oQueFalta() || est.carregando) return;
  const env = est.envelope;
  est.carregando = true;
  atualizarBotaoEnviar();
  try {
    const r = await postar("/api/atribuicoes/" + env.atribuicao_id + "/submeter", {
      anotador_id: est.persona.id,
      payload: montarPayload(env),
      // Medido e enviado — e invisível para quem anota. Só o admin vê tempos.
      tempo_ativo_ms: Math.max(0, Date.now() - est.abertoEm),
    });
    limparRascunho(env.atribuicao_id);
    est.envelope = null;
    est.form = null;
    recado(r.expirou
      ? t("recado.enviado_expirado")
      : t("recado.enviado", { versao: r.versao }));
    est.carregando = false;
    // A REVELAÇÃO do duelo, e só agora: com a avaliação já gravada, a
    // preferência não pode mais ser contaminada pela marca.
    if (r.revelacao && r.revelacao.length) { revelarDuelo(r.revelacao); return; }
    if (r.continuacao) { oferecerContinuacao(r.continuacao); return; }
    // FECHAR O LOOP ANTES DE PEDIR A PRÓXIMA COISA: enviar leva direto à
    // próxima tarefa, sem uma tela intermediária perguntando "e agora?".
    est.motivo = "";
    est.motivoChave = null;
    est.vista = "fila";
    desenharVistas();
    await carregarFila();
  } catch (e) {
    est.carregando = false;
    recado(e.message, true);
    desenharArea();
  }
}

/** QUEM ERA QUEM, depois do envio do duelo. Uma tela, uma saída.

    O estado mora em `est.revelacao` e não só no DOM: trocar de idioma aqui
    redesenha a partir da memória, e uma revelação que sumisse ao trocar de
    língua faria a pessoa perder a única chance de ver o resultado. */
function revelarDuelo(revelacao) {
  est.revelacao = revelacao;
  const area = $("#area-trabalho");
  limpar(area);
  const painel = el("div", "painel");
  painel.appendChild(juntar(el("div", "painel-cabeca"),
    el("h2", null, t("duelo.revelacao_titulo"))));
  const corpo = el("div", "painel-corpo");
  corpo.appendChild(el("p", "fraco", t("duelo.revelado")));
  const lista = el("div", "revelacao");
  for (const rodada of revelacao) {
    for (const lado of rodada.lados || []) {
      const linha = el("div", "revelacao-linha");
      // Nome de modelo é DADO: vem do servidor e sai como está.
      juntar(linha,
        el("span", "dado", t("duelo.revelacao_linha", {
          n: rodada.ordem, lado: lado.rotulo, modelo: lado.modelo,
        })),
        el("span", "crescer"),
        lado.rotulo === rodada.vencedora
          ? el("span", "etiqueta aprovado", t("duelo.vencedora", { lado: lado.rotulo }))
          : null);
      lista.appendChild(linha);
    }
  }
  corpo.appendChild(lista);
  const seguir = el("button", "botao primaria", t("botao.proxima_tarefa"));
  seguir.type = "button";
  seguir.addEventListener("click", () => {
    est.revelacao = null;
    est.motivo = "";
    est.motivoChave = null;
    carregarFila();
  });
  corpo.appendChild(juntar(el("div", "vazio-saidas"), seguir));
  painel.appendChild(corpo);
  area.appendChild(painel);
}

/** A oferta rubrica → SFT. Uma pergunta, duas saídas, nenhuma delas um beco. */
function oferecerContinuacao(cont) {
  const area = $("#area-trabalho");
  limpar(area);
  const painel = el("div", "painel");
  painel.appendChild(juntar(el("div", "painel-cabeca"), el("h2", null, t("cont.titulo"))));
  const caixa = el("div", "vazio");
  juntar(caixa,
    el("div", "vazio-titulo", t("cont.convite")),
    el("p", "vazio-linha", t("cont.porque")));
  const saidas = el("div", "vazio-saidas");
  const sim = el("button", "botao primaria", t("botao.escrever_resposta_agora"));
  sim.type = "button";
  sim.addEventListener("click", () => aceitarContinuacao(cont));
  const nao = el("button", "botao", t("botao.nao_proxima"));
  nao.type = "button";
  nao.addEventListener("click", () => { est.motivo = ""; est.motivoChave = null; carregarFila(); });
  juntar(saidas, sim, nao);
  caixa.appendChild(saidas);
  painel.appendChild(caixa);
  area.appendChild(painel);
}

async function aceitarContinuacao(cont) {
  est.aba = cont.tipo;
  est.vista = "fila";
  est.carregando = true;
  desenharAnotador();
  try {
    const r = await postar("/api/tarefas/livre", paramsProjeto({
      anotador_id: est.persona.id,
      tipo: cont.tipo,
      prompt_uid: cont.prompt_uid,
      origem: cont.origem,
    }));
    aceitarEnvelope(r.tarefa, null);
  } catch (e) {
    est.motivoChave = null;
    est.motivo = t("recado.erro_continuacao", { erro: e.message });
  } finally {
    est.carregando = false;
  }
  await recarregarContagens();
  desenharArea();
}

/** Devolve a atribuição em mãos e NÃO puxa a próxima — quem decide o que vem
    depois é quem chamou.

    `motivo` é o skip categorizado do brief v2. Ausente = abandono sem motivo
    (largar uma tarefa do catálogo, mudar de ideia): gestos que não são "não sei
    julgar isto" e não devem fingir que são. */
async function devolver(motivo) {
  if (!est.envelope) return;
  const id = est.envelope.atribuicao_id;
  try {
    const corpo = { anotador_id: est.persona.id };
    if (motivo) corpo.motivo = motivo;
    await postar("/api/atribuicoes/" + id + "/abandonar", corpo);
    limparRascunho(id);
    recado(motivo ? t("recado.pulada") : t("recado.devolvida_fila"));
  } catch (e) {
    recado(e.message, true);
  }
  est.envelope = null;
  est.form = null;
  est.skipAberto = false;
  est.motivo = "";
  est.motivoChave = null;
}

async function abandonar(motivo) {
  await devolver(typeof motivo === "string" ? motivo : null);
  await carregarFila();
}

async function recarregarContagens() {
  try {
    const r = await api(comParams("/api/tarefas/contagens",
      paramsProjeto({ anotador_id: est.persona.id })));
    est.contagens = r.contagens || {};
  } catch (_) { est.contagens = {}; }
  pintarContagens();
}

/** Só os números das abas — sem redesenhar a área de trabalho embaixo. */
function pintarContagens() {
  for (const b of document.querySelectorAll("#abas-anotador .aba")) {
    const conta = est.contagens[b.dataset.tipo];
    const selo = b.querySelector(".conta");
    if (selo) selo.textContent = conta === undefined ? "" : n(conta);
  }
  atualizarContagens();
}

/* ==========================================================================
   5.8 CATÁLOGO (modo livre)
   Busca + TRÊS filtros. Recorte fino é o trabalho da outra ferramenta; aqui a
   pessoa quer escolher uma tarefa em dez segundos.
