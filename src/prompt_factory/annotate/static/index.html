/* As DIRETRIZES não moram mais aqui. Elas vêm de `/api/diretrizes`, com número
   de versão, e o servidor grava essa versão em cada anotação
   (`anotacoes.versao_diretriz`). O cenário que isso resolve: a regra do A/B é
   ajustada numa terça, o cliente reclama de inconsistência na quinta — sem a
   versão gravada, a única saída é refazer o lote inteiro. */
/* As tabelas abaixo guardam CHAVES do dicionário, não texto. É o que permite ao
   teste de chave órfã enxergá-las (um `t("tipo." + id + ".nome")` seria
   invisível para ele) e o que faz a troca de idioma ser um redesenho, e não uma
   segunda tabela de strings a manter em dia. */
const TIPOS = [

    id: "avaliar_rubrica",
    nome: "tipo.avaliar_rubrica.nome",

    vazioTitulo: "tipo.comparar_ab.vazio_titulo",
    vazioLinha: "tipo.comparar_ab.vazio_linha",
  },
  /* As DUAS de inferência ao vivo (P4d). Ficam no fim porque são as únicas que
     dependem de um serviço fora deste processo — e quando ele não está de pé, é
     a última aba que falha, não a primeira que o avaliador abre. */
  {
    id: "conversa_modelo",
    nome: "tipo.conversa_modelo.nome",
    titulo: "tipo.conversa_modelo.titulo",

const TIPOS_CONVERSA = ["conversa_modelo", "duelo_modelos"];
const ehConversa = (tipo) => TIPOS_CONVERSA.indexOf(tipo) >= 0;

/** O nome do estilo de tarefa na língua de agora, com o id como último recurso. */

/* As DUAS sub-abas do revisor, na ordem do fluxo: o que chega e o que passou.

const SUBABAS_REVISOR = [

/* AS DUAS ESCALAS DA PASSAGEM 2, como TABELA com a chave inteira — pelo mesmo

   `classe` pinta o DESFECHO, não a nota: na escala 2, descartar e escalar não
   são a mesma coisa que encerrar, e a cor diz isso antes da leitura. */
const ESCALA_ANTES = [
  { id: "inutilizavel", nome: "rr.antes.inutilizavel.nome", ancora: "rr.antes.inutilizavel.ancora", classe: "grave" },
  { id: "ajustavel", nome: "rr.antes.ajustavel.nome", ancora: "rr.antes.ajustavel.ancora", classe: "" },

/* A BÚSSOLA DA PASSAGEM 2 — os quatro passos, na ordem em que a tela os pede.

   O Rate and Review é um documento contínuo, e o documento FICA: rolar por ele
   é como se confere o trabalho de outra pessoa. O que faltava não era recortar
   a tela em telas, era saber ONDE se está dentro dela — e o que ainda falta sem
   ter de rolar até o fim para descobrir. A bússola é essa orientação: quatro
   paradas grudadas no topo, cada uma dizendo o próprio estado e o próprio
   resumo, e cada uma sendo o atalho para a seção que ela descreve.

   Chave INTEIRA como literal, pelo mesmo motivo de `TIPOS`, `ESCALA_ANTES` e
   `SECOES_BRIEF`: `t("rr.passo_" + id)` seria invisível para o teste de chave
   órfã, e o dicionário passaria a acumular entradas mortas. */
const PASSOS_RR = [
  { id: "antes", rotulo: "rr.passo_antes", alvo: "rr-alvo-antes" },
  { id: "corrigir", rotulo: "rr.passo_corrigir", alvo: "rr-alvo-corrigir" },

/* Os quatro estados de um passo, dito por extenso para quem usa leitor de tela.
   `opcional` não é uma quinta cor de "pendente": é a afirmação de que aquele
   passo não tem o que fazer (nada mudou, e avaliar sem corrigir é desfecho
   legítimo — ver `rr.diff_vazio`). */
const ESTADOS_BUSSOLA = {
  feito: "rr.bussola_feito",
  atual: "rr.bussola_atual",
  pendente: "rr.bussola_pendente",
  opcional: "rr.bussola_opcional",
};

/* E os três desfechos que o admin dá a um item escalado. */
const DECISOES = [
  { id: "aprovada", nome: "admin.decisao.aprovada.nome", ancora: "admin.decisao.aprovada.ancora", classe: "boa" },
  { id: "devolvida", nome: "admin.decisao.devolvida.nome", ancora: "admin.decisao.devolvida.ancora", classe: "" },
  { id: "descartada", nome: "admin.decisao.descartada.nome", ancora: "admin.decisao.descartada.ancora", classe: "grave" },

/** OS ATALHOS, por papel — os únicos que a tela nunca mostra sozinha.

    A matriz de critérios é operável inteira pelo teclado (`1–9`, `N`, `0`,
    `↑ ↓`) e nada disso aparece em lugar nenhum: quem não leu o código digita
    vinte notas com o mouse. Os do A/B e da triagem já tinham chip ao lado do
    botão; estes não têm onde caber, e é justamente por isso que a folha existe.

    Tabela com a CHAVE INTEIRA (padrão de `TIPOS`, `ROTEIRO`, `SECOES_BRIEF`):
    montar `t("atalhos." + secao)` seria invisível para o teste de chave órfã. O

const ATALHOS = [
  { papel: "anotador", titulo: "atalhos.sec_matriz", linhas: [

    ["N", "atalhos.matriz_na"],

/** O CAMINHO DO PAYLOAD, dito em português de gente.

    e varia com o tipo de tarefa. */
const CAMPOS_LEGIVEIS = {

  comentario_geral: "rr.campo.comentario_geral",
  titulo: "rr.campo.titulo",
  criterios: "rr.campo.criterios",

  checklist: "rr.campo.checklist",

};

/** Os motivos de SKIP da fila (P9) — os ids têm de bater com
    `db.MOTIVOS_ABANDONO`, e há teste comparando as duas listas. O id é a
    identidade que viaja no evento; o rótulo é cromo e vem do dicionário pela
    CHAVE INTEIRA, nunca por concatenação. */
const MOTIVOS_SKIP = [
  ["outside-my-domain", "skip.outside_my_domain"],
  ["prompt-unclear", "skip.prompt_unclear"],
  ["out-of-scope", "skip.out_of_scope"],

/** As seções do brief, na ordem em que a tela as desenha.

    O par (campo do dado, chave do dicionário) e não `"brief." + secao`: chave
    montada por concatenação é INVISÍVEL para o teste de chave órfã, e uma
    entrada morta no dicionário só apareceria como um título vazio na tela. O
    campo é pt-BR porque é o nome da coluna no dado; o rótulo é cromo. */
const SECOES_BRIEF = [
  ["visao_geral", "brief.visao_geral"],
  ["caso_de_uso", "brief.caso_de_uso"],
  ["tipos_de_prompt", "brief.tipos_de_prompt"],
  ["selecao", "brief.selecao"],
  ["avaliacao", "brief.avaliacao"],

/** O que falta. Fica no painel do admin, à vista, em vez de virar surpresa em
    cada botão desabilitado.

    EM LINGUAGEM DE PRODUTO, nunca em código de marco. "P4"/"P6" são vocabulário
    do repositório e de quem escreveu o plano; quem abre este painel não tem o
    mapa que os decifra, e um roteiro que promete "P6" promete um mistério. A
    régua de quando uma linha sai daqui não mudou: entregou, sai da lista. */
const ROTEIRO = [
  "roteiro.criar",
  "roteiro.ingestao",
  "roteiro.acabamento",
];

/** AS CINCO ABAS DO ADMIN, na ordem do uso.

    A tela do admin acumulou um painel por marco. Empilhados, o painel de
    métricas e o formulário de geração do P5a a levariam a dois mil pixels de
    rolagem — o mesmo doom scrolling que a matriz de critérios e o brief já
    curaram, reintroduzido na única tela que ninguém percorre por prazer.

    Chave INTEIRA em cada entrada, como `TIPOS`/`ROTEIRO`: `t("abas_admin." +
    id)` seria invisível para o teste de chave órfã. `sec` é o seletor do bloco
    que a aba mostra — a alternância é `hidden`, e não `display` no JS, porque o
    que é regra fica no CSS. */
const ABAS_ADMIN = [
  { id: "visao", nome: "abas_admin.visao", sec: "#admin-sec-visao" },
  { id: "metricas", nome: "abas_admin.metricas", sec: "#admin-sec-metricas" },
  { id: "gerar", nome: "abas_admin.gerar", sec: "#admin-sec-gerar" },
  { id: "escalacoes", nome: "abas_admin.escalacoes", sec: "#admin-sec-escalacoes" },
  { id: "pool", nome: "abas_admin.pool", sec: "#admin-sec-pool" },
];

/* ==========================================================================
   2. ESTADO
   ========================================================================== */
const CHAVE = "bancada.";

/** As vistas do anotador. A FILA é o caminho principal e vem primeiro.

    `criar` é o TERCEIRO modo de seleção do produto (locked = fila, livre =
    catálogo, criar = escrever), e por isso ele mora aqui e não nas abas de tipo:
    escrever um prompt não é um estilo de tarefa, é a origem de um. Ele vem por
    último porque é o único que não consome o corpus — alimenta. */
const VISTAS = [
  { id: "fila", nome: "vista.fila" },
  { id: "catalogo", nome: "vista.catalogo" },
  { id: "minhas", nome: "vista.minhas" },
  { id: "criar", nome: "vista.criar" },
];

const est = {
  // A língua da INTERFACE (nunca a do dado). Resolvida antes do primeiro
  // desenho, em `iniciar()`, porque não existe quadro nenhum em que a tela
  // possa aparecer na língua errada.
  idioma: IDIOMA_PADRAO,
  persona: null,      // {id, nome, papel} — quem está usando agora
  papelEscolhido: null,
  perfis: [],
  saude: null,
  // As diretrizes VERSIONADAS, vindas de /api/diretrizes, nas DUAS línguas:
  // {tipo: {versao, textos: {en: [...], pt: [...]}}}. Vêm juntas de propósito —
  // é o que permite ao botão de idioma trocar o texto sem outra ida ao servidor.
  diretrizes: {},
  // O banco de perguntas, de `/api/modelos-rubrica`. Eram literais neste
  // arquivo até o P8; agora são dado, e é a mesma porta que o construtor do
  // admin (P5a) vai usar. Vazio até a aba `escrever_rubrica` precisar deles.
  modelosRubrica: [],
  // O BRIEF de cada projeto (P9), de `/api/briefs`: {projeto_id: {versao,
  // escopo, textos:{en,pt}}}. Outro eixo, outro ponteiro — a diretriz diz COMO
  // se faz um TIPO de tarefa, o brief diz o que é ESTE projeto. As duas línguas
  // juntas pela mesma razão de sempre: trocar de idioma não pode piscar.
  briefs: {},
  // As 32 classes do corpus, de `/api/taxonomia`. É o vocabulário em que o
  // `escopo` do brief é escrito, e a tela NUNCA guarda uma segunda cópia dele
  // (a que diverge é sempre a da tela).
  taxonomia: { versao: null, task_type: {}, domain: {} },
  // Os projetos e o que está em foco. `projeto: null` = todos.
  projetos: [],
  projeto: null,
  aba: TIPOS[0].id,
  subaba: SUBABAS_REVISOR[0].id,
  // DIVULGAÇÃO PROGRESSIVA: as diretrizes vêm abertas na PRIMEIRA visita de
  // cada aba nesta sessão e fechadas depois. Quem já leu não relê; quem chegou
  // agora não precisa procurar. Por sessão (não persistido) de propósito: uma
  // sessão nova é alguém voltando depois de um tempo.
  diretrizesVistas: new Set(),
  // A FAIXA DE PAPEL segue o mesmo padrão: ela explica o ofício do papel que
  // acabou de ser vestido, e depois de lida é uma barra permanente de explicação
  // já lida grudada no topo de toda tela — que ainda empurrava para trás dela as
  // duas barras `sticky` de dentro da tarefa. `faixaPapel` é qual papel está com
  // a faixa NA TELA agora: sem ele, um redesenho da barra (trocar de idioma) a
  // apagaria no meio da leitura, porque o papel já teria entrado no conjunto.
  faixaVista: new Set(),
  faixaPapel: null,
  // O brief abre UMA vez por projeto na sessão, e não uma vez por aba: ele
  // responde "o que é este trabalho", e a resposta não muda ao trocar de tipo
  // de tarefa. Dois painéis auto-abrindo a cada aba seriam um muro de texto.
  briefsVistos: new Set(),
  // A seção do brief à vista. Da SESSÃO, não persistida: quem volta depois de
  // um tempo começa pela visão geral, que é onde o brief começa.
  briefSecao: null,
  // O leque de motivos de skip está aberto? Da tarefa em mãos, não da sessão:
  // trocar de envelope o fecha sozinho.
  skipAberto: false,
  // A folha de atalhos está aberta? Não é persistida: ela é consulta, não
  // preferência — abrir a plataforma com um painel de ajuda por cima do trabalho
  // seria o contrário do que ela existe para fazer.
  atalhosAberto: false,

  /* ---- P2 ---- */
  vista: "fila",
  envelope: null,     // a tarefa hidratada em mãos (ou null)
  // Por que a fila está vazia. `motivoChave` (+ `motivoDados`) é o que o
  // SERVIDOR disse, guardado como CHAVE para ser traduzido no desenho — trocar
  // de idioma com a fila vazia tem de trocar essa frase também. `motivo` é o
  // erro de rede, que nasce já traduzido porque não vem do servidor.
  motivo: "",
  motivoChave: null,
  motivoDados: null,
  form: null,         // o estado do formulário do tipo em foco
  rascunhoRecuperado: false,
  carregando: false,
  contagens: {},
  foco: 0,            // qual critério o teclado está graduando
  // O tempo É medido e vai para o admin — e NUNCA aparece para quem anota.
  // Cronômetro à vista adiciona pressão sem melhorar decisão, e aqui não há
  // pagamento por hora que o justifique.
  abertoEm: 0,
  catalogo: { q: "", lang: "", fonte: "", faixa: "", page: 1, dados: null },
  minhas: null,

  /* ---- P4: o modo criar ---- */
  // O RASCUNHO mora aqui, e não no DOM, pela razão de sempre: trocar de idioma
  // redesenha a tela a partir de `est`, e um texto que a pessoa está escrevendo
  // não pode sumir porque ela clicou em `EN`.
  // `material` é o rascunho da TRÍADE (F4-2) — rubrica na forma do FORMULÁRIO
  // (`escrever_rubrica@1`-like; a conversão para `rubrica@3` acontece só na
  // montagem do envio) e gold como TEXTO das três listas (um item por linha; a
  // montagem separa). Ele só é apagado no SUCESSO do envio: um 409 de reserva
  // expirada que apagasse uma hora de escrita seria a pior forma de recusar.
  criacao: {
    texto: "", lang: "pt", task_type: "", domain: "", brief: "", enviando: false,
    material: materialVazio(),
  },
  /* ---- F4-2: a fila de pedidos (Central de Briefs) ---- */
  // `dados` guarda a resposta inteira de GET /api/pedidos ({meu, facetas,
  // reserva_ttl_min, limites}); `null` = nunca pedido (dispara a carga),
  // `{erro:true}` = a carga falhou (NÃO redispara sozinha — senão o erro de
  // rede viraria um laço de requisições). `motivoChave` é a CHAVE que o
  // servidor devolveu na fila vazia, traduzida no desenho — a lição do P3i.
  // `painelAberto` existe pela razão do `manterDiretrizes`: trocar de idioma
  // redesenha, e não pode fechar o painel que a pessoa acabou de abrir.
  pedido: {
    dados: null, filtros: { disciplina: "", papel: "" },
    motivoChave: null, painelAberto: true, carregando: false,
    puxando: false, devolvendo: false,
  },
  // O que ELA já escreveu (a vista "criar" lista abaixo do formulário) e o que
  // o revisor tem para decidir. `null` = nunca pedido, que é diferente de vazio.
  minhasCriacoes: null,
  criacoes: null,

  /* ---- P4d: a conversa com o modelo local ---- */
  // A GERAÇÃO EM VOO: {desde, dois}. Existe só enquanto a chamada está aberta,
  // e é dela que sai o indicador com o tempo decorrido — 17 s sem indicador
  // (medido) parecem travamento. O relógio é do MODELO, nunca da pessoa.
  gerando: null,
  // O último erro do runtime, guardado como CHAVE + dados (nunca a frase pronta
  // do servidor, que vem numa língua só). Ver `blocoRuntime`.
  erroModelo: null,
  // A revelação do duelo, depois do envio: quem era A e quem era B. Mora em
  // `est` e não no DOM porque trocar de idioma redesenha a tela a partir daqui.
  revelacao: null,

  /* ---- P3a: a triagem ---- */
  // {itens, total, minhas_excluidas, sel, detalhe, form, devolvendo, comentario,
  //  carregando}. `comentario` guarda o texto da devolução em ANDAMENTO: ele
  // mora no estado, e não só no <textarea>, para que trocar de idioma no meio
  // de uma devolução não apague o que o revisor já escreveu.
  triagem: null,

  /* ---- P3b: o Rate and Review ---- */
  // {itens, total, sel, detalhe, triagemDoItem, original, form, antes, depois,
  //  justificativa, motivos, foco, abertoEm, carregando, ...}.
  //
  // TUDO que o revisor digita e ainda não enviou mora aqui — as duas notas, o
  // formulário corrigido, o motivo de cada mudança e a justificativa geral —,
  // pela mesma razão do `triagem.comentario`: trocar de idioma redesenha a
  // tela a partir de `est`, e o que só existisse no DOM sumiria.
  //
  // `original` é a cópia INTOCADA do formulário como ele chegou. É contra ela
  // que o diff é calculado, e por isso ela nunca é editada nem regravada no
  // rascunho — desfazer uma correção precisa de um ponto de referência estável.
  rr: null,
  // A fila de escalação do admin: {itens, total, sel, decisao, comentario}.
  escalacao: null,

  /* ---- P5a: o painel do admin ---- */
  // Qual das cinco abas do admin está aberta. Da SESSÃO: quem volta ao painel
  // depois de um tempo começa pelo panorama, que é onde ele começa.
  abaAdmin: ABAS_ADMIN[0].id,
  // {dados, carregando, erro} de /api/admin/metricas. `null` = nunca pedido —
  // e é isso que torna a busca PREGUIÇOSA: o painel de métricas percorre todas
  // as anotações entregues, e pagá-lo na abertura do admin cobraria de quem só
  // veio conferir o pool.
  metricas: null,
  // O formulário de geração. `previa` é o plano que o servidor devolveu, e ele
  // é INVALIDADO a cada parâmetro alterado: criar sob uma prévia velha entrega
  // um número diferente do prometido, que é o único jeito de um formulário
  // deste tipo perder a confiança de quem o usa.
  gerar: {
    tipo: TIPOS[0].id, n: 20, lang: "", fonte: "", alvo: 1, prioridade: 50,
    projetoId: null, previa: null, carregando: false, criando: false,
  },
  // A trilha de auditoria por item escalado, em cache: {"a12": {itens, ...}}.
  // Reabrir um `<details>` que já foi lido não pode custar outra ida ao
  // servidor — e a lista de eventos de um item não muda enquanto ele espera.
  trilhas: {},
};

function guardarPersona() {
  try {
    if (est.persona) localStorage.setItem(CHAVE + "persona", JSON.stringify(est.persona));
    else localStorage.removeItem(CHAVE + "persona");
  } catch (_) { /* modo privado: a demo funciona igual, só não lembra */ }
}
function lerPersona() {
  try {
    const bruto = localStorage.getItem(CHAVE + "persona");
    if (!bruto) return null;
    const p = JSON.parse(bruto);
    return p && p.nome && PAPEL_POR_ID[p.papel] ? p : null;
  } catch (_) { return null; }
}

/* ---- tema ---- */
/** O rótulo do botão diz para ONDE o clique leva, não onde se está. */
function rotularTema() {
  const escuro = document.documentElement.getAttribute("data-tema") === "escuro";
  $("#tema").textContent = escuro ? t("tema.claro") : t("tema.escuro");
}
function aplicarTema(tema) {
  document.documentElement.setAttribute("data-tema", tema);
  rotularTema();
  try { localStorage.setItem(CHAVE + "tema", tema); } catch (_) {}
}
function alternarTema() {
  aplicarTema(document.documentElement.getAttribute("data-tema") === "escuro" ? "claro" : "escuro");
}

/* ==========================================================================
   3. SELETOR DE PAPEL  (na barra — não há tela de entrada)
   Uma decisão, sim, mas sem um vestíbulo para tomá-la: a plataforma abre na
   área de trabalho e o papel troca de onde a pessoa está. A frase de cada
   papel não some — vira o `title` do botão e a faixa de contexto logo abaixo
   da barra, que é onde ela ainda se explica sem competir com o trabalho.
   ========================================================================== */
function desenharPapeis() {
  const caixa = $("#papeis");
  // O FOCO MORRE NO REDESENHO: escolher um papel reconstrói os três botões, e o
  // nó que estava focado deixa de existir — a segunda seta seguida não chegaria
  // a lugar nenhum. Só devolvemos o foco se ele estava AQUI dentro; devolvê-lo
  // sempre roubaria o foco da página a cada troca de idioma e a cada partida.
  const tinhaFoco = caixa.contains(document.activeElement);
  limpar(caixa);
  PAPEIS.forEach((p, i) => {
    const b = el("button", "papel", t(p.nome));
    b.type = "button";
    b.setAttribute("role", "radio");
    const marcado = est.papelEscolhido === p.id;
    b.setAttribute("aria-checked", String(marcado));
    // ROVING TABINDEX, o mesmo padrão de `escalaRR`: um radiogroup é UMA parada
    // de Tab, e as setas andam dentro dele. Três paradas seguidas na barra
    // obrigariam quem usa teclado a atravessar os três papéis para chegar ao
    // seletor de pessoa.
    b.tabIndex = (marcado || (!est.papelEscolhido && i === 0)) ? 0 : -1;
    b.title = t(p.linha);
    b.dataset.papel = p.id;
    b.addEventListener("click", () => escolherPapel(p.id));
    b.addEventListener("keydown", (ev) => {
      if (ev.key !== "ArrowRight" && ev.key !== "ArrowLeft"
          && ev.key !== "ArrowDown" && ev.key !== "ArrowUp") return;
      ev.preventDefault();
      const passo = (ev.key === "ArrowRight" || ev.key === "ArrowDown") ? 1 : -1;
      escolherPapel(PAPEIS[(i + passo + PAPEIS.length) % PAPEIS.length].id);
    });
    caixa.appendChild(b);
  });
  if (tinhaFoco) {
    const escolhido = caixa.querySelector("[aria-checked=\"true\"]");
    if (escolhido) escolhido.focus();
  }

  const faixa = $("#faixa-papel");
  limpar(faixa);
  const atual = PAPEL_POR_ID[est.papelEscolhido];
  const id = atual ? atual.id : null;
  // A FAIXA É DA PRIMEIRA VISITA a cada papel. Enquanto o papel é o mesmo ela
  // FICA (redesenhar a barra não pode engolir a explicação no meio da leitura);
  // ao voltar a um papel já visto, ela não volta.
  if (id !== est.faixaPapel) {
    est.faixaPapel = id && !est.faixaVista.has(id) ? id : null;
    if (est.faixaPapel) est.faixaVista.add(id);
  }
  const mostrar = !!est.faixaPapel && est.faixaPapel === id;
  faixa.hidden = !mostrar;
  if (mostrar) juntar(faixa, el("span", "papel-linha", t(atual.linha)));
  medirFaixa();
}

/** A altura da faixa vira `--faixa-h`, para as duas barras `sticky` de dentro da
    tarefa (o cabeçalho da matriz e o rail) somarem ao `--barra-h`.

    MEDIDA DEPOIS DE ANEXADA E VISÍVEL: `offsetHeight` de um nó `hidden` é 0, e
    publicar 0 com a faixa na tela faria as duas barras pararem atrás dela — que
    é exatamente o defeito que isto veio consertar. */
function medirFaixa() {
  const faixa = $("#faixa-papel");
  const alto = faixa.hidden ? 0 : faixa.offsetHeight;
  document.documentElement.style.setProperty("--faixa-h", alto + "px");
}

/** `true` quando a plataforma está em modo solo (uma pessoa, os três chapéus).
    Vem do SERVIDOR (`/api/health`), nunca de uma constante do JS: é ele quem lê
    o `settings.toml` e quem de fato aplica ou não a regra. */
function modoSolo() { return !!(est.saude && est.saude.modo_solo); }

/** Trocar de papel troca de tela NA HORA. Sem confirmação e sem passo
    intermediário: o avaliador veio ver os três lados, e cada clique a mais
    entre eles é um lado a menos que ele vê.

    QUEM vai junto depende do modo. Em operação com equipe, o papel escolhe a
    pessoa: trocar para "Revisor" veste a primeira persona de revisor. No MODO
    SOLO, a pessoa é a mesma nos três papéis — porque é literalmente a mesma
    pessoa, e trocar de identidade ao trocar de aba faria o trabalho do autor
    aparecer revisado por uma fixture. Atribuição falsa num portfólio é pior
    que permissão larga numa app de 127.0.0.1. */
async function escolherPapel(papel) {
  if (papel === est.papelEscolhido && est.persona) return;
  est.papelEscolhido = papel;
  $("#entrada-erro").hidden = true;
  if (!modoSolo() || !est.persona) {
    const doPapel = est.perfis.filter((p) => p.papel === papel && p.ativo);
    const guardada = lerPersona();
    const escolhida = doPapel.find((p) => guardada && p.nome === guardada.nome) || doPapel[0];
    est.persona = escolhida
      ? { id: escolhida.id, nome: escolhida.nome, papel: escolhida.papel }
      : null;
    guardarPersona();
  }
  desenharPapeis();
  desenharPersonas();
  est.diretrizesVistas.clear();  // papel novo: as diretrizes voltam a abrir
  await abrirApp();
}

function desenharPersonas() {
  const sel = $("#persona");
  limpar(sel);
  // No modo solo a lista NÃO é filtrada por papel: a mesma pessoa atravessa as
  // três telas, e esconder quem não "é" revisor tornaria impossível voltar.
  const candidatos = modoSolo()
    ? est.perfis.filter((p) => p.ativo)
    : est.perfis.filter((p) => p.papel === est.papelEscolhido && p.ativo);
  if (!candidatos.length) {
    sel.appendChild(el("option", null, t("barra.ninguem_neste_papel")));
    sel.disabled = true;
    return;
  }
  sel.disabled = false;
  for (const p of candidatos) {
    const o = el("option", null, modoSolo() ? p.nome + " · " + nomePapel(p.papel) : p.nome);
    o.value = String(p.id);
    sel.appendChild(o);
  }
  if (est.persona && candidatos.some((p) => p.id === est.persona.id)) {
    sel.value = String(est.persona.id);
  }
}

async function trocarPersona() {
  const id = Number($("#persona").value);
  const p = est.perfis.find((x) => x.id === id);
  if (!p || (est.persona && est.persona.id === id)) return;
  est.persona = { id: p.id, nome: p.nome, papel: p.papel };
  // Fora do modo solo, a pessoa carrega o papel dela: escolher "Diego" na
  // lista leva para a tela de revisor, e não para uma tela que ele não abre.
  if (!modoSolo()) est.papelEscolhido = p.papel;
  guardarPersona();
  desenharPapeis();
  est.diretrizesVistas.clear();
  await abrirApp();
}

/* ---- projeto em foco ----
   Dois projetos nascem com o banco: `Portfólio` (o trabalho real sobre o
   corpus, e o default de toda tarefa nova) e `Demonstração` (o pacote de
   fixtures). Separá-los é o que permite dizer qual trabalho é de quem, em vez
   de somar fixture com autoria na mesma lista. O seletor existe porque, sem
   ele, "trabalhar só num projeto" seria uma promessa do schema que a interface
   não cumpre. */
async function carregarProjetos() {
  try {
    const r = await api("/api/projetos");
    est.projetos = r.items || [];
  } catch (e) {
    est.projetos = [];
    recado(t("recado.erro_projetos", { erro: e.message }), true);
  }
  if (est.projeto !== null && !est.projetos.some((p) => p.id === est.projeto)) {
    est.projeto = null;
  }
  desenharProjetos();
}

function desenharProjetos() {
  const sel = $("#projeto");
  limpar(sel);
  const todos = el("option", null, t("barra.todos_projetos"));
  todos.value = "";
  sel.appendChild(todos);
  for (const p of est.projetos) {
    // O número de tarefas ABERTAS vai no rótulo: um seletor que não diz quanto
    // trabalho tem cada projeto obriga a entrar em todos para descobrir onde
    // está o que se procura.
    const o = el("option", null, p.nome + " (" + n(p.n_abertas) + ")");
    o.value = String(p.id);
    o.title = p.descricao;
    sel.appendChild(o);
  }
  sel.value = est.projeto === null ? "" : String(est.projeto);
}

async function trocarProjeto() {
  const bruto = $("#projeto").value;
  const alvo = bruto === "" ? null : Number(bruto);
  if (alvo === est.projeto) return;
  est.projeto = alvo;
  try {
    if (alvo === null) localStorage.removeItem(CHAVE + "projeto");
    else localStorage.setItem(CHAVE + "projeto", String(alvo));
  } catch (_) {}
  await abrirApp();
}

function lerProjetoGuardado() {
  try {
    const bruto = localStorage.getItem(CHAVE + "projeto");
    return bruto ? Number(bruto) : null;
  } catch (_) { return null; }
}

/** Os parâmetros de projeto que uma chamada carrega — ou nada, quando o foco
    é "todos". Existe para que a chave não apareça como `projeto_id=null` em
    seis lugares diferentes. */
function paramsProjeto(base) {
  return est.projeto === null ? base : { ...base, projeto_id: est.projeto };
}

/** Criar persona continua acessível — só deixou de ser a porta de entrada. */
async function entrar() {
  const erro = $("#entrada-erro");
  erro.hidden = true;
  const novo = $("#novo-nome").value.trim();
  if (!novo) { erro.textContent = t("barra.sem_nome"); erro.hidden = false; return; }
  try {
    const criado = await postar("/api/perfis", { nome: novo, papel: est.papelEscolhido });
    est.perfis.push(criado);
    est.perfis.sort((a, b) => (a.papel + a.nome).localeCompare(b.papel + b.nome, "pt-BR"));
    est.persona = { id: criado.id, nome: criado.nome, papel: criado.papel };
  } catch (e) {
    erro.textContent = e.status === 409
      ? t("barra.nome_repetido", { erro: e.message })
      : t("barra.erro_perfil", { erro: e.message });
    erro.hidden = false;
    return;
  }
  guardarPersona();
  $("#novo-nome").value = "";
  $("#nova-pessoa").open = false;
  desenharPersonas();
  est.diretrizesVistas.clear();
  await abrirApp();
}

/* ==========================================================================
   4. APLICAÇÃO: barra + roteamento por papel
   ========================================================================== */
const TITULO_TELA = {
  anotador: "tela.anotador",
  revisor: "tela.revisor",
  admin: "tela.admin",
};

async function abrirApp() {
  // O papel É o escolhido na barra. Fora do modo solo ele sempre coincide com
  // o da persona (trocar de papel troca de pessoa); no modo solo a mesma
  // pessoa atravessa os três, e é a barra quem manda.
  const papel = est.papelEscolhido || (est.persona && est.persona.papel);
  $("#barra-titulo").textContent = TITULO_TELA[papel] ? t(TITULO_TELA[papel]) : "";

  for (const [id, no] of [["anotador", "#tela-anotador"], ["revisor", "#tela-revisor"], ["admin", "#tela-admin"]]) {
    $(no).hidden = papel !== id;
  }
  // Nenhuma persona com este papel: a tela ainda abre, e diz a saída. Um beco
  // aqui seria o pior possível — é a primeira coisa que se vê.
  if (!est.persona) { semPersona(papel); return; }

  // A saúde vem ANTES do desenho do anotador: é dela que saem os limites que o
  // botão "diz o que falta" usa, e desenhar antes mostraria os números padrão
  // por um quadro.
  await recarregarSaude();
  await carregarProjetos();
  if (papel === "anotador") {
    est.vista = "fila";
    est.envelope = null;
    est.motivo = "";
    est.motivoChave = null;
    await carregarDiretrizes();
    await carregarBriefs();
    await carregarModelosDeRubrica();
    await recarregarContagens();
    desenharAnotador();
  }
  if (papel === "revisor") {
    // As duas filas são recarregadas do zero ao entrar na tela: elas mudam por
    // fora (outra aba triando, o admin devolvendo) e um número velho aqui é
    // uma fila que promete trabalho que já foi feito.
    est.triagem = null;
    est.rr = null;
    await desenharRevisor();
  }
  if (papel === "admin") {
    // As duas filas do REVISOR são zeradas aqui também, e é simétrico ao ramo de
    // cima por um motivo prático: um `est.triagem` sobrevivente carrega uma
    // seleção viva para dentro de uma tela que não tem o que fazer com ela.
    est.triagem = null;
    est.rr = null;
    // As MÉTRICAS também: elas mudam por fora (o revisor avaliando noutra aba,
    // o admin decidindo uma escalação) e o seletor de projeto as recorta. Um
    // painel que abre com o número da visita anterior é o defeito que o cache
    // do M9 tem duas guardas para evitar — aqui basta não guardar.
    est.metricas = null;
    est.gerar.previa = null;
    await carregarEscalacao();
    desenharAdmin();
    if (est.abaAdmin === "metricas") await carregarMetricas();
  }
}

/** Papel sem ninguém cadastrado: bifurcação, não beco. */
function semPersona(papel) {
  const alvo = { anotador: "#area-trabalho", revisor: "#revisor-fila", admin: "#admin-cards" }[papel];
  const no = $(alvo);
  if (!no) return;
  limpar(no);
  const caixa = el("div", "vazio");
  juntar(caixa,
    el("div", "vazio-titulo", t("semPersona.titulo", { papel: nomePapel(papel).toLowerCase() })),
    el("p", "vazio-linha", t("semPersona.linha")));
  no.appendChild(caixa);
}

async function recarregarSaude() {
  try {
    est.saude = await api("/api/health");
  } catch (e) {
    est.saude = null;
    recado(t("recado.erro_saude", { erro: e.message }), true);
  }
  atualizarContagens();
}

/** As diretrizes vêm do BANCO, com versão — e é essa versão que o servidor
    grava em cada anotação. Uma cópia literal no HTML tornaria impossível
    separar "antes" de "depois" quando a regra mudasse. */
/** O banco de perguntas. Falha em SILÊNCIO de propósito: sem os modelos a aba
    `escrever_rubrica` continua inteira — a pessoa escreve o critério do zero,
    que é o caminho que os modelos existem para encurtar, não para substituir.
    Um erro vermelho aqui interromperia por causa de uma conveniência. */
async function carregarModelosDeRubrica() {
  if (est.modelosRubrica.length) return;
  try {
    const r = await api("/api/modelos-rubrica");
    est.modelosRubrica = r.items || [];
  } catch (_) {
    est.modelosRubrica = [];
  }
}

async function carregarDiretrizes() {
  if (Object.keys(est.diretrizes).length) return;
  try {
    const r = await api("/api/diretrizes");
    est.diretrizes = r.items || {};
  } catch (e) {
    est.diretrizes = {};
    recado(t("recado.erro_diretrizes", { erro: e.message }), true);
  }
}

/** O brief de cada projeto + a taxonomia em que o escopo dele é escrito.

    As duas juntas porque uma não desenha sem a outra: o escopo do brief é uma
    lista de IDS, e sem a taxonomia a tela mostraria `conversa-social` cru.
    Falhar aqui NÃO derruba nada — o painel some, o trabalho continua. Uma
    instrução ausente é ruim; uma tela que não abre por causa dela é pior. */
async function carregarBriefs() {
  if (Object.keys(est.briefs).length) return;
  try {
    const [b, tx] = await Promise.all([api("/api/briefs"), api("/api/taxonomia")]);
    est.briefs = b.items || {};
    est.taxonomia = tx || est.taxonomia;
  } catch (e) {
    est.briefs = {};
    recado(t("recado.erro_briefs", { erro: e.message }), true);
  }
}

/** O nome legível de uma classe da taxonomia, na língua da INTERFACE.

    O canônico é pt-BR (a taxonomia nasceu com o corpus); `nome_en` é o sidecar
    de exibição, o mesmo padrão do `*_i18n` das rubricas. Classe desconhecida cai
    no próprio id — que é a identidade de qualquer jeito, e é o que o escopo
    guarda. */
function nomeDaClasse(secao, id) {
  const entrada = (est.taxonomia[secao] || {})[id];
  if (!entrada) return null;
  return est.idioma === "en" ? entrada.nome_en || entrada.nome : entrada.nome;
}

/** Um chip de categoria: o nome legível + o id, sempre os dois.

    O id fica à vista porque é ELE que o brief guarda e que a anotação vai
    gravar — e porque é o que casa com o banco de prompts. Um chip só com o nome
    traduzido esconderia justamente a parte que atravessa os dois sistemas. */
function chipDeCategoria(secao, id) {
  const chip = el("span", "chip-cat");
  const nome = nomeDaClasse(secao, id);
  if (nome) {
    chip.appendChild(el("span", null, nome + " "));
    chip.appendChild(el("span", "cat-id", id));
  } else {
    chip.appendChild(el("span", "cat-id", id));
  }
  return chip;
}

/** O projeto cujo brief vale AGORA.

    Ordem de precedência, e ela é a do raciocínio: o projeto da TAREFA em mãos
    (o brief que de fato governa o que a pessoa está fazendo), depois o projeto
    em foco no seletor da barra, depois o primeiro que tenha brief. Sem isto, um
    seletor em "todos os projetos" deixaria o painel mudo justamente na abertura
    padrão da tela. */
function projetoDoBriefVigente() {
  const daTarefa = est.envelope && est.envelope.tarefa && est.envelope.tarefa.projeto_id;
  if (daTarefa && est.briefs[String(daTarefa)]) return daTarefa;
  if (est.projeto !== null && est.briefs[String(est.projeto)]) return est.projeto;
  const primeiro = Object.keys(est.briefs)[0];
  return primeiro === undefined ? null : Number(primeiro);
}

/** O bloco de escopo: as categorias que este projeto NÃO cobre.

    Só o que é exclusão entra. Listar as 32 classes em escopo daria um muro que
    ninguém lê, e um escopo que inclui tudo não é escopo — é descrição, e a tela
    diz isso com uma frase. */
function escopoDoBrief(escopo) {
  const caixa = el("div", "brief-escopo");
  caixa.appendChild(el("div", "brief-secao-titulo", t("brief.escopo")));
  const linhas = [
    ["task_type", escopo.task_type_fora || [], "brief.escopo_fora"],
    ["domain", escopo.domain_sem_sft || [], "brief.escopo_sem_sft"],
  ].filter(([, ids]) => ids.length);
  if (!linhas.length) {
    caixa.appendChild(el("p", null, t("brief.escopo_tudo")));
    return caixa;
  }
  for (const [secao, ids, chave] of linhas) {
    const linha = el("div", "brief-escopo-linha");
    linha.appendChild(el("span", "brief-escopo-rotulo", t(chave)));
    for (const id of ids) linha.appendChild(chipDeCategoria(secao, id));
    caixa.appendChild(linha);
  }
  caixa.appendChild(el("div", "brief-escopo-rotulo", t("brief.escopo_nota")));
  return caixa;
}

/** As cinco seções, UMA por vez, mais o escopo sempre à vista.

    Uma aba por seção em vez das cinco empilhadas: medido, empilhadas davam
    1.235px de painel e 1.608px até a área de trabalho numa viewport de 720px.
    É a mesma cura que a matriz do P8 aplicou aos critérios, e pela mesma razão
    — o painel passa a ter a altura da MAIOR seção, não da soma delas.

    O teclado é o mesmo `andarNasAbas` das abas de tipo: uma segunda mecânica de
    seta aqui seria uma segunda coisa para a pessoa aprender no mesmo ecrã. */
function desenharSecoesDoBrief(brief) {
  const textos = (brief.textos && brief.textos[est.idioma]) || {};
  const disponiveis = SECOES_BRIEF.filter(([campo]) => (textos[campo] || []).length);
  if (!disponiveis.some(([campo]) => campo === est.briefSecao)) {
    est.briefSecao = disponiveis.length ? disponiveis[0][0] : null;
  }

  const barra = $("#brief-abas");
  limpar(barra);
  for (const [campo, rotulo] of disponiveis) {
    const b = el("button", "aba", t(rotulo));
    b.type = "button";
    b.setAttribute("role", "tab");
    b.setAttribute("aria-selected", String(est.briefSecao === campo));
    b.addEventListener("click", () => {
      est.briefSecao = campo;
      // Redesenha SÓ o painel, e com `manter`: trocar de seção do brief não
      // pode fechá-lo nem tocar no rascunho da tarefa aberta.
      desenharBrief(true);
    });
    b.addEventListener("keydown", (ev) =>
      andarNasAbas(
        ev,
        disponiveis.map(([campo2]) => ({ id: campo2 })),
        (id) => {
          est.briefSecao = id;
          desenharBrief(true);
        },
        est.briefSecao,
      ));
    barra.appendChild(b);
  }

  const caixa = $("#brief-secao");
  limpar(caixa);
  const bloco = el("div", "brief-secao");
  for (const par of textos[est.briefSecao] || []) bloco.appendChild(el("p", null, par));
  caixa.appendChild(bloco);

  const escopo = $("#brief-escopo");
  limpar(escopo);
  escopo.appendChild(escopoDoBrief(brief.escopo || {}));
}

/** O painel do brief, redesenhado a cada troca de aba, projeto ou idioma.

    `manter` repete o contrato do painel de diretrizes: quem está no meio de uma
    tarefa não pode ver o painel reabrir sozinho. */
function desenharBrief(manter) {
  const det = $("#brief");
  const corpo = $("#brief-corpo");
  if (!det || !corpo) return;

  const projetoId = projetoDoBriefVigente();
  const brief = projetoId === null ? null : est.briefs[String(projetoId)];
  const proj = est.projetos.find((p) => p.id === projetoId);
  // Sem brief publicado o painel some INTEIRO, em vez de virar uma casca com
  // uma frase de erro no topo de toda tarefa. Quem precisa da instrução de
  // conserto é o terminal, e o `pf annotate seed` já a imprime.
  det.hidden = !brief;
  if (!brief) return;

  const nomeProj = proj ? proj.nome : "—";
  const titulo = $("#brief-titulo");
  limpar(titulo);
  titulo.appendChild(
    el("span", null, brief.versao
      ? t("brief.titulo_versao", { projeto: nomeProj, versao: brief.versao })
      : t("brief.titulo", { projeto: nomeProj })));

  desenharSecoesDoBrief(brief);

  // Divulgação progressiva: aberto na primeira visita a ESTE projeto na sessão.
  // Por projeto e não por aba — o brief não muda ao trocar de tipo de tarefa, e
  // reabri-lo a cada aba transformaria a instrução em ruído.
  if (!manter) {
    const primeiraVez = !est.briefsVistos.has(projetoId);
    est.briefsVistos.add(projetoId);
    det.open = primeiraVez;
  }
}

/** Os números da barra. O da fila é PESSOAL (o que sobrou para mim neste
    tipo); o da triagem também, porque exclui as do próprio revisor. */
function atualizarContagens() {
  const fila = $("#fila-conta");
  if (fila) {
    const minhas = est.contagens[est.aba];
    fila.textContent = minhas === undefined
      ? "…"
      : minhas === 0 ? t("fila.conta_zero") : t("fila.conta", { n: n(minhas) });
  }
  const rev = $("#revisor-conta");
  if (rev) {
    // O contador é o da SUB-ABA em foco: com duas filas na mesma tela, um único
    // número somando as duas não diria de qual trabalho ele fala.
    const fonte = est.subaba === "avaliacao" ? est.rr : est.triagem;
    rev.textContent = !fonte ? "…"
      : fonte.total === 0 ? t("revisor.conta_zero") : t("revisor.conta", { n: n(fonte.total) });
  }
  const esc = $("#escalacao-conta");
  if (esc) {
    const fila = est.escalacao;
    esc.textContent = !fila ? "…" : t("admin.escalacao_conta", { n: n(fila.total) });
  }
}

/* ==========================================================================
   5. TELA DO ANOTADOR
   Uma área de trabalho, uma tarefa por vez. As quatro abas são os quatro
   estilos de tarefa; o que muda entre elas é o formulário, não a navegação.
   ========================================================================== */
/** Os limites vêm do SERVIDOR (`/api/health.limites`), que os lê do
    settings.toml. Uma cópia aqui divergiria na primeira vez que o arquivo
    mudasse — e a tela passaria a prometer uma validação que o 422 desmente. */
function lim(chave, padrao) {
  const l = (est.saude && est.saude.limites) || {};
  const v = Number(l[chave]);
  return Number.isFinite(v) && v > 0 ? v : padrao;
}

/** `opcoes.manterDiretrizes` preserva o aberto/fechado do painel de diretrizes.

    Existe por causa da troca de idioma: redesenhar a tela reavaliaria a
    "primeira visita" e fecharia um painel que a pessoa tinha acabado de abrir —
    trocar de língua não pode mexer em nada que não seja língua. */
function desenharAnotador(opcoes) {
  const manter = !!(opcoes && opcoes.manterDiretrizes);
  const barra = $("#abas-anotador");
  limpar(barra);
  for (const x of TIPOS) {
    const b = el("button", "aba", t(x.nome));
    b.type = "button";
    b.setAttribute("role", "tab");
    b.setAttribute("aria-selected", String(est.aba === x.id));
    b.dataset.tipo = x.id;
    const conta = est.contagens[x.id];
    b.appendChild(el("span", "conta", conta === undefined ? "" : n(conta)));
    b.addEventListener("click", () => trocarAba(x.id));
    b.addEventListener("keydown", (ev) => andarNasAbas(ev, TIPOS, trocarAba, est.aba));
    barra.appendChild(b);
  }

  const tp = TIPO_POR_ID[est.aba];
  // O BRIEF PRIMEIRO, e não por estética: a decisão de abrir a diretriz depende
  // de o brief ter aberto ou não neste mesmo quadro.
  desenharBrief(manter);
  const det = $("#diretrizes");

  // Divulgação progressiva: aberta na primeira visita desta aba na sessão —
  // MENOS quando o brief está abrindo no mesmo quadro. Dois painéis de
  // instrução abertos ao mesmo tempo davam 1.608px até a área de trabalho numa
  // viewport de 720px, que é a dor que esta plataforma existe para não ter. O
  // brief ganha a primeira vez porque ele é o enquadramento: ler a mecânica
  // antes dele produz trabalho tecnicamente correto e fora de propósito.
  if (!manter) {
    const primeiraVez = !est.diretrizesVistas.has(tp.id);
    est.diretrizesVistas.add(tp.id);
    det.open = primeiraVez && !$("#brief").open;
  }
  // A VERSÃO fica à vista, e não como detalhe de implementação: é ela que
  // o servidor grava em cada anotação, e é o que responde "sob qual regra
  // isto foi anotado?" sem arqueologia de git. Ela é do CONTEÚDO, não da
  // tradução: `v1` em inglês e `v1` em português são a mesma regra.
  const dir = est.diretrizes[tp.id] || { versao: null, textos: {} };
  const linhas = (dir.textos && dir.textos[est.idioma]) || [];
  $("#diretrizes-titulo").textContent = dir.versao
    ? t("diretrizes.titulo_versao", { tipo: t(tp.nome), versao: dir.versao })
    : t("diretrizes.titulo", { tipo: t(tp.nome) });
  const lista = $("#diretrizes-lista");
  limpar(lista);
  for (const linha of linhas) lista.appendChild(el("li", null, linha));
  if (!linhas.length) lista.appendChild(el("li", null, t("diretrizes.sem")));

  desenharVistas();
  atualizarContagens();
  desenharArea();
}

function desenharVistas() {
  const caixa = $("#vistas");
  limpar(caixa);
  for (const v of VISTAS) {
    const b = el("button", "vista", t(v.nome));
    b.type = "button";
    b.setAttribute("aria-current", String(est.vista === v.id));
    b.addEventListener("click", () => irPara(v.id));
    caixa.appendChild(b);
  }
}

function trocarAba(tipo) {
  if (tipo === est.aba) return;
  est.aba = tipo;
  est.envelope = null;
  est.form = null;
  // O MOTIVO DA FILA VAZIA É DA ABA QUE O PRODUZIU. Sem limpá-lo aqui,
  // `desenharArea` vê um `motivoChave` preenchido, decide que já sabe por que a
  // fila está vazia e NÃO chama `carregarFila` — a aba nova abre mostrando o
  // vazio da aba anterior, com trabalho esperando. Aparece só quando a primeira
  // aba está vazia e a segunda não, que é exatamente o banco real de hoje.
  est.motivo = "";
  est.motivoChave = null;
  est.motivoDados = null;
  est.revelacao = null;
  est.erroModelo = null;
  est.minhas = null;
  est.catalogo = { q: "", lang: "", fonte: "", faixa: "", page: 1, dados: null };
  desenharAnotador();
}

function irPara(vista) {
  est.vista = vista;
  desenharVistas();
  desenharArea();
}

/** Roteia a área de trabalho pela vista atual e dispara o carregamento que
    faltar. Toda a tela do anotador passa por aqui. */
function desenharArea() {
  const area = $("#area-trabalho");
  limpar(area);
  // A REVELAÇÃO do duelo segura a tela até a pessoa pedir a próxima: ela é a
  // única chance de ver quem era quem, e um redesenho (uma troca de idioma, por
  // exemplo) não pode engoli-la.
  if (est.revelacao && est.vista === "fila") { revelarDuelo(est.revelacao); return; }
  if (est.vista === "catalogo") {
    desenharCatalogo(area);
    if (!est.catalogo.dados) carregarCatalogo();
    return;
  }
  if (est.vista === "minhas") {
    desenharMinhas(area);
    if (!est.minhas) carregarMinhas();
    return;
  }
  if (est.vista === "criar") {
    desenharCriar(area);
    if (!est.minhasCriacoes) carregarMinhasCriacoes();
    // `null` = nunca pedido; `{erro:true}` fica parado até um clique — senão um
    // erro de rede viraria um laço de requisições a cada redesenho.
    if (!est.pedido.dados && !est.pedido.carregando) carregarPedidos();
    return;
  }
  desenharFila(area);
  // A FILA PUXA SOZINHA: não existe botão "buscar tarefa". Fechar o laço antes
  // de pedir a próxima coisa é o que impede a tela de perguntar "e agora?".
  if (!est.envelope && !est.carregando && !est.motivo && !est.motivoChave) carregarFila();
}

/* ==========================================================================
   5.1 FILA
   ========================================================================== */

async function carregarFila() {
  est.carregando = true;
  desenharArea();
  try {
    const r = await postar("/api/tarefas/proxima",
      paramsProjeto({ anotador_id: est.persona.id, tipo: est.aba }));
    // O motivo entra como CHAVE + dados, e não como a frase que a rota devolve
    // em `motivo`: ela está em português, e o estado vazio é a primeira coisa
    // que se vê quando a fila acaba.
    aceitarEnvelope(r.tarefa, r.motivo_chave, r.motivo_dados);
  } catch (e) {
    est.envelope = null;
    est.motivoChave = null;
    est.motivo = t("fila.erro_proxima", { erro: e.message });
  } finally {
    est.carregando = false;
  }
  await recarregarContagens();
  desenharArea();
}

/** Recebe (ou não) uma tarefa e prepara o formulário — restaurando o rascunho
    se houver um guardado para esta atribuição. */
function aceitarEnvelope(envelope, motivoChave, motivoDados) {
  est.envelope = envelope || null;
  // A chave fica GUARDADA (e não a frase já traduzida): trocar de idioma com a
  // fila vazia tem de redesenhar o estado vazio na língua nova, e uma frase
  // congelada em `est` ficaria na língua em que a fila esvaziou.
  est.motivoChave = envelope ? null : (motivoChave || null);
  est.motivoDados = motivoDados || null;
  est.motivo = "";
  est.foco = 0;
  est.rascunhoRecuperado = false;
  est.abertoEm = Date.now();
  est.gerando = null;
  est.erroModelo = null;
  est.revelacao = null;
  pararTique();
  if (!envelope) { est.form = null; return; }
  const guardado = lerRascunho(envelope.atribuicao_id);
  if (guardado) {
    est.form = guardado;
    est.rascunhoRecuperado = true;
  } else {
    est.form = formInicial(envelope);
  }
}

function desenharFila(area) {
  const tp = TIPO_POR_ID[est.aba];
  const painel = el("div", "painel");
  const cabeca = el("div", "painel-cabeca");
  juntar(cabeca, el("h2", null, t(tp.titulo)), el("span", "crescer"));
  if (est.envelope) {
    const origem = est.envelope.tarefa.origem;
    cabeca.appendChild(el("span", "fraco", origem === "livre" ? t("fila.origem_livre")
      : origem === "continuacao" ? t("fila.origem_continuacao") : t("fila.origem_fila")));
  }
  painel.appendChild(cabeca);

  if (est.carregando) {
    painel.appendChild(esqueleto("fila.puxando"));
    area.appendChild(painel);
    return;
  }
  if (!est.envelope) {
    painel.appendChild(vazioComSaida(tp));
    area.appendChild(painel);
    return;
  }
  painel.appendChild(desenharWorkspace(est.envelope));
  area.appendChild(painel);
}

/** ESTADO VAZIO COMO BIFURCAÇÃO, nunca um beco: título honesto, o motivo que o
    servidor deu, e as saídas que existem DE VERDADE. */
function vazioComSaida(tp) {
  // O motivo que o servidor deu, traduzido AGORA a partir da chave — nunca a
  // frase pronta que ele mandou junto (ela é a versão em português, e existe
  // para que a API se explique sozinha em /docs).
  const motivo = est.motivo || (est.motivoChave ? t(est.motivoChave, est.motivoDados) : "");
  const caixa = el("div", "vazio");
  juntar(caixa,
    el("div", "vazio-titulo", t(tp.vazioTitulo)),
    el("p", "vazio-linha", motivo || t(tp.vazioLinha)));
  if (motivo) caixa.appendChild(el("p", "vazio-linha fraco", t(tp.vazioLinha)));

  const saidas = el("div", "vazio-saidas");
  const catalogo = el("button", "botao primaria", t("botao.escolher_catalogo"));
  catalogo.type = "button";
  catalogo.addEventListener("click", () => irPara("catalogo"));
  const minhas = el("button", "botao", t("botao.ver_minhas"));
  minhas.type = "button";
  minhas.addEventListener("click", () => irPara("minhas"));
  const virarAdmin = el("button", "botao", t("botao.entrar_admin"));
  virarAdmin.type = "button";
  virarAdmin.addEventListener("click", () => {
    // Com o seletor na barra isto virou UM salto, e não uma volta ao
    // vestíbulo seguida de duas escolhas. O estado vazio deixou de custar
    // três cliques para custar um.
    escolherPapel("admin");
    recado(t("recado.admin_gera"));
  });
  juntar(saidas, catalogo, minhas, virarAdmin);
  caixa.appendChild(saidas);
  return caixa;
}

/* ==========================================================================
   5.2 PEÇAS COMPARTILHADAS DOS WORKSPACES
   ========================================================================== */

/** O prompt, em serifa, com a PROVENIÊNCIA colada embaixo. Texto longo abre
    recortado e expande no clique — o corpus tem prompts de ~1 MB. */
function blocoPrompt(env) {
  const bloco = el("div", "painel-corpo");
  juntar(bloco, el("div", "rotulo-bloco", t("ws.prompt_rotulo")));
  const caixa = el("div", "leitura-caixa");
  caixa.appendChild(el("div", "leitura", env.prompt.text));
  bloco.appendChild(caixa);

  if (env.prompt.n_chars > 1200) {
    const abrir = el("button", "botao discreta", t("botao.mostrar_inteiro"));
    abrir.type = "button";
    abrir.addEventListener("click", () => {
      caixa.classList.toggle("aberta");
      abrir.textContent = caixa.classList.contains("aberta")
        ? t("botao.recolher") : t("botao.mostrar_inteiro");
    });
    bloco.appendChild(abrir);
  }

  const prov = el("div", "proveniencia");
  const selo = el("span", "selo" + (env.prompt.demo ? " demo" : ""),
    env.prompt.demo ? t("ws.prov_demo") : t("ws.prov_fonte", { fonte: env.prompt.fonte }));
  juntar(prov, selo,
    el("span", "selo", t("ws.prov_licenca", { licenca: env.prompt.licenca })),
    el("span", "selo", t("ws.prov_chars", { n: n(env.prompt.n_chars) })),
    el("span", "selo", nomeLingua(env.prompt.lang)));
  // A ATRIBUIÇÃO de um prompt do corpus é DADO: ela vem do `sources.toml`, é
  // exigência da licença (ODC-BY, CC-BY, CC-BY-SA) e sai exatamente como está.
  // A de uma fixture não é atribuição nenhuma — é a tela dizendo que aquilo não
  // é prompt de pessoa nenhuma —, e por isso ela passa pelo dicionário.
  if (env.prompt.demo) prov.appendChild(el("span", null, t("ws.prov_demo_atribuicao")));
  else if (env.prompt.atribuicao) prov.appendChild(el("span", null, env.prompt.atribuicao));
  bloco.appendChild(prov);
  return bloco;
}

/** O nome da língua de um DADO ("português"/"Portuguese"), na língua da tela. */
function nomeLingua(lang) {
  return lang === "pt" ? t("lang.pt") : t("lang.en");
}

/** `modelo-a` → `A`. O rótulo é cego, e o identificador da coluna não é rótulo. */
function rotuloCego(rotulo) { return rotulo === "modelo-a" ? "A" : "B"; }

/* A CONVENÇÃO DE LÍNGUA, POR CAMPO E NA TELA  (P3i)

   O padrão de mercado é assimétrico e não se adivinha: **justificativa,
   comentário de revisão, critério de rubrica e todo metadado saem em inglês**
   (é o que o cliente lê), enquanto **a resposta esperada e a conversa com o
   modelo saem na língua do prompt** (é o dado sendo produzido, e é onde a
   expertise nativa aparece).

   Ela é dita ONDE A DÚVIDA OCORRE — colada ao campo, não numa página de ajuda
   que ninguém abre no meio de uma tarefa —, e é DIRETRIZ, NÃO VALIDAÇÃO: nada
   aqui bloqueia o envio. O anotador pode ter um motivo para desviar (citar um
   trecho do prompt dentro da justificativa, por exemplo) e a plataforma não
   conhece esse motivo. Uma validação aqui produziria um bloqueio que só o
   humano sabe que está errado. */
function dicaLinguaMeta(chave) {
  const caixa = el("div", "lingua-campo");
  juntar(caixa, el("span", "lingua-selo", t("lingua.selo_en")), el("span", null, t(chave)));
  return caixa;
}

/** A dica do campo de DADO: a língua é a do prompt, e o selo mostra qual é. */
function dicaLinguaDado(lang) {
  const caixa = el("div", "lingua-campo dado");
  juntar(caixa,
    el("span", "lingua-selo", lang === "pt" ? t("lingua.selo_pt") : t("lingua.selo_en")),
    el("span", null, lang === "pt" ? t("lingua.dado_pt") : t("lingua.dado_en")));
  return caixa;
}

function blocoResposta(rotulo, texto) {
  const bloco = el("div", "painel-corpo");
  juntar(bloco, el("div", "rotulo-bloco", rotulo));
  const caixa = el("div", "leitura-caixa");
  caixa.appendChild(el("div", "leitura", texto));
  bloco.appendChild(caixa);
  return bloco;
}

function separador(no) {
  no.classList.add("borda-acima");
  return no;
}

/** O ESQUELETO DE CARGA — três barras do tamanho do que vem, no lugar de uma
    frase que pisca.

    "Carregando…" numa área vazia dá dois quadros: nada, e a tela inteira. A
    forma diz de antemão que vem uma lista, e o salto de layout desaparece. A
    frase não some — ela vira `aria-label` da região `status`, que é onde ela
    sempre foi útil de verdade (quem lê por leitor de tela não vê a barra).

    Sem pulso quando o sistema pede movimento reduzido: quem marcou essa
    preferência recebe as barras paradas, e a informação é a mesma. */
function esqueleto(chave) {
  const caixa = el("div", "esqueleto");
  caixa.setAttribute("role", "status");
  caixa.setAttribute("aria-label", t(chave));
  for (let i = 0; i < 3; i++) caixa.appendChild(el("div", "esqueleto-linha"));
  return caixa;
}

/** A ÚNICA ação primária da tela. O que FALTA continua dito antes do clique —
    validação que só existe depois do clique é fricção pura —, mas numa LINHA
    própria acima do botão, e não no rótulo dele: o botão precisa ser sempre o
    mesmo objeto, com o mesmo nome e o mesmo tamanho, ou a ação principal da tela
    se dissolve em algo que muda de forma enquanto a pessoa digita. */
function barraAcoes() {
  const barra = el("div", "acoes");
  const falta = oQueFalta();
  const aviso = el("div", "falta", falta || "");
  aviso.id = "falta-envio";
  aviso.hidden = !falta;
  const enviarBtn = el("button", "botao primaria", t("botao.enviar_proxima"));
  enviarBtn.type = "button";
  enviarBtn.id = "enviar";
  enviarBtn.disabled = !!falta || est.carregando;
  enviarBtn.addEventListener("click", enviar);
  juntar(barra, aviso, enviarBtn, el("span", "atalho", "Ctrl+Enter"));

  barra.appendChild(el("span", "crescer"));
  // O SKIP da fila não abandona direto: abre o leque de motivos do brief v2
  // ("pick the reason from the list. One click, no essay"). Inline e não modal,
  // como toda caixa de decisão desta tela — e o segundo clique no botão fecha,
  // que é o "cancelar" de quem mudou de ideia sem procurar um X.
  const pular = el("button", "botao discreta", t("botao.devolver_pegar_outra"));
  pular.type = "button";
  pular.setAttribute("aria-expanded", String(est.skipAberto));
  pular.addEventListener("click", () => {
    est.skipAberto = !est.skipAberto;
    desenharArea();
  });
  barra.appendChild(pular);
  return barra;
}

/** O leque de motivos de skip — a linha que o brief promete.

    Um botão por motivo; o clique abandona com AQUELE motivo e puxa a próxima.
    Sem textarea: o padrão de skips é dado de alocação, e qualquer pedágio a
    mais empurraria a pessoa para o rating confiante que ela não sustenta. */
function lequeDeSkip() {
  if (!est.skipAberto) return null;
  const caixa = el("div", "skip-motivos");
  caixa.appendChild(el("span", "skip-titulo", t("skip.titulo")));
  for (const [id, chave] of MOTIVOS_SKIP) {
    const b = el("button", "botao skip-motivo", t(chave));
    b.type = "button";
    b.addEventListener("click", () => abandonar(id));
    caixa.appendChild(b);
  }
  const ficar = el("button", "botao discreta", t("skip.cancelar"));
  ficar.type = "button";
  ficar.addEventListener("click", () => {
    est.skipAberto = false;
    desenharArea();
  });
  caixa.appendChild(ficar);
  return caixa;
}

function avisoRascunho() {
  if (!est.rascunhoRecuperado) return null;
  const aviso = el("div", "aviso-rascunho");
  juntar(aviso, el("span", null, t("ws.rascunho_recuperado")));
  const descartar = el("button", "botao discreta", t("botao.descartar_rascunho"));
  descartar.type = "button";
  descartar.addEventListener("click", () => {
    limparRascunho(est.envelope.atribuicao_id);
    est.form = formInicial(est.envelope);
    est.rascunhoRecuperado = false;
    desenharArea();
  });
  aviso.appendChild(descartar);
  return aviso;
}

/** O PRAZO DA VAGA — uma etiqueta com a hora, e nada mais.

    A vaga é devolvida à fila quando o prazo vence (`tarefas.expirar_vencidas`), e
    até agora a primeira notícia disso era o aviso DEPOIS do envio. Saber quando
    ela vence é informação de trabalho, e escondê-la não protege ninguém.

    O QUE ELA NÃO É: um relógio. O valor é calculado UMA VEZ, no desenho, e nunca
    se atualiza sozinho — nada aqui conta para trás e nada pisca. A regra do brief
    ("ninguém cronometra a pessoa") continua valendo inteira: isto é a hora em que
    a plataforma devolve a vaga, não quanto tempo alguém está levando.

    Âmbar (a cor de "devolvido") quando faltam menos de 20 minutos no momento em
    que a tarefa foi aberta: é a diferença entre "há prazo" e "termine ou devolva".
    Sem `expira_em` — o modo livre, que nasce sem prazo — não há etiqueta. */
function etiquetaDePrazo(env) {
  const hora = horaDe(env.expira_em);
  if (!hora) return null;
  const falta = new Date(String(env.expira_em)).getTime() - Date.now();
  const perto = falta < 20 * 60 * 1000;
  return el("span", "etiqueta " + (perto ? "devolvido" : "pendente"),
    t("ws.expira", { hora: hora }));
}

/** Material faltando: BIFURCAÇÃO, nunca beco. A saída principal é a que resolve
    a falta (escrever a rubrica deste mesmo prompt), não "volte e tente outra". */
function semMaterial(titulo, linha) {
  const caixa = el("div", "vazio");
  juntar(caixa, el("div", "vazio-titulo", titulo), el("p", "vazio-linha", linha));
  const saidas = el("div", "vazio-saidas");
  const rubrica = el("button", "botao primaria", t("botao.escrever_rubrica_deste"));
  rubrica.type = "button";
  rubrica.addEventListener("click", async () => {
    const uid = est.envelope.prompt.uid;
    // `devolver`, e não `abandonar`: puxar a próxima da fila aqui deixaria uma
    // atribuição a mais em aberto antes de abrir a que a pessoa pediu.
    await devolver();
    await pegarLivreEm("escrever_rubrica", uid);
  });
  const devolver = el("button", "botao", t("botao.devolver_pegar_outra"));
  devolver.type = "button";
  devolver.addEventListener("click", abandonar);
  juntar(saidas, rubrica, devolver);
  caixa.appendChild(saidas);
  return caixa;
}

/** O comentário do revisor fica ACIMA do formulário, no caminho do olho: no
    re-trabalho, reconhecer é mais barato que reconstruir de memória. */
function blocoDevolucao(env) {
  const anterior = env.versao_anterior;
  if (!anterior) return null;
  // DOIS CAMINHOS DE VOLTA, e o anotador precisa saber por qual dele veio: a
  // triagem devolve, e o admin também devolve ao decidir uma escalação. O
  // segundo é raro — e some sem ninguém notar se a tela só olhar o primeiro.
  const doAdmin = anterior.decisao_admin === "devolvida";
  if (anterior.veredito !== "devolvida" && !doAdmin) return null;
  const caixa = el("div", "devolucao");
  juntar(caixa,
    el("div", "devolucao-titulo", doAdmin
      ? t("ws.devolvida_admin", { versao: anterior.versao })
      : t("ws.devolvida_versao", { versao: anterior.versao })),
    // `.dado`: o comentário sai na língua em que a pessoa o escreveu.
    el("p", "dado", (doAdmin ? anterior.comentario_admin : anterior.comentario_revisor) || ""));
  return caixa;
}

/* O CONTEXTO DE UM WORKSPACE.
   Os quatro `ws*` servem a TRÊS leitores: quem anota (escreve), quem tria (lê)
   e quem avalia no Rate and Review (escreve por cima do que outra pessoa
   escreveu). Os três veem o MESMO layout — mesma rubrica, mesmas escalas,
   mesma ordem —, e a única forma honesta de garantir isso é ser o mesmo
   código: um segundo desenho "de revisão" seria um segundo lugar onde a
   rubrica pode divergir de si mesma, e a divergência apareceria justamente no
   item que está sendo julgado.

   O contexto tem cinco coisas:
   * `form`    — o estado do formulário que este workspace desenha;
   * `leitura` — desliga os ouvintes e trava os campos;
   * `aoDigitar` — cada tecla num campo de texto (barato: não redesenha);
   * `aoMudar`   — mudança ESTRUTURAL (nota, preferência, critério a mais);
   * `motivos`   — o gancho do P3b: devolve a caixa de motivo daquele pedaço do
     payload, ou `null` para quem não precisa dela (anotador e triagem).

   Antes do P3b os dois primeiros eram chamadas diretas a `salvarRascunho()` e
   `salvarEDesenhar()` — funções do ANOTADOR. Com um terceiro leitor que edita
   outro formulário e salva outro rascunho, deixá-las hardcoded faria o revisor
   escrever no rascunho da tarefa que o anotador tem aberta. */
const NADA = () => {};

function ctxEdicao() {
  return {
    form: est.form,
    leitura: false,
    foco: est.foco,
    aoFocar: (i) => { est.foco = i; },
    aoDigitar: () => { salvarRascunho(); atualizarBotaoEnviar(); atualizarEcoDoRail(est.form); },
    aoMudar: salvarEDesenhar,
    motivos: null,
  };
}

function ctxLeitura(form) {
  return {
    form: form, leitura: true, foco: -1,
    aoFocar: NADA, aoDigitar: NADA, aoMudar: NADA, motivos: null,
  };
}

/** O IRMÃO DE `ctxLeitura`: o mesmo workspace, destravado, para o revisor.

    A diferença que importa não é a edição — é o `motivos`: cada campo que o
    revisor altera revela, ali mesmo, o campo do motivo daquela alteração. Ver
    `caixaDeMotivos`. */
function ctxEdicaoRevisor() {
  return {
    form: est.rr.form,
    leitura: false,
    // Marca o terceiro leitor. O que ela desliga são as peças que pertencem a
    // QUEM ANOTA: o aviso de rascunho recuperado, o comentário de devolução (a
    // tela do revisor já o mostra no cabeçalho) e a barra de "Enviar e
    // próxima" — a ação primária daqui é registrar a avaliação, e são coisas
    // diferentes com o mesmo lugar na tela.
    revisor: true,
    foco: est.rr.foco,
    aoFocar: (i) => { est.rr.foco = i; },
    aoDigitar: rrDigitou,
    aoMudar: rrMudou,
    motivos: caixaDeMotivos,
  };
}

function desenharWorkspace(env, ctx) {
  const c = ctx || ctxEdicao();
  const meu = !c.leitura && !c.revisor;   // é o formulário de quem ANOTA?
  const caixa = el("div");
  if (c.leitura) caixa.className = "leitura-modo";
  const aviso = meu ? avisoRascunho() : null;
  const devolucao = meu ? blocoDevolucao(env) : null;
  // O PRAZO é de quem está com a vaga. Quem tria e quem avalia leem o mesmo
  // envelope, e mostrar a eles o prazo de outra pessoa seria um número sem dono.
  const prazo = meu ? etiquetaDePrazo(env) : null;
  const corpo = el("div", "painel-corpo");
  if (devolucao) corpo.appendChild(devolucao);
  if (aviso) corpo.appendChild(aviso);
  if (prazo) corpo.appendChild(prazo);
  if (devolucao || aviso || prazo) caixa.appendChild(corpo);

  caixa.appendChild(blocoPrompt(env));
  const tipo = env.tarefa.tipo;
  if (tipo === "avaliar_rubrica") caixa.appendChild(wsAvaliar(env, c));
  if (tipo === "escrever_rubrica") caixa.appendChild(wsEscrever(env, c));
  if (tipo === "sft_resposta") caixa.appendChild(wsSft(env, c));
  if (tipo === "comparar_ab") caixa.appendChild(wsComparar(env, c));
  if (tipo === "conversa_modelo") caixa.appendChild(wsConversa(env, c));
  if (tipo === "duelo_modelos") caixa.appendChild(wsDuelo(env, c));
  if (meu) {
    caixa.appendChild(barraAcoes());
    const leque = lequeDeSkip();
    if (leque) caixa.appendChild(leque);
  }
  return caixa;
}

/* ==========================================================================
   5.3 AVALIAR COM RUBRICA
   ========================================================================== */

/* ---------------------------------------------------------------------------
   5.2b  A MATRIZ DE CRITÉRIOS  (P8)  —  UM desenhador, três leitores, duas abas
   ---------------------------------------------------------------------------
   Até o P8 existiam DOIS laços de critérios quase verbatim: um em `wsAvaliar` e
   outro em `avaliacaoDaConversa`. Mesmo fallback de escala, mesmo `dataset.foco`,
   mesmo `aria-label`, mesmo `c0.motivos`. Mudar a rubrica exigia mexer nos dois,
   e a primeira vez que alguém esquecesse o segundo a divergência apareceria só
   na aba de conversa — que é onde menos se olha.

   O QUE A MATRIZ TROCA, E POR QUE
   ===============================
   20 fichas de ~120px viram 20 linhas de ~30px porque **as âncoras saem de
   dentro de cada critério e viram rótulo de coluna**, escritas uma vez no topo
   do grupo. É a única mecânica aqui que ataca a rolagem aritmeticamente; o resto
   seria promessa.

   O que se perde: a descrição deixa de estar sempre à vista. Quem a devolve é a
   FAIXA-GUIA no pé da matriz — o painel lateral deitado, ocupando altura fixa em
   vez de largura, seguindo ↑/↓. Ela funciona no teclado e no toque por
   construção: sem hover, sem posicionamento, sem cleanup.

   A matriz é AGNÓSTICA DE ESCALA: ela desenha `max - min + 1` células e lê os
   rótulos das âncoras. Uma rubrica de qualidade 1..5 entra como está; uma de
   severidade é `{min:1, max:3}` com três âncoras. O instrumento é DADO — e é
   isso que o construtor do admin (P5a) vai editar.
--------------------------------------------------------------------------- */

/** Os grupos declarados pela rubrica. Sem `grupo` em ninguém, devolve um grupo
    anônimo — uma rubrica de 4 critérios não ganha abas de cerimônia. */
function gruposDe(criterios) {
  const ordem = [];
  const mapa = new Map();
  criterios.forEach((c, i) => {
    const chave = c.grupo || "";
    if (!mapa.has(chave)) {
      mapa.set(chave, { chave: chave, rotulo: bi(c.grupo_i18n, c.grupo), indices: [] });
      ordem.push(chave);
    }
    mapa.get(chave).indices.push(i);
  });
  return ordem.map((k) => mapa.get(k));
}

function escalaDe(c) {
  return c.escala || { min: 1, max: 5, ancoras: [] };
}

/** A âncora daquele valor, ou `null`. É ela que vira rótulo de coluna. */
function ancoraDe(escala, valor) {
  return (escala.ancoras || []).find((a) => Number(a.valor) === Number(valor)) || null;
}

/** O catálogo de tipos de issue do critério, já normalizado pelo servidor. */
function catalogoDe(c) {
  return Array.isArray(c.tipos_issue) ? c.tipos_issue : [];
}

/** Este critério está sinalizado? (abaixo do topo da escala e não é N/A) */
function sinalizado(c, form, i) {
  const v = form.notas[i];
  return v !== null && v !== undefined && !form.na[i] && v < escalaDe(c).max;
}

/** O que falta NESTE critério para ele poder ser enviado. `null` = nada falta.

    A MESMA conta que `tarefas.erro_contra_a_rubrica` faz no servidor, e o mesmo
    gatilho: só o critério que declara catálogo cobra tipo e frase. Os dois
    concordarem é o que faz a validação parecer instantânea sem deixar de ser do
    servidor — e é por isso que a regra tem um nome dos dois lados. */
function faltaNoCriterio(c, form, i) {
  if (form.na[i]) return (form.motivosNa[i] || "").trim() ? null : "falta.motivo_na";
  const v = form.notas[i];
  if (v === null || v === undefined) return "falta.sem_nota";
  if (!catalogoDe(c).length || !sinalizado(c, form, i)) return null;
  const marcados = Object.values(form.issues[i] || {}).some(Boolean);
  if (!marcados) return "falta.sem_tipo";
  if (!(form.justificativas[i] || "").trim()) return "falta.sem_frase";
  return null;
}

/** O que falta na matriz inteira, já como frase — e nomeando o GRUPO.

    "3 criteria with no score in Content and truthfulness" em vez de "3 de 20
    sem nota". O botão já era o lugar onde este produto diz o que falta; com
    grupos ele passa a dizer ONDE, que é a diferença entre um número e uma
    instrução. É também a terceira camada que impede um grupo não preenchido de
    ficar invisível — as outras duas são a contagem na aba e o bloqueio do envio. */
/** Os índices dos critérios PRINCIPAIS (tudo que não é overall). */
function indicesPrincipais(criterios) {
  return criterios.map((c, i) => i).filter((i) => !criterios[i].resumo);
}

/** O overall está TRANCADO até todo critério principal estar decidido.

    Não é cerimônia: um overall dado ANTES dos detalhes é uma âncora que
    contamina os detalhes — decide-se "adequado" e retro-preenchem-se os
    critérios para bater com ele. Isso é invisível em qualquer auditoria
    posterior, e nenhum outro mecanismo desta tela o impede. Dado DEPOIS, ele é
    um resumo, que é o que ele diz ser. */
function overallTravado(criterios, form) {
  return indicesPrincipais(criterios).some((i) => faltaNoCriterio(criterios[i], form, i));
}

function faltaNaMatriz(criterios, form) {
  // Os principais primeiro, sempre: enquanto eles faltam, o overall está
  // travado e apontar para ele mandaria a pessoa para um controle que não
  // responde.
  const ordem = gruposDe(criterios).map((g) => ({
    ...g,
    indices: g.indices.slice().sort((a, b) => (criterios[a].resumo ? 1 : 0) - (criterios[b].resumo ? 1 : 0)),
  }));
  for (const g of ordem) {
    const pendentes = g.indices.filter((i) => faltaNoCriterio(criterios[i], form, i));
    if (!pendentes.length) continue;
    const i = pendentes[0];
    const chave = faltaNoCriterio(criterios[i], form, i);
    if (chave === "falta.sem_nota" && pendentes.length > 1) {
      return g.chave
        ? t("falta.notas_no_grupo", { n: n(pendentes.length), grupo: g.rotulo })
        : t("falta.notas", { n: n(pendentes.length), total: n(criterios.length) });
    }
    return t(chave, { criterio: bi(criterios[i].nome_i18n, criterios[i].nome) });
  }
  return null;
}

/** Uma célula da matriz: um valor da escala, com o rótulo da âncora dentro. */
function celulaDeSeveridade(c, i, valor, c0, nomeC) {
  const form = c0.form;
  const escala = escalaDe(c);
  const ancora = ancoraDe(escala, valor);
  const rotulo = ancora ? bi(ancora.rotulo_i18n, ancora.rotulo) : String(valor);
  const b = el("button", "celula");
  b.type = "button";
  const marcada = form.notas[i] === valor && !form.na[i];
  b.setAttribute("aria-pressed", String(marcada));
  b.setAttribute("aria-label", t("a11y.nota", { criterio: nomeC, valor: rotulo }));
  // A CÉLULA NÃO CARREGA O TEXTO DA ÂNCORA, e isto foi medido: com o rótulo
  // dentro, uma rubrica cujas âncoras diferem por critério produziu linhas de
  // 175px — pior que as fichas de 120px que a matriz veio substituir. Texto
  // longo dentro de uma célula estreita quebra em cinco linhas; truncado, não
  // se lê. O rótulo mora em três lugares que cabem: o cabeçalho de coluna
  // (quando a escala é a mesma no grupo inteiro), a faixa-guia do critério em
  // foco, e o ⓘ. O `aria-label` acima o carrega inteiro para quem usa leitor.
  b.appendChild(el("span", "celula-num", String(valor)));
  // …COM UMA EXCEÇÃO, e ela é o telefone: abaixo de 900px a matriz vira ficha e
  // o cabeçalho de coluna deixa de existir, e aí a célula fica com o número
  // pelado. O nó nasce sempre e o CSS o esconde acima de 900px (`.celula-ancora`)
  // — assim girar o aparelho não depende de redesenhar nada. É DADO (vem por
  // `bi()`), então nunca passa por `t()`.
  if (ancora && rotulo !== String(valor)) {
    b.appendChild(el("span", "celula-rotulo celula-ancora", rotulo));
  }
  if (c0.leitura) {
    b.tabIndex = -1;
  } else {
    b.addEventListener("click", () => {
      c0.aoFocar(i);
      form.na[i] = false;
      graduarEm(c0, i, valor);
    });
  }
  // O EXEMPLO daquela nota naquele critério, em disclosure INLINE.
  // Nunca overlay: dentro de uma coluna com `overflow:auto` um balão sofre
  // clipping, e cobrir justamente as âncoras que se está comparando é o pior
  // lugar possível para um painel. Nada de `title=` — é invisível no toque e
  // no teclado.
  if (ancora && bi(ancora.exemplo_i18n, ancora.exemplo)) {
    b.dataset.exemplo = bi(ancora.exemplo_i18n, ancora.exemplo);
  }
  return b;
}

/** A linha de chips do critério sinalizado. `null` quando não há catálogo. */
function chipsDeIssue(c, i, c0) {
  const catalogo = catalogoDe(c);
  const form = c0.form;
  if (!catalogo.length) return null;
  if (!sinalizado(c, form, i)) return null;
  const linha = el("div", "chips");
  linha.appendChild(el("span", "chips-rotulo", t("ws.tipos_issue")));
  catalogo.forEach((tipo) => {
    const marcado = !!(form.issues[i] || {})[tipo.id];
    if (c0.leitura && !marcado) return;
    const b = el("button", "chip", bi(tipo.rotulo_i18n, tipo.rotulo || tipo.id));
    b.type = "button";
    b.setAttribute("aria-pressed", String(marcado));
    if (c0.leitura) b.tabIndex = -1;
    else b.addEventListener("click", () => {
      form.issues[i] = { ...(form.issues[i] || {}) };
      form.issues[i][tipo.id] = !marcado;
      c0.aoMudar();
    });
    linha.appendChild(b);
  });
  return linha;
}

/** Uma linha da matriz: nome + ⓘ · células · N/A · (chips) · (frase) · (motivo). */
function linhaDeCriterio(c, i, c0) {
  const form = c0.form;
  const escala = escalaDe(c);
  const nomeC = bi(c.nome_i18n, c.nome);
  const linha = el("div", "criterio linha-matriz");
  linha.dataset.foco = String(!c0.leitura && c0.foco === i);
  if (faltaNoCriterio(c, form, i) && !c0.leitura) linha.dataset.pendente = "true";

  const grade = el("div", "matriz-linha");
  // O número de colunas é a ESCALA da rubrica, que é dado: o CSS não pode
  // saber se são 3 ou 5, então o JS lhe conta.
  grade.style.setProperty("--cols", String(escala.max - escala.min + 1));
  const rotulo = el("div", "matriz-nome");
  rotulo.appendChild(el("span", null, nomeC));
  // A rubrica que não declarou escala é MARCADA, nunca disfarçada: sem isso a
  // tela desenharia cinco botões mudos para um instrumento de três e mediria
  // outra coisa, sem nada avisando. (Ver `tarefas.normalizar_criterio`.)
  if (c.escala_declarada === false) {
    const selo = el("span", "selo alerta", t("ws.sem_escala"));
    selo.title = t("ws.sem_escala_dica");
    rotulo.appendChild(selo);
  }
  const info = el("button", "info");
  info.type = "button";
  info.textContent = "ⓘ";
  info.setAttribute("aria-expanded", "false");
  info.setAttribute("aria-label", t("a11y.explicar", { criterio: nomeC }));
  rotulo.appendChild(info);
  grade.appendChild(rotulo);

  for (let v = escala.min; v <= escala.max; v++) {
    grade.appendChild(celulaDeSeveridade(c, i, v, c0, nomeC));
  }

  const na = el("button", "celula celula-na");
  na.type = "button";
  na.setAttribute("aria-pressed", String(!!form.na[i]));
  na.setAttribute("aria-label", t("a11y.na", { criterio: nomeC }));
  na.appendChild(el("span", "celula-rotulo", t("ws.na")));
  if (c0.leitura) na.tabIndex = -1;
  else na.addEventListener("click", () => { c0.aoFocar(i); alternarNa(c0, i); });
  grade.appendChild(na);
  linha.appendChild(grade);

  // O exemplo da célula e a descrição do critério, INLINE, empurrando o resto
  // para baixo. Um nó por linha, criado só quando aberto.
  const painel = el("div", "explica");
  painel.hidden = true;
  info.addEventListener("click", () => {
    const aberto = info.getAttribute("aria-expanded") === "true";
    info.setAttribute("aria-expanded", String(!aberto));
    painel.hidden = aberto;
    if (!aberto && !painel.firstChild) desenharExplica(painel, c);
  });
  linha.appendChild(painel);

  if (form.na[i]) {
    const campo = el("textarea");
    campo.rows = 1;
    campo.className = "largo";
    campo.placeholder = t("ws.motivo_na_ph");
    // O `placeholder` some ao primeiro caractere: ele nunca foi nome acessível.
    campo.setAttribute("aria-label", t("a11y.motivo_na", { criterio: nomeC }));
    campo.value = form.motivosNa[i] || "";
    if (c0.leitura) campo.readOnly = true;
    else campo.addEventListener("input", () => {
      form.motivosNa[i] = campo.value; c0.aoDigitar();
    });
    if (!c0.leitura || campo.value) linha.appendChild(juntar(el("div", "linha-just"), campo));
  } else {
    const chips = chipsDeIssue(c, i, c0);
    if (chips) linha.appendChild(chips);
    linha.appendChild(fraseDoCriterio(c, i, c0));
  }
  // O MOTIVO DE CADA MUDANÇA, colado ao critério que mudou (P3b). O prefixo
  // cobre nota, N/A, cada tipo de issue e a frase — todos são caminhos sob ele,
  // então `rrSincronizar` os reconcilia sem uma linha nova.
  if (c0.motivos) linha.appendChild(c0.motivos("notas." + i + "."));
  return linha;
}

/** O conteúdo do disclosure: descrição + uma linha por âncora com o exemplo. */
function desenharExplica(painel, c) {
  const desc = bi(c.descricao_i18n, c.descricao);
  if (desc) painel.appendChild(el("div", "criterio-desc", desc));
  const ancoras = (escalaDe(c).ancoras || []).slice().sort((a, b) => a.valor - b.valor);
  for (const a of ancoras) {
    const linha = el("div", "explica-ancora");
    juntar(linha,
      el("span", "explica-valor", String(a.valor)),
      el("span", "explica-rotulo", bi(a.rotulo_i18n, a.rotulo)),
      el("span", "explica-exemplo", bi(a.exemplo_i18n, a.exemplo) || ""));
    painel.appendChild(linha);
  }
}

/** A frase que explica a nota. Ela NASCE do ato de sinalizar quando o critério
    tem catálogo — deixa de ser a exceção atrás de um botão e passa a ser
    consequência. É a resposta direta a "rationale que não explica os ratings". */
function fraseDoCriterio(c, i, c0) {
  const form = c0.form;
  const nomeC = bi(c.nome_i18n, c.nome);
  const caixa = el("div", "linha-just");
  const obrigatoria = catalogoDe(c).length > 0 && sinalizado(c, form, i);
  const escrito = form.justificativas[i];
  if (!obrigatoria && (escrito === null || escrito === undefined)) {
    // O convite a justificar aparece SÓ na linha em foco. Medido: com ele em
    // todas as linhas a matriz custava 95px por critério — o botão sozinho
    // valia ~35px, e vinte deles apagavam a compressão inteira. Ele é a exceção
    // do trabalho, e uma exceção não pode ocupar altura em cada linha.
    if (!c0.leitura && c0.foco === i) {
      const pedir = el("button", "botao discreta", t("botao.justificar"));
      pedir.type = "button";
