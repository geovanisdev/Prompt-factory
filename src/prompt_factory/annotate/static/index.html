    det.appendChild(el("div", "vazio-linha",
      rr.carregando ? t("rr.abrindo") : t("rr.erro_abrir")));
    return;
  }
  const env = rr.detalhe;
  const a = env.anotacao;
  // As caixas de motivo são registradas DURANTE o desenho do workspace, então
  // a lista tem de nascer vazia a cada redesenho — senão ela acumularia nós
  // que já saíram do DOM e `rrSincronizar` escreveria em elementos órfãos.
  rr.caixas = [];

  const cabeca = el("div", "triagem-cabeca");
  juntar(cabeca,
    el("span", "etiqueta pendente", t("rr.versao", { n: a.versao })),
    el("span", rr.minha ? "eu" : "fraco",
      rr.minha ? t("rr.por_voce") : t("rr.por", { nome: a.anotador })),
    el("span", "fraco", (a.submetida_em || "").slice(0, 19).replace("T", " ")),
    el("span", "crescer"),
    env.tarefa.projeto ? el("span", "fraco dado", env.tarefa.projeto + " · ") : null,
    el("span", "fraco", a.payload_schema
      + (a.versao_diretriz ? " · " + t("triagem.diretriz", { n: a.versao_diretriz }) : "")));
  det.appendChild(cabeca);
  if (rr.minha) {
    const aviso = faixaSoloDe(rr);
    if (aviso) det.appendChild(aviso);
  }
  // A PASSAGEM 1 À VISTA. "Quem aprovou isto, e com que comentário" é o que
  // separa "a triagem errou" de "o anotador errou" — e é a diferença que a
  // escala 1 registra.
  if (rr.triagemDoItem) {
    const tri = el("div", "painel-corpo");
    juntar(tri, el("span", "fraco", t("rr.triagem", { nome: rr.triagemDoItem.revisor })));
    if (rr.triagemDoItem.comentario) {
      // `.dado`: o comentário foi escrito por uma pessoa e sai como ela o
      // escreveu, na língua dela.
      tri.appendChild(el("p", "secundario dado",
        t("rr.triagem_comentario", { comentario: rr.triagemDoItem.comentario })));
    }
    det.appendChild(tri);
  }
  if (rr.rascunhoRecuperado) {
    const aviso = el("div", "painel-corpo");
    const caixa = el("div", "aviso-rascunho");
    juntar(caixa, el("span", null, t("rr.rascunho")));
    const descartar = el("button", "botao discreta", t("botao.descartar_rascunho"));
    descartar.type = "button";
    descartar.addEventListener("click", () => {
      limparRascunhoRR(rr.sel);
      rr.form = JSON.parse(JSON.stringify(rr.original));
      rr.antes = null;
      rr.depois = null;
      rr.justificativa = "";
      rr.motivos = {};
      rr.rascunhoRecuperado = false;
      desenharDetalheRR();
    });
    caixa.appendChild(descartar);
    aviso.appendChild(caixa);
    det.appendChild(aviso);
  }

  /* ---- 1. o trabalho como chegou ---- */
  const antes = el("div", "rr-secao");
  juntar(antes,
    el("div", "rr-secao-titulo", t("rr.antes_titulo")),
    el("p", "rr-secao-nota", t("rr.antes_nota")),
    escalaRR(ESCALA_ANTES, rr.antes, "a11y.escala_antes", (id) => {
      rr.antes = id;
      salvarRascunhoRR();
      desenharDetalheRR();
    }));
  det.appendChild(antes);

  /* ---- 2. corrigir no lugar ---- */
  const corrigir = el("div", "rr-secao");
  juntar(corrigir,
    el("div", "rr-secao-titulo", t("rr.corrigir_titulo")),
    el("p", "rr-secao-nota", t("rr.corrigir_nota")));
  det.appendChild(corrigir);
  // O MESMO workspace do anotador, destravado. Ver `ctxEdicaoRevisor`.
  det.appendChild(desenharWorkspace(env, ctxEdicaoRevisor()));
  // A caixa de ÚLTIMO RECURSO: um caminho que nenhum prefixo reivindicou cai
  // aqui em vez de virar uma mudança impossível de justificar (e um botão que
  // nunca destrava). Ela é registrada por último de propósito.
  det.appendChild(caixaDeMotivos(""));

  /* ---- o resumo do diff ---- */
  const resumo = el("div", "diff");
  resumo.id = "rr-diff";
  det.appendChild(resumo);

  /* ---- 3. o resultado ---- */
  const depois = el("div", "rr-secao");
  juntar(depois,
    el("div", "rr-secao-titulo", t("rr.depois_titulo")),
    el("p", "rr-secao-nota", t("rr.depois_nota")),
    escalaRR(ESCALA_DEPOIS, rr.depois, "a11y.escala_depois", (id) => {
      rr.depois = id;
      salvarRascunhoRR();
      desenharDetalheRR();
    }));
  det.appendChild(depois);

  /* ---- 4. por quê ---- */
  const just = el("div", "rr-secao");
  const minimo = lim("min_chars_avaliacao", 30);
  juntar(just,
    el("div", "rr-secao-titulo", t("rr.just_titulo")),
    el("p", "rr-secao-nota", t("rr.just_nota")));
  const area = el("textarea");
  area.rows = 4;
  area.className = "largo";
  area.placeholder = t("rr.just_ph", { min: minimo });
  area.value = rr.justificativa || "";
  const contador = el("div", "contador",
    t("ws.contador_de", { n: n((rr.justificativa || "").trim().length), min: minimo }));
  area.addEventListener("input", () => {
    rr.justificativa = area.value;
    contador.textContent = t("ws.contador_de",
      { n: n(area.value.trim().length), min: minimo });
    salvarRascunhoRR();
    rrAtualizarBotao();
  });
  juntar(just, area, contador, dicaLinguaMeta("lingua.meta"));
  det.appendChild(just);

  /* ---- a única ação primária ---- */
  const acoes = el("div", "triagem-acoes");
  const registrar = el("button", "botao primaria", "");
  registrar.type = "button";
  registrar.id = "rr-registrar";
  registrar.addEventListener("click", registrarAvaliacao);
  juntar(acoes, registrar, el("span", "atalho", "Ctrl+Enter"));
  det.appendChild(acoes);

  // Primeiro desenho do resumo e do botão, já com o rascunho recuperado dentro.
  rrSincronizar();
}

async function registrarAvaliacao() {
  const rr = est.rr;
  if (!rr || !rr.sel || rr.carregando || rrOQueFalta()) return;
  const alvo = rr.sel;
  const i = rr.itens.findIndex((x) => x.anotacao_id === alvo);
  const proximo = rr.itens[i + 1] || rr.itens[i - 1] || null;
  const corpo = {
    revisor_id: est.persona.id,
    avaliacao_antes: rr.antes,
    avaliacao_depois: rr.depois,
    justificativa: (rr.justificativa || "").trim(),
    edicoes: rr.diff.map((d) => ({
      campo: d.campo,
      valor_antes: comoTexto(d.antes),
      valor_depois: comoTexto(d.depois),
      motivo: (rr.motivos[d.campo] || "").trim(),
    })),
    // Medido e enviado — e invisível para quem avalia, como no anotador.
    tempo_ativo_ms: Math.max(0, Date.now() - rr.abertoEm),
  };
  // Só quando houve mudança: mandar uma cópia idêntica do payload diria ao
  // banco que houve correção onde não houve.
  if (rr.diff.length) corpo.payload_corrigido = montarPayload(rr.detalhe, rr.form);
  rr.carregando = true;
  rrAtualizarBotao();
  try {
    const r = await postar("/api/avaliacao/" + alvo, corpo);
    limparRascunhoRR(alvo);
    recado(r.status === "escalada" ? t("recado.escalada")
      : r.status === "descartada" ? t("recado.descartada") : t("recado.avaliada"));
  } catch (e) {
    rr.carregando = false;
    recado(e.message, true);
    rrAtualizarBotao();
    return;
  }
  rr.carregando = false;
  // FECHAR O LOOP: o próximo item assume o lugar sozinho.
  await carregarRR(proximo ? proximo.anotacao_id : null);
  await recarregarSaude();
}

/* ==========================================================================
   7. PAINEL DO ADMIN
   O único lugar do P1 com números de verdade em quantidade: contagens do banco
   da plataforma, estado dos dois bancos e a origem ativa do pool.
   ========================================================================== */
function desenharAdmin() {
  const s = est.saude;
  const c = (s && s.anotacao && s.anotacao.contagens) || {};

  const cards = $("#admin-cards");
  limpar(cards);
  const numeros = [
    [c.anotadores, "admin.card_anotadores", "admin.card_anotadores_nota"],
    [c.tarefas, "admin.card_tarefas", "admin.card_tarefas_nota"],
    [c.anotacoes, "admin.card_anotacoes", "admin.card_anotacoes_nota"],
    [c.revisoes, "admin.card_revisoes", "admin.card_revisoes_nota"],
    [c.avaliacoes, "admin.card_avaliacoes", "admin.card_avaliacoes_nota"],
    [c.criacoes, "admin.card_criacoes", "admin.card_criacoes_nota"],
  ];
  for (const [valor, rotulo, nota] of numeros) {
    const card = el("div", "card");
    juntar(card,
      el("div", "card-valor", n(valor || 0)),
      el("div", "card-rotulo", t(rotulo)),
      el("div", "card-nota", t(nota)));
    cards.appendChild(card);
  }

  /* ---- pool ---- */
  const p = (s && s.pool) || null;
  const et = $("#pool-etiqueta");
  limpar(et);
  et.className = "etiqueta " + (p && p.origem !== "fallback" ? "aprovado" : "devolvido");
  juntar(et, el("span", "ponto"),
    el("span", null, p
      ? (p.origem === "fallback" ? t("admin.pool_fallback") : t("admin.pool_curada"))
      : t("admin.pool_desconhecido")));

  const linhas = $("#pool-linhas");
  limpar(linhas);
  const pol = (p && p.politica_licenca) || null;
  // A CLASSE do valor vem da própria linha, e não de um `startsWith` no rótulo:
  // com dois idiomas, casar pelo texto do rótulo quebraria em um deles — e
  // quebraria em silêncio, num alinhamento de número.
  // As quatro frases DIAGNÓSTICAS deste painel vêm do servidor como CHAVE +
  // dados, e não como texto pronto: elas explicam a proveniência, que é a
  // segunda coisa que o brief manda um avaliador procurar, e o servidor fala
  // uma língua só. (`p.motivo`, `p.filtro_fallback` e `p.nota_nsfw` continuam
  // vindo em português na mesma resposta — para /docs e para o terminal.)
  const pares = p ? [
    ["admin.pool_origem", p.origem, null],
    ["admin.pool_itens", n(p.n_pool), "num"],
    ["admin.pool_por_que", p.motivo_chave ? t(p.motivo_chave, p.motivo_dados) : "-", null],
    ["admin.pool_colecao", p.colecao, null],
    ["admin.pool_filtro", p.filtro ? t(p.filtro.chave, p.filtro.dados) : "-", null],
    // A POLÍTICA DE LICENÇA e o número que ela exclui. Sem o número, "política
    // ativa" é promessa; com ele, é medida — e foi a ausência dela que deixou
    // 9.148 linhas cc-by-nc entrarem no trabalho sem ninguém ver.
    ["admin.pool_politica", pol && pol.descricao_chave ? t(pol.descricao_chave) : "-", null],
    ["admin.pool_excluidas", n(p.excluidas_por_licenca || 0), "num"],
    // A VERDADE sobre a garantia de NSFW, em vez de "sem NSFW".
    ["admin.pool_nsfw", p.nota_nsfw_chave ? t(p.nota_nsfw_chave) : "-", null],
    ["admin.pool_materializado", (p.materializado_em || "-").slice(0, 19).replace("T", " "), null],
    ["admin.pool_build", p.build_do_pool || "-", "mono"],
    // O MODO SOLO no painel, e não só na fila do revisor: quem lê as métricas
    // precisa saber se a taxa de aprovação veio de revisão cruzada ou de
    // autorrevisão. São números diferentes com o mesmo nome.
    ["admin.pool_autorrevisao", (est.saude && est.saude.modo_solo)
      ? t("admin.pool_autorrevisao_on") : t("admin.pool_autorrevisao_off"), null],
  ] : [["admin.pool_estado", t("admin.pool_sem_health"), null]];
  for (const [rotulo, valor, classe] of pares) {
    linhas.appendChild(el("dt", null, t(rotulo)));
    linhas.appendChild(el("dd", classe, valor));
  }

  /* ---- escalação ---- */
  desenharEscalacao();

  /* ---- projetos ---- */
  desenharProjetosAdmin();

  /* ---- equipe ---- */
  desenharEquipe();

  /* ---- bancos ---- */
  const bancos = $("#bancos-linhas");
  limpar(bancos);
  const a = (s && s.anotacao) || {};
  const co = (s && s.corpus) || {};
  const dados = [
    ["admin.banco_plataforma", a.arquivo || "-", "mono"],
    ["admin.banco_schema", String(a.schema_version ?? "-"), "num"],
    ["admin.banco_corpus", co.arquivo || "-", "mono"],
    ["admin.banco_prompts", n(co.n_prompts), "num"],
    ["admin.banco_build", co.db_build_id || "-", "mono"],
    ["admin.banco_construido", co.built_at || "-", null],
  ];
  for (const [rotulo, valor, classe] of dados) {
    bancos.appendChild(el("dt", null, t(rotulo)));
    bancos.appendChild(el("dd", classe, valor));
  }

  /* ---- roteiro ---- */
  const rot = $("#roteiro");
  limpar(rot);
  for (const [marco, chave] of ROTEIRO) {
    const li = el("li");
    juntar(li, el("b", null, marco + " — "), el("span", null, t(chave)));
    rot.appendChild(li);
  }

  /* ---- formulário de equipe ---- */
  // Reconstruído a cada desenho, e não só quando está vazio: o rótulo dos
  // papéis muda de língua, e um `if (!options.length)` deixaria a lista na
  // língua da primeira montagem para sempre.
  const sel = $("#admin-papel");
  const escolhido = sel.value;
  limpar(sel);
  for (const pp of PAPEIS) {
    const o = el("option", null, t(pp.nome));
    o.value = pp.id;
    sel.appendChild(o);
  }
  if (escolhido) sel.value = escolhido;
}

/* ---- A ESCALAÇÃO (P3b) ------------------------------------------------------
   `borderline_admin` no Rate and Review cria o item aqui, e a decisão do admin
   ENCERRA — aprovando, devolvendo ou descartando. É o único caminho pelo qual
   um item que passou da triagem volta ao anotador, e ele existe porque quem o
   percorre é o admin, com o parecer do revisor em mãos: a passagem 2 não se
   contradiz devolvendo o que ela mesma acabou de aprovar.

   O parecer inteiro fica À VISTA no item — as duas notas, a justificativa e o
   diff com o motivo de cada mudança. Mandar o admin abrir outra tela para ler
   aquilo faria a escalação custar mais que o problema que ela resolve. */
async function carregarEscalacao() {
  try {
    const r = await api(comParams("/api/escalacao/fila", { admin_id: est.persona.id }));
    est.escalacao = {
      itens: r.items || [], total: r.total || 0,
      sel: est.escalacao && est.escalacao.sel, decisao: null, comentario: "",
      carregando: false,
    };
  } catch (e) {
    est.escalacao = { itens: [], total: 0, sel: null, decisao: null, comentario: "",
                      carregando: false, erro: e.message };
    recado(t("admin.escalacao_erro", { erro: e.message }), true);
  }
}

function desenharEscalacao() {
  const lista = $("#escalacao-lista");
  if (!lista) return;
  limpar(lista);
  const fila = est.escalacao;
  atualizarContagens();
  if (!fila || !fila.itens.length) {
    const vazia = el("div", "vazio");
    juntar(vazia,
      el("div", "vazio-titulo", t("admin.escalacao_vazia")),
      el("p", "vazio-linha", t("admin.escalacao_vazia_linha")));
    lista.appendChild(vazia);
    return;
  }
  for (const item of fila.itens) {
    lista.appendChild(cartaoEscalado(item));
  }
}

function nomeDaEscala(opcoes, id) {
  const achado = opcoes.find((o) => o.id === id);
  return achado ? t(achado.nome) : String(id || "");
}

function cartaoEscalado(item) {
  const fila = est.escalacao;
  const cartao = el("div", "escalado");
  const topo = el("div", "escalado-topo");
  juntar(topo,
    el("strong", null, nomeTipo(item.tipo)),
    el("span", "fraco", t("admin.escalacao_por",
      { rev: item.revisor, aut: item.anotador })),
    el("span", "crescer"));
  if (item.projeto) topo.appendChild(el("span", "fraco dado", item.projeto));
  topo.appendChild(el("span", "etiqueta devolvido", t("admin.escalacao_escalas", {
    nota1: nomeDaEscala(ESCALA_ANTES, item.avaliacao_antes),
    nota2: nomeDaEscala(ESCALA_DEPOIS, item.avaliacao_depois),
  })));
  cartao.appendChild(topo);
  cartao.appendChild(el("div", "escalado-trecho dado",
    item.disponivel ? item.prompt : t("triagem.prompt_sumiu")));
  // A justificativa do revisor é DADO: sai na língua em que foi escrita.
  cartao.appendChild(el("div", "escalado-just dado", item.justificativa));
  cartao.appendChild(el("div", "fraco", item.edicoes.length
    ? t("admin.escalacao_edicoes", { n: n(item.edicoes.length) })
    : t("admin.escalacao_sem_edicoes")));
  for (const ed of item.edicoes) {
    const linha = el("div", "diff-item");
    juntar(linha, el("div", "diff-campo", ed.campo));
    const valores = el("div", "diff-valores");
    juntar(valores,
      el("span", "de", t("rr.diff_de") + ": " + (ed.valor_antes === null ? t("rr.diff_nada") : ed.valor_antes)),
      el("span", "para", t("rr.diff_para") + ": " + (ed.valor_depois === null ? t("rr.diff_nada") : ed.valor_depois)));
    linha.appendChild(valores);
    linha.appendChild(el("div", "diff-motivo dado", ed.motivo));
    cartao.appendChild(linha);
  }

  const aberto = fila.sel === item.avaliacao_id;
  const acoes = el("div", "escalado-acoes");
  const piso = lim("min_chars_devolucao", 20);
  const escolher = (id) => {
    fila.sel = item.avaliacao_id;
    fila.decisao = fila.decisao === id && aberto ? null : id;
    if (fila.decisao !== "devolvida") fila.comentario = fila.comentario || "";
    desenharEscalacao();
  };
  acoes.appendChild(escalaRR(DECISOES, aberto ? fila.decisao : null, "a11y.decisao", escolher));
  cartao.appendChild(acoes);

  if (!aberto || !fila.decisao) return cartao;

  const area = el("textarea");
  area.rows = 2;
  area.placeholder = t("admin.escalacao_ph", { min: piso });
  area.value = fila.comentario || "";
  // Mora no ESTADO, como o comentário da triagem: trocar de idioma no meio de
  // uma decisão redesenha o painel, e o que já foi escrito tem de continuar aqui.
  area.addEventListener("input", () => {
    fila.comentario = area.value;
    rotular();
  });
  cartao.appendChild(area);
  cartao.appendChild(dicaLinguaMeta("lingua.meta"));

  const rodape = el("div", "escalado-acoes");
  const enviar = el("button", "botao primaria", "");
  enviar.type = "button";
  const rotular = () => {
    // A ÚNICA ação primária deste cartão, e ela diz o que falta antes do clique
    // — o mesmo contrato do resto da plataforma.
    const escrito = (fila.comentario || "").trim().length;
    const falta = !fila.decisao ? t("falta.decisao")
      : (fila.decisao === "devolvida" && escrito < piso)
        ? t("falta.devolucao", { n: piso - escrito })
        : null;
    enviar.textContent = falta || t("botao.decidir");
    enviar.disabled = !!falta || fila.carregando;
  };
  rotular();
  enviar.addEventListener("click", () => decidirEscalacao(item.avaliacao_id));
  const cancelar = el("button", "botao discreta", t("botao.cancelar"));
  cancelar.type = "button";
  cancelar.addEventListener("click", () => {
    fila.decisao = null;
    fila.comentario = "";
    desenharEscalacao();
  });
  juntar(rodape, enviar, cancelar);
  cartao.appendChild(rodape);
  return cartao;
}

async function decidirEscalacao(avaliacaoId) {
  const fila = est.escalacao;
  if (!fila || !fila.decisao || fila.carregando) return;
  fila.carregando = true;
  try {
    const r = await postar("/api/escalacao/" + avaliacaoId, {
      admin_id: est.persona.id,
      decisao: fila.decisao,
      comentario: (fila.comentario || "").trim() || null,
    });
    recado(r.reabriu ? t("recado.decisao_devolvida") : t("recado.decisao"));
  } catch (e) {
    fila.carregando = false;
    recado(e.message, true);
    return;
  }
  fila.carregando = false;
  fila.sel = null;
  fila.decisao = null;
  fila.comentario = "";
  await carregarEscalacao();
  await recarregarSaude();
  desenharAdmin();
}

/** A separação entre demonstração e trabalho real, com número.

    É o que permite ao painel dizer qual trabalho é de quem em vez de somar
    fixture com autoria na mesma coluna — e é o que faz o portfólio significar
    alguma coisa para quem o avalia. */
function desenharProjetosAdmin() {
  const corpo = $("#projetos-corpo");
  limpar(corpo);
  const padrao = (est.saude && est.saude.projetos && est.saude.projetos.padrao) || "";
  if (!est.projetos.length) {
    const tr = el("tr");
    const td = el("td", "secundario", t("admin.sem_projetos"));
    td.colSpan = 5;
    juntar(tr, td);
    corpo.appendChild(tr);
    return;
  }
  for (const p of est.projetos) {
    const tr = el("tr");
    const nome = el("td");
    juntar(nome, el("span", "dado", p.nome));
    if (p.nome === padrao) nome.appendChild(el("span", "etiqueta aprovado", t("admin.padrao")));
    juntar(tr, nome,
      el("td", "fraco dado", p.cliente),
      el("td", "num", n(p.n_tarefas)),
      el("td", "num", n(p.n_abertas)),
      el("td", "secundario dado", p.descricao));
    corpo.appendChild(tr);
  }
}

function desenharEquipe() {
  const corpo = $("#equipe-corpo");
  limpar(corpo);
  if (!est.perfis.length) {
    const tr = el("tr");
    const td = el("td", "secundario", t("admin.sem_equipe"));
    td.colSpan = 4;
    juntar(tr, td);
    corpo.appendChild(tr);
  } else {
    for (const p of est.perfis) {
      const tr = el("tr");
      const estado = el("td");
      const eti = el("span", "etiqueta " + (p.ativo ? "aprovado" : "pendente"));
      juntar(eti, el("span", "ponto"),
        el("span", null, p.ativo ? t("admin.ativo") : t("admin.inativo")));
      juntar(estado, eti);
      juntar(tr,
        el("td", "dado", p.nome),
        el("td", null, nomePapel(p.papel)),
        estado,
        el("td", "mono", String(p.criado_em || "").slice(0, 19).replace("T", " ")));
      corpo.appendChild(tr);
    }
  }
  $("#equipe-conta").textContent = t("admin.equipe_conta", { n: n(est.perfis.length) });
}

async function criarPelaEquipe() {
  const campo = $("#admin-nome");
  const aviso = $("#admin-aviso");
  const nome = campo.value.trim();
  aviso.textContent = "";
  if (!nome) { aviso.textContent = t("barra.sem_nome"); return; }
  try {
    const criado = await postar("/api/perfis", { nome, papel: $("#admin-papel").value });
    est.perfis.push(criado);
    est.perfis.sort((a, b) => (a.papel + a.nome).localeCompare(b.papel + b.nome, "pt-BR"));
    campo.value = "";
    desenharEquipe();
    desenharPersonas();  // a barra tem de enxergar quem acabou de entrar
    await recarregarSaude();
    desenharAdmin();
    recado(t("recado.entrou_equipe", {
      nome: criado.nome, papel: nomePapel(criado.papel).toLowerCase(),
    }));
  } catch (e) {
    aviso.textContent = e.message;
  }
}

/* ==========================================================================
   8. PARTIDA
   ========================================================================== */
function ligarEventos() {
  $("#entrar").addEventListener("click", entrar);
  $("#novo-nome").addEventListener("keydown", (e) => { if (e.key === "Enter") entrar(); });
  $("#persona").addEventListener("change", trocarPersona);
  $("#projeto").addEventListener("change", trocarProjeto);
  $("#tema").addEventListener("click", alternarTema);
  $("#admin-criar").addEventListener("click", criarPelaEquipe);
  $("#admin-nome").addEventListener("keydown", (e) => { if (e.key === "Enter") criarPelaEquipe(); });
  // Um ouvinte só, no documento: os atalhos pertencem à TELA, não a um nó que
  // é destruído e recriado a cada redesenho da área de trabalho.
  document.addEventListener("keydown", teclado);
}

async function iniciar() {
  // O IDIOMA VEM PRIMEIRO, antes de qualquer desenho: não existe um quadro em
  // que a plataforma possa aparecer na língua errada, e `aplicarTema` já escreve
  // no botão de tema.
  est.idioma = idiomaInicial();
  NUM = new Intl.NumberFormat(est.idioma === "pt" ? "pt-BR" : "en-US");
  aplicarTextos();
  desenharIdiomas();

  let tema = "claro";
  try { tema = localStorage.getItem(CHAVE + "tema") || "claro"; } catch (_) {}
  aplicarTema(tema === "escuro" ? "escuro" : "claro");

  ligarEventos();

  // A SAÚDE VEM PRIMEIRO: é dela que sai `modo_solo`, e o seletor de persona
  // se monta de um jeito diferente nos dois modos. Desenhar antes mostraria a
  // lista errada por um quadro — e no modo solo a lista errada é a que esconde
  // a própria pessoa.
  await recarregarSaude();
  try {
    const r = await api("/api/perfis");
    est.perfis = r.items || [];
  } catch (e) {
    recado(t("recado.erro_personas", { erro: e.message }), true);
  }

  // A persona guardada é RECONFERIDA contra o banco: ela pode ter sido criada
  // noutra máquina, ou o banco pode ter sido apagado entre duas sessões. Nome +
  // papel batendo é o bastante; o id é recuperado daqui.
  const guardada = lerPersona();
  let inicial = null;
  if (guardada) {
    inicial = est.perfis.find((p) => p.nome === guardada.nome && p.papel === guardada.papel) || null;
    if (!inicial) recado(t("recado.persona_sumiu"), true);
  }
  // SEM VESTÍBULO: a plataforma abre já trabalhando. Sem persona guardada, o
  // papel inicial é o primeiro (anotador) com a primeira pessoa dele — que é o
  // que um avaliador quer ver nos primeiros três segundos.
  est.papelEscolhido = inicial ? inicial.papel : PAPEIS[0].id;
  est.projeto = lerProjetoGuardado();
  desenharPapeis();
  const doPapel = modoSolo()
    ? est.perfis.filter((p) => p.ativo)
    : est.perfis.filter((p) => p.papel === est.papelEscolhido && p.ativo);
  const escolhida = inicial || doPapel[0] || null;
  est.persona = escolhida ? { id: escolhida.id, nome: escolhida.nome, papel: escolhida.papel } : null;
  guardarPersona();
  desenharPersonas();
  await abrirApp();
}

iniciar();
</script>
