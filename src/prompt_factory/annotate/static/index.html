/* ==========================================================================
   5.10 TECLADO
   O teclado é o caminho principal; o mouse é o alternativo. Uma tarefa inteira
   precisa ser completável sem tocar no mouse.
   ========================================================================== */

function ehCampo(alvo) {
  const tag = (alvo && alvo.tagName) || "";
  return tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || (alvo && alvo.isContentEditable);
}

/** ↑/↓ andam entre critérios, 1..9 gradua o que está em foco.

    Uma função e não duas cópias: o `avaliar_rubrica` e as duas abas de conversa
    graduam a MESMA forma de rubrica, e duas cópias divergiriam justamente no
    detalhe que faz o gesto funcionar — andar sozinho para o próximo critério, que
    é o que transforma a rubrica inteira numa sequência de teclas. */
function graduarPeloTeclado(ev, criterios) {
  const total = est.form.notas.length;
  if (!total) return;
  if (ev.key === "ArrowDown" || ev.key === "ArrowUp") {
    const passo = ev.key === "ArrowDown" ? 1 : -1;
    est.foco = (est.foco + passo + total) % total;
    ev.preventDefault();
    // Trocar de grupo é consequência de andar, e não um atalho a mais: o grupo
    // ativo é DERIVADO do foco (ver `matrizDeCriterios`), então `↓` no último
    // critério de um grupo já abre o próximo.
    desenharArea();
    return;
  }
  const criterio = criterios[est.foco];
  // `N` marca "não se aplica" no critério em foco e avança, como um dígito.
  // Letra livre nos três handlers; e o gesto é o mesmo do resto da matriz, que
  // é o que permite descer 20 critérios sem tirar a mão do lugar.
  if (ev.key === "n" || ev.key === "N") {
    ev.preventDefault();
    alternarNa(ctxEdicao(), est.foco);
    if (est.foco < total - 1) { est.foco += 1; desenharArea(); }
    return;
  }
  // `0` salta para o primeiro critério pendente, em QUALQUER grupo — o oposto
  // de "procure o buraco". Ele nunca fez nada: o teste de dígito é /^[1-9]$/.
  if (ev.key === "0") {
    ev.preventDefault();
    const buraco = criterios.findIndex((c, i) => faltaNoCriterio(c, est.form, i));
    if (buraco >= 0) { est.foco = buraco; desenharArea(); }
    else recado(t("recado.sem_buraco"));
    return;
  }
  if (!/^[1-9]$/.test(ev.key)) return;
  const escala = (criterio && criterio.escala) || { min: 1, max: 9 };
  const valor = Number(ev.key);
  if (valor < escala.min || valor > escala.max) {
    recado(t("recado.escala", { min: escala.min, max: escala.max }), true);
    return;
  }
  ev.preventDefault();
  est.form.na[est.foco] = false;
  graduar(est.foco, valor);
  // O AUTO-AVANÇO É SUPRIMIDO quando a nota obriga evidência: a ferramenta anda
  // sozinha enquanto não há o que explicar e PARA quando há. É a tese inteira do
  // marco encenada em três linhas — sem isso, a pessoa graduaria os 20 e só
  // depois descobriria que deve cinco frases, que é o doom scrolling de volta.
  if (criterio && faltaNoCriterio(criterio, est.form, est.foco)) { desenharArea(); return; }
  if (est.foco < total - 1) { est.foco += 1; desenharArea(); }
}

function teclado(ev) {
  // A FOLHA DE ATALHOS vem antes de tudo, inclusive da guarda de persona: ela é
  // a única tecla que serve para descobrir as outras, e negá-la a quem ainda não
  // escolheu uma pessoa seria esconder o mapa de quem acabou de chegar.
  if (ev.key === "?" && !ehCampo(ev.target)) { ev.preventDefault(); alternarAtalhos(); return; }
  if (ev.key === "Escape" && est.atalhosAberto) { ev.preventDefault(); alternarAtalhos(); return; }
  if (!est.persona) return;
  // O PAPEL É O DA BARRA, e não o da persona — o mesmo `||` de `abrirApp`. No
  // modo solo a mesma pessoa atravessa os três papéis, então `est.persona.papel`
  // pode dizer "revisor" com a tela do admin aberta.
  const papel = est.papelEscolhido || (est.persona && est.persona.papel);
  if (papel === "revisor") { tecladoRevisor(ev); return; }
  // O ADMIN NÃO HERDA ATALHO NENHUM, e este era um defeito de verdade: o painel
  // dele caía em `tecladoRevisor`, que despacha pela sub-aba do REVISOR e pelo
  // `est.triagem` que ninguém tinha zerado. Um `a` digitado fora de um campo
  // aprovava, em silêncio, o item que a triagem tinha selecionado da última vez.
  if (papel === "admin") return;
  if (papel !== "anotador") return;

  // Ctrl+Enter vale DENTRO dos campos também: é o atalho de "terminei de
  // escrever", e obrigar a sair do campo antes de enviar é fricção.
  if ((ev.ctrlKey || ev.metaKey) && ev.key === "Enter") {
    ev.preventDefault();
    // NUMA CONVERSA ABERTA, "terminei de escrever" é MANDAR O TURNO, não enviar
    // a anotação: são a mesma frase mental em dois momentos, e a tecla segue o
    // momento. Depois de encerrada, ela volta a ser o envio.
    const emConversa = est.envelope && ehConversa(est.envelope.tarefa.tipo)
      && est.form && !est.form.encerrada && est.vista === "fila";
    if (emConversa) {
      const escrito = (est.form.rascunho || "").trim();
      const conversa = est.envelope.conversa || {};
      if (conversa.aguardando !== null && conversa.aguardando !== undefined) mandarTurno(null);
      else if (escrito) mandarTurno(escrito);
      return;
    }
    enviar();
    return;
  }
  if (ehCampo(ev.target) || !est.envelope || est.vista !== "fila") return;

  const tipo = est.envelope.tarefa.tipo;
  if (ehConversa(tipo)) {
    // `E` ENCERRA. Não é "empate": num duelo o empate não tem vencedora para
    // continuar a conversa, e inventar uma continuação seria fabricar a escolha
    // que ninguém fez. `E` de encerrar/end é a mesma letra nas duas línguas.
    if ((ev.key === "e" || ev.key === "E") && est.form && !est.form.encerrada) {
      ev.preventDefault();
      encerrarConversa();
      return;
    }
    const pendente = est.envelope.conversa && est.envelope.conversa.rodada_pendente;
    if (tipo === "duelo_modelos" && pendente !== null && pendente !== undefined) {
      if (ev.key === "ArrowLeft") { ev.preventDefault(); escolherLado("A"); return; }
      if (ev.key === "ArrowRight") { ev.preventDefault(); escolherLado("B"); return; }
    }
    // Depois de encerrada, os números graduam a rubrica multi-turno — o mesmo
    // gesto do `avaliar_rubrica`, sobre a mesma forma de rubrica.
    if (est.form && est.form.encerrada && est.envelope.rubrica) {
      graduarPeloTeclado(ev, est.envelope.rubrica.criterios || []);
    }
    return;
  }
  if (tipo === "avaliar_rubrica" && est.envelope.rubrica) {
    graduarPeloTeclado(ev, est.envelope.rubrica.criterios || []);
    return;
  }
  if (tipo === "comparar_ab") {
    if (ev.key === "ArrowLeft") { ev.preventDefault(); escolherAB("modelo-a"); }
    if (ev.key === "ArrowRight") { ev.preventDefault(); escolherAB("modelo-b"); }
    if (ev.key === "e" || ev.key === "E") { ev.preventDefault(); escolherAB("empate"); }
  }
}

/** Os atalhos da TRIAGEM. `J`/`K` andam na fila, `A` aprova, `R` devolve.

    Ctrl+Enter dentro do campo de devolução envia o comentário — é o mesmo
    "terminei de escrever" do anotador, e obrigar a sair do campo para clicar
    seria a mesma fricção do outro lado da mesa. */
function tecladoRevisor(ev) {
  // A SEGUNDA TRANCA. `teclado` já roteia por papel; esta guarda existe para que
  // um chamador novo não consiga reabrir o buraco do admin sem passar por aqui.
  if (est.papelEscolhido !== "revisor") return;
  if (est.subaba === "avaliacao") { tecladoRR(ev); return; }
  const tri = est.triagem;
  if (!tri || est.subaba !== "anotacoes") return;
  if (tri.devolvendo) {
    if ((ev.ctrlKey || ev.metaKey) && ev.key === "Enter") {
      const piso = lim("min_chars_devolucao", 20);
      const escrito = (tri.comentario || "").trim();
      if (escrito.length >= piso) {
        ev.preventDefault();
        triar("devolvida", escrito);
      }
    }
    if (ev.key === "Escape") {
      ev.preventDefault();
      tri.devolvendo = false;
      desenharDetalheTriagem();
    }
    return;
  }
  if (ehCampo(ev.target) || !tri.itens.length) return;

  if (ev.key === "j" || ev.key === "J" || ev.key === "k" || ev.key === "K") {
    const passo = (ev.key === "j" || ev.key === "J") ? 1 : -1;
    const i = tri.itens.findIndex((x) => x.anotacao_id === tri.sel);
    const alvo = tri.itens[Math.min(tri.itens.length - 1, Math.max(0, (i < 0 ? 0 : i) + passo))];
    if (alvo) { ev.preventDefault(); abrirNaTriagem(alvo.anotacao_id); }
    return;
  }
  if (!tri.sel || !tri.detalhe) return;
  if (ev.key === "a" || ev.key === "A") { ev.preventDefault(); triar("aprovada", null); }
  if (ev.key === "r" || ev.key === "R") { ev.preventDefault(); abrirDevolucao(); }
}

/** Os atalhos do RATE AND REVIEW. `J`/`K` andam na fila, `Ctrl+Enter` registra.

    Nada de `A`/`R` aqui, e não é esquecimento: a passagem 2 não tem duas
    respostas rápidas — ela tem duas escalas de quatro posições e um diff a
    justificar. Uma tecla que "aprova" seria a triagem outra vez, com outro
    nome. As escalas andam pelas setas, dentro do radiogroup (ver `escalaRR`).

    O `1..4` também ficou de fora de propósito: o workspace do revisor é
    editável, e o mesmo `3` que graduaria uma escala está graduando um critério
    da rubrica logo abaixo. Duas coisas na mesma tecla, na mesma tela. */
function tecladoRR(ev) {
  const rr = est.rr;
  if (!rr) return;
  // Ctrl+Enter vale DENTRO dos campos: é o "terminei de escrever", e obrigar a
  // sair do campo antes de registrar seria a mesma fricção do outro lado.
  if ((ev.ctrlKey || ev.metaKey) && ev.key === "Enter") {
    ev.preventDefault();
    registrarAvaliacao();
    return;
  }
  if (ehCampo(ev.target) || !rr.itens.length) return;
  if (ev.key === "j" || ev.key === "J" || ev.key === "k" || ev.key === "K") {
    const passo = (ev.key === "j" || ev.key === "J") ? 1 : -1;
    const i = rr.itens.findIndex((x) => x.anotacao_id === rr.sel);
    const alvo = rr.itens[Math.min(rr.itens.length - 1, Math.max(0, (i < 0 ? 0 : i) + passo))];
    if (alvo) { ev.preventDefault(); abrirNoRR(alvo.anotacao_id); }
  }
}

/* Navegação por setas dentro de um conjunto de abas (padrão de tablist). */
function andarNasAbas(ev, itens, escolher, atual) {
  const i = itens.findIndex((x) => x.id === atual);
  if (ev.key === "ArrowRight") { escolher(itens[(i + 1) % itens.length].id); ev.preventDefault(); }
  if (ev.key === "ArrowLeft") { escolher(itens[(i - 1 + itens.length) % itens.length].id); ev.preventDefault(); }
}

/* ==========================================================================
   6. TELA DO REVISOR — PASSAGEM 1: A TRIAGEM
   Fila cronológica à esquerda, detalhe à direita — e o detalhe abre NO MESMO
   LAYOUT que o anotador viu (os mesmos `ws*`, em modo leitura), porque
   reconhecer é mais barato que reconstruir.

   `A` aprova, `R` devolve (com comentário obrigatório), `J`/`K` andam na fila.
   Aprovar manda para a passagem 2; devolver reabre a tarefa do anotador, que
   corrige e reenvia como versão 2.
   ========================================================================== */
async function desenharRevisor() {
  const barra = $("#abas-revisor");
  limpar(barra);
  for (const s of SUBABAS_REVISOR) {
    const b = el("button", "aba", t(s.nome));
    b.type = "button";
    b.setAttribute("role", "tab");
    b.setAttribute("aria-selected", String(est.subaba === s.id));
    // "…" e não "0" quando a fila ainda não foi lida: são estados diferentes, e
    // um zero inventado é a única leitura que faz alguém deixar de clicar.
    const fonte = s.id === "anotacoes" ? est.triagem
      : s.id === "avaliacao" ? est.rr : est.criacoes;
    b.appendChild(el("span", "conta", fonte ? n(fonte.total) : "…"));
    b.addEventListener("click", () => { est.subaba = s.id; desenharRevisor(); });
    b.addEventListener("keydown", (ev) => andarNasAbas(ev, SUBABAS_REVISOR, (id) => { est.subaba = id; desenharRevisor(); }, est.subaba));
    barra.appendChild(b);
  }

  const s = SUBABAS_REVISOR.find((x) => x.id === est.subaba);
  $("#revisor-fila-titulo").textContent = t(s.titulo);
  $("#revisor-atalhos").textContent = est.subaba === "anotacoes"
    ? t("revisor.atalhos") : t("rr.atalhos");

  if (est.subaba === "criacoes") {
    if (!est.criacoes) { await carregarCriacoes(); return; }
    desenharFilaCriacoes(s);
    return;
  }
  if (est.subaba === "avaliacao") {
    if (!est.rr) { await carregarRR(); return; }
    desenharFilaRR(s);
    desenharDetalheRR();
    atualizarContagens();
    return;
  }
  if (!est.triagem) { await carregarTriagem(); return; }
  desenharFilaTriagem(s);
  desenharDetalheTriagem();
  atualizarContagens();
}

async function carregarTriagem(manterSel) {
  const anterior = manterSel === undefined ? (est.triagem && est.triagem.sel) : manterSel;
  const vazia = {
    itens: [], total: 0, minhas_excluidas: 0, minhas_na_fila: 0, modo_solo: false,
    sel: null, detalhe: null, form: null, devolvendo: false, comentario: "",
    carregando: false,
  };
  try {
    const r = await api(comParams("/api/revisao/fila",
      paramsProjeto({ revisor_id: est.persona.id })));
    est.triagem = {
      ...vazia,
      itens: r.items || [],
      total: r.total || 0,
      minhas_excluidas: r.minhas_excluidas || 0,
      minhas_na_fila: r.minhas_na_fila || 0,
      modo_solo: !!r.modo_solo,
    };
  } catch (e) {
    est.triagem = { ...vazia, erro: e.message };
  }
  await desenharRevisor();
  // Seleciona sozinho: uma fila com itens e nada aberto obriga um clique que
  // não decide nada. Se o item que estava aberto sumiu (acabou de ser triado),
  // o próximo assume o lugar dele — a fila anda sem que ninguém a empurre.
  const itens = est.triagem.itens;
  if (!itens.length) return;
  const alvo = itens.find((x) => x.anotacao_id === anterior) || itens[0];
  await abrirNaTriagem(alvo.anotacao_id);
}

/** A FAIXA DO MODO SOLO — permanente, não dispensável.

    Ela declara que a regra de QC está afrouxada: o revisor está vendo (e vai
    julgar) trabalho que ele mesmo escreveu. Um aviso que se fecha vira um
    aviso que ninguém viu na hora que importava, e esconder isso seria mentir
    sobre o QC — que é exatamente o que este projeto existe para não fazer. */
function faixaSoloDe(estado) {
  if (!estado || !estado.modo_solo) return null;
  const caixa = el("div", "faixa-solo");
  juntar(caixa,
    el("b", null, t("solo.titulo")),
    el("span", null, t("solo.linha")),
    el("span", "fraco",
      (estado.minhas_na_fila
        ? t("solo.contagem", { n: n(estado.minhas_na_fila), total: n(estado.itens.length) })
        : t("solo.sem_meus"))
      + t("solo.nota")));
  return caixa;
}

/** A faixa da TRIAGEM. As duas passagens usam a mesma, e por isso ela é uma
    função só com o estado por parâmetro: duas faixas seriam dois lugares onde a
    declaração do modo solo pode divergir de si mesma. */
function faixaSolo() {
  return faixaSoloDe(est.triagem);
}

function desenharFilaTriagem(s) {
  const fila = $("#revisor-fila");
  limpar(fila);
  const tri = est.triagem;
  const solo = faixaSolo();
  if (solo) fila.appendChild(solo);
  if (!tri.itens.length) {
    const vazia = el("div", "fila-vazia");
    juntar(vazia, el("div", "vazio-titulo", t(s.vazio)), el("p", "vazio-linha", t(s.linha)));
    if (tri.minhas_excluidas) {
      // Sem esta linha, um revisor que anotou e vê a fila vazia acha que a
      // plataforma perdeu o trabalho dele.
      vazia.appendChild(el("p", "vazio-linha",
        t("triagem.minhas_excluidas", { n: n(tri.minhas_excluidas) })));
    }
    fila.appendChild(vazia);
    return;
  }
  for (const item of tri.itens) {
    const b = el("button", "fila-item");
    b.type = "button";
    b.setAttribute("aria-current", String(tri.sel === item.anotacao_id));
    const topo = el("div", "fila-item-topo");
    juntar(topo,
      el("strong", null, nomeTipo(item.tipo)),
      // No modo solo a fila é mista: marcar QUAIS são minhas é o que torna o
      // aviso acionável em vez de decorativo.
      el("span", item.minha ? "eu" : null,
        item.minha ? t("triagem.eu_sufixo", { nome: item.anotador }) : item.anotador),
      el("span", "crescer"));
    // `dado`: nome de projeto é conteúdo do banco, não cromo — ele sai na
    // língua em que foi cadastrado, como o nome de uma pessoa.
    if (item.projeto) topo.appendChild(el("span", "fraco dado", item.projeto));
    if (item.versao > 1) topo.appendChild(el("span", "etiqueta devolvido", "v" + item.versao));
    b.appendChild(topo);
    b.appendChild(el("div", "fila-item-trecho",
      item.disponivel ? item.prompt : t("triagem.prompt_sumiu")));
    b.addEventListener("click", () => abrirNaTriagem(item.anotacao_id));
    fila.appendChild(b);
  }
}

async function abrirNaTriagem(anotacaoId) {
  const tri = est.triagem;
  if (!tri) return;
  tri.sel = anotacaoId;
  tri.devolvendo = false;
  tri.comentario = "";
  tri.carregando = true;
  desenharFilaTriagem(SUBABAS_REVISOR[0]);
  desenharDetalheTriagem();
  try {
    const r = await api(comParams("/api/revisao/" + anotacaoId, { revisor_id: est.persona.id }));
    tri.detalhe = r.tarefa;
    tri.minha = !!r.minha;
    tri.form = formDoPayload(r.tarefa, r.tarefa.anotacao.payload);
  } catch (e) {
    tri.detalhe = null;
    tri.form = null;
    recado(e.message, true);
  }
  tri.carregando = false;
  desenharDetalheTriagem();
}

function desenharDetalheTriagem() {
  const det = $("#revisor-detalhe");
  limpar(det);
  // A triagem não tem bússola, e o `--bussola-h` que o Rate and Review deixou
  // no nó continuaria valendo: o cabeçalho da matriz grudaria uma bússola
  // abaixo de onde ela está. Aqui, antes de qualquer `return` antecipado.
  medirBussolaRR();
  const tri = est.triagem;
  if (!tri || !tri.sel) {
    const caixa = el("div", "vazio");
    juntar(caixa,
      el("div", "vazio-titulo", t("triagem.nada_selecionado")),
      el("p", "vazio-linha", t("triagem.nada_selecionado_linha")));
    det.appendChild(caixa);
    return;
  }
  // Carregando e falhou são estados DIFERENTES, e o ternário de uma linha os
  // desenhava iguais: a mesma frase cinza, no mesmo lugar.
  if (tri.carregando) { det.appendChild(esqueleto("triagem.abrindo")); return; }
  if (!tri.detalhe) {
    det.appendChild(el("div", "vazio-linha", t("triagem.erro_abrir")));
    return;
  }
  const env = tri.detalhe;
  const a = env.anotacao;

  // `avaliar_rubrica@2+severidade@1` é o identificador do contrato de payload —
  // vocabulário de máquina, gravado em toda linha de `anotacoes` e entregue
  // dentro do JSONL. Ele NÃO some (é a chave de quem lê o arquivo depois), mas
  // sai do texto visível: no topo da tela de quem tria, ele ocupava o lugar da
  // única informação acionável dali, que é a versão da regra sob a qual o
  // trabalho foi feito.
  const carimbo = el("span", "fraco",
    a.versao_diretriz ? t("triagem.diretriz", { n: a.versao_diretriz }) : "");
  carimbo.title = a.payload_schema;
  const cabeca = el("div", "triagem-cabeca");
  juntar(cabeca,
    el("span", "etiqueta pendente", t("triagem.versao", { n: a.versao })),
    el("span", tri.minha ? "eu" : "fraco",
      tri.minha ? t("triagem.por_voce") : t("triagem.por", { nome: a.anotador })),
    el("span", "fraco", dataHora(a.submetida_em)),
    el("span", "crescer"),
    // O nome do projeto sai num nó próprio, marcado como DADO: junto com o
    // resto ele viraria uma string única meio cromo, meio conteúdo — e a
    // varredura de língua deixaria de conseguir separar as duas coisas.
    env.tarefa.projeto ? el("span", "fraco dado", env.tarefa.projeto + " · ") : null,
    carimbo);
  det.appendChild(cabeca);
  // O aviso acompanha o ITEM, e não só a fila: julgar o próprio trabalho é uma
  // decisão que se toma no detalhe, com o botão à mão.
  if (tri.minha) {
    const aviso = faixaSolo();
    if (aviso) det.appendChild(aviso);
  }

  // O MESMO LAYOUT do anotador, em leitura. Ver `desenharWorkspace`.
  det.appendChild(desenharWorkspace(env, ctxLeitura(tri.form)));

  if (tri.devolvendo) { det.appendChild(caixaDevolucao()); return; }

  const acoes = el("div", "triagem-acoes");
  const aprovar = el("button", "botao primaria", t("botao.aprovar"));
  aprovar.type = "button";
  aprovar.addEventListener("click", () => triar("aprovada", null));
  const devolver = el("button", "botao", t("botao.devolver_ajuste"));
  devolver.type = "button";
  devolver.addEventListener("click", abrirDevolucao);
  juntar(acoes,
    aprovar, el("span", "atalho", "A"),
    devolver, el("span", "atalho", "R"),
    el("span", "crescer"),
    el("span", "fraco", t("triagem.nota_acoes")));
  det.appendChild(acoes);
}

/** A microcopy DIZ para quem o comentário vai — e é isso que muda o que o
    revisor escreve. */
function caixaDevolucao() {
  const piso = lim("min_chars_devolucao", 20);
  const tri = est.triagem;
  const caixa = el("div", "devolver-caixa");
  caixa.appendChild(el("div", "devolucao-titulo", t("triagem.devolver_titulo")));
  caixa.appendChild(el("p", "vazio-linha", t("triagem.devolver_microcopy")));
  const area = el("textarea");
  area.rows = 3;
  area.id = "comentario-devolucao";
  area.placeholder = t("triagem.devolver_ph", { min: piso });
  area.setAttribute("aria-label", t("triagem.devolver_titulo"));
  // Repovoado do ESTADO: trocar de idioma no meio de uma devolução redesenha
  // este bloco, e o que o revisor já escreveu tem de continuar aqui. E, quando o
  // estado está vazio, do RASCUNHO em disco: `est` sobrevive ao redesenho, o
  // localStorage sobrevive à aba fechada.
  if (!(tri.comentario || "").trim()) tri.comentario = lerRascunhoTexto(chaveTriagem(tri.sel));
  area.value = tri.comentario || "";
  caixa.appendChild(area);
  const escrito = () => (tri.comentario || "").trim().length;
  const contador = el("div", "contador", t("ws.contador_de", { n: n(escrito()), min: piso }));
  caixa.appendChild(contador);
  // O comentário de devolução é METADADO: ele entra no relatório de qualidade e
  // na auditoria do item, e é o cliente quem lê os dois.
  caixa.appendChild(dicaLinguaMeta("lingua.meta"));

  const acoes = el("div", "triagem-acoes");
  const rotularEnviar = (b) => {
    const tem = escrito();
    b.disabled = tem < piso;
    b.textContent = tem < piso
      ? t("falta.devolucao", { n: piso - tem })
      : t("botao.devolver_com_comentario");
  };
  const enviar = el("button", "botao primaria", "");
  enviar.type = "button";
  rotularEnviar(enviar);
  enviar.addEventListener("click", () => triar("devolvida", (tri.comentario || "").trim()));
  const cancelar = el("button", "botao discreta", t("botao.cancelar"));
  cancelar.type = "button";
  cancelar.addEventListener("click", () => {
    tri.devolvendo = false;
    tri.comentario = "";
    salvarRascunhoTexto(chaveTriagem(tri.sel), "");
    desenharDetalheTriagem();
  });
  area.addEventListener("input", () => {
    tri.comentario = area.value;
    salvarRascunhoTexto(chaveTriagem(tri.sel), area.value);
    contador.textContent = t("ws.contador_de", { n: n(escrito()), min: piso });
    rotularEnviar(enviar);
  });
  juntar(acoes, enviar, cancelar);
  caixa.appendChild(acoes);
  // FOCO no campo: quem apertou R já decidiu devolver, e o próximo gesto é
  // escrever — não procurar onde escrever. O cursor vai para o FIM do que já
  // existe, para que um redesenho no meio da frase não jogue o texto atrás dele.
  requestAnimationFrame(() => {
    area.focus();
    const fim = area.value.length;
    area.setSelectionRange(fim, fim);
  });
  return caixa;
}

function abrirDevolucao() {
  if (!est.triagem || !est.triagem.detalhe) return;
  est.triagem.devolvendo = true;
  desenharDetalheTriagem();
}

async function triar(veredito, comentario) {
  const tri = est.triagem;
  if (!tri || !tri.sel || tri.carregando) return;
  const alvo = tri.sel;
  // Qual é o PRÓXIMO nesta fila: depois de triar, este item some, e a seleção
  // precisa cair no seguinte sozinha — fechar o loop antes de pedir a próxima
  // coisa vale para quem revisa igual.
  const i = tri.itens.findIndex((x) => x.anotacao_id === alvo);
  const proximo = tri.itens[i + 1] || tri.itens[i - 1] || null;
  tri.carregando = true;
  try {
    await postar("/api/revisao/" + alvo, {
      revisor_id: est.persona.id,
      veredito: veredito,
      comentario: comentario || null,
    });
    recado(veredito === "aprovada" ? t("recado.aprovada") : t("recado.devolvida"));
    // O rascunho do comentário morre com o envio: mantê-lo faria a próxima
    // devolução deste mesmo item abrir com o texto da anterior.
    salvarRascunhoTexto(chaveTriagem(alvo), "");
    // APROVAR ENCHE A OUTRA FILA. Sem invalidar aqui, a sub-aba do Rate and
    // Review continuaria mostrando o que ela leu na última visita — e o item
    // que acabou de ser aprovado só apareceria depois de sair da tela e voltar.
    // `null` (e não uma recarga) porque recarregar agora desenharia a fila da
    // passagem 2 por cima do detalhe da triagem que está aberto.
    if (veredito === "aprovada") est.rr = null;
  } catch (e) {
    tri.carregando = false;
    recado(e.message, true);
    return;
  }
  tri.carregando = false;
  await carregarTriagem(proximo ? proximo.anotacao_id : null);
  await recarregarSaude();
}

/* ==========================================================================
   6b. TELA DO REVISOR — PASSAGEM 2: O RATE AND REVIEW

   A mesma fila à esquerda, o mesmo detalhe à direita, o MESMO workspace — só
   que destravado. A tela conduz em quatro passos numerados, e a ordem é a
   ordem da decisão:

     1. avaliar o trabalho COMO CHEGOU (antes de tocar em qualquer coisa);
     2. corrigir ali mesmo, com um motivo curto por mudança;
     3. avaliar o RESULTADO;
     4. escrever por que — obrigatório sempre.

   UMA AÇÃO PRIMÁRIA, e ela diz o que falta antes do clique. A ordem em que
   `rrOQueFalta` procura é a ordem visual: o botão aponta para a primeira coisa
   pendente de cima para baixo, e não para a "mais importante" — quem lê o
   botão está procurando onde continuar, não uma opinião.

   O CRONÔMETRO É INVISÍVEL, como no anotador: `abertoEm` é um carimbo, não um
   relógio na tela. Ele vai para `avaliacoes.tempo_ativo_ms` e de lá para o
   painel do admin.
   ========================================================================== */

/** Achata um payload em `{caminho: folha}`. Espelho de `avaliacoes.achatar` no
    servidor, e é a igualdade entre os dois que faz o botão desta tela concordar
    com o 422 — o servidor recalcula o diff e exige os mesmos caminhos. */
function achatar(valor, prefixo, saida) {
  const plano = saida || {};
  const folha = valor === null || typeof valor !== "object";
  const vazio = !folha && (Array.isArray(valor) ? !valor.length : !Object.keys(valor).length);
  if (folha || vazio) {
    if (prefixo) plano[prefixo] = valor;
    return plano;
  }
  const chaves = Array.isArray(valor) ? valor.map((_, i) => i) : Object.keys(valor);
  for (const k of chaves) achatar(valor[k], prefixo ? prefixo + "." + k : String(k), plano);
  return plano;
}

/** Os caminhos que mudaram entre dois payloads, na ordem do payload ORIGINAL.
    Ordem alfabética misturaria o critério 10 com o 1; esta acompanha o
    formulário, que é onde a pessoa está olhando. */
function diffPayload(antes, depois) {
  const a = achatar(antes, "");
  const b = achatar(depois, "");
  const tem = (o, k) => Object.prototype.hasOwnProperty.call(o, k);
  const ordem = Object.keys(a).concat(Object.keys(b).filter((k) => !tem(a, k)));
  const saida = [];
  for (const campo of ordem) {
    const va = tem(a, campo) ? a[campo] : null;
    const vb = tem(b, campo) ? b[campo] : null;
    if (JSON.stringify(va) === JSON.stringify(vb)) continue;
    saida.push({ campo: campo, antes: va, depois: vb });
  }
  return saida;
}

/** Uma folha como texto, para o resumo e para o corpo do POST. */
function comoTexto(v) {
  if (v === null || v === undefined) return null;
  return (typeof v === "string" ? v : JSON.stringify(v)).slice(0, 2000);
}

/* ---- rascunho da avaliação, por ANOTAÇÃO ----
   Separado do rascunho do anotador (`bancada.rascunho.<atribuicao>`) porque são
   dois trabalhos diferentes sobre coisas diferentes: a mesma pessoa, no modo
   solo, pode ter uma tarefa aberta e uma avaliação pela metade ao mesmo tempo. */
function rrChave(id) { return CHAVE + "avaliacao." + id; }

function salvarRascunhoRR() {
  const rr = est.rr;
  if (!rr || !rr.sel || !rr.form) return;
  try {
    localStorage.setItem(rrChave(rr.sel), JSON.stringify({
      antes: rr.antes, depois: rr.depois, justificativa: rr.justificativa,
      motivos: rr.motivos, form: rr.form,
    }));
  } catch (_) { /* modo privado ou cota cheia: funciona igual, só não lembra */ }
}
function lerRascunhoRR(id) {
  try {
    const bruto = localStorage.getItem(rrChave(id));
    return bruto ? JSON.parse(bruto) : null;
  } catch (_) { return null; }
}
function limparRascunhoRR(id) {
  try { localStorage.removeItem(rrChave(id)); } catch (_) {}
}

async function carregarRR(manterSel) {
  const anterior = manterSel === undefined ? (est.rr && est.rr.sel) : manterSel;
  const vazia = {
    itens: [], total: 0, minhas_excluidas: 0, minhas_na_fila: 0, modo_solo: false,
    sel: null, detalhe: null, triagemDoItem: null, original: null, form: null,
    antes: null, depois: null, justificativa: "", motivos: {}, diff: [], caixas: [],
    foco: 0, abertoEm: 0, carregando: false, rascunhoRecuperado: false, minha: false,
  };
  try {
    const r = await api(comParams("/api/avaliacao/fila",
      paramsProjeto({ revisor_id: est.persona.id })));
    est.rr = {
      ...vazia,
      itens: r.items || [],
      total: r.total || 0,
      minhas_excluidas: r.minhas_excluidas || 0,
      minhas_na_fila: r.minhas_na_fila || 0,
      modo_solo: !!r.modo_solo,
    };
  } catch (e) {
    est.rr = { ...vazia, erro: e.message };
    recado(t("rr.erro_fila", { erro: e.message }), true);
  }
  await desenharRevisor();
  // Seleciona sozinho, como a triagem: uma fila com itens e nada aberto obriga
  // um clique que não decide nada.
  const itens = est.rr.itens;
  if (!itens.length) return;
  const alvo = itens.find((x) => x.anotacao_id === anterior) || itens[0];
  await abrirNoRR(alvo.anotacao_id);
}

async function abrirNoRR(anotacaoId) {
  const rr = est.rr;
  if (!rr) return;
  rr.sel = anotacaoId;
  rr.carregando = true;
  rr.detalhe = null;
  rr.caixas = [];
  desenharFilaRR(SUBABAS_REVISOR[1]);
  desenharDetalheRR();
  try {
    const r = await api(comParams("/api/avaliacao/" + anotacaoId, { revisor_id: est.persona.id }));
    rr.detalhe = r.tarefa;
    rr.minha = !!r.minha;
    rr.triagemDoItem = r.triagem || null;
    // O ORIGINAL é a cópia intocada: o diff é contra ela, e desfazer uma
    // correção precisa de um ponto de referência que não se mexe.
    rr.original = formDoPayload(r.tarefa, r.tarefa.anotacao.payload);
    rr.form = JSON.parse(JSON.stringify(rr.original));
    rr.antes = null;
    rr.depois = null;
    rr.justificativa = "";
    rr.motivos = {};
    rr.foco = 0;
    rr.rascunhoRecuperado = false;
    const guardado = lerRascunhoRR(anotacaoId);
    if (guardado) {
      rr.antes = guardado.antes || null;
      rr.depois = guardado.depois || null;
      rr.justificativa = guardado.justificativa || "";
      rr.motivos = guardado.motivos || {};
      if (guardado.form) rr.form = guardado.form;
      rr.rascunhoRecuperado = true;
    }
    // O relógio começa quando o item ABRE, não quando a fila carrega.
    rr.abertoEm = Date.now();
  } catch (e) {
    rr.detalhe = null;
    rr.form = null;
    recado(e.message, true);
  }
  rr.carregando = false;
  desenharDetalheRR();
}

function desenharFilaRR(s) {
  const fila = $("#revisor-fila");
  limpar(fila);
  const rr = est.rr;
  const solo = faixaSoloDe(rr);
  if (solo) fila.appendChild(solo);
  if (!rr.itens.length) {
    const vazia = el("div", "fila-vazia");
    juntar(vazia, el("div", "vazio-titulo", t(s.vazio)), el("p", "vazio-linha", t(s.linha)));
    if (rr.minhas_excluidas) {
      vazia.appendChild(el("p", "vazio-linha",
        t("rr.minhas_excluidas", { n: n(rr.minhas_excluidas) })));
    }
    // ESTADO VAZIO COM SAÍDA: a fila da passagem 2 só enche quando a triagem
    // aprova, e a saída real é ir triar.
    const saidas = el("div", "vazio-saidas");
    const irTriar = el("button", "botao primaria", t("subaba.anotacoes.nome"));
    irTriar.type = "button";
    irTriar.addEventListener("click", () => { est.subaba = "anotacoes"; desenharRevisor(); });
    juntar(saidas, irTriar);
    vazia.appendChild(saidas);
    fila.appendChild(vazia);
    return;
  }
  for (const item of rr.itens) {
    const b = el("button", "fila-item");
    b.type = "button";
    b.setAttribute("aria-current", String(rr.sel === item.anotacao_id));
    const topo = el("div", "fila-item-topo");
    juntar(topo,
      el("strong", null, nomeTipo(item.tipo)),
      el("span", item.minha ? "eu" : null,
        item.minha ? t("triagem.eu_sufixo", { nome: item.anotador }) : item.anotador),
      el("span", "crescer"));
    if (item.projeto) topo.appendChild(el("span", "fraco dado", item.projeto));
    if (item.versao > 1) topo.appendChild(el("span", "etiqueta devolvido", "v" + item.versao));
    b.appendChild(topo);
    // QUEM TRIOU, na própria linha da fila. A métrica de QC mais interessante
    // deste marco — "a triagem deixou passar" — precisa dos dois nomes juntos,
    // e o revisor decide melhor sabendo quem já olhou aquilo.
    if (item.triador) {
      b.appendChild(el("div", "fila-item-topo",
        t("rr.triagem", { nome: item.triador })));
    }
    b.appendChild(el("div", "fila-item-trecho",
      item.disponivel ? item.prompt : t("triagem.prompt_sumiu")));
    b.addEventListener("click", () => abrirNoRR(item.anotacao_id));
    fila.appendChild(b);
  }
}

/** UMA ESCALA: as quatro opções sempre visíveis, com a âncora ao lado.

    Um `<select>` economizaria espaço e custaria a única coisa que uma escala
    ancorada tem — a possibilidade de comparar as quatro descrições antes de
    escolher uma. Teclado: as setas andam e selecionam, como num radiogroup de
    verdade, e Tab entra e sai do grupo. */
function escalaRR(opcoes, valor, ariaChave, aoEscolher) {
  const caixa = el("div", "escala");
  caixa.setAttribute("role", "radiogroup");
  caixa.setAttribute("aria-label", t(ariaChave));
  opcoes.forEach((o, i) => {
    const b = el("button", "escala-opcao" + (o.classe ? " " + o.classe : ""));
    b.type = "button";
    b.setAttribute("role", "radio");
    b.setAttribute("aria-checked", String(valor === o.id));
    // Só o selecionado (ou o primeiro, quando nada está) fica na ordem do Tab:
    // é o padrão de um radiogroup, e é o que evita quatro paradas de Tab por
    // escala numa tela que já tem muitas.
    b.tabIndex = (valor === o.id || (!valor && i === 0)) ? 0 : -1;
    juntar(b, el("b", null, t(o.nome)), el("span", null, t(o.ancora)));
    b.addEventListener("click", () => aoEscolher(o.id));
    b.addEventListener("keydown", (ev) => {
      if (ev.key !== "ArrowDown" && ev.key !== "ArrowUp" &&
          ev.key !== "ArrowRight" && ev.key !== "ArrowLeft") return;
      ev.preventDefault();
      const passo = (ev.key === "ArrowDown" || ev.key === "ArrowRight") ? 1 : -1;
      aoEscolher(opcoes[(i + passo + opcoes.length) % opcoes.length].id);
    });
    caixa.appendChild(b);
  });
  return caixa;
}

/** A caixa de motivos de um pedaço do payload. Ela nasce VAZIA e é preenchida
    por `rrSincronizar` conforme os campos daquele prefixo mudam — é isso que
    faz o motivo aparecer colado ao campo editado e sumir quando a edição é
    desfeita, sem modal e sem redesenhar a tela a cada tecla. */
function caixaDeMotivos(prefixo) {
  const caixa = el("div", "motivos");
  est.rr.caixas.push({ prefixo: prefixo, no: caixa, linhas: {} });
  return caixa;
}

/** UMA LINHA + ⓘ, no lugar de um parágrafo-ensaio.

    As três notas das seções do Rate and Review tinham de 25 a 40 palavras cada e
    ficavam ACIMA do controle que elas explicam — três parágrafos empurrando o
    trabalho para baixo, lidos na primeira visita e pulados em todas as outras.
    O que sobrou na linha é a instrução; o porquê (que é o que vale reler, e o
    que um revisor novo precisa) fica atrás do mesmo ⓘ da matriz de critérios.

    Reusa o padrão de `linhaDeCriterio`: um `button.info` com `aria-expanded` e
    um painel `.explica` que nasce vazio e só é preenchido na primeira abertura. */
function notaDeSecao(chaveCurta, chaveDetalhe) {
  const caixa = el("div");
  const linha = el("p", "rr-secao-nota", t(chaveCurta) + " ");
  const info = el("button", "info");
  info.type = "button";
  info.textContent = "ⓘ";
  info.setAttribute("aria-expanded", "false");
  info.setAttribute("aria-label", t("botao.mostrar_inteiro"));
  linha.appendChild(info);
  const painel = el("div", "explica");
  painel.hidden = true;
  info.addEventListener("click", () => {
    const aberto = info.getAttribute("aria-expanded") === "true";
    info.setAttribute("aria-expanded", String(!aberto));
    painel.hidden = aberto;
    if (!aberto && !painel.firstChild) painel.appendChild(el("p", null, t(chaveDetalhe)));
  });
  juntar(caixa, linha, painel);
  return caixa;
}

/** O nome legível de um caminho do payload — `notas.2.nota` → "nota da rubrica
    — Fluência".

    O nome do critério sai do DADO, nunca de uma cópia: para `notas.*` e
    `checklist.*` ele vem da rubrica do envelope (com o sidecar `*_i18n`, como
    toda a matriz); para `criterios.*` ele vem do formulário do próprio Rate and
    Review, porque a tarefa É escrever a rubrica e o nome pode ter acabado de
    mudar. Sem envelope (a escalação lê `edicoes_avaliacao` sem o payload em
    mãos) sobra o número, que já é melhor que o caminho cru sozinho. */
function rotuloDoCampo(campo, env) {
  const partes = String(campo || "").split(".");
  const chave = CAMPOS_LEGIVEIS[partes[0]];
  if (!chave) return String(campo || "");
  const i = Number(partes[1]);
  if (!Number.isInteger(i) || i < 0) return t(chave);
  let nome = "";
  if (partes[0] === "criterios") {
    const doForm = est.rr && est.rr.form && (est.rr.form.criterios || [])[i];
    nome = doForm ? String(doForm.nome || "").trim() : "";
  } else {
    const c = env && env.rubrica && (env.rubrica.criterios || [])[i];
    if (c) nome = bi(c.nome_i18n, c.nome);
  }
  return t(chave, { criterio: nome || t("ws.criterio_n", { n: i + 1 }) });
}

function linhaDeMotivo(campo) {
  const piso = lim("min_chars_motivo_edicao", 10);
  const legivel = rotuloDoCampo(campo, est.rr.detalhe);
  const linha = el("div", "motivo-linha");
  const entrada = el("input");
  entrada.type = "text";
  entrada.maxLength = 600;
  entrada.placeholder = t("rr.motivo_ph", { min: piso });
  entrada.value = est.rr.motivos[campo] || "";
  entrada.setAttribute("aria-label", t("rr.motivo_rotulo", { campo: legivel }));
  entrada.addEventListener("input", () => {
    est.rr.motivos[campo] = entrada.value;
    salvarRascunhoRR();
    rrAtualizarResumo();
    rrAtualizarBotao();
  });
  // O caminho do campo é o ENDEREÇO no payload, e é literalmente o que vai para
  // `edicoes_avaliacao.campo`. Ele fica, em mono e sem tradução — é vocabulário
  // de máquina, e traduzi-lo faria a trilha de auditoria e a tela discordarem.
  // O que passou a vir junto é o nome legível: sozinho, o caminho obrigava quem
  // justifica a mudança a decorar a ordem dos critérios.
  juntar(linha,
    el("label", null, t("rr.motivo_rotulo", { campo: legivel })),
    el("span", "mono fraco", campo),
    entrada);
  return linha;
}

/** Recalcula o diff e reconcilia as caixas de motivo — SEM redesenhar.

    Reconstruir as caixas a cada tecla tiraria o foco do campo no meio da
    palavra. Aqui só entra a linha que passou a existir e só sai a que deixou de
    existir; quem estava sendo digitado permanece o mesmo nó. */
function rrSincronizar() {
  const rr = est.rr;
  if (!rr || !rr.detalhe || !rr.form) return;
  rr.diff = diffPayload(
    montarPayload(rr.detalhe, rr.original), montarPayload(rr.detalhe, rr.form));
  const ativos = {};
  for (const d of rr.diff) ativos[d.campo] = true;

  const colocados = {};
  for (const caixa of rr.caixas) {
    for (const campo of Object.keys(caixa.linhas)) {
      if (ativos[campo]) colocados[campo] = true;
    }
  }
  for (const caixa of rr.caixas) {
    for (const d of rr.diff) {
      if (colocados[d.campo]) continue;
      if (d.campo.indexOf(caixa.prefixo) !== 0) continue;
      const linha = linhaDeMotivo(d.campo);
      caixa.linhas[d.campo] = linha;
      caixa.no.appendChild(linha);
      colocados[d.campo] = true;
    }
    for (const campo of Object.keys(caixa.linhas)) {
      if (ativos[campo]) continue;
      caixa.no.removeChild(caixa.linhas[campo]);
      delete caixa.linhas[campo];
    }
  }
  rrAtualizarResumo();
  rrAtualizarBotao();
}

/** Uma tecla num campo do workspace do revisor. */
function rrDigitou() {
  salvarRascunhoRR();
  rrSincronizar();
  // O revisor também vê o rail, e o eco dele é do formulário DELE — nunca do
  // rascunho aberto do anotador. É o mesmo cuidado que separou os callbacks no
  // P3b: `ctxEdicaoRevisor` existe justamente para que escrever aqui não escreva
  // no trabalho de outra pessoa.
  atualizarEcoDoRail(est.rr.form);
}

/** Uma mudança ESTRUTURAL (nota, preferência, critério a mais ou a menos).
    Redesenha o detalhe inteiro, como o anotador faz — são cliques, e o foco não
    está no meio de uma palavra. */
function rrMudou() {
  salvarRascunhoRR();
  desenharDetalheRR();
}

/** O RESUMO DO DIFF: conferir o que mudou sem rolar a tela inteira de volta.

    Só texto aqui dentro — nenhum campo editável —, e é por isso que ele pode
    ser reconstruído a cada tecla sem custar foco. */
function rrAtualizarResumo() {
  const no = $("#rr-diff");
  if (!no) return;
  const rr = est.rr;
  limpar(no);
  const piso = lim("min_chars_motivo_edicao", 10);
  const cabeca = el("div", "painel-cabeca cabeca-plana");
  juntar(cabeca,
    el("h2", "rr-secao-titulo", t("rr.diff_titulo")),
    el("span", "crescer"),
    el("span", "etiqueta " + (rr.diff.length ? "devolvido" : "pendente"),
      t("rr.diff_conta", { n: n(rr.diff.length) })));
  no.appendChild(cabeca);
  if (!rr.diff.length) {
    no.appendChild(el("p", "rr-secao-nota", t("rr.diff_vazio")));
    return;
  }
  const lista = el("div", "diff-lista");
  for (const d of rr.diff) {
    const item = el("div", "diff-item");
    const campo = el("div", "diff-campo");
    juntar(campo,
      el("div", null, rotuloDoCampo(d.campo, rr.detalhe)),
      el("div", "mono fraco", d.campo));
    item.appendChild(campo);
    const valores = el("div", "diff-valores");
    juntar(valores,
      el("span", "de", t("rr.diff_de") + ": "
        + (comoTexto(d.antes) === null ? t("rr.diff_nada") : comoTexto(d.antes))),
      el("span", "para", t("rr.diff_para") + ": "
        + (comoTexto(d.depois) === null ? t("rr.diff_nada") : comoTexto(d.depois))));
    item.appendChild(valores);
    const motivo = (rr.motivos[d.campo] || "").trim();
    item.appendChild(el("div", "diff-motivo" + (motivo.length < piso ? " pendente" : ""),
      motivo.length < piso ? t("rr.diff_sem_motivo") : motivo));
    lista.appendChild(item);
  }
  no.appendChild(lista);
}

/** O QUE FALTA, na ordem em que a tela pede — de cima para baixo. */
function rrOQueFalta() {
  const rr = est.rr;
  if (!rr || !rr.detalhe || !rr.form) return t("falta.nada");
  if (!rr.antes) return t("falta.rr_antes");
  const piso = lim("min_chars_motivo_edicao", 10);
  const sem = (rr.diff || [])
    .filter((d) => (rr.motivos[d.campo] || "").trim().length < piso).length;
  if (sem) return sem === 1 ? t("falta.rr_motivo_um") : t("falta.rr_motivos", { n: sem });
  if (!rr.depois) return t("falta.rr_depois");
  const minimo = lim("min_chars_avaliacao", 30);
  const tem = (rr.justificativa || "").trim().length;
  if (tem < minimo) return t("falta.justificativa", { n: minimo - tem });
  return null;
}

function rrAtualizarBotao() {
  const b = $("#rr-registrar");
  if (!b) return;
  const falta = rrOQueFalta();
  const aviso = $("#rr-falta");
  if (aviso) {
    aviso.textContent = falta || "";
    aviso.hidden = !falta;
  }
  b.disabled = !!falta || est.rr.carregando;
}

/** OS QUATRO PASSOS, DERIVADOS de `est.rr` — nada disto é guardado.

    Um segundo estado ("em que passo eu estou") divergiria do primeiro no dia em
    que alguém mexesse numa das escalas, e a bússola apontaria para um passo que
    a tela já concluiu. Aqui ela é uma LEITURA do formulário, como
    `rrOQueFalta` é — e é a MESMA leitura: os dois pisos saem dos mesmos `lim()`,
    e a ordem em que a pendência é procurada é a mesma ordem visual. Divergir
    faria a bússola declarar um passo pronto enquanto o botão continua dizendo
    que falta, e quem lê a bússola concluiria que o botão está quebrado. Ver
    `rrOQueFalta`, logo acima — as duas andam juntas, e há teste que as trava.

    `opcional` não é uma quinta cor de "pendente": é a afirmação de que aquele
    passo não tem o que fazer. Avaliar sem corrigir é desfecho legítimo (é o que
    `rr.diff_vazio` diz), e marcar isso como pendência inventaria uma tarefa. */
function rrPassos() {
  const rr = est.rr;
  const piso = lim("min_chars_motivo_edicao", 10);
  const minimo = lim("min_chars_avaliacao", 30);
  const diff = rr.diff || [];
  const sem = diff.filter((d) => (rr.motivos[d.campo] || "").trim().length < piso).length;
  const escrito = (rr.justificativa || "").trim().length;
  const estados = {
    antes: rr.antes ? "feito" : "pendente",
    corrigir: !diff.length ? "opcional" : (sem ? "pendente" : "feito"),
    depois: rr.depois ? "feito" : "pendente",
    just: escrito >= minimo ? "feito" : "pendente",
  };
  // O RESUMO de cada passo é o que ele DECIDIU, não o que ele é: o nome da
  // opção escolhida sai das mesmas tabelas que desenham as escalas (zero
  // tradução nova), e o da justificativa reusa o contador que já existe embaixo
  // do campo. Dois textos para o mesmo número divergiriam na primeira mexida.
  const valores = {
    antes: rr.antes ? nomeDaEscala(ESCALA_ANTES, rr.antes) : "",
    corrigir: t("rr.diff_conta", { n: n(diff.length) })
      + (sem ? " · " + t("rr.bussola_sem_motivo", { n: n(sem) }) : ""),
    depois: rr.depois ? nomeDaEscala(ESCALA_DEPOIS, rr.depois) : "",
    just: t("ws.contador_de", { n: n(escrito), min: minimo }),
  };
  const passos = PASSOS_RR.map((p) => ({
    id: p.id,
    rotulo: p.rotulo,
    alvo: p.alvo,
    estado: estados[p.id],
    valor: valores[p.id],
    pendencia: p.id === "corrigir" && sem > 0,
  }));
  const primeira = passos.find((p) => p.estado === "pendente");
  if (primeira) primeira.estado = "atual";
  return passos;
}

/** A BÚSSOLA, NEUTRA. Estado nenhum é aplicado aqui.

    Construir e pintar em funções separadas é o que permite à atualização ser
    cirúrgica: o nó do botão sobrevive à digitação, e com ele o foco de quem
    estava navegando pela bússola quando o resumo mudou embaixo dela. */
function bussolaRR() {
  const nav = el("nav", "rr-bussola");
  nav.id = "rr-bussola";
  nav.setAttribute("aria-label", t("rr.bussola_aria"));
  const lista = el("ol", "rr-bussola-passos");
  PASSOS_RR.forEach((p, i) => {
    const item = el("li", "rr-bussola-item");
    const b = el("button", "rr-bussola-passo");
    b.type = "button";
    b.dataset.passo = p.id;
    // ROVING TABINDEX manual: a bússola é UMA parada de Tab. Ao contrário de
    // `escalaRR`, aqui a seta MOVE O FOCO e não ativa nada — pular para uma
    // seção é uma navegação, não uma escolha, e uma seta que rolasse a tela
    // junto seria inútil para quem só quer olhar as quatro paradas. Enter e
    // espaço continuam ativando, nativamente, porque isto é um `<button>`.
    b.tabIndex = i === 0 ? 0 : -1;
    // O número é DECORAÇÃO: a posição já está dita por extenso no `aria-label`
    // ("passo 2 de 4"), e anunciá-la duas vezes é ruído.
    const num = el("span", "rr-bussola-num", String(i + 1));
    num.setAttribute("aria-hidden", "true");
    juntar(b,
      num,
      el("span", "rr-bussola-rotulo", t(p.rotulo)),
      el("span", "rr-bussola-valor", ""));
    b.addEventListener("click", () => irAoPassoRR(p.alvo));
    b.addEventListener("keydown", (ev) => {
      if (ev.key !== "ArrowRight" && ev.key !== "ArrowLeft") return;
      ev.preventDefault();
      const salto = ev.key === "ArrowRight" ? 1 : -1;
      const irmaos = lista.querySelectorAll(".rr-bussola-passo");
      const alvo = irmaos[(i + salto + PASSOS_RR.length) % PASSOS_RR.length];
      if (!alvo) return;
      b.tabIndex = -1;
      alvo.tabIndex = 0;
      alvo.focus();
    });
    item.appendChild(b);
    lista.appendChild(item);
  });
  nav.appendChild(lista);
  return nav;
}

/** PINTA a bússola a partir de `rrPassos()` — cirúrgica, nunca redesenhando.

    Ela roda a cada tecla do detalhe (um listener delegado no `#revisor-detalhe`)
    e reconstruir os botões aqui tiraria o foco do campo no meio da palavra: é o
    mesmo cuidado de `rrSincronizar` e de `atualizarEcoDoRail`.

    E ela NUNCA ROUBA O FOCO. O roving vai para o passo ATUAL, a menos que o foco
    já esteja dentro da bússola — aí ele fica exatamente onde a pessoa o pôs, e
    uma tecla digitada três seções abaixo não pode movê-lo. */
function rrAtualizarBussola() {
  const nav = $("#rr-bussola");
  // O MESMO `#revisor-detalhe` serve a triagem, que não tem bússola nenhuma —
  // um `input` na caixa de devolução chegaria aqui pelo listener delegado.
  if (!nav || !est.rr || !est.rr.detalhe || !est.rr.form) return;
  const passos = rrPassos();
  const focado = nav.contains(document.activeElement) ? document.activeElement : null;
  const botoes = nav.querySelectorAll(".rr-bussola-passo");
  passos.forEach((p, i) => {
    const b = botoes[i];
    if (!b) return;
    const texto = p.valor || "—";
    // O nome ACESSÍVEL carrega tudo o que a linha mostra e mais o que ela
    // insinua pela cor: posição, nome, estado e resumo. O `title` repete o mesmo
    // — no desktop o resumo está truncado por reticências, e passar o mouse tem
    // de revelar a frase inteira em vez de metade dela.
    const rotulo = t("rr.bussola_passo_aria",
      { n: n(i + 1), nome: t(p.rotulo), estado: t(ESTADOS_BUSSOLA[p.estado]), valor: texto });
    if (b.dataset.estado !== p.estado) b.dataset.estado = p.estado;
    if (p.estado === "atual") b.setAttribute("aria-current", "step");
    else b.removeAttribute("aria-current");
    if (b.getAttribute("aria-label") !== rotulo) {
      b.setAttribute("aria-label", rotulo);
      b.title = rotulo;
    }
    const num = b.querySelector(".rr-bussola-num");
    const marca = p.estado === "feito" ? "✓" : String(i + 1);
    if (num && num.textContent !== marca) num.textContent = marca;
    const valor = b.querySelector(".rr-bussola-valor");
    if (valor) {
      if (valor.textContent !== texto) valor.textContent = texto;
      if (p.pendencia) valor.dataset.pendencia = "true";
      else delete valor.dataset.pendencia;
    }
    b.tabIndex = focado ? (b === focado ? 0 : -1) : (p.estado === "atual" ? 0 : -1);
  });
  // Com tudo feito não há passo atual, e sem esta linha a bússola sairia da
  // ordem do Tab justamente quando ela vira o resumo do trabalho pronto.
  if (!focado && !passos.some((p) => p.estado === "atual") && botoes[0]) {
    botoes[0].tabIndex = 0;
  }
}

/** PULAR PARA UM PASSO: foco primeiro, rolagem depois.

    Rolar sem levar o foco junto move os olhos e deixa o teclado para trás — a
    tecla seguinte agiria lá em cima, na bússola, e não no controle que acabou de
    aparecer. O alvo é o primeiro interativo VIVO da seção, e `[tabindex="0"]`
    encabeça a lista de propósito: dentro de um radiogroup ele é o botão que o
    roving elegeu, que é exatamente onde a pessoa espera cair. A própria seção é
    o último recurso, e é por isso que ela nasce com `tabindex="-1"`.

    `preventScroll` porque quem rola é a linha seguinte: o `scroll-margin-top` do
    CSS desconta as três barras grudadas, e deixar o navegador rolar sozinho
    pararia com o título da seção atrás da bússola que acabou de ser clicada. */
function irAoPassoRR(alvoId) {
  const sec = document.getElementById(alvoId);
  if (!sec) return;
  const vivo = sec.querySelector("[tabindex=\"0\"],button,input,textarea,select");
  (vivo || sec).focus({ preventScroll: true });
  const reduzido = window.matchMedia
    && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  sec.scrollIntoView({ behavior: reduzido ? "auto" : "smooth", block: "start" });
}

/** A altura da bússola vira `--bussola-h`, NO `#revisor-detalhe`.

    No detalhe e não no `:root` porque a bússola só existe nesta tela: global,
    ela empurraria o cabeçalho da matriz do ANOTADOR para baixo por causa de uma
    barra que não está lá. É o mesmo canal de `--faixa-h` e `--cols` — medida do
    DOM sai por `setProperty`, nunca por estilo inline.

    ZERAR quando o nav não existe é obrigação, não higiene: o mesmo
    `#revisor-detalhe` desenha a triagem e os três estados vazios do Rate and
    Review, e um valor sobrando ali deixaria as barras de dentro da tarefa
    flutuando abaixo de uma bússola que ninguém está vendo. Por isso a chamada
    vem logo depois do `limpar(det)` das duas funções de desenho: um ponto só,
    antes de qualquer `return` antecipado. */
function medirBussolaRR() {
  const det = $("#revisor-detalhe");
  if (!det) return;
  const nav = $("#rr-bussola");
  det.style.setProperty("--bussola-h", (nav ? nav.offsetHeight : 0) + "px");
}

function desenharDetalheRR() {
  const det = $("#revisor-detalhe");
  // O FOCO MORRE NO REDESENHO, como nos papéis: escolher uma escala reconstrói o
  // detalhe inteiro, e o botão da bússola que estava focado deixa de existir. Só
  // devolvemos o foco se ele estava AQUI dentro — devolvê-lo sempre o roubaria
  // de quem está digitando na justificativa.
  const focado = document.activeElement;
  const passoFocado = focado && focado.closest && focado.closest("#rr-bussola")
    ? focado.dataset.passo : null;
  limpar(det);
  medirBussolaRR();
  const rr = est.rr;
  if (!rr || !rr.sel) {
    const caixa = el("div", "vazio");
    juntar(caixa,
      el("div", "vazio-titulo", t("rr.nada_selecionado")),
      el("p", "vazio-linha", t("rr.nada_selecionado_linha")));
    det.appendChild(caixa);
    return;
  }
  if (rr.carregando) { det.appendChild(esqueleto("rr.abrindo")); return; }
  if (!rr.detalhe) {
    det.appendChild(el("div", "vazio-linha", t("rr.erro_abrir")));
    return;
  }
  const env = rr.detalhe;
  const a = env.anotacao;
  // As caixas de motivo são registradas DURANTE o desenho do workspace, então
  // a lista tem de nascer vazia a cada redesenho — senão ela acumularia nós
  // que já saíram do DOM e `rrSincronizar` escreveria em elementos órfãos.
  rr.caixas = [];

  // Mesma decisão da triagem: o identificador do contrato vive no `title`.
  const carimbo = el("span", "fraco",
    a.versao_diretriz ? t("triagem.diretriz", { n: a.versao_diretriz }) : "");
  carimbo.title = a.payload_schema;
  const cabeca = el("div", "triagem-cabeca");
  juntar(cabeca,
    el("span", "etiqueta pendente", t("rr.versao", { n: a.versao })),
    el("span", rr.minha ? "eu" : "fraco",
      rr.minha ? t("rr.por_voce") : t("rr.por", { nome: a.anotador })),
    el("span", "fraco", dataHora(a.submetida_em)),
    el("span", "crescer"),
    env.tarefa.projeto ? el("span", "fraco dado", env.tarefa.projeto + " · ") : null,
    carimbo);
  det.appendChild(cabeca);
  // A BÚSSOLA vem antes de tudo o que rola: ela é a barra grudada desta tela, e
  // o aviso de solo, o comentário da triagem e o do rascunho passam POR BAIXO
  // dela. O documento contínuo continua contínuo — o que ela acrescenta é saber
  // onde se está dentro dele sem rolar até o fim para descobrir.
  det.appendChild(bussolaRR());
  // Cada seção é o ALVO de um passo: `id` para o salto, `tabindex="-1"` para o
  // foco de último recurso (uma `div` não é focável) e `role="region"` COM nome
  // — sem o nome, um leitor de tela anuncia "region" quatro vezes seguidas.
  const marcarPasso = (no, id) => {
    const p = PASSOS_RR.find((x) => x.id === id);
    no.id = p.alvo;
    no.tabIndex = -1;
    no.setAttribute("role", "region");
    no.setAttribute("aria-label", t(p.rotulo));
  };
  if (rr.minha) {
    const aviso = faixaSoloDe(rr);
    if (aviso) det.appendChild(aviso);
  }
  // A PASSAGEM 1 À VISTA. "Quem aprovou isto, e com que comentário" é o que
  // separa "a triagem errou" de "o anotador errou" — e é a diferença que a
  // escala 1 registra.
  if (rr.triagemDoItem) {
    const tri = el("div", "painel-corpo");
    juntar(tri, el("span", "fraco", t("rr.triagem", { nome: rr.triagemDoItem.revisor })));
    if (rr.triagemDoItem.comentario) {
      // `.dado`: o comentário foi escrito por uma pessoa e sai como ela o
      // escreveu, na língua dela.
      tri.appendChild(el("p", "secundario dado",
        t("rr.triagem_comentario", { comentario: rr.triagemDoItem.comentario })));
    }
    det.appendChild(tri);
  }
  if (rr.rascunhoRecuperado) {
    const aviso = el("div", "painel-corpo");
    const caixa = el("div", "aviso-rascunho");
    juntar(caixa, el("span", null, t("rr.rascunho")));
    const descartar = el("button", "botao discreta", t("botao.descartar_rascunho"));
    descartar.type = "button";
    descartar.addEventListener("click", () => {
      limparRascunhoRR(rr.sel);
      rr.form = JSON.parse(JSON.stringify(rr.original));
      rr.antes = null;
      rr.depois = null;
      rr.justificativa = "";
      rr.motivos = {};
      rr.rascunhoRecuperado = false;
      desenharDetalheRR();
    });
    caixa.appendChild(descartar);
    aviso.appendChild(caixa);
    det.appendChild(aviso);
  }

  /* ---- 1. o trabalho como chegou ---- */
  const antes = el("div", "rr-secao");
  marcarPasso(antes, "antes");
  juntar(antes,
    el("div", "rr-secao-titulo", t("rr.antes_titulo")),
    notaDeSecao("rr.antes_nota", "rr.antes_nota_detalhe"),
    escalaRR(ESCALA_ANTES, rr.antes, "a11y.escala_antes", (id) => {
      rr.antes = id;
      salvarRascunhoRR();
      desenharDetalheRR();
    }));
  det.appendChild(antes);

  /* ---- 2. corrigir no lugar ---- */
  const corrigir = el("div", "rr-secao");
  marcarPasso(corrigir, "corrigir");
  juntar(corrigir,
    el("div", "rr-secao-titulo", t("rr.corrigir_titulo")),
    notaDeSecao("rr.corrigir_nota", "rr.corrigir_nota_detalhe"));
  det.appendChild(corrigir);
  // O MESMO workspace do anotador, destravado. Ver `ctxEdicaoRevisor`.
  det.appendChild(desenharWorkspace(env, ctxEdicaoRevisor()));
  // A caixa de ÚLTIMO RECURSO: um caminho que nenhum prefixo reivindicou cai
  // aqui em vez de virar uma mudança impossível de justificar (e um botão que
  // nunca destrava). Ela é registrada por último de propósito.
  det.appendChild(caixaDeMotivos(""));

  /* ---- o resumo do diff ---- */
  const resumo = el("div", "diff");
  resumo.id = "rr-diff";
  det.appendChild(resumo);

  /* ---- 3. o resultado ---- */
  const depois = el("div", "rr-secao");
  marcarPasso(depois, "depois");
  juntar(depois,
    el("div", "rr-secao-titulo", t("rr.depois_titulo")),
    el("p", "rr-secao-nota", t("rr.depois_nota")),
    escalaRR(ESCALA_DEPOIS, rr.depois, "a11y.escala_depois", (id) => {
      rr.depois = id;
      salvarRascunhoRR();
      desenharDetalheRR();
    }));
  det.appendChild(depois);

  /* ---- 4. por quê ---- */
  const just = el("div", "rr-secao");
  marcarPasso(just, "just");
  const minimo = lim("min_chars_avaliacao", 30);
  juntar(just,
    el("div", "rr-secao-titulo", t("rr.just_titulo")),
    notaDeSecao("rr.just_nota", "rr.just_nota_detalhe"));
  const area = el("textarea");
  area.rows = 4;
  area.className = "largo";
  area.placeholder = t("rr.just_ph", { min: minimo });
  area.setAttribute("aria-label", t("rr.just_titulo"));
  area.value = rr.justificativa || "";
  const contador = el("div", "contador",
    t("ws.contador_de", { n: n((rr.justificativa || "").trim().length), min: minimo }));
  area.addEventListener("input", () => {
    rr.justificativa = area.value;
    contador.textContent = t("ws.contador_de",
      { n: n(area.value.trim().length), min: minimo });
    salvarRascunhoRR();
    rrAtualizarBotao();
  });
  juntar(just, area, contador, dicaLinguaMeta("lingua.meta"));
  det.appendChild(just);

  /* ---- a única ação primária ---- */
  // O rótulo nasce definitivo; quem muda a cada tecla é a linha `#rr-falta`
  // acima dele. Ver `barraAcoes`.
  const acoes = el("div", "triagem-acoes");
  const aviso = el("div", "falta");
  aviso.id = "rr-falta";
  aviso.hidden = true;
  const registrar = el("button", "botao primaria", t("botao.registrar_avaliacao"));
  registrar.type = "button";
  registrar.id = "rr-registrar";
  registrar.addEventListener("click", registrarAvaliacao);
  juntar(acoes, aviso, registrar, el("span", "atalho", "Ctrl+Enter"));
  det.appendChild(acoes);

  // Primeiro desenho do resumo e do botão, já com o rascunho recuperado dentro.
  rrSincronizar();
  // A bússola lê o formulário a cada tecla, e um listener DELEGADO evita
  // registrá-la em cada campo do workspace (que nasce e morre a cada redesenho).
  // A função é NOMEADA de propósito: mesmo alvo, mesmo tipo e a MESMA referência
  // não empilham — e este detalhe é redesenhado a cada clique de escala.
  det.addEventListener("input", rrAtualizarBussola);
  // Devolver o foco ANTES de pintar: `rrAtualizarBussola` faz o roving em volta
  // de quem está focado, e restaurar depois deixaria duas paradas de Tab.
  if (passoFocado) {
    const volta = det.querySelector("[data-passo=\"" + passoFocado + "\"]");
    if (volta) volta.focus();
  }
  rrAtualizarBussola();
  medirBussolaRR();
}

async function registrarAvaliacao() {
  const rr = est.rr;
  if (!rr || !rr.sel || rr.carregando || rrOQueFalta()) return;
  const alvo = rr.sel;
  const i = rr.itens.findIndex((x) => x.anotacao_id === alvo);
  const proximo = rr.itens[i + 1] || rr.itens[i - 1] || null;
  const corpo = {
    revisor_id: est.persona.id,
    avaliacao_antes: rr.antes,
    avaliacao_depois: rr.depois,
    justificativa: (rr.justificativa || "").trim(),
    edicoes: rr.diff.map((d) => ({
      campo: d.campo,
      valor_antes: comoTexto(d.antes),
      valor_depois: comoTexto(d.depois),
      motivo: (rr.motivos[d.campo] || "").trim(),
    })),
    // Medido e enviado — e invisível para quem avalia, como no anotador.
    tempo_ativo_ms: Math.max(0, Date.now() - rr.abertoEm),
  };
  // Só quando houve mudança: mandar uma cópia idêntica do payload diria ao
  // banco que houve correção onde não houve.
  if (rr.diff.length) corpo.payload_corrigido = montarPayload(rr.detalhe, rr.form);
  rr.carregando = true;
  rrAtualizarBotao();
  try {
    const r = await postar("/api/avaliacao/" + alvo, corpo);
    limparRascunhoRR(alvo);
    recado(r.status === "escalada" ? t("recado.escalada")
      : r.status === "descartada" ? t("recado.descartada") : t("recado.avaliada"));
  } catch (e) {
    rr.carregando = false;
    recado(e.message, true);
    rrAtualizarBotao();
    return;
  }
  rr.carregando = false;
  // FECHAR O LOOP: o próximo item assume o lugar sozinho.
  await carregarRR(proximo ? proximo.anotacao_id : null);
  await recarregarSaude();
}

/* ==========================================================================
   7. PAINEL DO ADMIN
   O único lugar do P1 com números de verdade em quantidade: contagens do banco
   da plataforma, estado dos dois bancos e a origem ativa do pool.
   ========================================================================== */
function desenharAdmin() {
  const s = est.saude;
  const c = (s && s.anotacao && s.anotacao.contagens) || {};

  desenharAbasAdmin();

  const cards = $("#admin-cards");
  limpar(cards);
  const numeros = [
    [c.anotadores, "admin.card_anotadores", "admin.card_anotadores_nota"],
    [c.tarefas, "admin.card_tarefas", "admin.card_tarefas_nota"],
    [c.anotacoes, "admin.card_anotacoes", "admin.card_anotacoes_nota"],
    [c.revisoes, "admin.card_revisoes", "admin.card_revisoes_nota"],
    [c.avaliacoes, "admin.card_avaliacoes", "admin.card_avaliacoes_nota"],
    [c.criacoes, "admin.card_criacoes", "admin.card_criacoes_nota"],
  ];
  for (const [valor, rotulo, nota] of numeros) {
    const card = el("div", "card");
    juntar(card,
      el("div", "card-valor", n(valor || 0)),
      el("div", "card-rotulo", t(rotulo)),
      el("div", "card-nota", t(nota)));
    cards.appendChild(card);
  }

  /* ---- pool ---- */
  const p = (s && s.pool) || null;
  const et = $("#pool-etiqueta");
  limpar(et);
  et.className = "etiqueta " + (p && p.origem !== "fallback" ? "aprovado" : "devolvido");
  juntar(et, el("span", "ponto"),
    el("span", null, p
      ? (p.origem === "fallback" ? t("admin.pool_fallback") : t("admin.pool_curada"))
      : t("admin.pool_desconhecido")));

  const linhas = $("#pool-linhas");
  limpar(linhas);
  const pol = (p && p.politica_licenca) || null;
  // A CLASSE do valor vem da própria linha, e não de um `startsWith` no rótulo:
  // com dois idiomas, casar pelo texto do rótulo quebraria em um deles — e
  // quebraria em silêncio, num alinhamento de número.
  // As quatro frases DIAGNÓSTICAS deste painel vêm do servidor como CHAVE +
  // dados, e não como texto pronto: elas explicam a proveniência, que é a
  // segunda coisa que o brief manda um avaliador procurar, e o servidor fala
  // uma língua só. (`p.motivo`, `p.filtro_fallback` e `p.nota_nsfw` continuam
  // vindo em português na mesma resposta — para /docs e para o terminal.)
  const pares = p ? [
    ["admin.pool_origem", p.origem, null],
    ["admin.pool_itens", n(p.n_pool), "num"],
    ["admin.pool_por_que", p.motivo_chave ? t(p.motivo_chave, p.motivo_dados) : "-", null],
    ["admin.pool_colecao", p.colecao, null],
    ["admin.pool_filtro", p.filtro ? t(p.filtro.chave, p.filtro.dados) : "-", null],
    // A POLÍTICA DE LICENÇA e o número que ela exclui. Sem o número, "política
    // ativa" é promessa; com ele, é medida — e foi a ausência dela que deixou
    // 9.148 linhas cc-by-nc entrarem no trabalho sem ninguém ver.
    ["admin.pool_politica", pol && pol.descricao_chave ? t(pol.descricao_chave) : "-", null],
    ["admin.pool_excluidas", n(p.excluidas_por_licenca || 0), "num"],
    // A VERDADE sobre a garantia de NSFW, em vez de "sem NSFW".
    ["admin.pool_nsfw", p.nota_nsfw_chave ? t(p.nota_nsfw_chave) : "-", null],
    ["admin.pool_materializado", dataHora(p.materializado_em), null],
    ["admin.pool_build", p.build_do_pool || "-", "mono"],
    // O MODO SOLO no painel, e não só na fila do revisor: quem lê as métricas
    // precisa saber se a taxa de aprovação veio de revisão cruzada ou de
    // autorrevisão. São números diferentes com o mesmo nome.
    ["admin.pool_autorrevisao", (est.saude && est.saude.modo_solo)
      ? t("admin.pool_autorrevisao_on") : t("admin.pool_autorrevisao_off"), null],
  ] : [["admin.pool_estado", t("admin.pool_sem_health"), null]];
  for (const [rotulo, valor, classe] of pares) {
    linhas.appendChild(el("dt", null, t(rotulo)));
    linhas.appendChild(el("dd", classe, valor));
  }

  /* ---- escalação ---- */
  desenharEscalacao();

  /* ---- projetos ---- */
  desenharProjetosAdmin();

  /* ---- equipe ---- */
  desenharEquipe();

  /* ---- métricas e geração (P5a) ---- */
  desenharMetricas();
  desenharGerar();

  /* ---- bancos ---- */
  const bancos = $("#bancos-linhas");
  limpar(bancos);
  const a = (s && s.anotacao) || {};
  const co = (s && s.corpus) || {};
  const dados = [
    ["admin.banco_plataforma", a.arquivo || "-", "mono"],
    ["admin.banco_schema", String(a.schema_version ?? "-"), "num"],
    ["admin.banco_corpus", co.arquivo || "-", "mono"],
    ["admin.banco_prompts", n(co.n_prompts), "num"],
    ["admin.banco_build", co.db_build_id || "-", "mono"],
    ["admin.banco_construido", co.built_at || "-", null],
  ];
  for (const [rotulo, valor, classe] of dados) {
    bancos.appendChild(el("dt", null, t(rotulo)));
    bancos.appendChild(el("dd", classe, valor));
  }
  // O COMANDO MORA AQUI, e em nenhuma tela de anotador. Quem abre a fila e não
  // encontra brief nem diretriz não é quem roda a CLI — mandar `pf annotate
  // seed` para ele é falar a língua do repositório com quem veio trabalhar. O
  // padrão é o do `blocoRuntime`: o estado, e o comando que o conserta, juntos.
  bancos.appendChild(el("dt", null, t("admin.banco_seed")));
  const seedDd = el("dd");
  seedDd.appendChild(el("code", "comando dado", "pf annotate seed"));
  seedDd.appendChild(el("div", "fraco", t("admin.banco_seed_nota")));
  bancos.appendChild(seedDd);

  /* ---- roteiro ---- */
  const rot = $("#roteiro");
  limpar(rot);
  for (const chave of ROTEIRO) {
    rot.appendChild(el("li", null, t(chave)));
  }

  /* ---- formulário de equipe ---- */
  // Reconstruído a cada desenho, e não só quando está vazio: o rótulo dos
  // papéis muda de língua, e um `if (!options.length)` deixaria a lista na
  // língua da primeira montagem para sempre.
  const sel = $("#admin-papel");
  const escolhido = sel.value;
  limpar(sel);
  for (const pp of PAPEIS) {
    const o = el("option", null, t(pp.nome));
    o.value = pp.id;
    sel.appendChild(o);
  }
  if (escolhido) sel.value = escolhido;
}
