   ========================================================================== */

const FAIXAS = [
  ["", "catalogo.faixa_qualquer"],
  ["curto", "catalogo.faixa_curto"],
  ["medio", "catalogo.faixa_medio"],
  ["longo", "catalogo.faixa_longo"],
];

function desenharCatalogo(area) {
  const painel = el("div", "painel");
  const cabeca = el("div", "painel-cabeca");
  juntar(cabeca,
    el("h2", null, t("catalogo.titulo", { tipo: nomeTipo(est.aba).toLowerCase() })),
    el("span", "crescer"));
  const dados = est.catalogo.dados;
  if (dados) {
    cabeca.appendChild(el("span", "fraco num",
      t("catalogo.contagem", { n: n(dados.total), total: n(dados.n_pool) })));
  }
  painel.appendChild(cabeca);

  const corpo = el("div", "painel-corpo");
  const filtros = el("div", "filtros");
  const busca = el("input");
  busca.type = "text";
  busca.placeholder = t("catalogo.busca_ph");
  busca.value = est.catalogo.q;
  // O texto digitado vai para o ESTADO a cada tecla (a busca só dispara no
  // Enter ou no botão). Sem isto, trocar de idioma com uma busca escrita e
  // ainda não disparada apagaria o que a pessoa acabou de digitar.
  busca.addEventListener("input", () => { est.catalogo.q = busca.value; });
  busca.addEventListener("keydown", (ev) => {
    if (ev.key === "Enter") { est.catalogo.page = 1; carregarCatalogo(); }
  });
  filtros.appendChild(busca);

  const selIdioma = seletor([["", "catalogo.todos_idiomas"], ["pt", "lang.pt"], ["en", "lang.en"]],
    est.catalogo.lang, (v) => { est.catalogo.lang = v; est.catalogo.page = 1; carregarCatalogo(); });
  const selFaixa = seletor(FAIXAS, est.catalogo.faixa,
    (v) => { est.catalogo.faixa = v; est.catalogo.page = 1; carregarCatalogo(); });
  // As FONTES são dado (nomes de dataset), não cromo: entram como estão.
  const selFonte = seletorLivre(
    [["", t("catalogo.todas_fontes")]].concat(((dados && dados.fontes) || []).map((f) => [f, f])),
    est.catalogo.fonte,
    (v) => { est.catalogo.fonte = v; est.catalogo.page = 1; carregarCatalogo(); });
  juntar(filtros, selIdioma, selFaixa, selFonte);

  const buscar = el("button", "botao", t("botao.buscar"));
  buscar.type = "button";
  buscar.addEventListener("click", () => { est.catalogo.page = 1; carregarCatalogo(); });
  filtros.appendChild(buscar);
  corpo.appendChild(filtros);
  if (est.catalogo.q && dados && !dados.busca_aplicada) {
    corpo.appendChild(el("p", "falta", t("catalogo.busca_vazia")));
  }
  painel.appendChild(corpo);

  if (!dados) {
    painel.appendChild(esqueleto("catalogo.carregando"));
    area.appendChild(painel);
    return;
  }
  if (!dados.items.length) {
    const vazio = el("div", "vazio");
    juntar(vazio,
      el("div", "vazio-titulo", t("catalogo.vazio_titulo")),
      el("p", "vazio-linha", t("catalogo.vazio_linha", { n: n(dados.n_pool) })));
    const saidas = el("div", "vazio-saidas");
    const limpaB = el("button", "botao primaria", t("botao.limpar_filtros"));
    limpaB.type = "button";
    limpaB.addEventListener("click", () => {
      est.catalogo = { q: "", lang: "", fonte: "", faixa: "", page: 1, dados: null };
      carregarCatalogo();
    });
    const volta = el("button", "botao", t("botao.voltar_fila"));
    volta.type = "button";
    volta.addEventListener("click", () => irPara("fila"));
    juntar(saidas, limpaB, volta);
    vazio.appendChild(saidas);
    painel.appendChild(vazio);
    area.appendChild(painel);
    return;
  }

  const lista = el("div", "lista-catalogo");
  for (const item of dados.items) {
    const linha = el("div", "item-catalogo" + (item.ja_anotei ? " feito" : ""));
    const texto = el("div", "item-texto");
    juntar(texto, el("div", "item-trecho", item.trecho + (item.truncado ? "…" : "")));
    const meta = el("div", "item-meta");
    juntar(meta,
      el("span", "selo", item.fonte),
      el("span", "selo", item.licenca),
      el("span", "selo", t("ws.prov_chars", { n: n(item.n_chars) })),
      el("span", "selo", nomeLingua(item.lang)));
    if (item.ja_anotei) meta.appendChild(el("span", "selo", t("catalogo.ja_anotei")));
    // O ERRO SE ANUNCIA ANTES DE ACONTECER: um prompt cru do corpus não tem
    // resposta de modelo nenhuma, e comparar A/B sobre ele seria um beco.
    const podeEste = (item.pode || []).indexOf(est.aba) >= 0;
    if (!podeEste) meta.appendChild(el("span", "selo", t("catalogo.sem_material_selo")));
    texto.appendChild(meta);
    linha.appendChild(texto);

    const impedido = !!item.ja_anotei || !podeEste;
    const b = el("button", "botao" + (impedido ? "" : " primaria"),
      item.ja_anotei ? t("botao.ja_anotado")
        : !podeEste ? t("botao.sem_material") : t("botao.anotar_este"));
    b.type = "button";
    b.disabled = impedido;
    if (!podeEste && !item.ja_anotei) {
      b.title = est.aba === "comparar_ab"
        ? t("catalogo.title_ab", { n: n(item.n_respostas) })
        : t("catalogo.title_avaliar");
    }
    b.addEventListener("click", () => pegarLivre(item.uid));
    linha.appendChild(b);
    lista.appendChild(linha);
  }
  painel.appendChild(lista);

  if (dados.pages > 1) {
    const nav = el("div", "paginacao");
    const anterior = el("button", "botao", t("botao.anterior"));
    anterior.type = "button";
    anterior.disabled = dados.page <= 1;
    anterior.addEventListener("click", () => { est.catalogo.page = dados.page - 1; carregarCatalogo(); });
    const proximo = el("button", "botao", t("botao.proxima"));
    proximo.type = "button";
    proximo.disabled = dados.page >= dados.pages;
    proximo.addEventListener("click", () => { est.catalogo.page = dados.page + 1; carregarCatalogo(); });
    juntar(nav, anterior,
      el("span", "num", t("catalogo.pagina", { page: n(dados.page), pages: n(dados.pages) })),
      proximo);
    painel.appendChild(nav);
  }
  area.appendChild(painel);
}

/** Seletor cujos rótulos são CHAVES do dicionário (cromo). */
function seletor(opcoes, valor, aoMudar) {
  return seletorLivre(opcoes.map(([v, chave]) => [v, t(chave)]), valor, aoMudar);
}

/** Seletor cujos rótulos já são texto pronto — usado para DADO (nome de fonte). */
function seletorLivre(opcoes, valor, aoMudar) {
  const sel = el("select");
  for (const [v, rotulo] of opcoes) {
    const o = el("option", null, rotulo);
    o.value = v;
    sel.appendChild(o);
  }
  sel.value = valor;
  sel.addEventListener("change", () => aoMudar(sel.value));
  return sel;
}

/** Junta caminho e query. Existe para que o caminho continue sendo um literal
    inteiro no código — é o que o teste de contrato do front consegue ler. */
/** `caminho?a=1&b=2`. Aceita `URLSearchParams` **ou** um objeto simples.

    Aceitar os dois não é conveniência: com só `URLSearchParams`, passar um
    objeto produzia `?[object Object]` — uma URL válida, um 422 do servidor por
    campo faltando, e uma tela vazia sem erro visível. Foi exatamente isso que
    aconteceu na primeira montagem da fila de triagem. Um contorno silencioso
    é pior que um erro, então a função passou a converter. */
function comParams(caminho, params) {
  const p = params instanceof URLSearchParams
    ? params
    : new URLSearchParams(Object.entries(params).map(([k, v]) => [k, String(v)]));
  return caminho + "?" + p.toString();
}

/** Ordem das buscas do catálogo. Trocar dois filtros em sequência dispara duas
    consultas, e a PRIMEIRA pode responder por último — a tela mostraria o
    resultado do filtro anterior como se fosse o atual. Só a busca mais recente
    tem direito de escrever em `est.catalogo.dados`. */
let buscaAtual = 0;

async function carregarCatalogo() {
  const c = est.catalogo;
  const minha = ++buscaAtual;
  const p = new URLSearchParams({
    anotador_id: String(est.persona.id),
    tipo: est.aba,
    page: String(c.page),
  });
  if (c.q.trim()) p.set("q", c.q.trim());
  if (c.lang) p.set("lang", c.lang);
  if (c.fonte) p.set("fonte", c.fonte);
  if (c.faixa) p.set("faixa", c.faixa);
  let resultado;
  try {
    resultado = await api(comParams("/api/catalogo", p));
  } catch (e) {
    resultado = { items: [], total: 0, pages: 0, page: 1, n_pool: 0, fontes: [] };
    if (minha === buscaAtual) recado(t("catalogo.erro", { erro: e.message }), true);
  }
  if (minha !== buscaAtual) return;  // chegou atrasada: descarta
  c.dados = resultado;
  if (est.vista === "catalogo") desenharArea();
}

const pegarLivre = (uid) => pegarLivreEm(est.aba, uid);

/** Abre este prompt neste tipo, pelo modo livre, e leva para a área de trabalho. */
async function pegarLivreEm(tipo, uid) {
  try {
    // A tarefa nasce NO PROJETO EM FOCO: sem isso, escolher um prompt no
    // catálogo enquanto se trabalha no Portfólio criaria a tarefa no projeto
    // padrão de qualquer jeito, e o recorte da barra não valeria para o que se
    // cria dentro dele.
    const r = await postar("/api/tarefas/livre", paramsProjeto({
      anotador_id: est.persona.id, tipo, prompt_uid: uid,
    }));
    est.aba = tipo;
    aceitarEnvelope(r.tarefa, null);
    est.vista = "fila";
    desenharAnotador();
    await recarregarContagens();
  } catch (e) {
    recado(e.message, true);
  }
}

/* ==========================================================================
   5.9 MINHAS TAREFAS
   ========================================================================== */

const ROTULO_STATUS = {
  em_andamento: ["pendente", "status.em_andamento"],
  submetida: ["pendente", "status.submetida"],
  aprovada: ["aprovado", "status.aprovada"],
  abandonada: ["pendente", "status.abandonada"],
  expirada: ["pendente", "status.expirada"],
};

/* ==========================================================================
   O MODO CRIAR (P4) — o terceiro modo de seleção
   ========================================================================== */

/** Um seletor de classe da taxonomia, opcional, com nome legível E id.

    O mesmo contrato do chip do brief e do select da pergunta de categoria: o id
    é o que atravessa a plataforma e o corpus, e escondê-lo esconderia a única
    parte que casa com o banco de prompts. Vazio é uma opção de verdade — a
    sugestão é pista para quem revisa, não rótulo. */
function seletorDeClasse(secao, valor, aoMudar) {
  const sel = el("select");
  const vazia = el("option", null, t("criar.sem_sugestao"));
  vazia.value = "";
  sel.appendChild(vazia);
  const classes = est.taxonomia[secao] || {};
  for (const id of Object.keys(classes)) {
    const nome = nomeDaClasse(secao, id) || id;
    const op = el("option", null, nome + " · " + id);
    op.value = id;
    sel.appendChild(op);
  }
  sel.value = valor || "";
  sel.addEventListener("change", () => aoMudar(sel.value));
  return sel;
}

/* O funil do modo criar, com a chave INTEIRA — como todas as tabelas deste
   arquivo. `t("criar.status." + item.status)` seria invisível para o teste de
   chave órfã, e um status novo do backend sairia cru na tela. */
/* As duas línguas que o DDL aceita, com a chave inteira — mesma disciplina. */
const LINGUAS_CRIACAO = [["pt", "criar.lang_pt"], ["en", "criar.lang_en"]];

const STATUS_CRIACAO = {
  "submetida": { chave: "criar.status.submetida", classe: "" },
  "aprovada": { chave: "criar.status.aprovada", classe: "boa" },
  "rejeitada": { chave: "criar.status.rejeitada", classe: "grave" },
  "exportada": { chave: "criar.status.exportada", classe: "boa" },
};

/** O selo de uma criação já enviada: status + o que ele significa no funil. */
function seloDeCriacao(item) {
  const s = STATUS_CRIACAO[item.status] || STATUS_CRIACAO.submetida;
  return el("span", "selo " + s.classe, t(s.chave));
}

/* ==========================================================================
   A FILA DE PEDIDOS E A TRÍADE (Central de Briefs, F4-2)
   ========================================================================== */

/* As duas tabelas da fila, com a chave INTEIRA — como todas as tabelas deste
   arquivo (`t("pedido.papel_" + p)` seria invisível para o teste de chave
   órfã, e um valor novo do backend sairia cru na tela). Os vocabulários são os
   de `db.PAPEIS_PEDIDO` e das chaves que `pedidos.proximo` emite; há teste
   cobrando as três pontas. */
const PAPEIS_PEDIDO_ROTULO = {
  "professor": "pedido.papel_professor",
  "aluno": "pedido.papel_aluno",
};

const MOTIVOS_PEDIDO = {
  "vazio": "pedido.motivo_vazio",
  "vazio_filtrado": "pedido.motivo_vazio_filtrado",
  "ja_reservado": "pedido.motivo_ja_reservado",
};

/** O rascunho vazio da tríade. Função, e não literal duplicado: o reset do
    envio e o `est` inicial têm de concordar sobre a forma — duas cópias
    divergiriam na primeira coluna nova.

    A rubrica fica na forma do FORMULÁRIO (a de `escrever_rubrica@1`: pontas
    como `rotulo_min`/`rotulo_max`, `escala_max` no select); a conversão para
    `rubrica@3` acontece SÓ na montagem do envio (`montarMaterial`). A gold é
    TEXTO das três listas — um item por linha; a montagem separa. */
function materialVazio() {
  return {
    rubrica: { titulo: "", criterios: [] },
    gold: { deve_conter: "", nao_pode: "", armadilhas: "", observacoes: "" },
  };
}

/** O pedido reservado por esta pessoa, ou `null`. Ponto único da pergunta que
    o formulário, a cascata e o envio fazem — três leituras divergentes dariam
    uma tríade enviada sem pedido (422 garantido). */
function pedidoAtivo() {
  const d = est.pedido.dados;
  return d && d.meu ? d.meu : null;
}

/** Os limites da TRÍADE, do `GET /api/pedidos` — não do `/api/health`: o
    `max_criterios_rubrica` de lá é o da aba escrever_rubrica (8), e a tríade
    valida contra o de `[pedidos]` (5). Ler o health aqui deixaria a pessoa
    chegar a oito critérios e tomar 422 no envio. */
function limPedido(chave, padrao) {
  const d = est.pedido.dados;
  const v = d && d.limites ? Number(d.limites[chave]) : NaN;
  return Number.isFinite(v) && v > 0 ? v : padrao;
}

/** Papel do pedido como selo. Fora da tabela = valor novo do backend: sai CRU
    e marcado `.dado`, nunca por uma chave inventada. */
function seloDePapel(papel) {
  const chave = PAPEIS_PEDIDO_ROTULO[papel];
  return chave ? el("span", "selo", t(chave)) : el("span", "selo dado", String(papel));
}

async function carregarPedidos() {
  const p = est.pedido;
  if (p.carregando) return;
  p.carregando = true;
  try {
    p.dados = await api(comParams("/api/pedidos", { anotador_id: est.persona.id }));
  } catch (e) {
    // `{erro:true}` e não `null`: `null` é "nunca pedido" e redispararia a
    // carga a cada redesenho — um erro de rede viraria um laço de requisições.
    p.dados = { erro: true, meu: null, facetas: null, reserva_ttl_min: null, limites: null };
    recado(t("recado.erro_pedido", { erro: e.message }), true);
  }
  p.carregando = false;
  if (est.vista === "criar") desenharArea();
}

async function puxarPedido() {
  const p = est.pedido;
  if (p.puxando) return;
  p.puxando = true;
  desenharArea();
  try {
    const r = await postar("/api/pedidos/proximo", {
      anotador_id: est.persona.id,
      disciplina: p.filtros.disciplina || null,
      papel: p.filtros.papel || null,
    });
    // A CHAVE é guardada e traduzida no desenho (lição do P3i): trocar de
    // idioma com a fila vazia tem de trocar esta frase também.
    p.motivoChave = r.pedido ? null : r.motivo_chave;
    if (r.pedido) {
      p.painelAberto = true;
      recado(t(r.motivo_chave === "ja_reservado" ? MOTIVOS_PEDIDO.ja_reservado : "recado.pedido_puxado"));
      // Refetch em vez de costurar `r.pedido` em `dados`: o GET traz o `meu` E
      // as facetas já sem ele — os dois números têm de andar juntos.
      p.dados = null;
    }
  } catch (e) {
    recado(t("recado.erro_pedido", { erro: e.message }), true);
  }
  p.puxando = false;
  desenharArea();
}

async function devolverPedido() {
  const p = est.pedido;
  const meuP = pedidoAtivo();
  if (!meuP || p.devolvendo) return;
  p.devolvendo = true;
  try {
    await postar("/api/pedidos/" + meuP.id + "/devolver", { anotador_id: est.persona.id });
    recado(t("recado.pedido_devolvido"));
    p.motivoChave = null;
    p.dados = null;
  } catch (e) {
    recado(t("recado.erro_pedido", { erro: e.message }), true);
    // 404/403/409 = o estado local está velho (a reserva expirou, outra sessão
    // mexeu). O refetch conta a verdade; um retry cego repetiria o erro.
    if (e.status === 404 || e.status === 403 || e.status === 409) p.dados = null;
  }
  p.devolvendo = false;
  desenharArea();
}

/** O painel do pedido, no topo da vista criar — a casca do brief do P9, com
    acento próprio. O rascunho da tríade NÃO mora aqui (mora em `est.criacao.
    material`), então devolver o pedido não apaga o que a pessoa escreveu. */
function blocoPedido() {
  const p = est.pedido;
  const det = el("details", "diretrizes brief pedido");
  det.open = p.painelAberto;
  det.addEventListener("toggle", () => { p.painelAberto = det.open; });
  const dados = p.dados;
  const meuP = pedidoAtivo();
  det.appendChild(el("summary", null,
    meuP ? t("pedido.titulo_n", { id: n(meuP.id) }) : t("pedido.titulo")));
  const corpo = el("div", "brief-corpo");
  det.appendChild(corpo);

  if (!dados || p.carregando) {
    corpo.appendChild(esqueleto("criar.carregando"));
    return det;
  }

  if (!meuP) {
    corpo.appendChild(el("p", "vazio-linha", t("pedido.linha")));
    if (p.motivoChave && MOTIVOS_PEDIDO[p.motivoChave]) {
      corpo.appendChild(el("p", "vazio-linha", t(MOTIVOS_PEDIDO[p.motivoChave])));
    }
    if (dados.facetas) {
      const filtros = el("div", "pedido-filtros");
      const campoD = el("div", "campo");
      const selD = el("select");
      selD.setAttribute("aria-label", t("pedido.filtro_disciplina"));
      const opTodas = el("option", null, t("pedido.filtro_todos"));
      opTodas.value = "";
      selD.appendChild(opTodas);
      for (const fx of dados.facetas.disciplina) {
        // Disciplina "" é o default de quem o nome do arquivo não revelou:
        // não dá para OFERECER um filtro sem rótulo (limpar o filtro já cobre).
        if (!fx.valor) continue;
        const o = el("option", "dado", fx.valor + " (" + n(fx.n) + ")");
        o.value = fx.valor;
        selD.appendChild(o);
      }
      selD.value = p.filtros.disciplina;
      selD.addEventListener("change", () => { p.filtros.disciplina = selD.value; });
      juntar(campoD, el("span", null, t("pedido.filtro_disciplina")), selD);
      const campoP = el("div", "campo");
      const selP = el("select");
      selP.setAttribute("aria-label", t("pedido.filtro_papel"));
      const opTodos = el("option", null, t("pedido.filtro_todos"));
      opTodos.value = "";
      selP.appendChild(opTodos);
      for (const fx of dados.facetas.papel) {
        const chave = PAPEIS_PEDIDO_ROTULO[fx.valor];
        const o = el("option", chave ? null : "dado",
          (chave ? t(chave) : fx.valor) + " (" + n(fx.n) + ")");
        o.value = fx.valor;
        selP.appendChild(o);
      }
      selP.value = p.filtros.papel;
      selP.addEventListener("change", () => { p.filtros.papel = selP.value; });
      juntar(campoP, el("span", null, t("pedido.filtro_papel")), selP);
      juntar(filtros, campoD, campoP);
      corpo.appendChild(filtros);
    }
    const acoes = el("div", "acoes");
    const b = el("button", "primario", p.puxando ? t("pedido.puxando") : t("pedido.puxar"));
    b.type = "button";
    b.disabled = p.puxando;
    b.addEventListener("click", puxarPedido);
    acoes.appendChild(b);
    if (dados.facetas) {
      acoes.appendChild(el("span", "fraco",
        t("pedido.disponiveis", { n: n(dados.facetas.disponiveis) })));
    }
    corpo.appendChild(acoes);
    return det;
  }

  const topo = el("div", "pedido-chips");
  juntar(topo, seloDePapel(meuP.papel), chipDeCategoria("task_type", meuP.task_type));
  if (meuP.disciplina) {
    const chip = el("span", "chip-cat");
    chip.appendChild(el("span", "dado", meuP.disciplina));
    topo.appendChild(chip);
  }
  corpo.appendChild(topo);

  const dl = el("dl", "linhas");
  const pares = [
    [t("pedido.rot_tema"), meuP.tema],
    [t("pedido.rot_meta"), meuP.meta_pedagogica],
  ];
  if (meuP.habilidades.length) {
    pares.push([t("pedido.rot_habilidades"), meuP.habilidades.join(", ")]);
  }
  for (const [rot, valor] of pares) {
    dl.appendChild(el("dt", null, rot));
    dl.appendChild(el("dd", "dado", String(valor)));
  }
  corpo.appendChild(dl);

  corpo.appendChild(el("div", "rotulo-bloco espaco-acima-2", t("pedido.recorte")));
  corpo.appendChild(el("div", "pedido-recorte dado", meuP.recorte));

  if (meuP.avisos.length) {
    const av = el("div", "aviso-dup");
    av.appendChild(el("strong", null, t("pedido.avisos")));
    const ul = el("ul");
    for (const a of meuP.avisos) ul.appendChild(el("li", "dado", a));
    av.appendChild(ul);
    corpo.appendChild(av);
  }

  // PERMANENTE, nunca um `recado()`: a regra de autoria é a política de
  // licença do módulo inteiro, e o momento em que ela importa é o momento em
  // que a pessoa está com o recorte de terceiros na frente.
  corpo.appendChild(el("p", "aviso-autoria", t("pedido.autoria")));

  const acoes = el("div", "acoes");
  const dev = el("button", "botao", t("pedido.devolver"));
  dev.type = "button";
  dev.disabled = p.devolvendo;
  dev.addEventListener("click", devolverPedido);
  juntar(acoes, dev,
    el("span", "fraco", t("pedido.ttl", { min: n(dados.reserva_ttl_min) })));
  corpo.appendChild(acoes);
  return det;
}

/** Um item por linha → lista. A separação mora aqui e na cascata, uma função. */
function itensDeLista(texto) {
  return String(texto || "").split("\n").map((x) => x.trim()).filter(Boolean);
}

/** Os blocos da tríade no formulário — SÓ com pedido ativo.

    A rubrica REUSA `editorCriterio` (o formulário da aba escrever_rubrica),
    não a `matrizDeCriterios`: lá a pessoa APLICA uma rubrica; aqui ela
    ESCREVE uma. O contexto é próprio para os rascunhos não se cruzarem com o
    `est.form` do anotador. */
function blocoTriade() {
  const m = est.criacao.material;
  const c0 = {
    leitura: false,
    form: m.rubrica,
    aoDigitar: atualizarBotaoCriar,
    aoMudar: () => { desenharArea(); },
    motivos: null,
  };
  const caixa = el("div", "espaco-acima-2");
  caixa.appendChild(el("div", "rotulo-bloco", t("triade.rubrica_titulo")));
  caixa.appendChild(el("p", "pergunta-desc", t("triade.rubrica_linha")));

  const tituloCampo = el("div", "campo espaco-abaixo-2");
  const entrada = el("input");
  entrada.type = "text";
  entrada.className = "largo";
  entrada.maxLength = 200;
  entrada.placeholder = t("ws.titulo_rubrica_ph");
  entrada.setAttribute("aria-label", t("ws.titulo_rubrica"));
  entrada.value = m.rubrica.titulo;
  entrada.addEventListener("input", () => {
    m.rubrica.titulo = entrada.value;
    atualizarBotaoCriar();
  });
  juntar(tituloCampo, el("span", null, t("ws.titulo_rubrica")), entrada,
    dicaLinguaMeta("lingua.rubrica"));
  caixa.appendChild(tituloCampo);

  const lista = el("div", "criterios");
  m.rubrica.criterios.forEach((c, i) => lista.appendChild(editorCriterio(c, i, c0)));
  caixa.appendChild(lista);

  const rodape = el("div", "forma espaco-acima-2");
  const mais = el("button", "botao", t("botao.acrescentar_criterio"));
  mais.type = "button";
  // O teto é o da TRÍADE (`[pedidos]`, 5) — menor que o 8 da aba
  // escrever_rubrica. Vem do GET /api/pedidos, nunca do /api/health.
  mais.disabled = m.rubrica.criterios.length >= limPedido("max_criterios_rubrica", 5);
  mais.addEventListener("click", () => {
    m.rubrica.criterios.push({
      nome: "", descricao: "", escala_min: 1, escala_max: 5, rotulo_min: "", rotulo_max: "",
    });
    desenharArea();
  });
  juntar(rodape, mais, el("span", "fraco", t("ws.faixa_criterios", {
    min: limPedido("min_criterios_rubrica", 3),
    max: limPedido("max_criterios_rubrica", 5),
  })));
  caixa.appendChild(rodape);

  caixa.appendChild(el("div", "rotulo-bloco espaco-acima-2", t("triade.gold_titulo")));
  caixa.appendChild(el("p", "pergunta-desc", t("triade.gold_linha")));
  const listas = [
    ["deve_conter", "triade.deve_conter", "triade.deve_conter_ph", 3],
    ["nao_pode", "triade.nao_pode", "triade.nao_pode_ph", 2],
    ["armadilhas", "triade.armadilhas", "triade.armadilhas_ph", 2],
    ["observacoes", "triade.observacoes", "triade.observacoes_ph", 2],
  ];
  for (const [campo, rotulo, ph, linhas] of listas) {
    const cx = el("div", "campo");
    const ta = el("textarea");
    ta.rows = linhas;
    ta.placeholder = t(ph);
    ta.setAttribute("aria-label", t(rotulo));
    ta.value = m.gold[campo];
    ta.addEventListener("input", () => {
      m.gold[campo] = ta.value;
      atualizarBotaoCriar();
    });
    juntar(cx, el("span", null, t(rotulo)), ta);
    caixa.appendChild(cx);
  }
  caixa.appendChild(dicaLinguaMeta("lingua.meta"));
  return caixa;
}

/** Rascunho → `material_criacao@1` (sem o rótulo: quem carimba é o servidor).

    É AQUI que a forma do formulário vira `rubrica@3` — as duas PONTAS
    ancoradas, `min` fixo em 1 como na aba escrever_rubrica. Gerar no formato
    errado daria uma rubrica que a tela abre sem âncora nenhuma: o defeito do
    `routes_revisao:243`, documentado em `models.EscalaCriacaoIn`. */
function montarMaterial() {
  const m = est.criacao.material;
  return {
    rubrica: {
      titulo: m.rubrica.titulo.trim(),
      criterios: m.rubrica.criterios.map((c) => {
        const max = Number(c.escala_max) || 5;
        return {
          nome: c.nome.trim(),
          descricao: c.descricao.trim(),
          escala: {
            min: 1,
            max: max,
            ancoras: [
              { valor: 1, rotulo: c.rotulo_min.trim() },
              { valor: max, rotulo: c.rotulo_max.trim() },
            ],
          },
        };
      }),
    },
    gold: {
      deve_conter: itensDeLista(m.gold.deve_conter),
      nao_pode: itensDeLista(m.gold.nao_pode),
      armadilhas: itensDeLista(m.gold.armadilhas),
      observacoes: m.gold.observacoes.trim() || null,
    },
  };
}

/** O que falta, NA ORDEM DO TRABALHO: prompt → rubrica → gold — a cascata do
    P9. Devolve `[chave, vars]` do primeiro impedimento, ou `null`. Os pisos
    são os mesmos que o servidor aplica (`models.py`), vindos da rota. */
function oQueFaltaCriar() {
  const f = est.criacao;
  const faltamTexto = lim("min_chars_criacao", 15) - f.texto.trim().length;
  if (faltamTexto > 0) return ["criar.falta", { n: n(faltamTexto) }];
  if (!pedidoAtivo()) return null;

  const m = f.material;
  const titulo = m.rubrica.titulo.trim();
  if (titulo.length < 5) return ["falta.triade_titulo", { n: n(5 - titulo.length) }];
  const minC = limPedido("min_criterios_rubrica", 3);
  if (m.rubrica.criterios.length < minC) {
    return ["falta.triade_criterios", { n: n(minC - m.rubrica.criterios.length) }];
  }
  for (let i = 0; i < m.rubrica.criterios.length; i++) {
    const c = m.rubrica.criterios[i];
    if (c.nome.trim().length < 3) return ["falta.triade_criterio_nome", { i: n(i + 1) }];
    if (c.descricao.trim().length < 10) return ["falta.triade_criterio_desc", { i: n(i + 1) }];
    if (c.rotulo_min.trim().length < 3 || c.rotulo_max.trim().length < 3) {
      return ["falta.triade_criterio_pontas", { i: n(i + 1) }];
    }
  }

  const minItem = limPedido("gold_min_chars_item", 15);
  const deve = itensDeLista(m.gold.deve_conter);
  const minDeve = limPedido("gold_min_deve_conter", 2);
  if (deve.length < minDeve) return ["falta.triade_deve", { n: n(minDeve) }];
  const nao = itensDeLista(m.gold.nao_pode);
  const minNao = limPedido("gold_min_nao_pode", 1);
  if (nao.length < minNao) return ["falta.triade_nao_pode", { n: n(minNao) }];
  for (const item of [...deve, ...nao, ...itensDeLista(m.gold.armadilhas)]) {
    if (item.length < minItem) return ["falta.triade_item_curto", { n: n(minItem) }];
  }
  return null;
}

/** Uma criação na lista — o texto, o selo, e o que a decisão produziu.

    O `uid_previsto` aparece porque ele é a PROMESSA: é o identificador que a
    linha vai ter no corpus depois do `pf ingest plataforma`. Mostrá-lo é o que
    permite conferir, depois da ingestão, que a promessa foi cumprida. */
function cartaoDeCriacao(item, extras) {
  const card = el("div", "card-criacao");
  const topo = el("div", "criacao-topo");
  const selos = [seloDeCriacao(item)];
  // O BADGE DO CORPUS (P7): o fim da promessa que a aprovação fez. Só acende
  // com `=== true` — `null` significa "não conferido" (a listagem sem conexão
  // com o corpus), e um badge aceso por engano é pior que nenhum.
  if (item.chegou_ao_corpus === true) {
    const selo = el("span", "selo boa", t("criar.corpus_ok"));
    selo.title = t("criar.corpus_ok_linha");
    selos.push(selo);
  }
  juntar(topo, ...selos, el("span", "crescer"),
    el("span", "fraco mono", item.lang));
  card.appendChild(topo);
  card.appendChild(el("p", "criacao-texto", item.texto));

  const pes = el("dl", "linhas");
  const pares = [[t("criar.rot_licenca"), item.licenca]];
  if (item.task_type_sugerido) {
    pares.push([t("criar.rot_task_type"),
      (nomeDaClasse("task_type", item.task_type_sugerido) || "") + " · " + item.task_type_sugerido]);
  }
  if (item.domain_sugerido) {
    pares.push([t("criar.rot_domain"),
      (nomeDaClasse("domain", item.domain_sugerido) || "") + " · " + item.domain_sugerido]);
  }
  if (item.uid_previsto) pares.push([t("criar.rot_uid"), item.uid_previsto]);
  if (item.comentario_revisao) pares.push([t("criar.rot_comentario"), item.comentario_revisao]);
  for (const [rotulo, valor] of pares) {
    pes.appendChild(el("dt", null, rotulo));
    pes.appendChild(el("dd", "dado", String(valor)));
  }
  card.appendChild(pes);

  // A criação que veio de um PEDIDO leva a referência ao lado (F4-2): tema,
  // papel e task_type — o suficiente para quem lê saber de onde o prompt
  // veio. O RECORTE ao lado do revisor é do F5, junto do anti-cópia.
  if (item.pedido) {
    const ref = el("div", "pedido-ref");
    const topoRef = el("div", "criacao-topo");
    juntar(topoRef,
      el("strong", null, t("pedido.ref_titulo", { id: n(item.pedido.id) })),
      seloDePapel(item.pedido.papel),
      chipDeCategoria("task_type", item.pedido.task_type));
    ref.appendChild(topoRef);
    ref.appendChild(el("p", "dado", item.pedido.tema));
    card.appendChild(ref);
  }

  // O AVISO DE DUPLICATA é RESULTADO, não erro — e a frase diz isso. A mesma
  // cadeia de normalização que junta as duplicatas do corpus acabou de
  // reconhecer que duas pessoas escreveram a mesma coisa.
  if (item.uid_duplicata) {
    const aviso = el("div", "aviso-dup");
    juntar(aviso, el("strong", null, t("criar.dup_titulo")),
      el("span", null, " " + t("criar.dup_linha", { uid: item.uid_duplicata })));
    card.appendChild(aviso);
  }

  // A linha do funil quando o badge NÃO acendeu: cada estado diz qual comando
  // falta, porque a ingestão roda fora desta app e "aprovada" sozinha deixaria
  // a pessoa esperando um badge que nenhum clique daqui produz. O caso
  // exportada + duplicata é o texto colado: o dedup o colapsou no original do
  // aviso logo acima — resultado, não erro.
  if (item.chegou_ao_corpus !== true) {
    let linhaCorpus = null;
    if (item.status === "aprovada") linhaCorpus = t("criar.corpus_pendente");
    else if (item.status === "exportada") {
      linhaCorpus = item.uid_duplicata
        ? t("criar.corpus_colapsou")
        : t("criar.corpus_aguardando");
    }
    if (linhaCorpus) card.appendChild(el("p", "fraco", linhaCorpus));
  }
  if (extras) card.appendChild(extras);
  return card;
}

/** O formulário + o que esta pessoa já escreveu.

    A dedicação CC0 fica ACIMA do botão, não num rodapé: é a única licença que
    quem escreve pode afirmar na hora em que escreve, e o projeto inteiro se
    apoia em licença por linha. Quem envia precisa ver o que está cedendo. */
function desenharCriar(area) {
  const f = est.criacao;
  // O PEDIDO vem antes do formulário, como o brief vem antes das diretrizes:
  // é o enquadramento do que se vai escrever (Central de Briefs, F4-2).
  area.appendChild(blocoPedido());
  const painel = el("div", "painel");
  const cabeca = el("div", "painel-cabeca");
  juntar(cabeca, el("h2", null, t("criar.titulo")), el("span", "crescer"));
  painel.appendChild(cabeca);
  painel.appendChild(el("p", "vazio-linha", t("criar.linha")));

  const corpo = el("div", "painel-corpo");

  const campoTexto = el("div", "campo");
  const area1 = el("textarea");
  area1.rows = 6;
  area1.value = f.texto;
  area1.placeholder = t("criar.texto_ph");
  area1.setAttribute("aria-label", t("criar.texto"));
  area1.addEventListener("input", () => {
    f.texto = area1.value;
    atualizarBotaoCriar();
  });
  juntar(campoTexto, el("span", null, t("criar.texto")), area1, dicaLinguaDado(f.lang));
  corpo.appendChild(campoTexto);

  // O IDIOMA é declarado, e a tela diz que ele é um palpite: quem decide de
  // verdade é o s02 da pipeline, com dois detectores e um árbitro.
  const linhaMeta = el("div", "criar-meta");
  const campoLang = el("div", "campo");
  const selLang = el("select");
  for (const [id, chave] of LINGUAS_CRIACAO) {
    const op = el("option", null, t(chave));
    op.value = id;
    selLang.appendChild(op);
  }
  selLang.value = f.lang;
  selLang.setAttribute("aria-label", t("criar.lang"));
  selLang.addEventListener("change", () => { f.lang = selLang.value; });
  juntar(campoLang, el("span", null, t("criar.lang")), selLang,
    el("div", "pergunta-desc", t("criar.lang_nota")));
  linhaMeta.appendChild(campoLang);

  for (const [secao, chave, rotulo] of [
    ["task_type", "task_type", "criar.task_type"],
    ["domain", "domain", "criar.domain"],
  ]) {
    const campo = el("div", "campo");
    juntar(campo, el("span", null, t(rotulo)),
      seletorDeClasse(secao, f[chave], (v) => { f[chave] = v; }),
      el("div", "pergunta-desc", t("criar.sugestao_nota")));
    linhaMeta.appendChild(campo);
  }
  corpo.appendChild(linhaMeta);

  const campoBrief = el("div", "campo");
  const areaBrief = el("textarea");
  areaBrief.rows = 2;
  areaBrief.value = f.brief;
  areaBrief.placeholder = t("criar.brief_ph");
  areaBrief.setAttribute("aria-label", t("criar.brief"));
  areaBrief.addEventListener("input", () => { f.brief = areaBrief.value; });
  juntar(campoBrief, el("span", null, t("criar.brief")), areaBrief,
    dicaLinguaMeta("lingua.meta"));
  corpo.appendChild(campoBrief);

  // Com um pedido reservado, o formulário É a tríade: prompt + rubrica + gold.
  // Para escrever uma criação livre, devolve-se o pedido — a vista tem um
  // formulário só, e o backend exige os três juntos (`pedido_id` + `material`).
  if (pedidoAtivo()) corpo.appendChild(blocoTriade());

  corpo.appendChild(el("p", "cc0", t("criar.cc0")));

  const acoes = el("div", "acoes");
  const botao = el("button", "primario");
  botao.type = "button";
  botao.id = "botao-criar";
  botao.addEventListener("click", enviarCriacao);
  acoes.appendChild(botao);
  corpo.appendChild(acoes);
  painel.appendChild(corpo);
  area.appendChild(painel);
  atualizarBotaoCriar();

  const lista = el("div", "painel espaco-acima-3");
  const cab2 = el("div", "painel-cabeca");
  juntar(cab2, el("h2", null, t("criar.minhas")), el("span", "crescer"));
  lista.appendChild(cab2);
  if (!est.minhasCriacoes) {
    lista.appendChild(esqueleto("criar.carregando"));
  } else if (!est.minhasCriacoes.length) {
    lista.appendChild(el("p", "vazio-linha", t("criar.minhas_vazio")));
  } else {
    const caixa = el("div", "painel-corpo");
    for (const item of est.minhasCriacoes) caixa.appendChild(cartaoDeCriacao(item));
    lista.appendChild(caixa);
  }
  area.appendChild(lista);
}

/** O botão diz O QUE FALTA, com o piso vindo do /api/health — como em toda a
    plataforma, para que ele e o 422 nunca contem histórias diferentes. */
function atualizarBotaoCriar() {
  const botao = $("#botao-criar");
  if (!botao) return;
  const falta = oQueFaltaCriar();
  botao.disabled = !!falta || est.criacao.enviando;
  botao.textContent = est.criacao.enviando
    ? t("criar.enviando")
    : falta ? t(falta[0], falta[1]) : t("criar.enviar");
}

async function carregarMinhasCriacoes() {
  try {
    const r = await api(comParams("/api/criacoes", { anotador_id: est.persona.id }));
    est.minhasCriacoes = r.items || [];
  } catch (e) {
    est.minhasCriacoes = [];
    recado(t("recado.erro_criacoes", { erro: e.message }), true);
  }
  if (est.vista === "criar") desenharArea();
}

async function enviarCriacao() {
  const f = est.criacao;
  if (f.enviando) return;
  const meuP = pedidoAtivo();
  f.enviando = true;
  atualizarBotaoCriar();
  try {
    const corpo = {
      autor_id: est.persona.id,
      texto: f.texto.trim(),
      lang: f.lang,
      task_type_sugerido: f.task_type || null,
      domain_sugerido: f.domain || null,
      brief: f.brief.trim() || null,
    };
    // Com pedido reservado, o envio É a tríade — o servidor exige os dois
    // juntos, nos dois sentidos. O rótulo `material_criacao@1` NÃO viaja:
    // quem carimba é o servidor (`extra="forbid"` transformaria em 422).
    if (meuP) {
      corpo.pedido_id = meuP.id;
      corpo.material = montarMaterial();
    }
    const novo = await postar("/api/criacoes", corpo);
    // Limpa o rascunho SÓ no sucesso: um 422 que apaga o que a pessoa escreveu
    // é a pior forma de recusar um formulário.
    est.criacao = {
      texto: "", lang: f.lang, task_type: "", domain: "", brief: "",
      enviando: false, material: materialVazio(),
    };
    est.minhasCriacoes = null;
    if (meuP) {
      // O pedido virou `usado` na mesma transação da criação; o refetch traz a
      // fila e as facetas já sem ele.
      est.pedido.dados = null;
      est.pedido.motivoChave = null;
    }
    recado(novo.duplicata_corpus ? t("recado.criada_dup") : t("recado.criada"));
    desenharArea();
    carregarMinhasCriacoes();
    return;
  } catch (e) {
    // A reserva expirou no meio da escrita — o caso que MAIS vai acontecer
    // (alguém abre o pedido, escreve por horas e envia). O rascunho FICA em
    // `est`; o painel volta ao modo "puxar" e a frase diz o conserto.
    if (meuP && e.status === 409) {
      recado(t("recado.reserva_expirada"), true);
      est.pedido.dados = null;
      f.enviando = false;
      desenharArea();
      return;
    }
    recado(t("recado.erro_criar", { erro: e.message }), true);
  }
  f.enviando = false;
  atualizarBotaoCriar();
}

/** A fila de criações do revisor. Uma passagem só: ou o texto serve de prompt
    e entra no corpus, ou não serve — corrigir o texto de outra pessoa e ingerir
    o resultado como "prompt escrito por gente" destruiria a proveniência. */
function desenharFilaCriacoes(sub) {
  const fila = $("#revisor-fila");
  limpar(fila);
  const cr = est.criacoes;
  const solo = faixaSolo();
  if (solo) fila.appendChild(solo);
  if (!cr.items.length) {
    const vazia = el("div", "fila-vazia");
    juntar(vazia, el("div", "vazio-titulo", t(sub.vazio)), el("p", "vazio-linha", t(sub.linha)));
    fila.appendChild(vazia);
    desenharDetalheCriacao();
    return;
  }
  for (const item of cr.items) {
    const b = el("button", "fila-item");
    b.type = "button";
    b.setAttribute("aria-current", String(cr.sel === item.id));
    const topo = el("div", "fila-item-topo");
    juntar(topo, el("strong", null, t("criar.item")), el("span", "dado", item.autor),
      el("span", "crescer"), el("span", "fraco mono", item.lang));
    // O aviso de duplicata aparece JÁ NA LISTA: é a informação que muda a
    // decisão, e escondê-la atrás de um clique faria o revisor aprovar às cegas
    // uma criação que não acrescenta linha nenhuma ao corpus.
    if (item.uid_duplicata) topo.appendChild(el("span", "etiqueta devolvido", t("criar.dup_selo")));
    b.appendChild(topo);
    b.appendChild(el("div", "fila-item-trecho", item.texto));
    b.addEventListener("click", () => { cr.sel = item.id; desenharFilaCriacoes(sub); });
    fila.appendChild(b);
  }
  desenharDetalheCriacao();
}

function desenharDetalheCriacao() {
  const det = $("#revisor-detalhe");
  limpar(det);
  const cr = est.criacoes;
  const item = cr && cr.items.find((x) => x.id === cr.sel);
  if (!item) {
    det.appendChild(el("p", "vazio-linha", t("criar.escolha")));
    return;
  }
  // A criação vinda de PEDIDO leva junto o que o revisor precisa para julgar
  // originalidade (F5): o recorte AO LADO, o anti-cópia que o servidor
  // calculou, e a tríade em leitura. Tudo dentro do mesmo cartão — um segundo
  // painel separaria o julgamento do que está sendo julgado.
  const extras = el("div");
  if (item.pedido) {
    extras.appendChild(blocoRevisaoPedido(item));
    if (item.material) extras.appendChild(blocoTriadeLeitura(item.material));
  }
  extras.appendChild(acoesDeCriacao(item));
  det.appendChild(cartaoDeCriacao(item, extras));
}

/** O recorte e o veredito do anti-cópia, para quem revisa uma criação de pedido.

    O número vem do SERVIDOR (`criacoes.anticopia`, recalculado a cada leitura
    com a régua de agora) — um revisor estimando sobreposição no olho não é
    verificação. O trecho em comum viaja no `title` da linha: útil quando o
    número é alto, ruído visual quando são 8 caracteres de "a partir de". */
function blocoRevisaoPedido(item) {
  const caixa = el("div", "revisao-pedido");
  caixa.appendChild(el("div", "rotulo-bloco", t("pedido.recorte")));
  caixa.appendChild(el("div", "pedido-recorte dado", item.pedido.recorte));
  const ac = item.anticopia;
  if (ac) {
    const linha = el("p", ac.chars >= ac.limiar ? "anticopia grave" : "anticopia",
      t("revisao.anticopia", { n: n(ac.chars), limiar: n(ac.limiar) }));
    if (ac.trecho) linha.title = ac.trecho;
    caixa.appendChild(linha);
  }
  caixa.appendChild(el("p", "aviso-autoria", t("revisao.originalidade")));
  return caixa;
}

/** A tríade em LEITURA — o revisor julga o que foi entregue, não edita.

    O material chega desserializado do `GET /api/criacoes` (`criacoes._material`)
    na forma de `rubrica@3`; desenhar aqui com inputs convidaria a corrigir, e
    a decisão do P4 é uma passagem SEM edição — proveniência não se conserta. */
function blocoTriadeLeitura(material) {
  const caixa = el("div", "revisao-triade");
  const rub = material.rubrica;
  if (rub) {
    caixa.appendChild(el("div", "rotulo-bloco", t("triade.rubrica_titulo")));
    caixa.appendChild(el("p", "dado", rub.titulo));
    for (const c of rub.criterios || []) {
      const cx = el("div", "criterio-leitura");
      const esc = c.escala || {};
      const ancoras = (esc.ancoras || [])
        .map((a) => a.valor + " — " + a.rotulo).join(" · ");
      juntar(cx,
        el("strong", "dado", c.nome),
        el("p", "dado", c.descricao),
        el("p", "fraco dado",
          (esc.min || 1) + ".." + (esc.max || "?") + (ancoras ? " · " + ancoras : "")));
      caixa.appendChild(cx);
    }
  }
  const gold = material.gold;
  if (gold) {
    caixa.appendChild(el("div", "rotulo-bloco espaco-acima-2", t("triade.gold_titulo")));
    for (const [campo, chave] of [
      ["deve_conter", "triade.deve_conter"],
      ["nao_pode", "triade.nao_pode"],
      ["armadilhas", "triade.armadilhas"],
    ]) {
      const itens = gold[campo] || [];
      if (!itens.length) continue;
      caixa.appendChild(el("p", "fraco", t(chave)));
      const ul = el("ul");
      for (const it of itens) ul.appendChild(el("li", "dado", String(it)));
      caixa.appendChild(ul);
    }
    if (gold.observacoes) {
      caixa.appendChild(el("p", "fraco", t("triade.observacoes")));
      caixa.appendChild(el("p", "dado", gold.observacoes));
    }
  }
  return caixa;
}

/** Aprovar / recusar. A recusa abre o comentário obrigatório — ele é a única
    informação que quem escreveu recebe. */
function acoesDeCriacao(item) {
  const caixa = el("div", "criacao-acoes");
  const campo = el("div", "campo");
  const texto = el("textarea");
  texto.rows = 2;
  texto.placeholder = t("criar.comentario_ph");
  texto.setAttribute("aria-label", t("criar.comentario"));
  juntar(campo, el("span", null, t("criar.comentario")), texto,
    dicaLinguaMeta("lingua.meta"));

  const acoes = el("div", "acoes");
  const aprovar = el("button", "primario", t("criar.aprovar"));
  aprovar.type = "button";
  aprovar.addEventListener("click", () => decidirCriacao(item.id, true, null));
  const recusar = el("button", null, t("criar.recusar"));
  recusar.type = "button";
  recusar.addEventListener("click", () => decidirCriacao(item.id, false, texto.value));
  juntar(acoes, aprovar, recusar);
  juntar(caixa, campo, acoes);
  return caixa;
}

async function decidirCriacao(id, aprovar, comentario) {
  try {
    await postar("/api/criacoes/" + id + "/revisar", {
      revisor_id: est.persona.id,
      aprovar: aprovar,

    });
    recado(aprovar ? t("recado.criacao_aprovada") : t("recado.criacao_recusada"));
    est.criacoes = null;
    desenharRevisor();

    recado(t("recado.erro_decidir", { erro: e.message }), true);
  }
}

async function carregarCriacoes() {
  try {
    const r = await api(comParams("/api/criacoes", {
      anotador_id: est.persona.id, fila: true,
    }));
    const itens = r.items || [];
    est.criacoes = {
      items: itens, total: itens.length, modo_solo: !!r.modo_solo,
      sel: itens.length ? itens[0].id : null,
    };

    est.criacoes = { items: [], total: 0, modo_solo: false, sel: null };

}

function desenharMinhas(area) {
  const painel = el("div", "painel");
  const cabeca = el("div", "painel-cabeca");
  juntar(cabeca, el("h2", null, t("minhas.titulo")), el("span", "crescer"));
  if (est.minhas) {
    cabeca.appendChild(el("span", "fraco num", t("minhas.total", { n: n(est.minhas.length) })));
  }
  painel.appendChild(cabeca);

  if (!est.minhas) {
    painel.appendChild(esqueleto("minhas.carregando"));
    area.appendChild(painel);
    return;
  }
  if (!est.minhas.length) {
    const vazio = el("div", "vazio");
    juntar(vazio,
      el("div", "vazio-titulo", t("minhas.vazio_titulo")),
      el("p", "vazio-linha", t("minhas.vazio_linha")));
    const saidas = el("div", "vazio-saidas");
    const fila = el("button", "botao primaria", t("botao.ir_fila"));
    fila.type = "button";
    fila.addEventListener("click", () => irPara("fila"));
    const cat = el("button", "botao", t("botao.escolher_catalogo"));
    cat.type = "button";
    cat.addEventListener("click", () => irPara("catalogo"));
    juntar(saidas, fila, cat);
    vazio.appendChild(saidas);
    painel.appendChild(vazio);
    area.appendChild(painel);
    return;
  }

  for (const item of est.minhas) {
    const linha = el("div", "minha");
    const texto = el("div", "item-texto");
    const topo = el("div", "forma");
    const [classe, chave] = ROTULO_STATUS[item.status] || ["pendente", null];
    const eti = el("span", "etiqueta " + classe);
    juntar(eti, el("span", "ponto"), el("span", null, chave ? t(chave) : item.status));
    juntar(topo, eti,
      el("span", "fraco", nomeTipo(item.tipo)),
      el("span", "fraco", item.origem === "livre" ? t("fila.origem_livre") : t("minhas.da_fila")));
    if (item.versao) topo.appendChild(el("span", "fraco", t("minhas.versao", { n: item.versao })));
    texto.appendChild(topo);

    texto.appendChild(el("div", "item-trecho",
      item.disponivel ? item.prompt : t("minhas.indisponivel")));
    // A DEVOLUÇÃO é o único item desta lista que exige ação, e por isso ela vem
    // com o comentário embutido: obrigar a abrir a tarefa para descobrir o que
    // o revisor escreveu é a fricção que faz uma devolução ser ignorada.
    // OS DOIS caminhos de volta: a triagem e o admin decidindo uma escalação.
    // O segundo é raro, e por isso é o que some sem ninguém notar — o admin
    // escreveria um comentário obrigatório que o anotador nunca leria.
    const doAdmin = item.decisao_admin === "devolvida" && item.comentario_admin;
    const devolvida = (item.veredito === "devolvida" && item.comentario_revisor) || doAdmin;
    if (devolvida) {
      const dev = el("div", "devolucao");
      juntar(dev,
        el("div", "devolucao-titulo",
          doAdmin ? t("minhas.devolvida_admin") : t("minhas.devolvida")),
        // `.dado`: o comentário sai na língua em que a pessoa o escreveu.
        el("p", "dado", doAdmin ? item.comentario_admin : item.comentario_revisor));
      texto.appendChild(dev);
    }
    linha.appendChild(texto);

    if (item.status === "em_andamento" && item.disponivel) {
      const abrir = el("button", "botao primaria",
        devolvida ? t("botao.corrigir_reenviar") : t("botao.continuar"));
      abrir.type = "button";
      abrir.addEventListener("click", () => reabrir(item));
      linha.appendChild(abrir);
    }
    painel.appendChild(linha);
  }
  area.appendChild(painel);
}
