<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bancada — annotation workbench</title>
<!--
  BANCADA — a plataforma de anotação.

  Um arquivo, sem build, sem framework, sem rede: CSS e JS embutidos, nenhuma
  referência a host externo. A plataforma precisa abrir offline, numa máquina
  só, e continuar abrindo daqui a dois anos sem `npm install`.

  REGRA DE SEGURANÇA DESTE ARQUIVO
  Nenhum HTML nasce de string, em lugar nenhum: todo texto vai para o DOM por
  `textContent`, e todo elemento é criado por `el()`. Não existe aqui o
  equivalente ao `snippetSeguro()` da interface de curadoria porque não existe
  destaque de busca a reabrir — e sem essa exceção a regra fica absoluta, que é
  mais fácil de manter do que uma regra com uma exceção. O corpus tem <script>
  de verdade dentro dos prompts.

  IDIOMA  (P3i — INVERTE o que o P1/P2 construíram)
  O portfólio é lido por avaliadores estrangeiros: **o inglês é a língua
  primária** e o pt-BR é um toggle. Nenhuma string de cromo mora solta neste
  arquivo — todas passam por `TEXTOS`, um dicionário de duas línguas com chaves
  estáveis, e por `t(chave)`.

  Três regras que sustentam isso, e que os testes conferem:
    1. `TEXTOS` é JSON ESTRITO (chaves e valores entre aspas duplas, sem
       vírgula sobrando e sem comentário dentro). É o que permite ao pytest
       carregá-lo com `json.loads` e provar paridade e ausência de chave órfã
       sem um parser de JavaScript.
    2. O texto estático do HTML não existe: cada nó carrega `data-t`
       (textContent), `data-t-ph` (placeholder), `data-t-title` ou `data-t-aria`,
       e `aplicarTextos()` os preenche. Um `data-t` sem chave no dicionário é
       erro de teste, não uma tela em branco.
    3. Trocar de idioma NÃO recarrega e NÃO refaz chamada: `est` guarda o
       estado, `/api/diretrizes` já traz as duas línguas, e `aplicarIdioma()`
       redesenha a partir da memória. Rascunho, seleção e tarefa aberta
       sobrevivem porque nunca saem de `est`.

  A LÍNGUA DOS DADOS é outra coisa, e a tela DIZ isso em cada campo:
  justificativa, comentário de revisão, critério de rubrica e todo metadado saem
  em **inglês** (é o que o cliente lê); resposta esperada (SFT) e a conversa com
  o modelo saem em **pt-BR, ou na língua do prompt** (é o dado sendo produzido).
  É diretriz, não validação: o envio nunca é bloqueado por causa dela, porque o
  anotador pode ter uma razão para desviar e a plataforma não a conhece.
-->
<style>
/* ==========================================================================
   1. TOKENS
   Claro por padrão, e isso é a assinatura do produto: a ferramenta de curadoria
   (:8765) é escura, densa e de três colunas, cara de instrumento de pesquisa. A
   Bancada precisa parecer OUTRO produto, de outra empresa — fundo branco
   levemente quente, superfícies em branco puro, borda de 1px em cinza frio, ar
   em volta de uma tarefa só.

   O acento azul-ardósia (#1F4E79) significa TRÊS coisas e nada mais: ação
   primária, foco de teclado e item selecionado. As cores semânticas
   (aprovado/devolvido/pendente) são deliberadamente de outra família — um
   anotador precisa distinguir esses três estados de relance, e se o "aprovado"
   fosse um tom do acento ele competiria com o botão de enviar.

   O tema escuro NÃO é o mesmo azul: #1F4E79 sobre fundo escuro fica ilegível.
   Ele clareia para #6FA8D8, mantendo o papel, perdendo o tom exato.
   ========================================================================== */
:root{
  color-scheme: light;
  --fundo:#FCFBF9;
  --superficie:#FFFFFF;
  --superficie-2:#F6F5F2;
  --linha:#E1E4E8;
  --linha-forte:#C6CBD1;
  --texto:#1A1D21;
  --texto-2:#565D66;
  --texto-3:#868D95;
  --acento:#1F4E79;
  --acento-forte:#173C5E;
  --acento-fraco:rgba(31,78,121,.07);
  --acento-medio:rgba(31,78,121,.24);
  --sobre-acento:#FFFFFF;
  --aprovado:#41693F;
  --aprovado-fundo:rgba(65,105,63,.10);
  --devolvido:#96601A;
  --devolvido-fundo:rgba(150,96,26,.12);
  --pendente:#6E757D;
  --pendente-fundo:rgba(110,117,125,.12);
  --erro:#A32F2A;
  --sombra:0 1px 2px rgba(20,25,32,.05), 0 4px 14px rgba(20,25,32,.04);
  --fonte-ui:ui-sans-serif,"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Helvetica Neue",sans-serif;
  --fonte-leitura:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Times New Roman",serif;
  --fonte-mono:ui-monospace,"Cascadia Mono",Consolas,"DejaVu Sans Mono",monospace;
  --raio:8px;
  --barra-h:56px;
}
:root[data-tema="escuro"]{
  color-scheme: dark;
  --fundo:#14171B;
  --superficie:#1A1E23;
  --superficie-2:#20252B;
  --linha:#2C323A;
  --linha-forte:#3E464F;
  --texto:#E8EAEC;
  --texto-2:#A6ADB5;
  --texto-3:#79818A;
  --acento:#6FA8D8;
  --acento-forte:#8FC0E6;
  --acento-fraco:rgba(111,168,216,.12);
  --acento-medio:rgba(111,168,216,.34);
  --sobre-acento:#0F1418;
  --aprovado:#83B181;
  --aprovado-fundo:rgba(131,177,129,.14);
  --devolvido:#D5A55A;
  --devolvido-fundo:rgba(213,165,90,.14);
  --pendente:#99A1A9;
  --pendente-fundo:rgba(153,161,169,.14);
  --erro:#E1746C;
  --sombra:0 1px 2px rgba(0,0,0,.35), 0 4px 14px rgba(0,0,0,.25);
}

/* ==========================================================================
   2. BASE
   ========================================================================== */
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%}
body{
  margin:0;
  background:var(--fundo);
  color:var(--texto);
  font-family:var(--fonte-ui);
  font-size:14.5px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em}
h2{font-size:1.02rem}
h3{font-size:.92rem}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--fonte-mono);font-size:.86em}
.fraco{color:var(--texto-3);font-weight:400}
.secundario{color:var(--texto-2)}

/* FOCO DE TECLADO SEMPRE VISÍVEL. Uma tarefa inteira precisa ser completável
   sem tocar no mouse (item de aceite do P7); um foco invisível torna isso
   impossível de aprender. */
:focus{outline:none}
:focus-visible{
  outline:2px solid var(--acento);
  outline-offset:2px;
  border-radius:4px;
}

/* Movimento é confirmação, nunca decoração — e quem pediu para desligar,
   desligou. */
@media (prefers-reduced-motion: no-preference){
  .papel,.botao,.aba,.card{transition:background-color .12s ease,border-color .12s ease,box-shadow .12s ease}
  .recado{transition:opacity .18s ease}
}

/* ---- botões ---- */
.botao{
  background:var(--superficie);
  border:1px solid var(--linha-forte);
  border-radius:var(--raio);
  padding:7px 13px;
  cursor:pointer;
  color:var(--texto);
}
.botao:hover:not(:disabled){background:var(--superficie-2);border-color:var(--texto-3)}
.botao:disabled{opacity:.5;cursor:not-allowed}
.botao.primaria{
  background:var(--acento);
  border-color:var(--acento);
  color:var(--sobre-acento);
  font-weight:600;
}
.botao.primaria:hover:not(:disabled){background:var(--acento-forte);border-color:var(--acento-forte)}
.botao.primaria:disabled{background:var(--superficie-2);border-color:var(--linha);color:var(--texto-3)}
.botao.discreta{border-color:transparent;background:transparent;color:var(--texto-2);padding:6px 9px}
.botao.discreta:hover:not(:disabled){background:var(--superficie-2);color:var(--texto)}

/* Etiqueta do que ainda não existe. Fica COLADA no controle desabilitado, e
   não numa nota de rodapé: quem clica precisa saber ali por que não abriu. */
.marco{
  font-size:.72rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
  color:var(--texto-3);border:1px solid var(--linha);border-radius:99px;
  padding:1px 7px;margin-left:7px;white-space:nowrap;
}

.etiqueta{
  display:inline-flex;align-items:center;gap:5px;
  font-size:.78rem;font-weight:600;border-radius:99px;padding:2px 9px;
}
.etiqueta.aprovado{color:var(--aprovado);background:var(--aprovado-fundo)}
.etiqueta.devolvido{color:var(--devolvido);background:var(--devolvido-fundo)}
.etiqueta.pendente{color:var(--pendente);background:var(--pendente-fundo)}
.ponto{width:7px;height:7px;border-radius:99px;background:currentColor;display:inline-block}

/* ==========================================================================
   3. SELETOR DE PAPEL  (P3a: na barra, não numa tela de vestíbulo)
   Até o P2 havia uma tela de entrada com três cards. Ela custava os primeiros
   15 segundos de quem abre o portfólio — e esses 15 segundos são os únicos
   garantidos. O papel virou um controle segmentado na barra: a plataforma abre
   JÁ na área de trabalho, e trocar de papel é um clique de onde se está.
   ========================================================================== */
.papeis{display:inline-flex;gap:2px;padding:2px;border-radius:99px;background:var(--superficie-2);border:1px solid var(--linha)}
.papel{
  border:0;background:transparent;color:var(--texto-2);cursor:pointer;
  padding:5px 13px;border-radius:99px;font-size:.88rem;white-space:nowrap;
}
.papel:hover{color:var(--texto)}
.papel[aria-checked="true"]{background:var(--acento);color:#fff;font-weight:600}

/* ---- seletor de idioma ----
   Mesmo controle segmentado dos papéis, em escala menor e sem o acento: trocar
   de língua não é uma decisão de trabalho, é uma preferência de leitura, e
   pintá-la de azul a poria no mesmo peso visual de "qual papel eu sou". */
.linguas{display:inline-flex;gap:2px;padding:2px;border-radius:99px;background:var(--superficie-2);border:1px solid var(--linha);flex:0 0 auto}
.lingua{
  border:0;background:transparent;color:var(--texto-3);cursor:pointer;
  padding:3px 9px;border-radius:99px;font-size:.78rem;font-weight:600;
  letter-spacing:.04em;text-transform:uppercase;
}
.lingua:hover{color:var(--texto)}
.lingua[aria-pressed="true"]{background:var(--superficie);color:var(--texto);box-shadow:var(--sombra)}

/* ---- a convenção de língua POR CAMPO ----
   Fica COLADA no campo, no lugar onde a dúvida ocorre — não numa página de
   ajuda que ninguém abre no meio de uma tarefa. É diretriz, não validação: o
   selo diz o que se espera e o envio não é bloqueado por causa dele. */
.lingua-campo{
  display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap;
  color:var(--texto-3);font-size:.79rem;margin-top:4px;
}
.lingua-selo{
  border:1px solid var(--linha-forte);border-radius:99px;padding:0 7px;
  font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:var(--texto-2);white-space:nowrap;
}
.lingua-campo.dado .lingua-selo{border-color:var(--acento-medio);color:var(--acento)}
/* A frase de cada papel some da barra (não cabe) e vira o `title` do botão,
   mais a linha de contexto abaixo da barra na primeira troca. */
.papel-linha{color:var(--texto-2);font-size:.9rem;line-height:1.45}
.faixa-papel{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding:10px 18px;background:var(--acento-fraco);
  border-bottom:1px solid var(--linha);color:var(--texto-2);font-size:.9rem;
}
select,input[type="text"]{
  background:var(--superficie);border:1px solid var(--linha-forte);
  border-radius:6px;padding:6px 9px;min-width:190px;
}
/* Os seletores da barra ENCOLHEM antes de a barra empurrar a página para o
   lado: rolagem horizontal num portfólio é a primeira coisa que se vê e a
   última que se perdoa. `min-width:0` é o que permite ao flex encolher um
   <select>, que por padrão se recusa. */
.barra select{
  /* 130px cabe "Diego Prado" e "Demonstração (8)" sem cortar; abaixo disso o
     seletor deixaria de dizer o que está selecionado, que é a única coisa que
     ele faz quando está fechado. */
  min-width:130px;flex:0 1 auto;max-width:200px;padding:5px 8px;font-size:.88rem;
  text-overflow:ellipsis;
}
.barra .selo-demo{flex:0 0 auto}
input[type="text"]::placeholder{color:var(--texto-3)}
.ou{color:var(--texto-3);font-size:.85rem}
.selo-demo{color:var(--texto-3);font-size:.8rem;white-space:nowrap}
.erro{color:var(--erro);font-size:.9rem;margin-top:10px}
/* Criar persona continua ACESSÍVEL, só deixou de ser obrigatória: um
   `<details>` na barra, fechado, que não compete com a área de trabalho. */
.nova-pessoa{position:relative;flex:0 0 auto}
.nova-pessoa > summary{
  list-style:none;cursor:pointer;padding:5px 10px;border:1px solid var(--linha);
  border-radius:6px;font-size:.86rem;color:var(--texto-2);background:var(--superficie);
  white-space:nowrap;
}
.nova-pessoa > summary::-webkit-details-marker{display:none}
.nova-pessoa[open] > summary{border-color:var(--acento);color:var(--acento)}
.nova-pessoa-corpo{
  position:absolute;right:0;top:calc(100% + 8px);z-index:20;width:300px;
  background:var(--superficie);border:1px solid var(--linha);border-radius:var(--raio);
  padding:14px;box-shadow:0 8px 24px rgba(0,0,0,.14);
  display:flex;flex-direction:column;gap:9px;
}
.nova-pessoa-corpo input[type="text"]{min-width:0;width:100%}

/* ==========================================================================
   4. BARRA SUPERIOR
   O seletor de papel fica SEMPRE visível: quem abre um portfólio quer ver os
   três lados, e procurar como sair de um papel é a primeira fricção possível.
   ========================================================================== */
.barra{
  position:sticky;top:0;z-index:10;height:var(--barra-h);
  display:flex;align-items:center;gap:16px;padding:0 18px;
  background:var(--superficie);border-bottom:1px solid var(--linha);
}
.marca{font-weight:600;letter-spacing:-.01em;white-space:nowrap}
.marca .fraco{font-weight:400;font-size:.82rem;margin-left:7px}
.barra-titulo{color:var(--texto-2);font-size:.92rem;border-left:1px solid var(--linha);padding-left:16px}
.crescer{flex:1}

/* Numa janela estreita a barra tem de ENCOLHER, nunca empurrar a página para o
   lado: rolagem horizontal num portfólio é a primeira coisa que se vê e a
   última que se perdoa. O que sai primeiro é o supérfluo — o subtítulo da
   marca e o título da tela —, e o SELETOR DE PAPEL fica até o fim, porque é o
   controle que o avaliador veio usar. */
@media (max-width:1180px){
  .barra{gap:10px;padding:0 12px}
  .barra-titulo{display:none}
}
@media (max-width:1000px){
  /* Os rótulos "como" e "em" saem antes dos controles: o <select> se explica
     pelo conteúdo, o rótulo não acrescenta nada quando o espaço aperta. */
  .barra .selo-demo{display:none}
}
@media (max-width:760px){
  .marca .fraco{display:none}
  main{padding:18px 12px 48px}
  .barra .nova-pessoa{display:none}
}
@media (max-width:560px){
  .barra select{min-width:110px}
  .papel{padding:5px 9px;font-size:.82rem}
}

main{padding:22px 18px 60px;max-width:1180px;margin:0 auto}

/* ==========================================================================
   5. ABAS
   ========================================================================== */
.abas{display:flex;gap:2px;border-bottom:1px solid var(--linha);margin-bottom:20px;flex-wrap:wrap}
.aba{
  background:transparent;border:none;border-bottom:2px solid transparent;
  padding:9px 14px;cursor:pointer;color:var(--texto-2);font-size:.95rem;
  margin-bottom:-1px;border-radius:6px 6px 0 0;
}
.aba:hover{color:var(--texto);background:var(--superficie-2)}
.aba[aria-selected="true"]{color:var(--acento);border-bottom-color:var(--acento);font-weight:600}
.aba .conta{
  font-variant-numeric:tabular-nums;font-size:.8rem;color:var(--texto-3);
  margin-left:7px;
}

/* ==========================================================================
   6. ÁREA DE TRABALHO E ESTADOS VAZIOS
   Estado vazio é uma BIFURCAÇÃO, nunca um beco: título honesto, uma linha de
   contexto, e as saídas que existem.
   ========================================================================== */
.painel{
  background:var(--superficie);border:1px solid var(--linha);
  border-radius:var(--raio);box-shadow:var(--sombra);
}
.painel + .painel{margin-top:16px}
.painel-cabeca{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding:13px 16px;border-bottom:1px solid var(--linha);
}
.painel-corpo{padding:16px}

.diretrizes{
  border:1px solid var(--linha);border-radius:var(--raio);
  background:var(--superficie-2);margin-bottom:16px;
}
.diretrizes summary{
  cursor:pointer;padding:10px 14px;font-weight:600;font-size:.92rem;
  list-style:none;display:flex;align-items:center;gap:8px;
}
.diretrizes summary::-webkit-details-marker{display:none}
.diretrizes summary::before{content:"›";color:var(--texto-3);font-size:1.2rem;line-height:1}
.diretrizes[open] summary::before{content:"⌄"}
.diretrizes ul{margin:0;padding:0 16px 14px 34px;color:var(--texto-2)}
.diretrizes li{margin-bottom:5px}

.vazio{padding:34px 26px;text-align:center}
.vazio-titulo{font-size:1.08rem;font-weight:600;margin-bottom:8px}
.vazio-linha{color:var(--texto-2);max-width:620px;margin:0 auto 6px}
.vazio-saidas{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:20px}

/* CONTEÚDO, NÃO CROMO.
   `.dado` marca todo nó cujo texto vem do banco e cuja língua é a do DADO —
   nome de projeto, nome de pessoa, nome de fonte. Ele não muda quando o idioma
   da interface muda, e é isso que a classe declara: sem ela, a varredura que
   procura português numa tela em inglês não teria como separar "Portfólio" (um
   projeto que se chama assim) de uma string de cromo esquecida na tradução.
   A classe não pinta nada — ela existe para ser lida. */
.dado{}

/* O texto do prompt tem VOZ DIFERENTE do cromo: serifa de leitura. É ele que
   está sendo julgado. */
.area-prompt{
  border:1px dashed var(--linha-forte);border-radius:var(--raio);
  background:var(--superficie-2);padding:18px 20px;margin:20px auto 0;max-width:680px;
  text-align:left;
}
.area-prompt .rotulo{
  font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;
  color:var(--texto-3);font-weight:600;margin-bottom:8px;
}
.prompt{font-family:var(--fonte-leitura);font-size:1.02rem;line-height:1.62;color:var(--texto-2)}

/* ==========================================================================
   7. FILA DO REVISOR (duas colunas: lista à esquerda, detalhe à direita)
   ========================================================================== */
.revisao{display:grid;grid-template-columns:minmax(240px,320px) 1fr;gap:16px;align-items:start}
@media (max-width:820px){.revisao{grid-template-columns:1fr}}
.fila-lista{max-height:60vh;overflow:auto}
.fila-item{
  display:flex;flex-direction:column;gap:4px;padding:11px 14px;
  border-bottom:1px solid var(--linha);cursor:pointer;background:transparent;
  width:100%;text-align:left;border-left:3px solid transparent;
}
.fila-item[aria-current="true"]{background:var(--acento-fraco);border-left-color:var(--acento)}
.fila-item:hover{background:var(--superficie-2)}
.fila-item-topo{display:flex;align-items:baseline;gap:8px;font-size:.85rem;color:var(--texto-2)}
.fila-item-topo strong{color:var(--texto);font-size:.9rem}
.fila-item-trecho{
  font-family:var(--fonte-leitura);font-size:.9rem;line-height:1.45;color:var(--texto-2);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.fila-vazia{padding:26px 16px;color:var(--texto-2)}

/* O detalhe da triagem: mesmo layout do anotador, campos em LEITURA. Nada é
   escondido nem reordenado — reconhecer é mais barato que reconstruir, e um
   segundo formato de exibição seria um segundo lugar onde a rubrica pode
   divergir de si mesma. */
.leitura-modo input,.leitura-modo textarea,.leitura-modo select,.leitura-modo .nota{
  pointer-events:none;
}
.leitura-modo textarea,.leitura-modo input[type="text"]{
  background:var(--superficie-2);color:var(--texto-2);
}
.leitura-modo .nota[aria-pressed="true"]{
  background:var(--acento);border-color:var(--acento);color:#fff;font-weight:600;
}
.leitura-modo .ab-coluna[aria-pressed="true"]{border-color:var(--acento);box-shadow:0 0 0 1px var(--acento)}
.triagem-acoes{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 16px;
  border-top:1px solid var(--linha);background:var(--superficie-2);
  position:sticky;bottom:0;
}
.triagem-cabeca{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:12px 16px;border-bottom:1px solid var(--linha);
}
.devolver-caixa{padding:14px 16px;border-top:1px solid var(--devolvido);background:var(--devolvido-fundo)}
.devolver-caixa textarea{width:100%;margin-top:8px}

/* MODO SOLO: permanente e discreta, nunca dispensável. Ela declara que a regra
   de QC está afrouxada — e um aviso que se fecha vira um aviso que ninguém viu
   na hora que importava. Âmbar (a cor de "devolvido"), e não vermelho: não é
   erro, é uma escolha explícita de quem configurou. */
.faixa-solo{
  display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;
  padding:9px 14px;margin-bottom:12px;font-size:.88rem;
  color:var(--devolvido);background:var(--devolvido-fundo);
  border:1px solid var(--devolvido);border-radius:var(--raio);
}
.faixa-solo b{font-weight:600}
.faixa-solo .fraco{color:var(--texto-2)}
.fila-item .eu{color:var(--devolvido);font-weight:600}

/* ==========================================================================
   8. PAINEL DO ADMIN
   ========================================================================== */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:12px;margin-bottom:16px}
.card{
  background:var(--superficie);border:1px solid var(--linha);border-radius:var(--raio);
  padding:14px 16px;box-shadow:var(--sombra);
}
.card-valor{font-size:1.7rem;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.card-rotulo{color:var(--texto-2);font-size:.88rem;margin-top:2px}
.card-nota{color:var(--texto-3);font-size:.8rem;margin-top:6px}

.linhas{display:grid;grid-template-columns:auto 1fr;gap:7px 18px;align-items:baseline}
.linhas dt{color:var(--texto-2);font-size:.9rem;white-space:nowrap}
.linhas dd{margin:0;overflow-wrap:anywhere}

table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--linha);font-size:.92rem}
th{color:var(--texto-2);font-weight:600;font-size:.82rem;letter-spacing:.03em;text-transform:uppercase}
tbody tr:last-child td{border-bottom:none}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}

.forma{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.roteiro{margin:0;padding-left:20px;color:var(--texto-2)}
.roteiro li{margin-bottom:5px}
.roteiro b{color:var(--texto);font-weight:600}

/* ==========================================================================
   8b. RATE AND REVIEW (P3b) — as duas escalas, o motivo por mudança e o diff

   As quatro opções de cada escala ficam SEMPRE VISÍVEIS, com a âncora legível
   ao lado. Um `<select>` economizaria espaço e custaria a única coisa que uma
   escala ancorada tem: a possibilidade de comparar as quatro descrições antes
   de escolher uma. É o mesmo motivo pelo qual as notas da rubrica são botões.
   ========================================================================== */
.rr-secao{border-top:1px solid var(--linha);padding:16px}
.rr-secao-titulo{font-size:.98rem;font-weight:600;margin-bottom:4px}
.rr-secao-nota{color:var(--texto-2);font-size:.88rem;margin:0 0 12px;max-width:70ch}
.escala{display:flex;flex-direction:column;gap:6px}
.escala-opcao{
  display:flex;gap:10px;align-items:baseline;text-align:left;
  border:1px solid var(--linha-forte);border-radius:var(--raio);
  background:var(--superficie);padding:9px 12px;cursor:pointer;
  font:inherit;color:var(--texto);width:100%;
}
.escala-opcao:hover{background:var(--superficie-2)}
.escala-opcao[aria-checked="true"]{
  border-color:var(--acento);background:var(--acento-fraco);
  box-shadow:0 0 0 1px var(--acento);
}
.escala-opcao b{font-weight:600;white-space:nowrap;min-width:9.5rem}
.escala-opcao span{color:var(--texto-2);font-size:.88rem}
.escala-opcao[aria-checked="true"] b{color:var(--acento)}
/* O DESFECHO de cada opção da escala 2, na cor semântica: descartar e escalar
   não são a mesma coisa que encerrar, e a cor diz isso antes da leitura. */
.escala-opcao.grave[aria-checked="true"]{
  border-color:var(--devolvido);background:var(--devolvido-fundo);box-shadow:0 0 0 1px var(--devolvido);
}
.escala-opcao.grave[aria-checked="true"] b{color:var(--devolvido)}
.escala-opcao.boa[aria-checked="true"]{
  border-color:var(--aprovado);background:var(--aprovado-fundo);box-shadow:0 0 0 1px var(--aprovado);
}
.escala-opcao.boa[aria-checked="true"] b{color:var(--aprovado)}

/* O MOTIVO DE UMA MUDANÇA, inline. Não é modal, não é painel lateral: ele nasce
   colado ao campo que mudou e some quando a edição é desfeita. */
.motivos{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.motivo-linha{
  border-left:3px solid var(--devolvido);background:var(--devolvido-fundo);
  border-radius:0 var(--raio) var(--raio) 0;padding:8px 10px;
}
.motivo-linha label{
  display:block;font-size:.76rem;letter-spacing:.04em;text-transform:uppercase;
  color:var(--devolvido);font-weight:600;margin-bottom:5px;
}
.motivo-linha input{width:100%}

/* O RESUMO DO DIFF: conferir o que mudou sem rolar a tela inteira de volta. */
.diff{border-top:1px solid var(--linha);padding:16px;background:var(--superficie-2)}
.diff-lista{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.diff-item{
  display:grid;grid-template-columns:minmax(9rem,auto) 1fr;gap:4px 14px;
  border:1px solid var(--linha);border-radius:var(--raio);
  background:var(--superficie);padding:9px 12px;
}
.diff-campo{font-family:var(--fonte-mono);font-size:.82rem;color:var(--acento);overflow-wrap:anywhere}
.diff-valores{display:flex;flex-direction:column;gap:3px;font-size:.88rem}
.diff-valores span{overflow-wrap:anywhere}
.diff-valores .de{color:var(--texto-3);text-decoration:line-through}
.diff-valores .para{color:var(--texto)}
.diff-motivo{grid-column:1/-1;color:var(--texto-2);font-size:.85rem;border-top:1px dashed var(--linha);padding-top:6px}
.diff-motivo.pendente{color:var(--devolvido);font-weight:600}

/* ---- a escalação, no painel do admin ---- */
.escalado{border-bottom:1px solid var(--linha);padding:14px 16px}
.escalado:last-child{border-bottom:none}
.escalado-topo{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;font-size:.9rem}
.escalado-just{
  font-family:var(--fonte-leitura);color:var(--texto-2);margin:8px 0;
  border-left:3px solid var(--linha-forte);padding-left:12px;
}
.escalado-trecho{color:var(--texto-3);font-size:.86rem;margin:6px 0}
.escalado-acoes{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.escalado textarea{width:100%;margin-top:8px}

/* ==========================================================================
   9. RECADO (confirmação que não bloqueia)
   ========================================================================== */
.recado{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%);
  background:var(--texto);color:var(--fundo);
  padding:9px 16px;border-radius:99px;box-shadow:var(--sombra);
  font-size:.92rem;z-index:50;max-width:90vw;
}
.recado.ruim{background:var(--erro);color:#fff}

/* ==========================================================================
   10. ÁREA DE TRABALHO DO ANOTADOR (P2)

   Uma tarefa por vez, com ar em volta. As três vistas (fila, catálogo, minhas)
   são navegação de SEGUNDA ordem e por isso ficam em botões de texto discretos
   à direita — as quatro abas de cima escolhem QUE TIPO de trabalho, que é a
   decisão de primeira ordem; a vista escolhe só como o trabalho chega.
   ========================================================================== */
.sub-barra{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  margin:-8px 0 16px;
}
.vista{
  background:transparent;border:1px solid transparent;border-radius:99px;
  padding:4px 12px;cursor:pointer;color:var(--texto-2);font-size:.88rem;
}
.vista:hover{background:var(--superficie-2);color:var(--texto)}
.vista[aria-current="true"]{
  background:var(--acento-fraco);border-color:var(--acento-medio);
  color:var(--acento);font-weight:600;
}

/* ---- leitura: prompt e resposta de modelo ---- */
.rotulo-bloco{
  font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;
  color:var(--texto-3);font-weight:600;
}
.leitura{
  font-family:var(--fonte-leitura);font-size:1.03rem;line-height:1.65;
  white-space:pre-wrap;overflow-wrap:anywhere;
}
.leitura-caixa{max-height:34vh;overflow:auto}
.leitura-caixa.aberta{max-height:none}
/* PROVENIÊNCIA À VISTA: fonte e licença de cada prompt. É o argumento inteiro
   do projeto, e ele fica colado ao texto, não numa aba de metadados. */
.proveniencia{
  display:flex;gap:8px;flex-wrap:wrap;align-items:center;
  color:var(--texto-3);font-size:.82rem;margin-top:10px;
  padding-top:9px;border-top:1px dashed var(--linha);
}
.selo{
  border:1px solid var(--linha);border-radius:99px;padding:1px 9px;
  white-space:nowrap;
}
.selo.demo{border-color:var(--devolvido);color:var(--devolvido)}

/* ---- critérios da rubrica ---- */
.criterios{display:flex;flex-direction:column;gap:10px}
.criterio{
  border:1px solid var(--linha);border-radius:var(--raio);padding:12px 14px;
  background:var(--superficie);
}
.criterio[data-foco="true"]{border-color:var(--acento);box-shadow:0 0 0 1px var(--acento)}
.criterio-nome{font-weight:600;font-size:.96rem}
.criterio-desc{color:var(--texto-2);font-size:.88rem;margin-top:3px}
.notas{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;align-items:center}
.nota{
  min-width:40px;height:34px;border:1px solid var(--linha-forte);
  border-radius:6px;background:var(--superficie);cursor:pointer;
  font-variant-numeric:tabular-nums;font-size:.95rem;
}
.nota:hover{border-color:var(--texto-3)}
.nota[aria-pressed="true"]{
  background:var(--acento);border-color:var(--acento);
  color:var(--sobre-acento);font-weight:600;
}
.ancoras{
  display:flex;justify-content:space-between;gap:12px;
  color:var(--texto-3);font-size:.8rem;margin-top:6px;
}
/* DIVULGAÇÃO PROGRESSIVA: a justificativa por critério só existe depois do
   clique em "justificar" — ela não é o trabalho, é a exceção do trabalho. */
.linha-just{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}

/* ---- editor de rubrica ---- */
.editor-criterio{
  border:1px solid var(--linha);border-radius:var(--raio);padding:12px 14px;
  display:flex;flex-direction:column;gap:8px;
}
.campos{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.campo{display:flex;flex-direction:column;gap:3px}
.campo > span{color:var(--texto-2);font-size:.8rem}
input[type="text"].largo,textarea{width:100%;min-width:0}
textarea{
  background:var(--superficie);border:1px solid var(--linha-forte);
  border-radius:6px;padding:8px 10px;resize:vertical;line-height:1.5;
}
.textarea-sft{
  font-family:var(--fonte-leitura);font-size:1.05rem;line-height:1.6;
  min-height:min(46vh,420px);
}
.contador{color:var(--texto-3);font-size:.82rem;font-variant-numeric:tabular-nums}
.modelos{border:1px solid var(--linha);border-radius:var(--raio);background:var(--superficie-2)}
.modelos summary{cursor:pointer;padding:9px 13px;font-size:.9rem;font-weight:600;list-style:none}
.modelos summary::-webkit-details-marker{display:none}
.modelos summary::before{content:"› ";color:var(--texto-3)}
.modelos[open] summary::before{content:"⌄ "}
.modelos-corpo{padding:0 13px 12px;display:flex;flex-direction:column;gap:8px}

/* ---- comparação A/B: duas colunas com rolagem sincronizada ---- */
.ab{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:900px){.ab{grid-template-columns:1fr}}
.ab-coluna{
  border:1px solid var(--linha);border-radius:var(--raio);
  display:flex;flex-direction:column;background:var(--superficie);
  text-align:left;cursor:pointer;padding:0;color:inherit;
}
.ab-coluna:hover{border-color:var(--linha-forte)}
.ab-coluna[aria-pressed="true"]{
  border-color:var(--acento);box-shadow:0 0 0 1px var(--acento);
  background:var(--acento-fraco);
}
.ab-cabeca{
  display:flex;align-items:center;gap:10px;padding:10px 14px;
  border-bottom:1px solid var(--linha);
}
.ab-texto{padding:14px;overflow:auto;height:46vh}
.ab-empate{display:flex;justify-content:center;margin-top:12px}

/* ---- conversa com modelo local (P4d) ----
   A conversa é uma COLUNA de turnos, não um chat de mensageiro: não há bolha
   alinhada à direita, não há avatar e não há hora ao lado de cada linha. O que
   está sendo julgado é o texto, e todo enfeite que compete com ele é ruído numa
   tela cujo trabalho é ler com atenção. O que distingue quem falou é a cor de
   fundo e um rótulo — o mínimo que resolve. */
.conversa{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.turno{
  border:1px solid var(--linha);border-radius:var(--raio);
  background:var(--superficie);overflow:hidden;
}
.turno.eu{background:var(--superficie-2);border-color:var(--linha-forte)}
/* Turno marcado como problemático: âmbar, a MESMA cor da devolução — as duas
   coisas são "isto aqui precisa de conserto", e usar dois âmbares diferentes
   faria a pessoa aprender duas vezes o mesmo código. */
.turno.marcado{border-color:var(--devolvido);box-shadow:0 0 0 1px var(--devolvido)}
.turno-cabeca{
  display:flex;gap:9px;align-items:center;flex-wrap:wrap;
  padding:8px 13px;border-bottom:1px solid var(--linha);
  font-size:.8rem;color:var(--texto-3);
}
.turno-quem{font-weight:600;color:var(--texto-2)}
.turno-corpo{padding:12px 14px}
.turno-acao{
  background:none;border:none;padding:0;cursor:pointer;color:var(--texto-3);
  font:inherit;font-size:.8rem;text-decoration:underline;
}
.turno-acao:hover{color:var(--acento)}
/* SEM MODAL: marcar um turno abre o editor ALI, embaixo do turno — o mesmo
   padrão do motivo por edição do P3b. Um modal esconderia justamente o texto
   sobre o qual a nota está sendo dada. */
.marca-turno{
  border-top:1px dashed var(--linha);padding:11px 14px;
  background:var(--devolvido-fundo);display:flex;flex-direction:column;gap:8px;
}
/* O raciocínio do modelo (`message.thinking`) NÃO é descartado e NÃO é a
   resposta: fica recolhido, com marcador, à parte do corpo do turno. */
.raciocinio{border-top:1px dashed var(--linha)}
.raciocinio summary{
  cursor:pointer;padding:7px 14px;font-size:.8rem;color:var(--texto-3);list-style:none;
}
.raciocinio summary::-webkit-details-marker{display:none}
.raciocinio summary::before{content:"› "}
.raciocinio[open] summary::before{content:"⌄ "}
.raciocinio-corpo{
  padding:0 14px 12px;color:var(--texto-2);font-size:.9rem;
  white-space:pre-wrap;overflow-wrap:anywhere;max-height:30vh;overflow:auto;
}
.compositor{
  display:flex;flex-direction:column;gap:9px;
  border-top:1px solid var(--linha);padding-top:13px;margin-top:14px;
}
.compositor textarea{font-family:var(--fonte-leitura);font-size:1rem;line-height:1.6}
/* O ÚNICO relógio à vista nesta plataforma, e ele é do MODELO: 17 s de geração
   sem indicador parecem travamento. Nada aqui cronometra a pessoa. */
.gerando{display:flex;gap:10px;align-items:center;color:var(--acento);font-size:.92rem}
.ponto-gerando{width:9px;height:9px;border-radius:50%;background:var(--acento);flex:none}
@media (prefers-reduced-motion: no-preference){
  .ponto-gerando{animation:pulsa 1.1s ease-in-out infinite}
}
@keyframes pulsa{0%,100%{opacity:.25}50%{opacity:1}}
.decorrido{font-variant-numeric:tabular-nums;color:var(--texto-3)}
/* O estado do runtime: o que falta e o comando que conserta. Não é um erro —
   é uma instrução, e por isso tem a cor da devolução e não a do erro. */
.runtime{
  display:flex;flex-direction:column;gap:9px;
  border:1px solid var(--devolvido);background:var(--devolvido-fundo);
  border-radius:var(--raio);padding:12px 14px;margin-bottom:14px;
}
.runtime.pronto{border-color:var(--linha);background:var(--superficie-2)}
.comando{
  font-family:var(--fonte-mono);font-size:.86rem;
  background:var(--superficie);border:1px solid var(--linha-forte);
  border-radius:6px;padding:6px 10px;user-select:all;overflow-wrap:anywhere;
}
/* A rodada do duelo reusa a grade do A/B: duas colunas, rótulo cego. */
.rodada{margin-top:2px}
.rodada-nota{color:var(--texto-3);font-size:.82rem;margin-bottom:8px}
.duelo-escolha{display:flex;flex-direction:column;gap:9px;margin-top:12px}
.revelacao{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.revelacao-linha{
  display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:.9rem;
  border:1px solid var(--linha);border-radius:6px;padding:8px 12px;
}

/* ---- checklist da rubrica-guia (SFT vindo de continuação) ---- */
.guia{display:flex;flex-direction:column;gap:8px}
.marcavel{
  display:flex;gap:9px;align-items:flex-start;padding:9px 11px;
  border:1px solid var(--linha);border-radius:6px;cursor:pointer;
}
.marcavel:hover{background:var(--superficie-2)}
.marcavel input{margin-top:3px}
.com-guia{display:grid;grid-template-columns:1fr minmax(240px,320px);gap:16px;align-items:start}
@media (max-width:900px){.com-guia{grid-template-columns:1fr}}

/* ---- a barra da ação primária ----
   Grudada no fim da área de trabalho: a única ação primária da tela nunca pode
   ficar abaixo da dobra, senão a tarefa parece não ter fim. */
.acoes{
  position:sticky;bottom:0;z-index:5;
  display:flex;gap:10px;align-items:center;flex-wrap:wrap;
  padding:12px 16px;background:var(--superficie);
  border-top:1px solid var(--linha);border-radius:0 0 var(--raio) var(--raio);
}
.atalho{
  font-family:var(--fonte-mono);font-size:.76rem;color:var(--texto-3);
  border:1px solid var(--linha);border-radius:4px;padding:1px 6px;
}
.falta{color:var(--devolvido);font-size:.88rem}
.aviso-rascunho{
  display:flex;gap:10px;align-items:center;flex-wrap:wrap;
  background:var(--devolvido-fundo);color:var(--devolvido);
  border:1px solid var(--devolvido);border-radius:var(--raio);
  padding:8px 12px;font-size:.88rem;margin-bottom:14px;
}

/* ---- catálogo ---- */
.filtros{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.filtros input[type="text"]{min-width:240px;flex:1}
.lista-catalogo{display:flex;flex-direction:column}
.item-catalogo{
  display:flex;gap:14px;align-items:flex-start;
  padding:13px 16px;border-bottom:1px solid var(--linha);
}
.item-catalogo:last-child{border-bottom:none}
.item-catalogo.feito{opacity:.5}
.item-texto{flex:1;min-width:0}
.item-trecho{
  font-family:var(--fonte-leitura);font-size:.96rem;line-height:1.55;
  display:-webkit-box;-webkit-line-clamp:3;line-clamp:3;-webkit-box-orient:vertical;
  overflow:hidden;
}
.item-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:7px;color:var(--texto-3);font-size:.8rem}
.paginacao{display:flex;gap:10px;align-items:center;justify-content:center;padding:14px}

/* ---- minhas tarefas ---- */
.minha{display:flex;gap:14px;align-items:flex-start;padding:13px 16px;border-bottom:1px solid var(--linha)}
.minha:last-child{border-bottom:none}
.devolucao{
  background:var(--devolvido-fundo);border-left:3px solid var(--devolvido);
  padding:10px 13px;border-radius:0 6px 6px 0;margin-bottom:14px;
}
.devolucao-titulo{font-weight:600;color:var(--devolvido);margin-bottom:4px}
</style>

<!-- ==========================================================================
     APLICAÇÃO
     A plataforma abre JÁ na área de trabalho. O papel é um controle da barra
     (P3a), e não uma tela de vestíbulo: os primeiros 15 segundos de quem abre
     o portfólio pertencem ao produto.
     ========================================================================== -->
<div id="app">
  <header class="barra">
    <div class="marca">Bancada <span class="fraco" data-t="app.marca_sufixo"></span></div>
    <div class="papeis" id="papeis" role="radiogroup" data-t-aria="a11y.papel"></div>
    <label for="persona" class="selo-demo" data-t="barra.como"></label>
    <select id="persona" data-t-aria="a11y.persona"></select>
    <details class="nova-pessoa" id="nova-pessoa">

<script>
"use strict";
/* ==========================================================================
   0. FERRAMENTAS
   `el()` e `limpar()` são as DUAS únicas formas de montar tela aqui. Nenhum
   texto vira HTML por concatenação: tudo entra por `textContent`, inclusive o
   que vem do banco (nomes de persona, motivo do pool, caminhos de arquivo).
   ========================================================================== */
/** Formatador de número — trocado junto com o idioma (1.234 vs 1,234). */
let NUM = new Intl.NumberFormat("en-US");
const n = (v) => NUM.format(Number(v) || 0);
const $ = (s) => document.querySelector(s);

/** Cria um elemento. `texto` entra por textContent, sempre. */
function el(tag, cls, texto) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (texto !== undefined && texto !== null) e.textContent = String(texto);
  return e;
}
function limpar(no) { while (no.firstChild) no.removeChild(no.firstChild); }
/** Anexa vários filhos de uma vez e devolve o pai (encadeia bem). */
function juntar(pai, ...filhos) {
  for (const f of filhos) if (f) pai.appendChild(f);
  return pai;
}

let temporizadorRecado = null;
/** Confirmação de ~2 s que não bloqueia nada. */
function recado(msg, ruim) {
  const e = $("#recado");
  e.textContent = msg;
  e.classList.toggle("ruim", !!ruim);
  e.hidden = false;
  clearTimeout(temporizadorRecado);
  temporizadorRecado = setTimeout(() => { e.hidden = true; }, ruim ? 4000 : 2000);
}

async function api(caminho, opcoes) {
  const r = await fetch(caminho, opcoes);
  const txt = await r.text();
  let corpo = null;
  try { corpo = txt ? JSON.parse(txt) : null; } catch (_) { corpo = null; }
  if (!r.ok) {
    const e = new Error(detalhe(corpo) || ("HTTP " + r.status));
    e.status = r.status;
    // O CORPO INTEIRO vai junto. O 503 da inferência (P4d) manda um objeto com
    // a chave do dicionário, os dados e a conversa como ela ficou — e uma
    // mensagem em português não bastaria numa tela que fala duas línguas.
    e.corpo = corpo;
    throw e;
  }
  return corpo;
}
/** O `detail` do FastAPI é string em HTTPException, lista de dicts em 422 — e um
    OBJETO nas falhas de inferência, que precisam viajar com chave e dados. */
function detalhe(corpo) {
  const d = corpo && corpo.detail;
  if (!d) return "";
  if (typeof d === "string") return d;
  if (Array.isArray(d)) {
    return d.map((e) => (e.loc ? e.loc.slice(1).join(".") + ": " : "") + (e.msg || "")).join(" · ");
  }
  return String(d.mensagem || "");
}
const postar = (c, corpo) =>
  api(c, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(corpo) });

   plataforma que abre em português para quem não lê português falha no primeiro
   dos três segundos que ela tem. O pt-BR continua inteiro, num toggle — e ele

   O dicionário abaixo é JSON ESTRITO de propósito: sem aspas simples, sem
   vírgula sobrando, sem comentário dentro. É o que permite ao pytest carregá-lo
   com `json.loads` e provar, sem um parser de JavaScript, que (a) as duas
   línguas cobrem exatamente as mesmas chaves e (b) não existe chave órfã nos
   dois sentidos — usada e inexistente, ou existente e nunca usada.

   Por isso também não há chave montada por concatenação: `t("tela." + papel)`
   seria invisível para o teste, então quem precisa de chave variável guarda a
   chave INTEIRA numa tabela (ver `TITULO_TELA`, `TIPOS`, `ROTULO_STATUS`).

   A tradução não é literal onde o português tinha microcopy melhor: "Enviar e
   próxima" virou "Submit and next" (e não "Send and next"), "Devolvida para

/** O texto da chave, na língua de agora. `vars` preenche os `{marcadores}`.

    Uma chave que não existe volta como ELA MESMA, e não como string vazia: um
    buraco silencioso na tela é indistinguível de um campo legitimamente vazio,
    enquanto `botao.enviar_proxima` escrito num botão é impossível de ignorar.
    (O teste de chave órfã impede que isso chegue ao navegador.) */
function t(chave, vars) {
  const dicionario = TEXTOS[est.idioma] || TEXTOS[IDIOMA_PADRAO];
  let texto = dicionario[chave];
  if (texto === undefined) texto = TEXTOS[IDIOMA_PADRAO][chave];
  if (texto === undefined) return chave;
  if (!vars) return texto;
  return texto.replace(/\{(\w+)\}/g, (bruto, nome) =>
    Object.prototype.hasOwnProperty.call(vars, nome) ? String(vars[nome]) : bruto);
}

/** Um texto que veio do BANCO em duas línguas (rubrica de fixture, diretriz).

    Cai no canônico quando a tradução não existe — uma rubrica escrita por um
    anotador tem só a língua em que ela foi escrita, e é isso mesmo: ela é DADO,
    não cromo, e a plataforma não inventa tradução de dado. */
function bi(mapa, padrao) {
  if (mapa && typeof mapa === "object") {
    const v = mapa[est.idioma];
    if (typeof v === "string" && v) return v;
  }
  return padrao === undefined || padrao === null ? "" : String(padrao);
}

/** A língua inicial. Preferência salva > navegador > inglês.

    Só o português desvia do padrão, e de propósito: um avaliador estrangeiro
    nunca deve ver esta plataforma em português, enquanto um navegador em pt-BR
    quase certamente pertence a alguém que prefere ler em português. */
function idiomaInicial() {
  try {
    const salvo = localStorage.getItem(CHAVE + "idioma");
    if (salvo && IDIOMAS.indexOf(salvo) >= 0) return salvo;
  } catch (_) { /* modo privado: abre no padrão, e funciona igual */ }
  const nav = (navigator.languages && navigator.languages[0]) || navigator.language || "";
  return String(nav).toLowerCase().indexOf("pt") === 0 ? "pt" : IDIOMA_PADRAO;
}

/** Preenche todo texto ESTÁTICO do HTML. Ver os `data-t*` no corpo da página. */
function aplicarTextos() {
  document.documentElement.lang = est.idioma === "pt" ? "pt-BR" : "en";
  document.title = t("app.titulo");
  for (const no of document.querySelectorAll("[data-t]")) no.textContent = t(no.dataset.t);
  for (const no of document.querySelectorAll("[data-t-ph]")) no.placeholder = t(no.dataset.tPh);
  for (const no of document.querySelectorAll("[data-t-title]")) no.title = t(no.dataset.tTitle);
  for (const no of document.querySelectorAll("[data-t-aria]")) {
    no.setAttribute("aria-label", t(no.dataset.tAria));
  }
  rotularTema();
}

function desenharIdiomas() {
  const caixa = $("#linguas");
  limpar(caixa);
  for (const lang of IDIOMAS) {
    const b = el("button", "lingua", TEXTOS[lang][lang === "pt" ? "idioma.pt" : "idioma.en"]);
    b.type = "button";
    b.setAttribute("aria-pressed", String(est.idioma === lang));
    // O `title` na PRÓPRIA língua do botão: quem procura o português não lê a
    // explicação em inglês para encontrá-lo.
    b.title = TEXTOS[lang][lang === "pt" ? "idioma.pt_title" : "idioma.en_title"];
    b.addEventListener("click", () => escolherIdioma(lang));
    caixa.appendChild(b);
  }
}

/** TROCAR DE LÍNGUA NÃO RECARREGA E NÃO REFAZ CHAMADA.

    Tudo que está na tela sai de `est` (rascunho, tarefa em mãos, seleção da
    triagem, página do catálogo) e as diretrizes já vieram nas duas línguas numa
    chamada só. Redesenhar é, literalmente, desenhar o mesmo estado com outro
    dicionário — e é por isso que nada se perde. */
function escolherIdioma(lang) {
  if (lang === est.idioma || IDIOMAS.indexOf(lang) < 0) return;
  est.idioma = lang;
  try { localStorage.setItem(CHAVE + "idioma", lang); } catch (_) {}
  NUM = new Intl.NumberFormat(lang === "pt" ? "pt-BR" : "en-US");
  aplicarTextos();
  desenharIdiomas();
  desenharPapeis();
  desenharPersonas();
  desenharProjetos();
  redesenharTela();
  recado(t("recado.idioma"));
}

/** Redesenha a tela do papel atual A PARTIR DA MEMÓRIA — sem tocar na rede. */
function redesenharTela() {
  const papel = est.papelEscolhido || (est.persona && est.persona.papel);
  $("#barra-titulo").textContent = TITULO_TELA[papel] ? t(TITULO_TELA[papel]) : "";
  if (!est.persona) { semPersona(papel); return; }
  if (papel === "anotador") desenharAnotador({ manterDiretrizes: true });
  if (papel === "revisor") desenharRevisor();
  if (papel === "admin") desenharAdmin();
}

/* ==========================================================================
   1. VOCABULÁRIO DA PLATAFORMA
   Os papéis e os quatro estilos de tarefa vêm do mesmo lugar do backend
   (annotate/db.py). Aqui eles ganham a frase que explica o ofício — e é essa
   frase que faz a tela se explicar sozinha, sem tour e sem tooltip.
   ========================================================================== */
const PAPEIS = [
  { id: "anotador", nome: "papel.anotador.nome", linha: "papel.anotador.linha" },
  { id: "revisor", nome: "papel.revisor.nome", linha: "papel.revisor.linha" },
  { id: "admin", nome: "papel.admin.nome", linha: "papel.admin.linha" },
];
const PAPEL_POR_ID = Object.fromEntries(PAPEIS.map((p) => [p.id, p]));

/** O nome do papel na língua de agora. Um papel desconhecido volta como o
    próprio id — nunca em branco: id na tela é diagnóstico, branco é bug mudo. */
function nomePapel(id) {
  const p = PAPEL_POR_ID[id];
  return p ? t(p.nome) : String(id || "");
}

   versão gravada, a única saída é refazer o lote inteiro. */
