/* ==========================================================================
   7b. AS MÉTRICAS (P5a)
   Os MESMOS números do `quality-report` que o `pf annotate export` entrega: a
   rota chama `entrega.panorama`, `entrega.calibracao_do_revisor` e
   `entrega.triagem_deixou_passar`, que são as funções que escrevem o artefato.
   Um painel com contas próprias divergiria do relatório na primeira mudança, e
   a divergência apareceria como "a tela dizia 12 e o cliente recebeu 9".
   ========================================================================== */

/** O NOME do projeto em foco (a rota de métricas filtra por nome, não por id).
    `null` = todos, que é o que a barra chama de "todos os projetos". */
function nomeDoProjetoAtual() {
  if (est.projeto === null) return null;
  const p = est.projetos.find((x) => x.id === est.projeto);
  return p ? p.nome : null;
}

async function carregarMetricas() {
  est.metricas = { dados: null, carregando: true, erro: null };
  desenharMetricas();
  const params = { admin_id: est.persona.id };
  const projeto = nomeDoProjetoAtual();
  if (projeto) params.projeto = projeto;
  try {
    const r = await api(comParams("/api/admin/metricas", params));
    est.metricas = { dados: r, carregando: false, erro: null };
  } catch (e) {
    est.metricas = { dados: null, carregando: false, erro: e.message };
  }
  desenharMetricas();
}

/** Um gráfico de barras horizontais, em DIV.

    Nada de SVG: o namespace do SVG é uma URL, e esta plataforma prova por teste
    que não há uma única referência externa no arquivo — ela tem de abrir
    offline. A largura de cada barra é DADO (o CSS não pode saber quanto vale
    37%) e viaja por `setProperty`, o mesmo canal de `--cols` e `--faixa-h`.

    O conjunto inteiro é um `role="img"` com nome: quem lê por leitor de tela
    recebe o rótulo da região e depois os pares rótulo/número, que é a mesma
    informação — a barra é redundante para ele, não é a informação. */
function barrasH(pares, chaveAria) {
  const caixa = el("div", "grafico");
  caixa.setAttribute("role", "img");
  caixa.setAttribute("aria-label", t(chaveAria));
  let maior = 0;
  for (const [, valor] of pares) maior = Math.max(maior, Number(valor) || 0);
  for (const [rotulo, valor] of pares) {
    const linha = el("div", "grafico-linha");
    const trilho = el("div", "grafico-trilho");
    const barra = el("div", "grafico-barra");
    barra.style.setProperty("--w", (maior ? (Number(valor) || 0) * 100 / maior : 0) + "%");
    trilho.appendChild(barra);
    juntar(linha, el("span", "grafico-rotulo", rotulo), trilho,
      el("span", "grafico-num", n(valor)));
    caixa.appendChild(linha);
  }
  return caixa;
}

/** Um par ordenado de `{chave: n}` para a barra, com o rótulo já resolvido. */
function paresDe(mapa, comoRotulo) {
  return Object.entries(mapa || {})
    .sort((a, b) => b[1] - a[1])
    .map(([chave, valor]) => [comoRotulo ? comoRotulo(chave) : chave, valor]);
}

/** Por que um kappa não pôde ser publicado — a chave INTEIRA, como todas as
    tabelas deste arquivo. `t("conc." + motivo)` seria invisível para o teste de
    chave órfã, e a chave que o backend inventasse amanhã sairia crua na tabela. */
const MOTIVO_CONC = {
  "poucos_pares": "conc.poucos_pares",
  "sem_variancia": "conc.sem_variancia",
};

/** O rótulo de uma linha de concordância.

    A chave vem do BACKEND (`chave_i18n`), como o motivo da fila vazia e as
    frases do painel do pool: a rota fala uma língua, a tela fala duas. O nome da
    pergunta de categoria é DADO (foi escrito no instrumento) e passa por `bi()`,
    não pelo dicionário. */
function rotuloDeConcordancia(linha) {
  if (linha.chave_i18n === "agr.notas") {
    const e = linha.escala || {};
    return t("agr.notas", { min: e.min, max: e.max });
  }
  if (linha.chave_i18n === "agr.categoria") {
    return t("agr.categoria", {
      rotulo: bi(linha.rotulo_pergunta_i18n, linha.rotulo_pergunta || linha.campo),
    });
  }
  return t(linha.chave_i18n || "agr.outro");
}

/** A tabela de agreement — e a regra dura: **observada e kappa nunca aparecem
    um sem o outro**.

    Medido: 12 pares sempre a um degrau de distância dão observada 0,9375 e kappa
    −1,0. Os dois estão certos e respondem perguntas diferentes (concordam quase
    sempre em valor; nunca mais do que o acaso já daria, porque usam só duas
    posições da escala). Um painel com "−1,0" sozinho faria alguém refazer um
    lote que está bom; um com "94%" sozinho esconderia um viés real. */
function blocoConcordancia(conc) {
  const caixa = el("div");
  const resumo = conc.resumo || {};
  const linhas = conc.linhas || [];
  if (!linhas.length) {
    // Vazio não é zero: não há PAR nenhum para comparar. A frase diz o que
    // fazer para haver — um estado vazio sem saída é um beco.
    juntar(caixa,
      el("p", "metricas-nota", t("metricas.conc_vazia")),
      el("p", "metricas-nota", t("metricas.conc_vazia_saida")));
    return caixa;
  }
  caixa.appendChild(tabelaMetrica(
    [["metricas.col_campo", null], ["metricas.col_pares", "num"],
     ["metricas.col_observada", "num"], ["metricas.col_kappa", "num"],
     ["metricas.col_instrumento", null]],
    linhas.map((x) => [
      [rotuloDeConcordancia(x), null],
      [n(x.n_pares), "num"],
      [Math.round(x.observada * 1000) / 10 + "%", "num"],
      // `null` com o MOTIVO ao lado, nunca zero: zero afirmaria concordância ao
      // nível do acaso, que é a acusação mais forte que este número sabe fazer.
      [x.kappa === null || x.kappa === undefined
        ? "— " + t(MOTIVO_CONC[x.motivo] || MOTIVO_CONC.poucos_pares)
        : String(x.kappa), "num"],
      // O instrumento pelo NOME: um agreement sem o nome do instrumento que o
      // produziu não é conferível, e este painel existe para ser conferido.
      [x.instrumento, "dado mono"],
    ])));
  const pe = el("dl", "linhas espaco-acima-3");
  for (const [rotulo, valor] of [
    ["metricas.conc_tarefas", n(resumo.tarefas_com_2_ou_mais || 0)],
    ["metricas.conc_sozinhas", n(resumo.tarefas_com_1 || 0)],
    ["metricas.conc_pessoas", n(resumo.anotadores_distintos || 0)],
    ["metricas.conc_sinteticas", n(resumo.sinteticas_excluidas || 0)],
    ["metricas.conc_piso", n(conc.piso_pares || 0)],
  ]) {
    pe.appendChild(el("dt", null, t(rotulo)));
    pe.appendChild(el("dd", "num", valor));
  }
  caixa.appendChild(pe);
  return caixa;
}

function cartaoMetrica(valor, rotulo) {
  const card = el("div", "card");
  juntar(card, el("div", "card-valor", n(valor || 0)), el("div", "card-rotulo", t(rotulo)));
  return card;
}

function secaoMetrica(titulo, corpo, nota) {
  const secao = el("div", "painel-corpo borda-acima");
  juntar(secao, el("div", "metricas-sub", t(titulo)),
    nota ? el("p", "metricas-nota", t(nota)) : null, corpo);
  return secao;
}

/** A MATRIZ DE CONFUSÃO da calibração: alvo escondido (linha) × o que o revisor
    disse (coluna).

    Ela existe porque a escala é ORDINAL: uma taxa de acerto exato trataria
    "chamou de adequado o que era excepcional" e "chamou de adequado o que era
    inutilizável" como o mesmo erro. A matriz mostra a distância, e a diagonal
    marcada mostra onde estava o acerto. */
function matrizConfusao(cal) {
  const escala = cal.scale || [];
  const conf = cal.confusion || {};
  let maior = 0;
  for (const v of Object.values(conf)) maior = Math.max(maior, Number(v) || 0);

  const tab = el("table", "mc");
  const thead = el("thead");
  const linhaCabeca = el("tr");
  const canto = el("th");
  canto.setAttribute("aria-label", t("metricas.cal_eixos"));
  linhaCabeca.appendChild(canto);
  for (const id of escala) {
    const th = el("th", null, nomeDaEscala(ESCALA_ANTES, id));
    th.scope = "col";
    linhaCabeca.appendChild(th);
  }
  thead.appendChild(linhaCabeca);
  tab.appendChild(thead);

  const tbody = el("tbody");
  for (const esperado of escala) {
    const tr = el("tr");
    const th = el("th", null, nomeDaEscala(ESCALA_ANTES, esperado));
    th.scope = "row";
    tr.appendChild(th);
    for (const obtido of escala) {
      // A chave vem do servidor como "esperado -> obtido" (é a mesma string
      // que o relatório de qualidade imprime). O separador é literal dos dois
      // lados: montá-lo diferente aqui deixaria a matriz vazia, sem erro.
      const valor = Number(conf[esperado + " -> " + obtido] || 0);
      const degrau = maior ? Math.min(4, Math.ceil(valor * 4 / maior)) : 0;
      const td = el("td", "calor-" + degrau + (esperado === obtido ? " mc-acerto" : ""),
        n(valor));
      tr.appendChild(td);
    }
    tbody.appendChild(tr);
  }
  tab.appendChild(tbody);
  return tab;
}

function tabelaMetrica(colunas, linhas) {
  const tab = el("table");
  const thead = el("thead");
  const tr = el("tr");
  for (const [chave, classe] of colunas) {
    const th = el("th", classe, t(chave));
    th.scope = "col";
    tr.appendChild(th);
  }
  thead.appendChild(tr);
  const tbody = el("tbody");
  for (const celulas of linhas) {
    const linha = el("tr");
    for (const [texto, classe] of celulas) linha.appendChild(el("td", classe, texto));
    tbody.appendChild(linha);
  }
  juntar(tab, thead, tbody);
  return tab;
}

function desenharMetricas() {
  const alvo = $("#admin-metricas");
  if (!alvo) return;
  limpar(alvo);
  const m = est.metricas;
  if (!m || m.carregando) {
    alvo.appendChild(esqueleto("metricas.abrindo"));
    return;
  }
  if (m.erro) {
    alvo.appendChild(el("div", "painel-corpo falta", t("metricas.erro", { erro: m.erro })));
    return;
  }
  const d = m.dados || {};
  const pan = d.panorama || {};
  if (!pan.total) {
    const vazio = el("div", "vazio");
    juntar(vazio, el("div", "vazio-titulo", t("metricas.vazia")));
    alvo.appendChild(vazio);
    return;
  }

  const cards = el("div", "cards");
  juntar(cards,
    cartaoMetrica(pan.total, "metricas.card_total"),
    cartaoMetrica(pan.human, "metricas.card_humanas"),
    cartaoMetrica(pan.synthetic, "metricas.card_sinteticas"),
    cartaoMetrica(pan.corrected_by_reviewer, "metricas.card_corrigidas"),
    cartaoMetrica(pan.edits_total, "metricas.card_edicoes"),
    cartaoMetrica(pan.median_active_ms, "metricas.card_mediana"));
  const topo = el("div", "painel-corpo");
  juntar(topo, cards,
    el("p", "metricas-nota", t("metricas.autorrevisadas", { n: n(pan.self_reviewed || 0) })));
  alvo.appendChild(topo);

  /* ---- volumes ---- */
  alvo.appendChild(secaoMetrica("metricas.por_tipo",
    barrasH(paresDe(pan.by_task_type, nomeTipo), "a11y.grafico_tipos")));

  // POR PESSOA: o gráfico e a tabela na MESMA seção, e não em duas com o mesmo
  // título. Eles respondem coisas diferentes — o gráfico dá o volume relativo
  // de relance, a tabela dá mediana e re-trabalho — e dois títulos idênticos a
  // 400px de distância fariam quem lê achar que viu duas vezes a mesma coisa.
  const pessoas = d.por_anotador || [];
  const blocoPessoas = el("div");
  blocoPessoas.appendChild(barrasH(paresDe(pan.by_annotator), "a11y.grafico_pessoas"));
  if (pessoas.length) {
    blocoPessoas.appendChild(el("div", "espaco-acima-3"));
    blocoPessoas.appendChild(tabelaMetrica(
      [["metricas.col_pessoa", null], ["metricas.col_n", "num"],
       ["metricas.col_mediana", "num"], ["metricas.col_retrabalho", "num"],
       ["metricas.col_corrigidas", "num"]],
      pessoas.map((x) => [
        [x.anotador, "dado"],
        [n(x.n), "num"],
        [n(x.mediana_tempo_ativo_ms), "num"],
        [n(x.retrabalho), "num"],
        [n(x.corrigidas), "num"],
      ])));
  }
  alvo.appendChild(secaoMetrica("metricas.por_pessoa", blocoPessoas));

  /* ---- as duas escalas da passagem 2, lado a lado ---- */
  const escalas = el("div", "metricas-grade");
  juntar(escalas,
    juntar(el("div"), el("div", "metricas-sub", t("metricas.escala_chegada")),
      barrasH(paresDe(pan.rating_before, (id) => nomeDaEscala(ESCALA_ANTES, id)),
        "a11y.grafico_escalas")),
    juntar(el("div"), el("div", "metricas-sub", t("metricas.escala_final")),
      barrasH(paresDe(pan.rating_after, (id) => nomeDaEscala(ESCALA_DEPOIS, id)),
        "a11y.grafico_escalas")));
  alvo.appendChild(secaoMetrica("metricas.escalas_titulo", escalas));

  /* ---- calibração do revisor ---- */
  const cal = d.calibracao_revisor || { n: 0 };
  const bloco = el("div");
  if (!cal.n) {
    // "Não medido" NUNCA vira zero. Uma matriz vazia diria que o revisor errou
    // tudo; a frase diz que ninguém mediu — que é outra afirmação, e a honesta.
    bloco.appendChild(el("p", "metricas-nota", t("metricas.cal_vazia")));
  } else {
    const linhas = el("dl", "linhas");
    for (const [rotulo, valor] of [
      ["metricas.cal_exata", cal.exact + "/" + cal.n],
      ["metricas.cal_vizinha", cal.within_one + "/" + cal.n],
      ["metricas.cal_mae", String(cal.mean_absolute_error)],
    ]) {
      linhas.appendChild(el("dt", null, t(rotulo)));
      linhas.appendChild(el("dd", "num", valor));
    }
    juntar(bloco, linhas,
      el("div", "metricas-sub espaco-acima-3", t("metricas.confusao")),
      el("p", "metricas-nota", t("metricas.cal_eixos")),
      matrizConfusao(cal));
    // A família do defeito plantado é DADO (ela vem do catálogo aberto da
    // campanha de geração, que cresce sozinho): sai como veio, sem tradução.
    const familias = Object.entries(cal.by_defect_family || {})
      .map(([fam, x]) => [fam, x.n]);
    if (familias.length) {
      juntar(bloco, el("div", "metricas-sub espaco-acima-3", t("metricas.familias")),
        barrasH(familias, "a11y.grafico_tipos"));
    }
  }
  alvo.appendChild(secaoMetrica("metricas.cal_titulo", bloco, "metricas.cal_nota"));

  /* ---- concordância entre anotadores ---- */
  alvo.appendChild(secaoMetrica(
    "metricas.conc_titulo", blocoConcordancia(d.concordancia || {}), "metricas.conc_nota"));

  /* ---- o que a triagem deixou passar ---- */
  const vaz = d.vazamento_triagem || {};
  const linhasVaz = el("dl", "linhas");
  for (const [rotulo, valor] of [
    ["metricas.vaz_aprovados", n(vaz.approved_by_triage || 0)],
    ["metricas.vaz_avaliados", n(vaz.then_rated || 0)],
    ["metricas.vaz_inuteis", n(vaz.arrived_unusable || 0)],
    ["metricas.vaz_perdidos", n(vaz.ended_unsalvageable || 0)],
    ["metricas.vaz_taxa", vaz.leak_rate === null || vaz.leak_rate === undefined
      ? "-" : Math.round(vaz.leak_rate * 1000) / 10 + "%"],
  ]) {
    linhasVaz.appendChild(el("dt", null, t(rotulo)));
    linhasVaz.appendChild(el("dd", "num", valor));
  }
  alvo.appendChild(secaoMetrica("metricas.vaz_titulo", linhasVaz, "metricas.vaz_nota"));

  /* ---- duelos e A/B ---- */
  const du = d.duelos || {};
  const caixaDuelo = el("div");
  if (!du.n_rodadas && !(du.ab && du.ab.n)) {
    caixaDuelo.appendChild(el("p", "metricas-nota", t("metricas.duelos_vazio")));
  } else {
    if ((du.por_modelo || []).length) {
      caixaDuelo.appendChild(tabelaMetrica(
        [["metricas.col_modelo", null], ["metricas.col_rodadas", "num"],
         ["metricas.col_vitorias", "num"], ["metricas.col_winrate", "num"]],
        du.por_modelo.map((x) => [
          [x.modelo, "dado mono"],
          [n(x.rodadas), "num"],
          [n(x.vitorias), "num"],
          [x.win_rate === null ? "-" : Math.round(x.win_rate * 1000) / 10 + "%", "num"],
        ])));
    }
    // O VIÉS DE POSIÇÃO. Quase nenhuma plataforma o mostra: se o lado A vence
    // muito mais que o B com volume, o que está sendo medido é a posição na
    // tela, e não a resposta.
    const rot = du.por_rotulo || {};
    caixaDuelo.appendChild(el("p", "metricas-nota espaco-acima-2",
      t("metricas.vies_posicao", {
        a: n(rot.A || 0), b: n(rot.B || 0), total: n(du.n_rodadas || 0),
      })));
    if (du.ab && du.ab.n) {
      caixaDuelo.appendChild(barrasH(paresDe(du.ab.por_preferencia), "a11y.grafico_escalas"));
    }
  }
  alvo.appendChild(secaoMetrica("metricas.duelos", caixaDuelo));
}

/* ==========================================================================
   7c. GERAR TAREFAS EM LOTE (P5a)
   A prévia é `GET` e não escreve nada; a criação é `POST` e cria exatamente o
   que a prévia mostrou — as duas mandam o MESMO corpo e o servidor as resolve
   pela mesma função. Trocar qualquer parâmetro INVALIDA a prévia: criar sob
   uma prévia velha entregaria um número diferente do prometido.
   ========================================================================== */
function desenharGerar() {
  const g = est.gerar;
  const sel = $("#gerar-tipo");
  if (!sel) return;
  // Os selects são reconstruídos a cada desenho (e não só quando vazios): os
  // rótulos mudam de língua, e um `if (!options.length)` os deixaria na língua
  // da primeira montagem para sempre. Mesmo padrão de `#admin-papel`.
  limpar(sel);
  for (const tp of TIPOS) {
    const o = el("option", null, nomeTipo(tp.id));
    o.value = tp.id;
    sel.appendChild(o);
  }
  sel.value = g.tipo;

  const alvo = $("#gerar-alvo");
  limpar(alvo);
  for (let i = 1; i <= 5; i++) {
    const o = el("option", null, n(i));
    o.value = String(i);
    alvo.appendChild(o);
  }
  alvo.value = String(g.alvo);

  const proj = $("#gerar-projeto");
  limpar(proj);
  const padrao = el("option", null, t("gerar.projeto_padrao"));
  padrao.value = "";
  proj.appendChild(padrao);
  for (const p of est.projetos) {
    const o = el("option", null, p.nome);
    o.value = String(p.id);
    proj.appendChild(o);
  }
  proj.value = g.projetoId === null ? "" : String(g.projetoId);

  $("#gerar-n").value = String(g.n);
  $("#gerar-lang").value = g.lang;
  $("#gerar-fonte").value = g.fonte;
  $("#gerar-prioridade").value = String(g.prioridade);
  desenharGerarPrevia();
}

/** Lê o formulário para `est.gerar` e INVALIDA a prévia.

    Só a área da prévia é redesenhada — nunca o formulário inteiro. Reconstruir
    os campos a cada tecla tiraria o foco no meio de um número. */
function mudouGerar() {
  const g = est.gerar;
  g.tipo = $("#gerar-tipo").value;
  g.n = Math.max(1, Math.min(200, Number($("#gerar-n").value) || 1));
  g.lang = $("#gerar-lang").value.trim();
  g.fonte = $("#gerar-fonte").value.trim();
  g.alvo = Number($("#gerar-alvo").value) || 1;
  g.prioridade = Math.max(0, Math.min(100, Number($("#gerar-prioridade").value) || 0));
  const p = $("#gerar-projeto").value;
  g.projetoId = p === "" ? null : Number(p);
  g.previa = null;
  desenharGerarPrevia();
}

function corpoDaGeracao() {
  const g = est.gerar;
  const corpo = {
    admin_id: est.persona.id,
    tipo: g.tipo,
    n: g.n,
    n_anotacoes_alvo: g.alvo,
    prioridade: g.prioridade,
  };
  if (g.lang) corpo.lang = g.lang;
  if (g.fonte) corpo.fonte = g.fonte;
  if (g.projetoId !== null) corpo.projeto_id = g.projetoId;
  return corpo;
}

function desenharGerarPrevia() {
  const caixa = $("#gerar-previa");
  if (!caixa) return;
  limpar(caixa);
  const g = est.gerar;
  if (g.carregando) {
    caixa.appendChild(esqueleto("gerar.abrindo"));
  } else if (g.previa) {
    const p = g.previa;
    const corpo = el("div", "painel-corpo borda-acima");
    const linhas = el("dl", "linhas");
    for (const [rotulo, valor] of [
      ["gerar.criaria", n(p.criaria)],
      ["gerar.puladas_material", n(p.puladas_material)],
      ["gerar.puladas_existentes", n(p.puladas_existentes)],
      ["gerar.fora_filtro", n(p.fora_filtro)],
      ["gerar.cobertura", t("gerar.cobertura_avaliar", {
        n: n((p.cobertura_pool || {}).avaliar_rubrica || 0),
        total: n(p.n_pool || 0),
      }) + t("gerar.cobertura_ab", {
        n: n((p.cobertura_pool || {}).comparar_ab || 0),
      })],
    ]) {
      linhas.appendChild(el("dt", null, t(rotulo)));
      linhas.appendChild(el("dd", null, valor));
    }
    corpo.appendChild(linhas);
    if ((p.amostra || []).length) {
      corpo.appendChild(el("div", "metricas-sub espaco-acima-3", t("gerar.amostra")));
      for (const item of p.amostra) {
        const linha = el("div", "escalado-trecho dado", item.trecho);
        linha.title = item.uid + " · " + item.lang + " · " + item.fonte + " · " + item.licenca;
        corpo.appendChild(linha);
      }
    }
    caixa.appendChild(corpo);
  }
  atualizarBotaoGerar();
}

/** O botão primário NUNCA muda de rótulo; o que falta é uma linha acima dele.
    Mesmo contrato de `barraAcoes` e do cartão da escalação. */
function atualizarBotaoGerar() {
  const g = est.gerar;
  const aviso = $("#gerar-falta");
  const botao = $("#gerar-criar");
  if (!aviso || !botao) return;
  const falta = !g.previa ? t("falta.previa")
    : (g.previa.criaria === 0 ? t("falta.nada") : null);
  aviso.textContent = falta || "";
  aviso.hidden = !falta;
  botao.disabled = !!falta || g.criando || g.carregando;
  $("#gerar-pedir").disabled = g.carregando || g.criando;
}

async function pedirPreviaGeracao() {
  const g = est.gerar;
  if (g.carregando) return;
  g.carregando = true;
  g.previa = null;
  desenharGerarPrevia();
  try {
    g.previa = await api(comParams("/api/admin/tarefas/previa", corpoDaGeracao()));
  } catch (e) {
    recado(t("gerar.erro", { erro: e.message }), true);
  }
  g.carregando = false;
  desenharGerarPrevia();
}

async function criarLoteDeTarefas() {
  const g = est.gerar;
  if (!g.previa || g.criando) return;
  g.criando = true;
  atualizarBotaoGerar();
  try {
    const r = await api("/api/admin/tarefas", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(corpoDaGeracao()),
    });
    recado(t("gerar.criadas", { n: n(r.criadas), abertas: n(r.na_fila_agora) }));
  } catch (e) {
    g.criando = false;
    recado(e.message, true);
    return;
  }
  g.criando = false;
  // A prévia CADUCOU: as tarefas que ela prometia agora existem, e uma segunda
  // criação sob o mesmo plano só pularia as que acabaram de nascer.
  g.previa = null;
  await recarregarSaude();
  await carregarProjetos();
  desenharAdmin();
}

/* ---- A TRILHA DE AUDITORIA de um item escalado -----------------------------
   `eventos` é a única fonte que responde "o que aconteceu com isto, em ordem,
   e por quem" sem remontar a história por inferência a partir de carimbos de
   tempo em cinco tabelas. Ela é buscada no primeiro clique e fica em cache:
   a lista de um item que espera decisão não muda enquanto ele espera. */
function chaveTrilha(item) {
  return "a" + item.anotacao_id;
}

function blocoTrilha(item) {
  const det = el("details", "trilha");
  det.appendChild(el("summary", null, t("trilha.titulo")));
  const corpo = el("div", "trilha-corpo");
  det.appendChild(corpo);
  const guardada = est.trilhas[chaveTrilha(item)];
  if (guardada) desenharTrilha(corpo, guardada);
  det.addEventListener("toggle", () => { if (det.open) abrirTrilha(item, corpo); });
  return det;
}

function desenharTrilha(corpo, estado) {
  limpar(corpo);
  if (estado.carregando) { corpo.appendChild(esqueleto("trilha.abrindo")); return; }
  if (estado.erro) {
    corpo.appendChild(el("div", "falta", t("trilha.erro", { erro: estado.erro })));
    return;
  }
  if (!estado.itens.length) {
    corpo.appendChild(el("div", "fraco", t("trilha.vazia")));
    return;
  }
  for (const ev of estado.itens) {
    const linha = el("div", "trilha-item");
    // A AÇÃO SAI CRUA, em monoespaçada: `avaliacao_registrada` é identificador
    // do banco (é o valor de `eventos.acao`), e traduzi-lo faria a tela e a
    // trilha de auditoria discordarem sobre o nome da mesma coisa.
    juntar(linha,
      el("span", "trilha-acao", ev.acao),
      el("span", "fraco dado", ev.ator || "-"),
      el("span", "crescer"),
      el("span", "fraco mono", dataHora(ev.criado_em)));
    corpo.appendChild(linha);
  }
}

async function abrirTrilha(item, corpo) {
  const chave = chaveTrilha(item);
  if (est.trilhas[chave] && !est.trilhas[chave].carregando) {
    desenharTrilha(corpo, est.trilhas[chave]);
    return;
  }
  est.trilhas[chave] = { carregando: true, itens: [], erro: null };
  desenharTrilha(corpo, est.trilhas[chave]);
  // DOIS EIXOS. A anotação carrega submissão, triagem e a avaliação; a
  // avaliação carrega a decisão do admin. Sem a segunda, a última coisa que
  // aconteceu com o item ficaria de fora justamente na tela onde ela é decidida.
  const pedidos = [["anotacao", item.anotacao_id]];
  if (item.avaliacao_id) pedidos.push(["avaliacao", item.avaliacao_id]);
  try {
    const juntos = [];
    for (const [entidade, id] of pedidos) {
      const r = await api(comParams("/api/admin/eventos", {
        admin_id: est.persona.id, entidade, entidade_id: id,
      }));
      for (const linha of r.items || []) juntos.push(linha);
    }
    juntos.sort((a, b) => a.id - b.id);
    est.trilhas[chave] = { carregando: false, itens: juntos, erro: null };
  } catch (e) {
    est.trilhas[chave] = { carregando: false, itens: [], erro: e.message };
  }
  desenharTrilha(corpo, est.trilhas[chave]);
}

/* ---- A ESCALAÇÃO (P3b) ------------------------------------------------------
   `borderline_admin` no Rate and Review cria o item aqui, e a decisão do admin
   ENCERRA — aprovando, devolvendo ou descartando. É o único caminho pelo qual
   um item que passou da triagem volta ao anotador, e ele existe porque quem o
   percorre é o admin, com o parecer do revisor em mãos: a passagem 2 não se
   contradiz devolvendo o que ela mesma acabou de aprovar.

   O parecer inteiro fica À VISTA no item — as duas notas, a justificativa e o
   diff com o motivo de cada mudança. Mandar o admin abrir outra tela para ler
   aquilo faria a escalação custar mais que o problema que ela resolve. */
async function carregarEscalacao() {
  try {
    const r = await api(comParams("/api/escalacao/fila", { admin_id: est.persona.id }));
    est.escalacao = {
      itens: r.items || [], total: r.total || 0,
      sel: est.escalacao && est.escalacao.sel, decisao: null, comentario: "",
      carregando: false,
    };
  } catch (e) {
    est.escalacao = { itens: [], total: 0, sel: null, decisao: null, comentario: "",
                      carregando: false, erro: e.message };
    recado(t("admin.escalacao_erro", { erro: e.message }), true);
  }
}

function desenharEscalacao() {
  const lista = $("#escalacao-lista");
  if (!lista) return;
  limpar(lista);
  const fila = est.escalacao;
  atualizarContagens();
  if (!fila || !fila.itens.length) {
    const vazia = el("div", "vazio");
    juntar(vazia,
      el("div", "vazio-titulo", t("admin.escalacao_vazia")),
      el("p", "vazio-linha", t("admin.escalacao_vazia_linha")));
    lista.appendChild(vazia);
    return;
  }
  for (const item of fila.itens) {
    lista.appendChild(cartaoEscalado(item));
  }
}

function nomeDaEscala(opcoes, id) {
  const achado = opcoes.find((o) => o.id === id);
  return achado ? t(achado.nome) : String(id || "");
}

function cartaoEscalado(item) {
  const fila = est.escalacao;
  const cartao = el("div", "escalado");
  const topo = el("div", "escalado-topo");
  juntar(topo,
    el("strong", null, nomeTipo(item.tipo)),
    el("span", "fraco", t("admin.escalacao_por",
      { rev: item.revisor, aut: item.anotador })),
    el("span", "crescer"));
  if (item.projeto) topo.appendChild(el("span", "fraco dado", item.projeto));
  topo.appendChild(el("span", "etiqueta devolvido", t("admin.escalacao_escalas", {
    nota1: nomeDaEscala(ESCALA_ANTES, item.avaliacao_antes),
    nota2: nomeDaEscala(ESCALA_DEPOIS, item.avaliacao_depois),
  })));
  cartao.appendChild(topo);
  cartao.appendChild(el("div", "escalado-trecho dado",
    item.disponivel ? item.prompt : t("triagem.prompt_sumiu")));
  // A justificativa do revisor é DADO: sai na língua em que foi escrita.
  cartao.appendChild(el("div", "escalado-just dado", item.justificativa));
  cartao.appendChild(el("div", "fraco", item.edicoes.length
    ? t("admin.escalacao_edicoes", { n: n(item.edicoes.length) })
    : t("admin.escalacao_sem_edicoes")));
  for (const ed of item.edicoes) {
    const linha = el("div", "diff-item");
    // Sem envelope aqui: a fila da escalação lê `edicoes_avaliacao`, e não o
    // payload. O rótulo cai no número do critério, que já diz muito mais que o
    // caminho cru sozinho — e o caminho continua ao lado, para a auditoria.
    const campo = el("div", "diff-campo");
    juntar(campo,
      el("div", null, rotuloDoCampo(ed.campo, null)),
      el("div", "mono fraco", ed.campo));
    linha.appendChild(campo);
    const valores = el("div", "diff-valores");
    juntar(valores,
      el("span", "de", t("rr.diff_de") + ": " + (ed.valor_antes === null ? t("rr.diff_nada") : ed.valor_antes)),
      el("span", "para", t("rr.diff_para") + ": " + (ed.valor_depois === null ? t("rr.diff_nada") : ed.valor_depois)));
    linha.appendChild(valores);
    linha.appendChild(el("div", "diff-motivo dado", ed.motivo));
    cartao.appendChild(linha);
  }

  // A HISTÓRIA INTEIRA do item, recolhida. O admin decide sobre um trabalho que
  // atravessou duas passagens e às vezes um re-trabalho; sem a trilha, a única
  // saída seria remontá-la por inferência a partir de carimbos de tempo.
  cartao.appendChild(blocoTrilha(item));

  const aberto = fila.sel === item.avaliacao_id;
  const acoes = el("div", "escalado-acoes");
  const piso = lim("min_chars_devolucao", 20);
  const escolher = (id) => {
    fila.sel = item.avaliacao_id;
    fila.decisao = fila.decisao === id && aberto ? null : id;
    if (fila.decisao !== "devolvida") fila.comentario = fila.comentario || "";
    desenharEscalacao();
  };
  acoes.appendChild(escalaRR(DECISOES, aberto ? fila.decisao : null, "a11y.decisao", escolher));
  cartao.appendChild(acoes);

  if (!aberto || !fila.decisao) return cartao;

  const area = el("textarea");
  area.rows = 2;
  area.placeholder = t("admin.escalacao_ph", { min: piso });
  area.setAttribute("aria-label", area.placeholder);
  // Mora no ESTADO, como o comentário da triagem: trocar de idioma no meio de
  // uma decisão redesenha o painel, e o que já foi escrito tem de continuar aqui.
  // E no DISCO, pela mesma razão: quando a decisão é devolver, este comentário é
  // a única instrução que o anotador recebe.
  if (!(fila.comentario || "").trim()) {
    fila.comentario = lerRascunhoTexto(chaveEscalacao(item.avaliacao_id));
  }
  area.value = fila.comentario || "";
  area.addEventListener("input", () => {
    fila.comentario = area.value;
    salvarRascunhoTexto(chaveEscalacao(item.avaliacao_id), area.value);
    rotular();
  });
  cartao.appendChild(area);
  cartao.appendChild(dicaLinguaMeta("lingua.meta"));

  const rodape = el("div", "escalado-acoes");
  const enviar = el("button", "botao primaria", t("botao.decidir"));
  enviar.type = "button";
  const aviso = el("span", "falta");
  aviso.hidden = true;
  const rotular = () => {
    // A ÚNICA ação primária deste cartão, e ela diz o que falta antes do clique
    // — o mesmo contrato do resto da plataforma. O aviso é linha própria; o
    // rótulo do botão é fixo. Ver `barraAcoes`.
    const escrito = (fila.comentario || "").trim().length;
    const falta = !fila.decisao ? t("falta.decisao")
      : (fila.decisao === "devolvida" && escrito < piso)
        ? t("falta.devolucao", { n: piso - escrito })
        : null;
    aviso.textContent = falta || "";
    aviso.hidden = !falta;
    enviar.disabled = !!falta || fila.carregando;
  };
  rotular();
  enviar.addEventListener("click", () => decidirEscalacao(item.avaliacao_id));
  const cancelar = el("button", "botao discreta", t("botao.cancelar"));
  cancelar.type = "button";
  cancelar.addEventListener("click", () => {
    fila.decisao = null;
    fila.comentario = "";
    salvarRascunhoTexto(chaveEscalacao(item.avaliacao_id), "");
    desenharEscalacao();
  });
  juntar(rodape, aviso, enviar, cancelar);
  cartao.appendChild(rodape);
  return cartao;
}

async function decidirEscalacao(avaliacaoId) {
  const fila = est.escalacao;
  if (!fila || !fila.decisao || fila.carregando) return;
  fila.carregando = true;
  try {
    const r = await postar("/api/escalacao/" + avaliacaoId, {
      admin_id: est.persona.id,
      decisao: fila.decisao,
      comentario: (fila.comentario || "").trim() || null,
    });
    recado(r.reabriu ? t("recado.decisao_devolvida") : t("recado.decisao"));
    salvarRascunhoTexto(chaveEscalacao(avaliacaoId), "");
  } catch (e) {
    fila.carregando = false;
    recado(e.message, true);
    return;
  }
  fila.carregando = false;
  fila.sel = null;
  fila.decisao = null;
  fila.comentario = "";
  await carregarEscalacao();
  await recarregarSaude();
  desenharAdmin();
}

/** A separação entre demonstração e trabalho real, com número.

    É o que permite ao painel dizer qual trabalho é de quem em vez de somar
    fixture com autoria na mesma coluna — e é o que faz o portfólio significar
    alguma coisa para quem o avalia. */
function desenharProjetosAdmin() {
  const corpo = $("#projetos-corpo");
  limpar(corpo);
  const padrao = (est.saude && est.saude.projetos && est.saude.projetos.padrao) || "";
  if (!est.projetos.length) {
    const tr = el("tr");
    const td = el("td", "secundario", t("admin.sem_projetos"));
    td.colSpan = 5;
    juntar(tr, td);
    corpo.appendChild(tr);
    return;
  }
  for (const p of est.projetos) {
    const tr = el("tr");
    const nome = el("td");
    juntar(nome, el("span", "dado", p.nome));
    if (p.nome === padrao) nome.appendChild(el("span", "etiqueta aprovado", t("admin.padrao")));
    juntar(tr, nome,
      el("td", "fraco dado", p.cliente),
      el("td", "num", n(p.n_tarefas)),
      el("td", "num", n(p.n_abertas)),
      el("td", "secundario dado", p.descricao));
    corpo.appendChild(tr);
  }
}

function desenharEquipe() {
  const corpo = $("#equipe-corpo");
  limpar(corpo);
  if (!est.perfis.length) {
    const tr = el("tr");
    const td = el("td", "secundario", t("admin.sem_equipe"));
    td.colSpan = 4;
    juntar(tr, td);
    corpo.appendChild(tr);
  } else {
    for (const p of est.perfis) {
      const tr = el("tr");
      const estado = el("td");
      const eti = el("span", "etiqueta " + (p.ativo ? "aprovado" : "pendente"));
      juntar(eti, el("span", "ponto"),
        el("span", null, p.ativo ? t("admin.ativo") : t("admin.inativo")));
      juntar(estado, eti);
      juntar(tr,
        el("td", "dado", p.nome),
        el("td", null, nomePapel(p.papel)),
        estado,
        el("td", "mono", dataHora(p.criado_em)));
      corpo.appendChild(tr);
    }
  }
  $("#equipe-conta").textContent = t("admin.equipe_conta", { n: n(est.perfis.length) });
}

async function criarPelaEquipe() {
  const campo = $("#admin-nome");
  const aviso = $("#admin-aviso");
  const nome = campo.value.trim();
  aviso.textContent = "";
  if (!nome) { aviso.textContent = t("barra.sem_nome"); return; }
  try {
    const criado = await postar("/api/perfis", { nome, papel: $("#admin-papel").value });
    est.perfis.push(criado);
    est.perfis.sort((a, b) => (a.papel + a.nome).localeCompare(b.papel + b.nome, "pt-BR"));
    campo.value = "";
    desenharEquipe();
    desenharPersonas();  // a barra tem de enxergar quem acabou de entrar
    await recarregarSaude();
    desenharAdmin();
    recado(t("recado.entrou_equipe", {
      nome: criado.nome, papel: nomePapel(criado.papel).toLowerCase(),
    }));
  } catch (e) {
    aviso.textContent = e.message;
  }
}

/* ==========================================================================
   8. PARTIDA
   ========================================================================== */
function ligarEventos() {
  $("#entrar").addEventListener("click", entrar);
  $("#novo-nome").addEventListener("keydown", (e) => { if (e.key === "Enter") entrar(); });
  $("#persona").addEventListener("change", trocarPersona);
  $("#projeto").addEventListener("change", trocarProjeto);
  $("#tema").addEventListener("click", alternarTema);
  // O glifo é escrito aqui, e não no HTML: um "?" solto no corpo da página é
  // texto de tela sem `data-t`, e o teste que proíbe frase estática o pegaria.
  $("#btn-atalhos").textContent = "?";
  $("#btn-atalhos").addEventListener("click", alternarAtalhos);
  $("#admin-criar").addEventListener("click", criarPelaEquipe);
  $("#admin-nome").addEventListener("keydown", (e) => { if (e.key === "Enter") criarPelaEquipe(); });
  // P5a. Os ouvintes do formulário de geração são ligados UMA vez: os campos
  // são estáticos no HTML, e religá-los a cada desenho perderia o foco no meio
  // de um número digitado.
  $("#metricas-atualizar").addEventListener("click", carregarMetricas);
  for (const id of ["#gerar-tipo", "#gerar-n", "#gerar-lang", "#gerar-fonte",
                    "#gerar-alvo", "#gerar-prioridade", "#gerar-projeto"]) {
    $(id).addEventListener("input", mudouGerar);
    $(id).addEventListener("change", mudouGerar);
  }
  $("#gerar-pedir").addEventListener("click", pedirPreviaGeracao);
  $("#gerar-criar").addEventListener("click", criarLoteDeTarefas);
  // Um ouvinte só, no documento: os atalhos pertencem à TELA, não a um nó que
  // é destruído e recriado a cada redesenho da área de trabalho.
  document.addEventListener("keydown", teclado);
}

async function iniciar() {
  // O IDIOMA VEM PRIMEIRO, antes de qualquer desenho: não existe um quadro em
  // que a plataforma possa aparecer na língua errada, e `aplicarTema` já escreve
  // no botão de tema.
  est.idioma = idiomaInicial();
  formatadores(est.idioma);
  aplicarTextos();
  desenharIdiomas();

  let tema = "claro";
  try { tema = localStorage.getItem(CHAVE + "tema") || "claro"; } catch (_) {}
  aplicarTema(tema === "escuro" ? "escuro" : "claro");

  ligarEventos();

  // A SAÚDE VEM PRIMEIRO: é dela que sai `modo_solo`, e o seletor de persona
  // se monta de um jeito diferente nos dois modos. Desenhar antes mostraria a
  // lista errada por um quadro — e no modo solo a lista errada é a que esconde
  // a própria pessoa.
  await recarregarSaude();
  try {
    const r = await api("/api/perfis");
    est.perfis = r.items || [];
  } catch (e) {
    recado(t("recado.erro_personas", { erro: e.message }), true);
  }

  // A persona guardada é RECONFERIDA contra o banco: ela pode ter sido criada
  // noutra máquina, ou o banco pode ter sido apagado entre duas sessões. Nome +
  // papel batendo é o bastante; o id é recuperado daqui.
  const guardada = lerPersona();
  let inicial = null;
  if (guardada) {
    inicial = est.perfis.find((p) => p.nome === guardada.nome && p.papel === guardada.papel) || null;
    if (!inicial) recado(t("recado.persona_sumiu"), true);
  }
  // SEM VESTÍBULO: a plataforma abre já trabalhando. Sem persona guardada, o
  // papel inicial é o primeiro (anotador) com a primeira pessoa dele — que é o
  // que um avaliador quer ver nos primeiros três segundos.
  est.papelEscolhido = inicial ? inicial.papel : PAPEIS[0].id;
  est.projeto = lerProjetoGuardado();
  desenharPapeis();
  const doPapel = modoSolo()
    ? est.perfis.filter((p) => p.ativo)
    : est.perfis.filter((p) => p.papel === est.papelEscolhido && p.ativo);
  const escolhida = inicial || doPapel[0] || null;
  est.persona = escolhida ? { id: escolhida.id, nome: escolhida.nome, papel: escolhida.papel } : null;
  guardarPersona();
  desenharPersonas();
  await abrirApp();
}

iniciar();
</script>
