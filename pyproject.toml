[project]
name = "prompt-factory"
version = "0.1.0"
description = "Banco de prompts reais (pt-BR + EN): pipeline de extração/classificação e interface de curadoria"
requires-python = ">=3.12,<3.13"
dependencies = [
    "datasets>=4.8,<5",
    "pyarrow>=17",
    "pandas>=2.2",
    "numpy>=1.26,<3",
    "torch>=2.4",
    "sentence-transformers>=3.3",
    "scikit-learn>=1.5",
    "joblib>=1.4",
    "fast-langdetect>=0.3",
    "lingua-language-detector>=2.1",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "huggingface-hub>=0.34",
    "tqdm>=4.66",
]

[project.optional-dependencies]
setfit = ["setfit>=1.1"]
onnx = ["optimum[onnxruntime]>=1.21"]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]
# Camada de análise (`analysis/`): notebooks de QC que leem os artefatos de
# disco em SOMENTE LEITURA e renderizam HTML commitável. Fica num grupo à parte
# porque nada em `src/` importa matplotlib — quem só roda a pipeline ou a
# interface não precisa baixar nada disto (`uv sync --group analysis`).
analysis = ["matplotlib>=3.8", "jupyter>=1", "nbconvert>=7"]

[project.scripts]
pf = "prompt_factory.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# Esta máquina tem o TLS interceptado por proxy/antivírus: a raiz que reassina o
# tráfego só existe no armazenamento de certificados do Windows, então o bundle
# embutido do uv rejeita o PyPI com "invalid peer certificate: UnknownIssuer".
# system-certs faz o uv usar o trust store do SO (= flag `--system-certs`).
# Em uv < 0.12 a chave se chamava `native-tls`.
# Verificação de certificado continua LIGADA — nunca troque isto por
# --allow-insecure-host, que desliga a verificação de fato.
system-certs = true
# Cache do uv fica no C: e o .venv no G: — filesystems diferentes, hardlink não
# funciona. Copiar de vez elimina o warning "Failed to hardlink files".
link-mode = "copy"

# ATENÇÃO À ORDEM: as duas seções abaixo são sub-tabelas de `tool.uv`, e toda
# chave simples que viesse DEPOIS delas passaria a pertencer à última sub-tabela
# aberta. `system-certs` e `link-mode` têm de ficar acima — invertido, o TOML
# continua válido e o pyproject muda de significado em silêncio.
#
# Por que o índice existe: `torch` no PyPI arrasta CUDA em Linux. Medido no
# uv.lock: 526,6 MB do wheel manylinux + 2.094,3 MB de 17 wheels CUDA/triton =
# ~2,6 GB que o runner de CI baixaria para rodar uma suíte que nem importa
# torch (o único teste que o faz está marcado `slow` e é desselecionado).
# O índice pytorch-cpu serve o mesmo torch sem as dependências de GPU.
#
# `explicit = true` é o que torna a mudança segura: sem ele o índice entraria
# no pool de resolução de TODOS os pacotes e o lock inteiro poderia se mexer,
# inclusive no Windows. Com ele, só quem apontar para o índice em
# `[tool.uv.sources]` o consulta.
#
# O marcador fica na SOURCE, não no índice — é a granularidade que o uv
# oferece. Fora do Linux (o Windows desta máquina), `torch` continua vindo do
# PyPI, e o wheel `win_amd64` de 122,1 MB não muda.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.pytest.ini_options]
markers = [
    "slow: precisa de modelo baixado ou de I/O pesado (pule com `-m 'not slow'`)",
]

[tool.ruff]
# Sem esta seção o ruff sobe a árvore de diretórios e herda a configuração de
# FORA do repositório (acontece nesta máquina): o lint passa a depender de onde
# o projeto está clonado. Fixar aqui torna `ruff check .` reprodutível.
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]
ignore = ["E501"]  # comprimento de linha fica a cargo do `ruff format`
