# Prompt Factory — configuração global.
# Lido por src/prompt_factory/config.py (tomllib, com cache).
# Alterar thresholds aqui é a forma suportada de "replayar" estágios da pipeline.

[general]
seed = 42
# Cache do HuggingFace fora do C: (datasets grandes + torch). O cli.py faz
# os.environ.setdefault("HF_HOME", <este valor>) antes de qualquer import pesado.
hf_home = "G:/hf-cache"

[langid]
# s02, camada 1 (fast-langdetect/fastText). Abaixo de `arbiter_conf` ou de
# `min_chars` a decisão vai para o árbitro (lingua). `model = "full"` baixa
# lid.176.bin (~126 MB) na primeira execução; se o download falhar (TLS
# interceptado desta máquina), o wrapper cai sozinho para o "lite" EMBUTIDO no
# wheel e avisa alto.
arbiter_conf = 0.65
min_chars = 25
model = "full"
cache_dir = "G:/hf-cache/fasttext-langdetect"
# Fatiamento do texto ANTES de detectar: 1.000 caracteres decidem idioma com
# folga e o corpus tem prompts de até 1 milhão de caracteres.
max_input_chars = 1000

[variant]
# s02, classificador pt-BR/pt-PT (variant_ptbr.py). `min_score` é o mínimo do
# lado vencedor; `min_conf` é a margem relativa (m-n)/(m+n) exigida.
min_score = 2.0
min_conf = 0.25

[dedup]
# s06 (dedup próximo): só é near-dup quando os TRÊS critérios batem.
near_cosine = 0.985
near_jaccard = 0.65
# Razão máxima de tamanho (n_chars) entre os dois textos de um par candidato.
near_len_ratio = 2.0
# Valida cada membro do grupo CONTRA O CANÔNICO, nos mesmos três critérios,
# depois do union-find. Existe porque union-find é transitivo: confirmado A~B e
# B~C, o A e o C caem no mesmo componente sem nunca terem sido comparados.
# Medido na primeira execução do estágio: 27% dos 44.333 descartes (11.964)
# tinham cosseno < 0.985 contra o canônico do próprio grupo, e 13,4% tinham
# jaccard < 0.65. O e5 agrava (corta em 512 tokens, ~1.879 caracteres em pt):
# dois textos com o mesmo cabeçalho longo dão cosseno 1,0000 e conteúdos sem
# relação nenhuma depois do corte. Quem falha a validação PERMANECE no universo.
# `false` reproduz o comportamento antigo (encadeamento aceito) — é o que torna
# o estágio replayável nos dois modos.
near_pairwise = true
# Blocking duplo do produto de matrizes: block_rows linhas x col_chunk colunas
# por vez (2048 x 32768 f32 = 256 MB de buffer, pico < 1 GB).
block_rows = 2048
col_chunk = 32768

# Recheck de idioma DIRIGIDO, no mesmo passe do s06 (não no s02: refazer o s02
# obrigaria a refazer as horas de embedding do s05, e remover linha aqui não
# move as outras — a máscara é posicional).
# O que ele conserta: prompts BILÍNGUES, com a instrução num idioma e um payload
# colado (JSON, artigo, código) noutro. Na janela de 1.000 caracteres do s02 o
# payload ganha por volume e os dois detectores CONCORDAM em pt/en — não há
# discordância para o árbitro pegar. Foi assim que 976 linhas do template
# francês "Goal / Corriger les erreurs de formatage..." entraram no universo,
# 839 como pt (318 delas classificadas pt-BR e 212 pt-PT) e 137 como en.
lang_recheck = true
# Janela do cabeçalho. É MENOR que a do s02 de propósito: o idioma do prompt é o
# da INSTRUÇÃO, não o do material colado embaixo dela. Medido no corpus real, a
# cobertura da família francesa cai conforme a janela cresce (250 -> 2.061 de
# 2.061; 300 -> 2.057; 400 -> 1.943; 500 -> 1.202): quanto maior a janela, mais
# o payload afoga a instrução. Linha com n_chars <= esta janela não é
# reprocessada — o s02 já leu exatamente o mesmo texto.
lang_recheck_head_chars = 250
# Confiança mínima do árbitro (lingua) para descartar. As DUAS camadas precisam
# concordar num idioma fora de {pt, en}: sozinho, o árbitro devolve CATALÃO para
# texto em russo (que não está no conjunto dele) e derrubaria linha boa com um
# rótulo inventado. Medido: 2.215 linhas fora (2.177 fr + 38 es), com a família
# 'Goal/Corriger' inteira dentro e nenhum falso positivo nas 154 restantes.
lang_recheck_arbiter_conf = 0.85

[seed]
# s07 (`pf make-seed`). A amostra-semente é o ÚNICO insumo do classificador do
# M7: mexer em qualquer chave daqui não invalida um arquivo, invalida a campanha
# de rotulagem inteira. Por isso o sorteio é 100% determinístico a partir de
# `rng_seed` — mesmo universo + mesmas chaves = mesmos 12.000 uids.
rng_seed = 42
size = 12000           # total da semente; os 100 da calibração saem de DENTRO dele
pt_share = 0.5         # 6.000 pt + 6.000 en
# Fronteiras de n_chars que, junto com a fonte, definem os estratos: curto
# (< 120), médio (120–600) e longo (> 600). São 2 fronteiras = 3 faixas.
bucket_edges = [120, 600]
# Piso proporcional por faixa antes do rateio: sem ele o arredondamento apaga a
# faixa rara de uma fonte (prompts longos do aya, por exemplo) e o classificador
# nunca vê aquele formato.
bucket_floor = 0.10

# Quantas linhas cada fonte cede por idioma. A ORDEM das chaves é a ordem
# canônica de iteração do sorteio (determinismo) e o critério de desempate da
# redistribuição — mesma lógica da ordem das seções em sources.toml.
# Fonte com menos linhas que a cota trava no que tem e o déficit é redistribuído
# proporcionalmente entre as outras (o `strata.txt` registra quem cedeu quanto):
# `oasst` tem 286 linhas no universo e é o caso real que exercita esse caminho.
[seed.allocation.pt]
wildchat_pt = 3600
aya = 1200
oasst = 600
arena140k = 600

[seed.allocation.en]
wildchat_en = 3000
no_robots = 600
dolly = 600
hh_rlhf = 900
prism = 900

[labeling]
batch_size = 80        # 77 itens novos + 3 de calibração ocultos
gold_per_batch = 3
calibration_size = 100 # batch_0000: revisado à mão pelo humano, vira o ouro
# Corte do texto entregue ao agente. Prompt de 1 milhão de caracteres existe no
# corpus e estouraria a janela do lote inteiro; o item cortado termina com
# " …[TRUNCADO]".
#
# O número vem da JANELA DO CLASSIFICADOR, não de gosto: o e5 trunca em 512
# tokens, o que foi medido neste corpus em ~1.879 caracteres no português e
# ~2.117 no inglês (mediana de 120 textos longos por idioma). Rotular acima
# disso produz rótulo que depende de informação AUSENTE do vetor — ruído que o
# M7 não tem como aprender. Rotular abaixo, como os 1.500 originais, joga fora
# sinal que o classificador enxerga de graça: 23,1% da semente saía cortada,
# contra 18,0% aqui.
truncate_chars = 1900
# Portão por lote: concordância com o ouro nos 3 itens de calibração, medindo
# task_type E domain (6 comparações). A granularidade é 1/6, então 0.80 exige
# 5 acertos em 6 — abaixo disso o lote volta para `pending`.
agreement_min = 0.80
# Um claim que passa disso sem submissão é órfão (sessão morreu, cota acabou) e
# volta sozinho para `pending` na próxima varredura.
claim_ttl_hours = 2
# Tentativas antes da quarentena: lote que falha `max_attempts` vezes vira
# `failed` e sai do ciclo, em vez de envenenar a campanha para sempre.
max_attempts = 3
# s08: discordância entre a categoria nativa da fonte e o rótulo do agente, nos
# itens que têm as duas origens. Acima disto o mapeamento sai marcado como
# suspeito no relatório — nada é removido automaticamente.
mapping_warn = 0.30

[classifier]
conf_accept = 0.50     # >= aceita o rótulo
conf_review = 0.35     # entre review e accept: aceita mas marca needs_review

[loaddb]
# s11 (`pf load-db`). Teto de linhas SEM rótulo (task_type nulo) que a carga
# aceita antes de recusar o banco. O ponto não é a estética: um banco carregado
# com o parquet de rótulos ausente ou vazio fica plausível, abre na interface e
# só denuncia o erro semanas depois. 1% é folga para a cauda que o classificador
# legitimamente não decidiu; `--allow-unlabeled-pct` sobrescreve para os casos
# em que a falta de rótulo é intencional (carga do universo cru, antes do M7).
allow_unlabeled_pct = 1.0
# Linhas por executemany e por lote de leitura do parquet. Os dois andam juntos:
# o universo é lido em streaming (`iter_batches`) porque `text` sozinho passa de
# 750 MB e read_table inteiro estouraria a RAM.
insert_chunk_rows = 10000
read_batch_rows = 10000
# Cache de página durante a carga, em MB (vira PRAGMA cache_size negativo). O
# rebuild do FTS5 é o passo caro e é ele que consome esse cache.
cache_size_mb = 256
# `pf db-check --bench`: medições por consulta, além de 1 aquecimento fora do
# cronômetro. Reporta mediana e p95 — média mente no Windows com antivírus.
bench_repeats = 5

[embed]
model = "intfloat/multilingual-e5-small"
dim = 384
batch_size = 64
# Linhas por bloco gravado no memmap do s05 (também o passo do sidecar de
# retomada).
chunk_rows = 2048
# 0 = deixa o torch decidir o número de threads.
threads = 0
# O e5 corta em 512 tokens; o corpus tem prompts de até 1 milhão de caracteres e
# tokenizar isso inteiro para jogar fora 99,7% mata a vazão. Cortar ANTES.
truncate_chars = 3000

[app]
host = "127.0.0.1"
port = 8765

# --- listagem -----------------------------------------------------------------
# Itens por página (default e teto). O teto existe porque o corte de texto é por
# ITEM: 200 itens x list_text_chars ainda é uma resposta pequena, 5.000 não.
page_size = 50
max_page_size = 200
# Corte do `text` na LISTAGEM (o /api/prompts/{uid} devolve inteiro). O corpus
# tem prompts de ~1 milhão de caracteres: 50 deles numa página seriam ~50 MB de
# JSON e travariam a aba. Quem quer o texto todo busca o item.
list_text_chars = 1200
# Janela do snippet do FTS5, em tokens. É o que o card mostra na busca — o
# trecho com o termo, não o começo do texto.
snippet_tokens = 18
# Quantos caracteres do início do texto são varridos atrás de "User:"/"Assistant:".
# Bound de propósito: um LIKE sobre 1 MB x 50 linhas por página seria pago em
# TODA busca, e o marcador de conversa colada aparece cedo.
chat_markers_scan_chars = 20000
# Teto de `page * page_size`. Ninguém pagina até a linha 100.000 com a mão; quem
# faz isso é robô, e um OFFSET gigante mais o corte de texto viram um scan caro.
max_offset = 100000
# A partir de que OFFSET a listagem passa por cima do planner e força o
# `idx_prompts_created` (só em newest/oldest e só sem busca). Um OFFSET de N só é
# alcançável se o filtro casar mais de N linhas, e ordenar N linhas num B-tree
# temporário nunca sai mais barato que caminhar N entradas de um índice já
# ordenado. Medido no banco real, `lang=pt` na página 2000: 2.256 -> 12 ms.
# Abaixo do limiar o planner decide sozinho, e decide certo.
deep_offset_hint = 10000
# Entradas do cache de agregados (/api/facets por filtro + /api/stats). Toda
# escrita joga o cache inteiro fora, então isto é só o teto de quantos recortes
# diferentes ficam quentes ao mesmo tempo. 0 DESLIGA o cache — útil para medir o
# custo real de uma consulta sem precisar mexer no código.
cache_max_entradas = 64
# Tokens que o sanitizador do FTS aceita numa busca (o resto é descartado).
fts_max_tokens = 24

# --- busca semântica (M10) ----------------------------------------------------
# "f32" mantém a matriz inteira convertida na RAM: 144.754 x 384 x 4 = 212 MiB e
# 5,8 ms por consulta (BLAS sgemv). "f16" economiza metade da RAM lendo o memmap
# em blocos, mas a CONVERSÃO — não a multiplicação — custa 199,3 ms: 34x mais,
# medido no corpus real, para os mesmos escores (diferença de 6e-08).
# O ganho do f32 não é só velocidade: a 5,8 ms dá para pontuar o corpus INTEIRO e
# aplicar o filtro exato, em vez de aproximar por over-fetch. Aproximação
# silenciosa numa ferramenta de pesquisa linguística é pior que lentidão.
semantic_precision = "f32"
# Itens devolvidos por consulta (default e teto). Não há paginação: a ordem é o
# escore, e "página 2 do sentido" não significa nada para quem procura.
semantic_k = 50
semantic_max_k = 200
# Mínimo de caracteres da consulta. Abaixo disso o e5 devolve um vetor que é
# ruído com forma de vetor.
semantic_min_chars = 3
# Fração mínima de uids do `.npy` que precisam existir no banco (e vice-versa)
# para a busca ser considerada alinhada. Abaixo disso a carga FALHA: um `.npy` de
# outra build devolve vizinhos plausíveis e ERRADOS, que é o pior defeito
# possível num corpus. 0.99 dá folga para nada — é praticamente 1:1 de propósito.
semantic_min_alinhamento = 0.99

# --- coleções e export --------------------------------------------------------
# Teto de uids por requisição em /api/collections/{id}/items.
max_uids_por_requisicao = 5000
# Teto de linhas por export. Vale para os três modos (filtro, coleção, uids).
export_max_rows = 250000
# Fronteiras de n_chars da faceta de tamanho. Mesmas do [seed] bucket_edges de
# propósito: a interface facetando por uma régua e a semente amostrando por
# outra tornariam impossível ler os dois relatórios juntos.
size_buckets = [120, 600]

# ==============================================================================
# [annotate] — plataforma de anotação "Bancada" (Trilha B, P1)
# ==============================================================================
# Produto SEPARADO da interface de curadoria acima: banco próprio
# (data/db/annotate.sqlite, escrita) + prompts.sqlite SOMENTE LEITURA. As duas
# apps nunca compartilham porta nem conexão.
[annotate]
# Porta distinta da curadoria (8765) DE PROPÓSITO: as duas sobem ao mesmo tempo
# na demonstração, e uma colisão de porta apareceria como "a interface errada
# abriu", que é o defeito mais confuso possível numa apresentação.
host = "127.0.0.1"
port = 8766

# --- pool de prompts ----------------------------------------------------------
# De onde saem os prompts que a plataforma oferece. A ferramenta de curadoria
# monta uma COLEÇÃO com este nome e a Bancada a lê do corpus read-only —
# curadoria humana escolhendo o que vai para a anotação.
pool_collection = "anotacao"
# Teto de linhas do pool. Uma plataforma de demonstração não precisa de 144 mil
# prompts; precisa de um recorte que carregue rápido e que um avaliador consiga
# percorrer. O corte é aplicado nas DUAS origens (coleção e fallback).
pool_max = 500
# FALLBACK OBRIGATÓRIO. `pf load-db` reconstrói o banco do zero e APAGA as
# coleções: sem fallback, a plataforma ficaria sem pool depois de toda recarga
# do corpus — e um pool vazio numa demo é uma tela morta. O fallback é um filtro
# determinístico sobre o corpus, e a origem ativa aparece no /api/health e no
# painel do admin (pool trocando em silêncio seria mentira de interface).
# Aceita um valor único ("pt", que é o que valia até o P3i) OU uma lista. Com
# lista, o teto de `pool_max` é dividido em COTA IGUAL por língua e cada cota é
# amostrada com passo constante dentro dela. Proporcional ao corpus não serviria:
# são 116.051 linhas em inglês contra uma fração disso em português, e o pool
# sairia monolíngue de novo, agora na outra ponta. Quem mantém as 9.148 linhas
# `cc-by-nc-4.0` do inglês fora do trabalho é a política de licença abaixo, não
# o filtro de idioma.
pool_fallback_lang = ["pt", "en"]
# 40 caracteres: abaixo disso não há o que avaliar com rubrica. 2.000: acima
# disso o anotador rola a tela em vez de julgar (o corpus tem prompts de ~1 MB).
pool_fallback_min_chars = 40
pool_fallback_max_chars = 2000
# ANTI-ROBÔ: ~34% do português do WildChat é UM template repetido. Sem este
# teto o pool inteiro seria o mesmo prompt com números diferentes.
pool_fallback_max_dups = 0

# --- POLÍTICA DE LICENÇA DO POOL (P3a) ----------------------------------------
# Vale nas DUAS origens (coleção curada e fallback), e o default é FECHADO.
#
# O defeito que isto corrige, medido: até o P3a o pool filtrava idioma, tamanho e
# duplicatas e NÃO filtrava licença. Trocar `pool_fallback_lang` para "en" trazia
# 9.148 linhas `cc-by-nc-4.0` com commercial_ok = 0 para dentro do trabalho de
# anotação (60 delas na amostra de 500 que a plataforma serve), sem aviso na
# tela. Isso contradiz a tese do projeto: o `export.py` já exclui
# redistributable = 0 do export justamente porque a proveniência por linha é o
# argumento do Prompt Factory, e a plataforma não tinha herdado a política.
#
# Desligar qualquer uma das duas é um ato explícito, e o /api/health e o painel
# do admin dizem qual política está ativa e quantas linhas ela exclui.
pool_exigir_commercial_ok = true
pool_exigir_redistributable = true

# NOTA SOBRE NSFW, honesta: o filtro do pool tem `nsfw IS NOT 1`, e hoje ele
# exclui ZERO linhas — `nsfw` é nulo nas 159.733 do corpus, porque a campanha de
# rotulagem ainda não rodou. A cláusula fica (passa a valer quando os rótulos
# existirem) e a tela diz isso com todas as letras, em vez de prometer uma
# garantia que o dado não sustenta. Por isso ela NÃO é configurável.

# --- fila e trabalho ----------------------------------------------------------
# Validade de uma atribuição sem submissão (trava do modo locked). Expiração
# preguiçosa: o UPDATE roda antes de cada claim/listagem, sem thread de fundo.
# 120 min é longo o bastante para uma tarefa de SFT com interrupção e curto o
# bastante para a demo não travar tarefa até o dia seguinte.
claim_ttl_min = 120
# Itens por página nas listagens da plataforma (fila do revisor, catálogo,
# minhas atribuições). Menor que o 50 da curadoria: aqui se lê, não se garimpa.
page_size = 20
# Corte do texto do prompt nas LISTAS (o workspace mostra inteiro). O corpus tem
# prompts de ~1 milhão de caracteres.
list_text_chars = 600
# Quantas tarefas o `pf annotate seed` gera por tipo a partir do pool real.
# (P1 semeia só as 6 personas; o número já mora aqui para o P2 não hardcodar.)
seed_pool_tarefas = 8

# --- validação de conteúdo escrito pelo anotador ------------------------------
# Piso do modo criar. Abaixo disso não é prompt, é palavra solta — e o texto vai
# para o corpus de verdade pela ingestão da plataforma.
min_chars_criacao = 15
# Piso da justificativa obrigatória do A/B. "melhor" não é justificativa; o valor
# de uma comparação está no motivo, não na preferência.
min_chars_justificativa = 30
# Teto de critérios de uma rubrica escrita na plataforma. Rubrica com 20
# critérios não é mais rigorosa, é impossível de aplicar com consistência.
max_criterios_rubrica = 8
# Piso de critérios (P2). Abaixo de 3, o instrumento não separa nada: com 1 ou 2
# critérios a rubrica vira uma nota geral com nome comprido, e duas pessoas
# aplicando a mesma "escala de qualidade" concordam por acaso.
min_criterios_rubrica = 3
# Piso da resposta de referência do SFT (P2). É este texto que vira exemplo de
# treino: 40 caracteres é curto o bastante para caber um "não sei responder"
# honesto e longo o bastante para barrar um envio acidental de campo em branco.
min_chars_sft = 40

# --- triagem (P3a, passagem 1 da revisão) -------------------------------------
# Piso do comentário de DEVOLUÇÃO. O comentário volta para o anotador e é a
# única informação que ele recebe sobre o que corrigir: "refaça" devolve
# trabalho sem devolver instrução, e o re-trabalho sai igual ao primeiro.
min_chars_devolucao = 20

# --- Rate and Review (P3b, passagem 2 da revisão) -----------------------------
# Piso da JUSTIFICATIVA GERAL da avaliação, exigida sempre — inclusive quando o
# revisor não mudou nada e achou tudo excepcional. Ela aparece ao lado do escore
# no painel e no export: um número sem motivo ninguém contesta nem aprende com.
min_chars_avaliacao = 30
# Piso do motivo de CADA mudança do diff. Curto de propósito: o motivo de uma
# alteração é uma nota de rodapé ("a nota 5 não cabe na escala deste critério"),
# não um parecer. O parecer é a justificativa acima. Um motivo que precisa de
# 300 caracteres é sinal de que aquilo era para ter sido devolvido na triagem.
min_chars_motivo_edicao = 10

# MODO SOLO. Com `false` (o default), o revisor NÃO vê as próprias submissões:
# é a regra de QC de qualquer operação com equipe, e sem ela a taxa de
# aprovação do painel do admin não mede coisa nenhuma.
#
# Com `true`, o autor revisa o próprio trabalho — que é o caso de uso de quem
# monta o portfólio sozinho, atuando nos três papéis. A plataforma NÃO esconde
# isso: a fila de revisão mostra uma faixa permanente dizendo que o modo está
# ligado, e cada revisão gravada carrega `autorrevisao = 1`, para o export e o
# painel poderem declarar o número separado. Esconder seria mentir sobre o QC,
# que é justamente o que este projeto existe para não fazer.
permitir_autorrevisao = false

# --- projetos (escopo) --------------------------------------------------------
# Toda tarefa nasce dentro de um projeto desde o P3a. Dois nascem com o banco:
#  * `projeto_padrao` — o trabalho REAL sobre o corpus, o que compõe o
#    portfólio. É onde nasce toda tarefa nova.
#  * `projeto_demonstracao` — o pacote de fixtures (prompts à mão, rubricas de
#    exemplo, respostas com defeito plantado). Mostra a mecânica; não é
#    portfólio.
# Separá-los é o que permite ao painel e ao export dizerem qual trabalho é de
# quem, em vez de somar fixture com autoria na mesma coluna.
projeto_padrao = "Portfólio"
projeto_demonstracao = "Demonstração"

# --- anotações sintéticas (P4c, campanha B) -----------------------------------
# A DISTRIBUIÇÃO DE QUALIDADE-ALVO das anotações que a campanha gera. Ela existe
# por causa de um problema que só aparece quando tudo dá certo: se o dono anotar
# BEM — e vai, é o portfólio dele —, as escalas do Rate and Review nunca são
# exercitadas. Tudo cairia em "adequado"/"excepcional" e a tela mais sofisticada
# da plataforma mostraria dois dos quatro botões nunca usados.
#
# As chaves são exatamente `db.AVALIACOES_ANTES` (a escala 1 da passagem 2); uma
# chave fora dela para a campanha com erro de configuração, em vez de gerar um
# alvo que a tela não sabe representar. Os pesos são normalizados, então dá para
# escrevê-los em porcentagem, fração ou contagem — o que for mais legível.
#
# O default pende para `ajustavel` de propósito: é a faixa que produz o trabalho
# mais interessante para o revisor (dá para corrigir no lugar, que é o que a
# passagem 2 faz), e é a que menos aparece sozinha num conjunto pequeno.
sinteticas_distribuicao = { excepcional = 0.15, adequado = 0.30, ajustavel = 0.40, inutilizavel = 0.15 }

# Onde a sintética ENTRA no funil: `pendente_triagem` (o caminho completo, o
# dono tria e só depois avalia) ou `pendente_avaliacao` (vai direto para o Rate
# and Review). Escolhível porque ele vai querer exercitar os dois; o default é a
# triagem, porque pular a passagem 1 numa demonstração de QC seria esconder
# metade do aparato. `pf annotate gerar importar --status <X>` sobrepõe.
sinteticas_status = "pendente_triagem"

# ==============================================================================
# [geracao] — a campanha de geração da Bancada (Trilha B, P4c)
# ==============================================================================
# O livro-caixa em si mora em `geracao/manifest.json`, ao lado de
# `labeling/manifest.json` e pelo mesmo motivo. Aqui ficam só os limiares.
[geracao]
# Quantas falhas de VALIDAÇÃO um lote aguenta antes de ir para `failed`. Falha
# de validação não muda o estado (o lote segue `claimed` e o maestro faz um
# retry dirigido, como no `pf labels submit`); o que muda é esta contagem. O
# teto existe para não travar o ciclo num lote só.
max_tentativas = 3
# Validade de um claim. Uma sessão que morreu deixa lotes reivindicados e nunca
# importados; sem o TTL eles ficariam presos e o `preparar` seguinte escolheria
# prompts NOVOS, deixando um buraco permanente no meio da campanha. Mais longo
# que o da rotulagem (2 h) porque escrever duas respostas defensáveis para
# dezenas de prompts é trabalho de horas, não de minutos.
claim_ttl_horas = 6
# Piso de uma resposta de modelo. Abaixo disso não há o que comparar num A/B —
# e uma resposta curta demais vence ou perde pelo tamanho, não pelo conteúdo.
min_chars_resposta = 200
# Teto de critérios de uma rubrica GERADA. Menor que o `max_criterios_rubrica`
# da plataforma (8): a rubrica gerada é aplicada por outra pessoa em seguida, e
# 5 é o limite prático de quantas escalas alguém compara sem perder o fio. O
# piso é o mesmo da plataforma (`min_criterios_rubrica`).
max_criterios_material = 5
# Confiança mínima do detector para RECUSAR uma resposta por idioma. Abaixo
# dela, silêncio: recusar exige certeza, deixar passar não. O corpus deste
# projeto já provou que texto técnico e documento bilíngue enganam detector, e
# um falso positivo aqui joga fora o trabalho de um lote inteiro.
lang_confianca_min = 0.50
