# Prompt Factory — registro de fontes.
#
# Uma seção por fonte. Toda fonte carrega sua licença ATÉ A LINHA no banco final
# (colunas license / commercial_ok / redistributable / attribution), porque o
# corpus mistura licenças e o export precisa filtrar por política.
#
# Chaves obrigatórias (contrato lido por src/prompt_factory/ingest/base.py):
#   enabled          — se False, o ingester nem roda
#   default_on       — entra no `pf ingest` sem argumentos (e no `all`)
#   hf_id            — repo do dataset no HuggingFace Hub
#   license          — identificador SPDX quando existe; senão nome da licença
#   commercial_ok    — permite uso comercial do prompt derivado
#   redistributable  — permite redistribuir o texto (export exclui False por padrão)
#   attribution      — crédito por extenso, copiado tal e qual para cada linha
#   expected_min/max — faixa de sanidade: `pf report raw` marca WARN fora dela
#
# expected_min/max é MEDIDO, não estimado: os valores abaixo são as contagens
# reais do M2 (fontes determinísticas ficam com min == max de propósito, para
# que qualquer mudança silenciosa na fonte apareça no relatório).

# ---------------------------------------------------------------------------
# Português
# ---------------------------------------------------------------------------

[wildchat_pt]
enabled = true
default_on = true
hf_id = "allenai/WildChat-4.8M"
lang = "pt"
license = "odc-by-1.0"
commercial_ok = true
redistributable = true
attribution = "Zhao, Wenting; Ren, Xiang; Hessel, Jack; Cardie, Claire; Choi, Yejin; Deng, Yuntian. \"WildChat: 1M ChatGPT Interaction Logs in the Wild\", ICLR 2024. Dataset allenai/WildChat-4.8M, Allen Institute for AI, licenciado sob Open Data Commons Attribution License (ODC-BY) v1.0."
expected_min = 55959
expected_max = 55959
notes = "Fonte principal de pt. Streaming com pushdown de `columns=` (filters= NÃO poupa banda aqui e quebraria a cadência do checkpoint: ver docstring de ingest/wildchat.py); idioma filtrado no cliente com `language == \"Portuguese\"`, por extenso. Checkpoint ds.state_dict() a cada 50k linhas VARRIDAS, part-files em data/raw/_parts/. MEDIDO no M3 (revisão c827c6df do dataset): 3.199.860 linhas varridas, 58.049 com language=Portuguese, 99 sem texto de usuário, 2.090 linhas descartadas por conversation_hash repetido (a coluna NÃO é chave: 1.520 hashes aparecem 2x ou mais, sempre com texto idêntico) => 55.959. Isso é o DOBRO da estimativa de 30k-45k do plano, que extrapolava 1,199% de pt a partir das primeiras 781k linhas: o mix muda ao longo do tempo (pt sobe para ~1,9% nos shards de 2024/2025). Como o passe é determinístico, min == max: qualquer divergência é revisão nova da fonte. ATENÇÃO para o s01/s02: 33,9% dessas linhas são UM template automatizado (\"Usando o seguinte texto:\" sobre diários oficiais), ~3,7% são francês e ~4% inglês mal rotulados pela fonte, e 15% trazem marcadores \"User:\"/\"Assistant:\" embutidos no próprio texto."

