# Prompt Factory — registro de fontes.
#
# Uma seção por fonte. Toda fonte carrega sua licença ATÉ A LINHA no banco final
# (colunas license / commercial_ok / redistributable / attribution), porque o
# corpus mistura licenças e o export precisa filtrar por política.
#
# Chaves obrigatórias (contrato lido por src/prompt_factory/ingest/base.py):
#   enabled          — se False, o ingester nem roda
#   hf_id            — repo do dataset no HuggingFace Hub
#   license          — identificador SPDX quando existe; senão nome da licença
#   commercial_ok    — permite uso comercial do prompt derivado
#   redistributable  — permite redistribuir o texto (export exclui False por padrão)
#   attribution      — crédito por extenso, copiado tal e qual para cada linha
#   expected_min/max — guarda de sanidade do M2/M3: contagem fora do intervalo = falha

# ---------------------------------------------------------------------------
# Português
# ---------------------------------------------------------------------------

[wildchat_pt]
enabled = true
hf_id = "allenai/WildChat-4.8M"
lang = "pt"
license = "odc-by-1.0"
commercial_ok = true
redistributable = true
attribution = "Zhao, Wenting; Ren, Xiang; Hessel, Jack; Cardie, Claire; Choi, Yejin; Deng, Yuntian. \"WildChat: 1M ChatGPT Interaction Logs in the Wild\", ICLR 2024. Dataset allenai/WildChat-4.8M, Allen Institute for AI, licenciado sob Open Data Commons Attribution License (ODC-BY) v1.0."
expected_min = 30000
expected_max = 45000
notes = "Fonte principal de pt. Streaming com pushdown de filters/columns; checkpoints ds.state_dict() a cada 50k linhas lidas."

[aya]
enabled = true
hf_id = "CohereLabs/aya_dataset"
lang = "pt"
license = "apache-2.0"
commercial_ok = true
redistributable = true
attribution = "Singh, Shivalika; Vargus, Freddie; D'souza, Daniel; et al. \"Aya Dataset: An Open-Access Collection for Multilingual Instruction Tuning\", Cohere For AI, 2024. Dataset CohereLabs/aya_dataset, licenciado sob Apache License 2.0."
expected_min = 8000
expected_max = 9500
notes = "8.997 prompts pt escritos à mão por anotadores humanos — melhor razão qualidade/licença do corpus."

[oasst]
enabled = true
hf_id = "OpenAssistant/oasst1"
hf_ids = ["OpenAssistant/oasst1", "OpenAssistant/oasst2"]
lang = "pt"
license = "apache-2.0"
commercial_ok = true
redistributable = true
attribution = "Köpf, Andreas; Kilcher, Yannic; von Rütte, Dimitri; et al. \"OpenAssistant Conversations — Democratizing Large Language Model Alignment\", NeurIPS 2023 Datasets and Benchmarks Track. Datasets OpenAssistant/oasst1 e OpenAssistant/oasst2, LAION-AI / OpenAssistant, licenciados sob Apache License 2.0."
expected_min = 2000
expected_max = 4500
notes = "Extrair só raízes com role=prompter e lang=pt. oasst1 e oasst2 se sobrepõem: unir por message_id antes de contar."

[arena140k]
enabled = true
hf_id = "lmarena-ai/arena-human-preference-140k"
lang = "pt"
license = "cc-by-4.0"
commercial_ok = true
redistributable = true
attribution = "LMArena (anteriormente LMSYS Chatbot Arena). \"Arena Human Preference 140k\". Dataset lmarena-ai/arena-human-preference-140k; os prompts são licenciados sob Creative Commons Attribution 4.0 International (CC-BY-4.0)."
expected_min = 1400
expected_max = 2200
notes = "1.684 prompts pt. Só o primeiro turno do usuário."

