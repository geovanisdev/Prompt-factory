# ---------------------------------------------------------------------------
# Inglês (amostra estratificada)
# ---------------------------------------------------------------------------

[wildchat_en]
enabled = true
default_on = true
hf_id = "allenai/WildChat-4.8M"
lang = "en"
license = "odc-by-1.0"
commercial_ok = true
redistributable = true
attribution = "Zhao, Wenting; Ren, Xiang; Hessel, Jack; Cardie, Claire; Choi, Yejin; Deng, Yuntian. \"WildChat: 1M ChatGPT Interaction Logs in the Wild\", ICLR 2024. Dataset allenai/WildChat-4.8M, Allen Institute for AI, licenciado sob Open Data Commons Attribution License (ODC-BY) v1.0."
expected_min = 100000
expected_max = 100000
notes = "Dois estágios. 1) `pf ingest wildchat-en` varre o split e guarda o POOL em data/raw/wildchat_en_pool.parquet: language == \"English\" + hash-gate determinístico int(sha256(conversation_hash).hexdigest()[:8],16) < 0.11*2**32 (11%, não 8%: 0,11 x ~1,79M linhas EN ~= 197k, com folga para os pisos do estrato). 2) `pf ingest wildchat-en --downsample` (sem rede) corta para EXATAMENTE 100.000 com default_rng(42) sobre família-do-modelo x faixa-de-tamanho x ano; o expected_min/max abaixo vale para ESTE arquivo final, não para o pool (a faixa do pool, 130k-300k, é só WARN e mora em ingest/wildchat.py). MEDIDO no M3: 183.300 linhas passaram no gate, 296 sem texto de usuário e 24.640 caíram por conversation_hash repetido => pool de 158.660 (dentro da faixa; a taxa de repetição de 13,4% é bem maior que a do pt porque duas conversas automatizadas sozinhas somam 12.196 cópias). O downsample achou 36 estratos dos 63 possíveis (gpt-4.1-mini só existe em 2025, gpt-3.5-turbo só em 2023/2024) e levou 9 deles inteiros; relatório completo em data/raw/wildchat_en.strata.txt."

